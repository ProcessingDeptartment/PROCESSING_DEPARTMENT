services:
  # The site: static front-end, served over HTTPS by Render automatically. Deployed as a Render
  # Static Site (not a Node web service) -- free forever, no sleep/spin-down, since it's just
  # files off a CDN. server.js is only used for local dev (`npm run dev`).
  - type: web
    name: facility-site
    runtime: static
    staticPublishPath: public
    buildCommand: "true"

  # The API: implements the storage contract in public/lib/api-backend.js, backed by Neon Postgres.
  # This one CANNOT be a static site -- it runs Node/Express against a live database, so it's a
  # free-tier web service, which does sleep after 15 min idle (see BACKEND_INTEGRATION.md).
  - type: web
    name: facility-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm run api
    envVars:
      # PORT is deliberately NOT set. Render assigns its own and expects the app to listen on it;
      # pinning it here makes the health check look at the wrong port and the deploy fails.
      # src/index.js already reads process.env.PORT.
      #
      # Both of these are secrets, so sync:false -- Render prompts for them rather than storing
      # them in the repo. Set them in Dashboard -> facility-api -> Environment.
      #   DATABASE_URL  the Neon connection string
      #   API_KEY       the shared access key; until it is set the API runs UNPROTECTED and logs a
      #                 warning on startup. Devices enter the same value once at /pages/api-key.html
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
