  sections: {
    objective: 'The procedure outlines the process of cooking dry allocated to dry.',
    roles: '<ul><li>Abagold Processing Management is responsible for the implementation and review of this procedure and linked work instructions and training of staff.</li><li>Abagold Processing Staff are responsible for working in accordance with documented procedures and work instructions and the reporting on unsafe equipment and conditions.</li></ul>',
    process: '<ol><li>Receive packing list and labelling list from sales and marketing department</li><li>Print out the labelling list (REC 7.4.7)</li><li>Request for finance to open the safe to record box details on REC 7.4.7</li><li>Complete labelling list REC 7.4.7 with FG01 representative</li><li>Scan and email REC 7.4.7 to sales and marketing</li><li>Sales and marketing to send back labels to be printed</li><li>Check the labels with FG01 against the packing list details paying special attention to the following:</li><li>Carton number as per the packing list</li><li>Product size</li><li>Net weight &amp; Gross weight</li><li>Product date</li><li>Lot number</li><li>Shelf life</li><li>Importer or dealer details – as per sales and marketing instruction (including address)</li><li>Upon confirmation print out all labels</li><li>Request from finance department to open the safe to label the boxes with FG01</li><li>If finance representative hands over the boxes and is not present during the labelling process REC 7.4.9 should be completed by all parties.</li><li>FG01 representative to complete REC 7.4.8 for all clients</li><li>Place all labelled boxes back in the safe</li><li>Upon arrival of truck open the safe, load the boxes into the truck</li><li>Tick off all boxes on the packing lists and sign to confirm the correct quantities per client</li><li>Complete REC 7.4.9 transfer document</li><li>Attach all packing lists to REC 7.4.7, 7.4.8, 7.4.9 with front page of dry export pack and file</li></ol>',
    review: 'This procedure is reviewed on an annual basis to ensure compliance with safety standards, customer as well as legislative requirements.'
