  sections: {
    objective: 'To describe the process of normal live sorting.',
    roles: '<ul><li>Abagold Management is responsible for the implementation and review of this procedure and linked work instructions and training of staff.</li><li>Abagold Staff are responsible for working in accordance with documented procedures and work instructions and the reporting on unsafe equipment and conditions.</li></ul>',
    process: '<ol><li>Receive orders from Harvesting and Live Export Manager.</li><li>Request the live sorting list from BI</li><li>Basket fetchers to identify baskets to be sorted and move it to the holding tanks/sorting area.</li><li>Prepare sorting equipment to be used. (Fill sorting table with sea water, fill up anesthetic tank with sea water and add 1 bag of magnesium sulphate (MgS04), prepare scales, sorting buckets and bags.)</li><li>Fetch baskets from the holding tank that need to be sorted and place them in the anesthetic tank.</li><li>Remove animals from the baskets that are: 20-40g after 6 – 8 min, 50-200g+ after 8 – 10 minutes and place them into buckets.</li><li>Weigh these animals in the buckets to get a basket out weight. (refer to normal sorting procedure)</li><li>Place the abalone on the sorting table to be split into green &amp; white shells and scrubbed with a specifically supplied hand brush.</li><li>As you split the abalone remove all boccardia, reject, and not live quality abalone and place them into their specific buckets.</li><li>These must be sorted separately back to the factory block with the correct comments (“rejects” and “not live”) on paperwork and information tags.</li><li>Rejects that are within 20 increments must be sorted back to the factory block and given the comment “sorted rejects” on paperwork and on information tags.</li><li>All live quality abalone splitted into green &amp; white shells must be taken to the grading machine for sorting.</li><li>Grade/Sort abalone individually over a flat scale into different live size ranges as required by the client not more than 8.9kg per bag for bigger animals (50-200g+) and not more than 8.5kg per bag for smaller animals (20-40g), or as per the latest instruction.</li><li>The full bags for live should ideally purge for 2 – 11 days before pack.</li><li>Abalone that does not fit into live size ranges and sizes that are full on orders with enough extras must be sorted back to the factory block for CAN or DRY harvest into 20 increments and commented “white” or “green” on paperwork and on information tags.</li><li>Smaller animals (20-40g) must be stocked at 13kg, and bigger animals (50-200g+) must be stocked at 18kg.</li><li>Write the RFID basket number, total weight, count of animals, batch &amp; SW, a comment “green or white”, and size range on an info tag and place the RFID tag at the back of the info tag for each full live bag.</li><li>Full live bags must have both the RFID tag &amp; info tag tied with a black twine and moved to the live holding area immediately after it was filled.</li><li>Write the bags as they are filled up on an Export Form and on your Basket-In Form with all the above details.</li><li>On your cover page write your overall total weight and total count for all the live bags.</li><li>Full baskets sorted for CANNING or DRY must have the RFID tag tied with a yellow cable tie on the inside of the basket and the info tag tied with a black cable tie on the edge of the basket.</li><li>Live Sorting Supervisors to do accuracy checks on all paperwork (drip loss, basket out-weight vs in-weight, and comments), paperwork to be signed off and handed in to the data capturers before 09:30am the next day.</li><li>Clean all sorting equipment before starting a new order.</li></ol>',
    review: 'This procedure is reviewed on an annual basis to ensure compliance with safety standards, customer as well as legislative requirements.'
