    roles: '<ul><li>Abagold Processing Management is responsible for the implementation and review of this procedure and linked work instructions and training of staff.</li><li>Abagold Processing Staff are responsible for working in accordance with documented procedures and work instructions and the reporting on unsafe equipment and conditions.</li></ul>',
    process: '<ol><li>Check bags received from farms according to IDN order</li><li>Prepare labels per customer on computer (As per QPS005)</li><li>Prepare and assemble polystyrene boxes</li><li>Cut the long flat boards to create compartments in the box</li><li>Layer the bottom of the box with a flat board and a sponge in a plastic bag</li><li>Place the compartments on top of the sponge in a plastic bag</li><li>Label Boxes</li><li>Place Friends of the sea Sticker on the corner of the long side of the box.</li><li>Do not cover any Logo’s or other stickers on the box</li><li>Prepare the ice packs</li><li>Cut the dry ice packs into nine’s</li><li>Submerge into buckets with fresh water</li><li>Remove the jelly packs from the water once it has swelled to size.</li><li>Place in the freezer for a minimum of 12 hours.</li></ol>',
