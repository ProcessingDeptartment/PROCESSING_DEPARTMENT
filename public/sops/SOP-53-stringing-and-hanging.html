    roles: '<ul><li>Abagold Processing Management is responsible for the implementation and review of this procedure and linked work instructions and training of staff.</li><li>Abagold Processing Staff are responsible for working in accordance with documented procedures and work instructions and the reporting on unsafe equipment and conditions.</li></ul>',
    process: '<ol><li>Prepare strings to correct length ensuring maximum use of trolley</li><li>Thread the need with string through the top of the meat over the abductor muscle and back through the bottom of the meat</li><li>Leave 1cm between each meat on the string</li><li>Once the first string is complete count the number of abalone</li><li>Ensure all strings will have the same quantity of abalone</li><li>Tie the end of the string to a hook on the trolley with the top of the meat facing down</li><li>Once trolley filled move to pre drying area</li><li>Repeat this process until all hooks on trolley are filled maintaining the same count on each trolley of 1 batch</li></ol>',
