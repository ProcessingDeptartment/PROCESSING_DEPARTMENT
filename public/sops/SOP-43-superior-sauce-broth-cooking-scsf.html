    objective: 'The procedure outlines the process of cooking the broth for the superior sauce for the customer GJH.',
    roles: '<ul><li>Abagold Processing Management is responsible for the implementation and review of this procedure and linked work instructions and training of staff.</li><li>Abagold Processing Staff are responsible for working in accordance with documented procedures and work instructions and the reporting on unsafe equipment and conditions.</li></ul>',
    process: '<ol><li>In Pot 1 heat up 80lt of fresh water.</li><li>In Pot 2 heat up 100lt of freshwater.</li><li>Use a thermometer to check the temperature of the water in the center of the pots.</li><li>Pot 1 temperature must be between 80-100°C.</li><li>Pot 2 temperature must be 100°C or water should be boiling.</li><li>Blanch ingredients for 2 minutes in a crate in Pot 1</li><li>1 kg guts</li><li>5 large abalone shells or 13 small abalone shells</li><li>Transfer blanched ingredients into Pot 2.</li><li>Add 3kg dried kelp to Pot 2</li><li>Cook ingredients for 35 minutes</li><li>Turn off heat</li><li>Decant broth into buckets</li><li>Allow broth to cool to 25 °C and measure the pH, salt, and brix.</li><li>Record results on REC 7.3.1</li><li>Label buckets with the sauce broth code which includes</li><li>Date of cook</li><li>Pot number</li><li>Bucket number</li><li>Weight of broth in bucket</li><li>Store labelled buckets in chiller until mixing is required.</li></ol>',
