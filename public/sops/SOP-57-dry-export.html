    objective: 'The procedure outlines the process of cooking dry allocated to dry.',
    roles: '<ul><li>Abagold Processing Management is responsible for the implementation and review of this procedure and linked work instructions and training of staff.</li><li>Abagold Processing Staff are responsible for working in accordance with documented procedures and work instructions and the reporting on unsafe equipment and conditions.</li></ul>',
    process: '<ol><li>Receive packing list and labelling list from sales and marketing department</li><li>Print out the labelling list (REC 7.4.6)</li><li>Request for finance to open the safe to record box details<ol><li>Complete stock transfer REC 7.4.9</li></ol></li><li>Complete labelling list REC 7.4.6 with FG01 representative</li><li>Check the labels with FG01 against the packing list details paying special attention to the following:<ol><li>Carton number as per the packing list</li><li>Product size</li><li>Net weight &amp; Gross weight</li><li>Product date</li><li>Box code</li><li>Shelf life</li><li>Importer or dealer details – as per sales and marketing instruction (including address)</li></ol></li><li>Upon confirmation print out all labels</li><li>Place all labelled boxes back in the safe</li><li>Upon arrival of truck open the safe, load the boxes into the truck<ol><li>Tick off all boxes on the packing lists and sign to confirm the correct quantities per client</li><li>Complete REC 7.4.9 transfer document</li></ol></li><li>Compile export pack</li></ol>',
