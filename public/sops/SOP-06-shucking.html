    roles: '<ul><li>Abagold Processing Management is responsible for the implementation and review of this procedure and linked work instructions and training of staff.</li><li>Abagold Processing Staff are responsible for working in accordance with documented procedures and work instructions and the reporting on unsafe equipment and conditions.</li></ul>',
    process: '<ol><li>After weighing animals, place animals on shucking table.</li><li>Place abalone on shucking table with the foot facing up.</li><li>Hold animal firmly with one hand, Insert plastic scraper or shucking tool under abalone mantle just to the side of the head.</li><li>Press down and remove foot from shell in one firm motion</li><li>Place shell in chute attached to shucking table</li><li>Move foot to gutting table.</li></ol>',
