  sections: {
    objective: 'The procedure outlines the process of live transfers for orders.',
    roles: '<ul><li>Abagold Management is responsible for the implementation and review of this procedure and linked work instructions and training of staff.</li><li>Abagold Staff are responsible for working in accordance with documented procedures and work instructions and the reporting on unsafe equipment and conditions.</li></ul>',
    process: '<ol><li>Live Orders Arrangements and Writing of IDNs:</li><li>All IDNs for confirmed orders to be printed by the Harvesting and Live Export Manager.</li><li>Pack lists for all orders to be prepared according to the IDNs using export forms by the Live Sorting Supervisor.</li><li>One or a pair of two people fetch completed live bags at the LHA as per the order.</li><li>When fetching live bags, monitor the purge days and follow the FIFO system as instructed by the Supervisor.</li><li>When fetching live bags, place six bags at a time on the trolley to ensure that bags are not stacked up on the trolley.</li><li>Move the bags to the clean tanks at LHA allocated for clients.</li><li>Fill up each client according to its IDN and specifications.</li><li>Once completed – label each client’s order by its “name” and “pack date &amp; day” using markers, stickers, and flat boards next to the tanks.</li><li>Supervisor to write up the basket numbers of bags per size range according to each client’s order monitoring the quality of the bags and purge days.</li><li>Supervisor to verify if the basket numbers are written correctly together with the employees working at the LHA.</li><li>Supervisors and the Harvesting and Live Export Manager must spot check the quality of the product and sign off the total order.</li><li>All export forms for the total order to be sent to BI by email for live export and filed at DC for storage and verification.</li><li>All tags must be kept after pack according to their specific IDNs and client name for reference when fixing errors.</li></ol>',
    review: 'This procedure is reviewed on an annual basis to ensure compliance with safety standards, customer as well as legislative requirements.'
