    roles: '<ul><li>Abagold Processing Management is responsible for the implementation and review of this procedure and linked work instructions and training of staff.</li><li>Abagold Processing Staff are responsible for working in accordance with documented procedures and work instructions and the reporting on unsafe equipment and conditions.</li></ul>',
    process: '<ol><li>Position empty basket near end of conveyer</li><li>Place divider at the bottom of the basket</li><li>Use pick and place tool to lift 10 cans at once and place in basket</li><li>Repeat step 3 until 120 cans full one layer</li><li>Place divider on layer and repeat step 3 and 4.</li><li>Repeat until the basket contains 840 cans</li><li>Any dropped cans must be reopened and resealed.</li><li>Move full basket to retort.</li></ol>',
