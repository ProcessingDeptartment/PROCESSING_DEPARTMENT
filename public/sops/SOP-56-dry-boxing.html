    roles: '<ul><li>Abagold Processing Management is responsible for the implementation and review of this procedure and linked work instructions and training of staff.</li><li>Abagold Processing Staff are responsible for working in accordance with documented procedures and work instructions and the reporting on unsafe equipment and conditions.</li></ul>',
    process: '<ol><li>Once collection bin is filled, collect brown bags, plastic bags and cartons for boxing</li><li>Record batch details of cartons and bags REC 7.4.5</li><li>Remove required weight of graded abalone and place into brown bag and seal with tape</li><li>Place a plastic bag over the sealed brown bag and seal with tape</li><li>Place the sealed bag into a carton</li><li>Print out the label</li><li>Before printing confirm all details are correct including:<ol><li>Bin code</li><li>Size grade</li><li>Production date</li><li>Job number</li><li>Establishment code</li></ol></li><li>Label all cartons and seal</li><li>Place all labeled sealed cartons into safe to await dispatch instructions.</li><li>Boxes stored in the safe for more than 2 months require a presale inspection before dispatch</li><li>For presale inspection: open the box, record batch number and job number, record size grade and quality grade, record total weight, and take a photo of the product</li><li>Reseal the box after inspection and return to safe</li></ol>',
