<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
<link rel="stylesheet" href="../styles/responsive.css">
<title>Create SOP</title>
</head>
<body>
<div class="header"><h1>Create Standard Operating Procedure</h1><p>Create a new SOP document.</p></div>
<div class="container">
<form>
<div class="card"><h2>Document Information</h2>
<div class="grid">
<div><label>SOP Number</label><input></div>
<div><label>Revision</label><input></div>
<div><label>Title</label><input></div>
<div><label>Department</label><input></div>
<div><label>Area</label><input></div>
<div><label>Owner</label><input></div>
<div><label>Approver</label><input></div>
<div><label>Status</label><select><option>Draft</option><option>Approved</option></select></div>
<div><label>Effective Date</label><input type="date"></div>
<div><label>Review Date</label><input type="date"></div>
</div></div>
<div class="card"><h2>Objective</h2><textarea></textarea></div>
<div class="card"><h2>Scope</h2><textarea></textarea></div>
<div class="card"><h2>Responsibilities</h2><textarea></textarea></div>
<div class="card"><h2>Definitions</h2><textarea></textarea></div>
<div class="card"><h2>Equipment & Materials</h2><textarea></textarea></div>
<div class="card"><h2>Safety Requirements</h2><textarea></textarea></div>
<div class="card"><h2>Procedure</h2><textarea></textarea></div>
<div class="card"><h2>Critical Control Points</h2><textarea></textarea></div>
<div class="card"><h2>Related Records</h2><textarea></textarea></div>
<div class="card"><h2>References</h2><textarea></textarea></div>
<div class="card"><h2>Revision History</h2><textarea></textarea></div>
<div class="card"><h2>Attachments</h2><textarea></textarea></div>
<div class="actions">
<button class="btn secondary" type="reset">Cancel</button>
<button class="btn primary" type="submit">Save SOP</button>
</div>
</form>
</div>
</body>
</html>
