    roles: '<ul><li>Abagold Processing Management is responsible for the implementation and review of this procedure and linked work instructions and training of staff.</li><li>Abagold Processing Staff are responsible for working in accordance with documented procedures and work instructions and the reporting on unsafe equipment and conditions.</li></ul>',
    process: '<ol><li>Record cooking process as per REC 7.4.1</li><li>Fill up Pot with 100lt seawater</li><li>Open steam to heat up pot</li><li>Add 600ml of Vinegar and stir in</li><li>Take pH reading at a temperature between 40-50 ̊C</li><li>Add more water or vinegar until the pH reads between 4.1 and 4.5</li><li>Add sugar and salt to Pot</li><li>When cooking cultivated abalone</li><li>Add 3kg Salt</li><li>Add 2 kg Brown sugar</li><li>When coking Wild abalone</li><li>Add 5kg Salt</li><li>Add 2kg Brown sugar</li><li>Weigh up to 60kg abalone from Chiller for 1 pot.</li><li>Check temperature of water</li><li>For Cultivated abalone, once temperature reaches 85-95 ̊C add abalone to Pot</li><li>For Wild abalone, once temperature reaches 60 - 70 ̊C add abalone to Pot</li><li>Cook Abalone</li><li>Cook cultivated abalone at 85-95 ̊C for 90 minutes.</li><li>Cook Wild abalone at 60 - 70 ̊C for 120 minutes.</li><li>Drain water and remove abalone from pot into crates.</li><li>Transfer abalone to white bins and rinse with freshwater.</li></ol>',
