    roles: '<ul><li>Abagold Processing Management is responsible for the implementation and review of this procedure and linked work instructions and training of staff.</li><li>Abagold Processing Staff are responsible for working in accordance with documented procedures and work instructions and the reporting on unsafe equipment and conditions.</li></ul>',
    process: '<ol><li>Print out REC 7.3.3 and complete broth &amp; ingredient information based on total weight of broth to be used for mixing.</li><li>Heat up pot to 100°C or until boiling.</li><li>Check the temperature of the broth</li><li>Check temperature in the center of the pot</li><li>Temperature should be 100°C or boiling.</li><li>Split the cold broth into two 5kg broths</li><li>Remove 3 x 10Kg of broth</li><li>In bucket 1:</li><li>Mix in the Tapioca starch until smooth</li><li>Add the chicken and vegetable powders</li><li>Add oyster sauce, soy sauce and sugar</li><li>In bucket 2:</li><li>Add gelatin powder</li><li>Allow gelatin to absorb for 10 minutes</li><li>Use an electric mixer to ensure the mix is free from any lumps</li><li>In bucket 3:</li><li>Mix in Malt</li><li>Add Xanthan Gum and mix well with an electric mixer until mixture is free from lumps.</li><li>Add buckets into boiling pot of broth and mix well.</li><li>Add liquid chicken and pork flavors.</li><li>Boil sauce for 25 minutes stirring occasionally.</li><li>After 25 minutes and once smooth, remove 50ml sample to measure at 25 °C the</li><li>Record on Rec 7.3.3</li><li>Decant the sauce into buckets</li><li>Label buckets with the correct sauce code, and record on REC 7.3.5</li><li>Pot code</li><li>Bucket number</li><li>Decant sauce from buckets into jugs</li><li>Fill cans with hot sauce</li></ol>',
