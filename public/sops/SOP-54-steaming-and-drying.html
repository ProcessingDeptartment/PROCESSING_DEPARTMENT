    objective: 'The procedure outlines the process of cooking dry allocated to dry.',
    roles: '<ul><li>Abagold Processing Management is responsible for the implementation and review of this procedure and linked work instructions and training of staff.</li><li>Abagold Processing Staff are responsible for working in accordance with documented procedures and work instructions and the reporting on unsafe equipment and conditions.</li></ul>',
    process: '<ol><li>Once trolley is full of dry on strings, move to pre-drying area (Windhoek)<ol><li>Ensure all fans and de-humidifiers are on</li><li>Write Day 0 date on the trolley card</li><li>Ensure side A or B of the trolley faces the wind. Never side C or D</li><li>Night shift checks pre-drying area (Windhoek) once midway through the shift, rotates trolleys so every trolley sits evenly in front of the fans, and swaps A and B so each side gets equal time facing the wind</li></ol></li><li>Leave all trolleys in the pre-drying area (Windhoek) overnight</li><li>Move trolleys to steamer<ol><li>The Day 1 morning steam, straight out of the pre-drying area, is the most important steam of the batch</li><li>Steam 2 trolleys at a time for 20 minutes per cycle</li></ol></li><li>Move trolleys from steamer into drying room 1 (main drying room)<ol><li>Do not leave the drying room doors open</li></ol></li><li>Days 1 to 3: steam twice per day, morning round and afternoon round. Follow the steam schedule<ol><li>Steam 2 trolleys at a time for 20 minutes per cycle</li></ol></li><li>Only remove 2 trolleys for steaming at a time. Keep drying room doors closed in between</li><li>At each steam, return the trolley with the opposite open side (A or B) facing the wind. Record the side on the trolley card</li><li>Write the actual steam time on the trolley card as each trolley comes out of the steamer</li><li>On weekends (Saturday and Sunday), one steam only. Follow the steam schedule</li><li>Days 4 to 7: steam once per day. Follow the steam schedule<ol><li>Continue to rotate the trolley at each steam so no side takes the wind all the time</li><li>Write the actual steam time on the trolley card as each trolley comes out of the steamer</li></ol></li><li>Days 8 to 13: trolleys remain in the main drying room, moving to lower wind zones as product dries</li><li>Days 13 to 21: move trolleys to Drying Room 2 (container). Shorten trolleys. No steaming required</li><li>Day 21 to grading: move product to Drying Room 3 (grading room). Place abalone in black crates with job number on every crate. No steaming required</li><li>Once product reaches required level of dryness, de-string and grade.</li><li>Maximum 21 days across all drying rooms before de-stringing</li><li>Important notes:</li><li>Doors stay closed from the end of the last steam round until the start of the next round. No trolleys in or out and no fan changes overnight</li><li>Fans and airflow are set by dry supervision or upper management only. No extra fans may be added</li></ol>',
