    roles: '<ul><li>Abagold Processing Management is responsible for the implementation and review of this procedure and linked work instructions and training of staff.</li><li>Abagold Processing Staff are responsible for working in accordance with documented procedures and work instructions and the reporting on unsafe equipment and conditions.</li></ul>',
    process: '<ol><li>After grading collect brown bags, plastic bags and cartons for boxing</li><li>Record batch details of cartons and bags on REC 7.4.4</li><li>Remove 15.15Kg of graded abalone and place into brown bag and seal with tape</li><li>Place a plastic bag over the sealed brown bag and seal with tape</li><li>Place the sealed bag into a carton</li><li>Print out the label</li><li>To print out the generic label go to the following location on the server:</li><li>Select “Generic dried label” for light product and “Generic dried label DARK” for dark product.</li><li>Before printing confirm all details are correct including:</li><li>Size grade</li><li>Production date</li><li>Job number</li><li>Establishment code</li><li>Label all cartons and seal</li><li>Place all labeled sealed cartons into safe to await dispatch instructions.</li></ol>',
