    objective: 'The procedure outlines the responsibility of the factory workers and management to ensure that the live holding area tank cleaning and checks are conducted.',
    roles: '<ul><li>Abagold Management is responsible for the implementation and review of this procedure and linked work instructions and training of staff.</li><li>Abagold Staff are responsible for working in accordance with documented procedures and work instructions and the reporting on unsafe equipment and conditions.</li></ul>',
    process: '<ol><li>Workers to collect their equipment (plastic scrappers, brooms, blue buckets, and small trolley for bags).</li><li>Move bags from the dirty tanks to be cleaned over to clean tanks.</li><li>Clean all dirty tanks and fill up the tanks – make sure all airpipes are tied down and not floating, nozzles are put back and valves are fully opened.</li><li>Move back all the bags you removed to clean tanks into the newly cleaned tanks.</li><li>Check for the following on all tanks in the live holding area:</li><li>Sufficient water in tanks.</li><li>Enough air that is evenly spread in the tank, and that all abalone are in bags and all the bags are tied correctly.</li><li>Put back all abalone outside the bags into relevant bags using a plastic scrapper.</li><li>Check if the bags are hanging correctly on the frames and that there are no fallen bags – fallen bags to be hanged again on the frames.</li><li>Ensure each bag has an RFID tag, report to your supervisor if there are bags with no tags.</li><li>Report to the supervisor or manager if there is any problem you can’t fix.</li><li>Supervisor to get assistance from technical to fix the problem.</li><li>Supervisor check the water temperature, pumps, chillers and the ozone system are still running and report these to the management group.</li><li>Check and remove any foreign objects (dirty papers, plastics, and spacers, etc.) in between the rows and tanks.</li><li>4. EQUIPTMENT</li><li>Plastic scrapers</li><li>Brooms</li><li>Blue buckets</li><li>Small trolley for bags</li></ol>',
