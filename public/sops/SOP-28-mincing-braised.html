    roles: '<ul><li>Abagold Processing Management is responsible for the implementation and review of this procedure and linked work instructions and training of staff.</li><li>Abagold Processing Staff are responsible for working in accordance with documented procedures and work instructions and the reporting on unsafe equipment and conditions.</li></ul>',
    process: '<ol><li>Receive cans from FG02 for processing</li><li>Record all details of the cans on REC 7.2.13 for traceability</li><li>Get mincer from storeroom and clean with water</li><li>Open cans using can opener</li><li>Drain the sauce into a sauce bucket and rinse the sauce off the abalone and place clean abalone in separate white bin.</li><li>Take buckets filled with sauce and throw away.</li><li>Switch on the mincer and place a clean white bin at the output of the mincer</li><li>Fill the mincer tray with abalone</li><li>Continue until white bin is filled with mince</li><li>Replace white bin with a new clean white bin</li><li>Repeat steps 7 through 9 until all product has been minced.</li><li>With the use of a spoon pack the mince into cans according to the current packing specification for minced abalone (REC 7.2.4)</li><li>Fill the cans of mince with a brine solution.</li><li>Follow SOP 23 and SOP 24 for seaming and coding of cans.</li></ol>',
