    roles: '<ul><li>The Processing Department is responsible for implementing this procedure and maintaining the required stock-control records.</li><li>The Dry Supervisor is responsible for completing the physical stock take in FG02.</li><li>Processing administrator is responsible for checking graded product and reconciling the physical stock take to Syspro and the supporting records.</li><li>When needed, The Shift Manager or Production &amp; export Manager is responsible for investigating variances and providing documented reasons and corrective actions.</li><li>Finance is responsible for accepting stock-take variances within the approved tolerance. Variances above the approved value must be escalated to Finance and the Production Manager.</li><li>Dumi and Franciline provide initial training and support. They may complete the FG01 stock take on the same day.</li></ul>',
