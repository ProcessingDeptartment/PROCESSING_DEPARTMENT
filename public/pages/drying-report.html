<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drying Report</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
<style>
  :root{
    --ink:var(--palette-ink); --steel-dk:var(--palette-dark); --paper:var(--palette-paper);
    --line:#c9cdd1; --line-soft:var(--palette-border); --accent:var(--palette-primary);
    --sans:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --mono:'IBM Plex Mono','SF Mono',Consolas,monospace;
  }
  #cr-root{ font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:14px; line-height:1.4; }
  #cr-root *{ box-sizing:border-box; }
  #cr-root h1,#cr-root h2{ margin:0; font-weight:700; }
  .cr-top{ background:var(--steel-dk); color:var(--palette-dark-text); padding:14px 18px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .doc-line{ display:flex; align-items:baseline; gap:10px; }
  .doc-code{ font-family:var(--mono); opacity:.8; }
  .btn{ padding:7px 13px; font-size:14px; font-family:var(--sans); cursor:pointer; border:none; border-radius:3px; font-weight:600; }
  .btn-ghost{ background:transparent; color:var(--palette-dark-text); border:1px solid #55636e !important; text-decoration:none; display:inline-flex; align-items:center; }
  .btn-ghost:hover{ background:#33444f; }
  .btn-flat{ background:var(--line-soft); color:var(--ink); }
  .btn-flat:hover{ background:#d5d8d6; }
  .cr-body{ padding:16px 18px 60px; max-width:1100px; margin:0 auto; }
  .panel{ background:#fff; border:1px solid var(--line-soft); border-radius:6px; margin-bottom:14px; padding:14px 16px; }
  .toolbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .muted{ color:#6b7680; font-size:12px; }
  .grow{ flex:1; }
  .jobline{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px; margin-bottom:12px; }
  .jobno{ font-family:var(--mono); font-size:22px; font-weight:700; letter-spacing:.02em; }
  .pill{ display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; border-radius:20px; padding:2px 9px; }
  .pill.open{ background:var(--palette-ok-bg); color:var(--palette-ok); }
  .pill.closed{ background:#e7eaec; color:#5b6b78; }
  h2.sec{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:#5c6771; margin:18px 0 8px; border-bottom:1px solid var(--line-soft); padding-bottom:4px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ padding:6px 8px; border-bottom:1px solid var(--line-soft); text-align:left; }
  th{ background:#f4f5f6; font-size:12px; }
  td.num,th.num{ text-align:right; font-family:var(--mono); }
  tr.total td{ font-weight:700; border-top:2px solid var(--ink); background:#fafbfb; }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px; }
  .kv dt{ color:#5c6771; }
  .kv dd{ margin:0; font-family:var(--mono); font-weight:600; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  @media (max-width:760px){ .grid2{ grid-template-columns:1fr; } }
  .warn{ background:#fbf0dc; color:#8a5a10; border-radius:4px; padding:8px 11px; font-size:12px; margin-top:8px; }
  .statbig{ font-family:var(--mono); font-size:20px; font-weight:700; }
  @media print{
    .no-print{ display:none !important; }
    .cr-top{ background:#fff; color:#000; border-bottom:2px solid #000; }
    .panel{ border:none; padding:0; margin-bottom:10px; }
    body{ background:#fff; }
    h2.sec{ break-after:avoid; }
    table{ break-inside:auto; }
    tr{ break-inside:avoid; }
  }
</style>
</head>
<body>
<div id="cr-root">
  <div class="cr-top">
    <div class="doc-line">
      <span class="doc-code">DRYING</span>
      <h1>Drying Report</h1>
    </div>
    <div class="no-print">
      <a class="btn btn-ghost" href="job-status.html">← Job status</a>
    </div>
  </div>
  <div class="cr-body">
    <div class="panel no-print">
      <div class="toolbar">
        <span class="muted">Job no.</span>
        <span class="jobno" id="jobLabel" style="font-size:16px;">—</span>
        <button class="btn btn-flat" id="refreshBtn">Refresh</button>
        <span class="grow"></span>
        <button class="btn btn-flat" id="csvBtn">Export CSV</button>
        <button class="btn btn-flat" id="printBtn">Print / PDF</button>
      </div>
      <div class="muted" id="statusLine"></div>
    </div>

    <div class="panel" id="reportPanel"></div>
  </div>
</div>

<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/auth.js?v=2"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script>(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const num = (v) => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  const fmt = (n, d) => (n == null ? '—' : n.toFixed(d == null ? 2 : d));

  let CACHE = {};

  async function getRecord(key) {
    let raw = await window.storage.get(key, true);
    if (!raw) { await sleep(1500); raw = await window.storage.get(key, true); }
    if (!raw) return [];
    try {
      const parsed = JSON.parse(raw.value != null ? raw.value : raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch { return []; }
  }

  function forJob(subs, jobNo) {
    const needle = String(jobNo).trim().toUpperCase();
    return subs.filter((s) => {
      const v = s.values || {};
      const j = String(v.jobNo || v.jobNumber || '').trim().toUpperCase();
      return j === needle;
    });
  }

  // first non-null value for a key across submissions/entries
  function pick(subs, ...keys) {
    for (const s of subs) {
      const v = s.values || {};
      for (const k of keys) { const n = v[k]; if (n != null && n !== '') return n; }
    }
    return null;
  }
  function pickNum(subs, ...keys) { return num(pick(subs, ...keys)); }
  // sum numeric key across submissions/entries
  function sumNum(subs, key) {
    let total = null;
    subs.forEach((s) => { const n = num((s.values || {})[key]); if (n != null) total = (total || 0) + n; });
    return total;
  }

  // shared with canning-report: harvest rows straight from abalone-receiving
  function harvestRows(receiving) {
    const rows = [];
    receiving.forEach((s) => {
      const date = (s.values || {}).receivingDate || '';
      (s.roster || []).forEach((r) => {
        const mass = num(r.wholeWeight), animals = num(r.farmCount);
        if (mass == null && animals == null) return;
        rows.push({ date, sizeRange: r.sizeRange || '', mass, animals });
      });
    });
    return rows;
  }

  const TIMELINE_STEPS = [
    ['cookingDate', 'Cooking date'],
    ['movementToDryRoom1Date', 'Movement to dry room 1'],
    ['steam1Date', 'Steam 1'], ['steam2Date', 'Steam 2'], ['steam3Date', 'Steam 3'],
    ['steam4Date', 'Steam 4'], ['steam5Date', 'Steam 5'], ['steam6Date', 'Steam 6'],
    ['steam7Date', 'Steam 7'], ['steam8Date', 'Steam 8'], ['steam9Date', 'Steam 9'],
    ['steam10Date', 'Steam 10'], ['steam11Date', 'Steam 11'], ['steam12Date', 'Steam 12'],
    ['steam13Date', 'Steam 13'], ['steam14Date', 'Steam 14'],
    ['movementToContainerDate', 'Movement to container'],
    ['removedFromTrolleysDate', 'Removed from trolleys'],
    ['movementToGradingRoomDate', 'Movement to grading room'],
    ['dateDeString', 'De-string'],
    ['dateGraded', 'Graded']
  ];

  const SIZE_GRADES = [
    ['under8g', 'Under 8g'], ['g8to10', '8g–10g'], ['g11to13', '11g–13g'], ['g14to16', '14g–16g'],
    ['g17to20', '17g–20g'], ['g21to23', '21g–23g'], ['g24to25', '24g–25g'], ['g26to28', '26g–28g'],
    ['g29to31', '29g–31g'], ['g32to35', '32g–35g'], ['g36to39', '36g–39g'], ['g40to44', '40g–44g'],
    ['g45to50', '45g–50g'], ['g51to55', '51g–55g'], ['g56to60', '56g–60g'], ['g60plus', '60g+']
  ];

  async function loadAll() {
    const [receiving, drying, grading] = await Promise.all([
      getRecord('formrecord:abalone-receiving'),
      getRecord('monitoring_log:drying-process'),
      getRecord('formrecord:grading-production-log-cultivated')
    ]);
    CACHE = { receiving, drying, grading };
  }

  function buildReport(jobNo) {
    const receiving = forJob(CACHE.receiving, jobNo);
    const drying = forJob(CACHE.drying, jobNo);
    const grading = forJob(CACHE.grading, jobNo);

    const harvest = harvestRows(receiving);
    const totalMass = harvest.reduce((a, h) => a + (h.mass || 0), 0);
    const totalAnimals = harvest.reduce((a, h) => a + (h.animals || 0), 0);

    const wholeWeight = pickNum(drying, 'wholeWeight') != null ? pickNum(drying, 'wholeWeight') : (totalMass || null);
    const cookingWeight = pickNum(drying, 'cookingWeight');
    const driedWeight = pickNum(grading, 'actualDriedWeight') != null
      ? pickNum(grading, 'actualDriedWeight') : pickNum(drying, 'dryWeight');
    const actualYield = pickNum(grading, 'yield') != null ? pickNum(grading, 'yield')
      : (pickNum(drying, 'estimateYield') != null ? pickNum(drying, 'estimateYield')
        : ((driedWeight != null && wholeWeight) ? (driedWeight / wholeWeight * 100) : null));

    const timeline = TIMELINE_STEPS
      .map(([k, label]) => ({ label, date: pick(drying, k) }))
      .filter((r) => r.date);
    const totalDryingTimeDays = pickNum(drying, 'totalDryingTimeDays');

    const gradeRows = SIZE_GRADES.map(([k, label]) => ({ label, weight: sumNum(grading, k) }))
      .filter((r) => r.weight != null);
    const bGrade = sumNum(grading, 'bGrade');
    const actualGradedWeight = pickNum(grading, 'actualGradedWeight');
    const gradeTotal = actualGradedWeight != null ? actualGradedWeight
      : (gradeRows.reduce((a, r) => a + (r.weight || 0), 0) + (bGrade || 0)) || null;

    return {
      jobNo, harvest, totalMass, totalAnimals,
      wholeWeight, cookingWeight, driedWeight, actualYield,
      timeline, totalDryingTimeDays,
      gradeRows, bGrade, gradeTotal,
      driedWeightReceived: pickNum(grading, 'driedWeightReceived'),
      dateIntoGradingRoom: pick(grading, 'dateIntoGradingRoom'),
      gradingDate: pick(grading, 'gradingDate'),
      header: (receiving[0] && receiving[0].values) || {},
      counts: { receiving: receiving.length, drying: drying.length, grading: grading.length }
    };
  }

  function render(rep, statusRow) {
    const closed = statusRow && statusRow.status === 'closed';
    const h = rep.header;
    const missing = [];
    if (!rep.counts.receiving) missing.push('Abalone Receiving (REC 7.1.2)');
    if (!rep.counts.drying) missing.push('Drying Process (REC 7.4.1)');
    if (!rep.counts.grading) missing.push('Grading Production Log — Cultivated (REC 7.4.3.1)');

    $('reportPanel').innerHTML = `
      <div class="jobline">
        <span class="muted">Drying Job No.</span>
        <span class="jobno">${esc(rep.jobNo)}</span>
        <span class="pill ${closed ? 'closed' : 'open'}">${closed ? 'Closed' : 'Open'}</span>
        <span class="grow"></span>
        <span class="muted">Generated ${new Date().toLocaleString()}</span>
      </div>

      <dl class="kv" style="margin-bottom:6px;">
        <dt>Drying process for</dt><dd>${esc(h.toBeProcessedFor || '—')}</dd>
        <dt>Received from</dt><dd>${esc(h.receivedFrom || '—')}</dd>
        <dt>Receiving date</dt><dd>${esc(h.receivingDate || '—')}</dd>
      </dl>

      <h2 class="sec">Yield summary</h2>
      <table>
        <thead><tr><th>Measure</th><th class="num">Value</th></tr></thead>
        <tbody>
          <tr><td>Whole weight (in)</td><td class="num">${fmt(rep.wholeWeight)} kg</td></tr>
          <tr><td>Cooking weight</td><td class="num">${fmt(rep.cookingWeight)} kg</td></tr>
          <tr><td>Actual dried weight</td><td class="num">${fmt(rep.driedWeight)} kg</td></tr>
          <tr class="total"><td>Actual yield</td><td class="num statbig">${fmt(rep.actualYield)} %</td></tr>
        </tbody>
      </table>
      <div class="muted" style="margin-top:4px;">Yield = dried weight ÷ whole weight × 100 (or the value recorded on REC 7.4.1 / 7.4.3.1 where present).</div>

      <h2 class="sec">Harvest breakdown (receiving)</h2>
      <table>
        <thead><tr>
          <th>Receiving date</th><th>Size range</th><th class="num">Whole mass (kg)</th>
          <th class="num">Animals</th><th class="num">Weight per animal (g)</th>
        </tr></thead>
        <tbody>
          ${rep.harvest.length ? rep.harvest.map((r) => `<tr>
            <td>${esc(r.date || '—')}</td>
            <td>${esc(r.sizeRange || '—')}</td>
            <td class="num">${fmt(r.mass, 3)}</td>
            <td class="num">${r.animals == null ? '—' : r.animals}</td>
            <td class="num">${(r.mass != null && r.animals) ? (r.mass / r.animals * 1000).toFixed(1) : '—'}</td>
          </tr>`).join('') : '<tr><td colspan="5" class="muted">No Abalone Receiving records for this job.</td></tr>'}
          ${rep.harvest.length ? `<tr class="total">
            <td>TOTAL</td><td></td>
            <td class="num">${fmt(rep.totalMass, 2)} kg</td>
            <td class="num">${rep.totalAnimals || '—'}</td>
            <td class="num">${rep.totalAnimals ? (rep.totalMass / rep.totalAnimals * 1000).toFixed(1) : '—'}</td>
          </tr>` : ''}
        </tbody>
      </table>

      <h2 class="sec">Drying process timeline</h2>
      <table>
        <thead><tr><th>Step</th><th>Date</th></tr></thead>
        <tbody>
          ${rep.timeline.length ? rep.timeline.map((r) => `<tr>
            <td>${esc(r.label)}</td><td class="num">${esc(r.date)}</td>
          </tr>`).join('') : '<tr><td colspan="2" class="muted">No Drying Process dates recorded for this job.</td></tr>'}
          <tr class="total"><td>Total drying time</td><td class="num">${rep.totalDryingTimeDays == null ? '—' : rep.totalDryingTimeDays + ' days'}</td></tr>
        </tbody>
      </table>

      <h2 class="sec">Size grade breakdown</h2>
      <table>
        <thead><tr><th>Size range</th><th class="num">Weight (kg)</th></tr></thead>
        <tbody>
          ${rep.gradeRows.length ? rep.gradeRows.map((r) => `<tr>
            <td>${esc(r.label)}</td><td class="num">${fmt(r.weight, 2)}</td>
          </tr>`).join('') : '<tr><td colspan="2" class="muted">No grading weights recorded for this job.</td></tr>'}
          ${rep.bGrade != null ? `<tr><td>B-grade</td><td class="num">${fmt(rep.bGrade, 2)}</td></tr>` : ''}
          ${rep.gradeTotal != null ? `<tr class="total"><td>TOTAL (actual graded weight)</td><td class="num">${fmt(rep.gradeTotal, 2)}</td></tr>` : ''}
        </tbody>
      </table>

      ${missing.length ? `<div class="warn no-print"><strong>No data yet from:</strong> ${esc(missing.join(', '))}. Those sections stay blank until those records are submitted against this job.</div>` : ''}
    `;
  }

  let CURRENT_JOB = null;
  function currentJob() { return CURRENT_JOB; }

  function downloadCsv() {
    if (!currentJob()) { alert('No job specified.'); return; }
    const rep = buildReport(currentJob());
    const q = (s) => `"${String(s == null ? '' : s).replace(/"/g, '""')}"`;
    const lines = [];
    lines.push(q('Drying Report'), '');
    lines.push(q('JOB HEADER'));
    lines.push([q('Job no.'), q(rep.jobNo)].join(','));
    lines.push([q('Processing for'), q(rep.header.toBeProcessedFor)].join(','));
    lines.push([q('Received from'), q(rep.header.receivedFrom)].join(','));
    lines.push([q('Receiving date'), q(rep.header.receivingDate)].join(','));
    lines.push('');
    lines.push(q('YIELD SUMMARY'));
    lines.push(['Measure', 'Value'].map(q).join(','));
    lines.push([q('Whole weight (kg)'), q(fmt(rep.wholeWeight))].join(','));
    lines.push([q('Cooking weight (kg)'), q(fmt(rep.cookingWeight))].join(','));
    lines.push([q('Actual dried weight (kg)'), q(fmt(rep.driedWeight))].join(','));
    lines.push([q('Actual yield (%)'), q(fmt(rep.actualYield))].join(','));
    lines.push('');
    lines.push(q('HARVEST BREAKDOWN'));
    lines.push(['Receiving date', 'Size range', 'Whole mass (kg)', 'Animals', 'Weight per animal (g)'].map(q).join(','));
    rep.harvest.forEach((r) => lines.push([
      q(r.date), q(r.sizeRange), q(fmt(r.mass, 3)), q(r.animals),
      q((r.mass != null && r.animals) ? (r.mass / r.animals * 1000).toFixed(1) : '')
    ].join(',')));
    lines.push([q('TOTAL'), '', q(fmt(rep.totalMass, 2)), q(rep.totalAnimals), ''].join(','));
    lines.push('');
    lines.push(q('DRYING TIMELINE'));
    lines.push(['Step', 'Date'].map(q).join(','));
    rep.timeline.forEach((r) => lines.push([q(r.label), q(r.date)].join(',')));
    lines.push([q('Total drying time (days)'), q(rep.totalDryingTimeDays)].join(','));
    lines.push('');
    lines.push(q('SIZE GRADE BREAKDOWN'));
    lines.push(['Size range', 'Weight (kg)'].map(q).join(','));
    rep.gradeRows.forEach((r) => lines.push([q(r.label), q(fmt(r.weight, 2))].join(',')));
    if (rep.bGrade != null) lines.push([q('B-grade'), q(fmt(rep.bGrade, 2))].join(','));
    if (rep.gradeTotal != null) lines.push([q('TOTAL (actual graded weight)'), q(fmt(rep.gradeTotal, 2))].join(','));

    const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `drying-report-${rep.jobNo}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  let STATUSES = [];
  let JOB_STATUSES = [];

  function isDryingJob(jobNo) {
    const j = String(jobNo || '').toUpperCase();
    return j.startsWith('3DP') || j.startsWith('DPR');
  }

  async function show(jobNo) {
    $('jobLabel').textContent = jobNo || '—';
    if (!jobNo) {
      $('reportPanel').innerHTML = '<div class="muted">No job specified. Open this report from <a href="job-status.html">Job Status Updates</a>.</div>';
      return;
    }
    const rep = buildReport(jobNo);
    render(rep, JOB_STATUSES.find((s) => String(s.job_no) === String(jobNo)));
    $('statusLine').textContent =
      `${rep.counts.receiving} receiving · ${rep.counts.drying} drying process · ${rep.counts.grading} grading log record(s) for this job`;
  }

  async function refresh() {
    $('statusLine').textContent = 'Loading…';
    [STATUSES] = await Promise.all([window.JobStatus.list(), loadAll()]);
    JOB_STATUSES = STATUSES.filter((s) => isDryingJob(s.job_no));
    CURRENT_JOB = new URLSearchParams(location.search).get('job');
    await show(currentJob());
  }

  async function init() {
    if (window.LoginUI) { await window.LoginUI.ensureAuthenticated(); }
    $('refreshBtn').addEventListener('click', refresh);
    $('csvBtn').addEventListener('click', downloadCsv);
    $('printBtn').addEventListener('click', () => window.print());
    await refresh();
  }

  init();
})();
</script>
</body>
</html>
