<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drying Report</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
<style>
  :root{
    --ink:var(--palette-ink); --steel-dk:var(--palette-dark); --paper:var(--palette-paper);
    --line:#c9cdd1; --line-soft:var(--palette-border); --accent:var(--palette-primary);
    --sans:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --mono:'IBM Plex Mono','SF Mono',Consolas,monospace;
  }
  #cr-root{ font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:14px; line-height:1.4; }
  #cr-root *{ box-sizing:border-box; }
  #cr-root h1,#cr-root h2{ margin:0; font-weight:700; }
  .cr-top{ background:var(--steel-dk); color:var(--palette-dark-text); padding:14px 18px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .doc-line{ display:flex; align-items:baseline; gap:10px; }
  .doc-code{ font-family:var(--mono); opacity:.8; }
  .btn{ padding:7px 13px; font-size:14px; font-family:var(--sans); cursor:pointer; border:none; border-radius:3px; font-weight:600; }
  .btn-ghost{ background:transparent; color:var(--palette-dark-text); border:1px solid #55636e !important; text-decoration:none; display:inline-flex; align-items:center; }
  .btn-ghost:hover{ background:#33444f; }
  .btn-flat{ background:var(--line-soft); color:var(--ink); }
  .btn-flat:hover{ background:#d5d8d6; }
  .cr-body{ padding:16px 18px 60px; max-width:1100px; margin:0 auto; }
  .panel{ background:#fff; border:1px solid var(--line-soft); border-radius:6px; margin-bottom:14px; padding:14px 16px; }
  .toolbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .muted{ color:#6b7680; font-size:12px; }
  .grow{ flex:1; }
  .jobline{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px; margin-bottom:12px; }
  .jobno{ font-family:var(--mono); font-size:22px; font-weight:700; letter-spacing:.02em; }
  .pill{ display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; border-radius:20px; padding:2px 9px; }
  .pill.open{ background:var(--palette-ok-bg); color:var(--palette-ok); }
  .pill.closed{ background:#e7eaec; color:#5b6b78; }
  h2.sec{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:#5c6771; margin:18px 0 8px; border-bottom:1px solid var(--line-soft); padding-bottom:4px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ padding:6px 8px; border-bottom:1px solid var(--line-soft); text-align:left; }
  th{ background:#f4f5f6; font-size:12px; }
  td.num,th.num{ text-align:right; font-family:var(--mono); }
  tr.total td{ font-weight:700; border-top:2px solid var(--ink); background:#fafbfb; }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px; }
  .kv dt{ color:#5c6771; }
  .kv dd{ margin:0; font-family:var(--mono); font-weight:600; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  @media (max-width:760px){ .grid2{ grid-template-columns:1fr; } }
  .warn{ background:#fbf0dc; color:#8a5a10; border-radius:4px; padding:8px 11px; font-size:12px; margin-top:8px; }
  .statbig{ font-family:var(--mono); font-size:20px; font-weight:700; }
  @media print{
    .no-print{ display:none !important; }
    .cr-top{ background:#fff; color:#000; border-bottom:2px solid #000; }
    .panel{ border:none; padding:0; margin-bottom:10px; }
    body{ background:#fff; }
    h2.sec{ break-after:avoid; }
    table{ break-inside:auto; }
    tr{ break-inside:avoid; }
  }
</style>
</head>
<body>
<div id="cr-root">
  <div class="cr-top">
    <div class="doc-line">
      <span class="doc-code">DRYING</span>
      <h1>Drying Report</h1>
    </div>
    <div class="no-print">
      <a class="btn btn-ghost" href="job-status.html">← Job status</a>
    </div>
  </div>
  <div class="cr-body">
    <div class="panel no-print">
      <div class="toolbar">
        <span class="muted">Job no.</span>
        <span class="jobno" id="jobLabel" style="font-size:16px;">—</span>
        <button class="btn btn-flat" id="refreshBtn">Refresh</button>
        <span class="grow"></span>
        <button class="btn btn-flat" id="csvBtn">Export CSV</button>
        <button class="btn btn-flat" id="printBtn">Print / PDF</button>
      </div>
      <div class="muted" id="statusLine"></div>
    </div>

    <div class="panel" id="reportPanel"></div>
  </div>
</div>

<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=14"></script>
<script src="../lib/auth.js?v=2"></script>
<script src="../lib/login-ui.js?v=3"></script>
<script>(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const num = (v) => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  const fmt = (n, d) => (n == null ? '—' : n.toFixed(d == null ? 2 : d));

  let CACHE = {};

  async function getRecord(key) {
    let raw = await window.storage.get(key, true);
    if (!raw) { await sleep(1500); raw = await window.storage.get(key, true); }
    if (!raw) return [];
    try {
      const parsed = JSON.parse(raw.value != null ? raw.value : raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch { return []; }
  }

  function forJob(subs, jobNo) {
    const needle = String(jobNo).trim().toUpperCase();
    return subs.filter((s) => {
      const v = s.values || {};
      const j = String(v.jobNo || v.jobNumber || '').trim().toUpperCase();
      return j === needle;
    });
  }

  // first non-null value for a key across submissions/entries
  function pick(subs, ...keys) {
    for (const s of subs) {
      const v = s.values || {};
      for (const k of keys) { const n = v[k]; if (n != null && n !== '') return n; }
    }
    return null;
  }
  function pickNum(subs, ...keys) { return num(pick(subs, ...keys)); }
  // sum numeric key across submissions/entries
  function sumNum(subs, key) {
    let total = null;
    subs.forEach((s) => { const n = num((s.values || {})[key]); if (n != null) total = (total || 0) + n; });
    return total;
  }

  // shared with canning-report: harvest rows straight from abalone-receiving
  function harvestRows(receiving) {
    const rows = [];
    receiving.forEach((s) => {
      const date = (s.values || {}).receivingDate || '';
      (s.roster || []).forEach((r) => {
        const mass = num(r.wholeWeight), animals = num(r.farmCount);
        if (mass == null && animals == null) return;
        rows.push({ date, sizeRange: r.sizeRange || '', mass, animals });
      });
    });
    return rows;
  }

  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const pad2 = (n) => String(n).padStart(2, '0');
  // an instant (server stamp) -> "12 Sep 2026 06:00"; a plain date -> "12 Sep 2026"
  function fmtWhen(v, withTime) {
    if (!v) return '';
    const str = String(v);
    const d = /^\d{4}-\d{2}-\d{2}$/.test(str) ? new Date(str + 'T00:00:00') : new Date(str);
    if (isNaN(d)) return str;
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + (withTime ? ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) : '');
  }
  const dayOf = (v) => { const d = new Date(v); return isNaN(d) ? '' : d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
  const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
  const submitted = (subs) => subs.filter((s) => s.status !== 'draft');

  const SIZE_GRADES = [
    ['under8g', 'Under 8g'], ['g8to10', '8g–10g'], ['g11to13', '11g–13g'], ['g14to16', '14g–16g'],
    ['g17to20', '17g–20g'], ['g21to23', '21g–23g'], ['g24to25', '24g–25g'], ['g26to28', '26g–28g'],
    ['g29to31', '29g–31g'], ['g32to35', '32g–35g'], ['g36to39', '36g–39g'], ['g40to44', '40g–44g'],
    ['g45to50', '45g–50g'], ['g51to55', '51g–55g'], ['g56to60', '56g–60g'], ['g60plus', '60g+']
  ];
  const SIZE_GRADES_RANCHED = [
    ['under50g', 'Under 50g'], ['g51to80', '51g–80g'], ['g81to100', '81g–100g'], ['g101to150', '101g–150g'],
    ['g151to200', '151g–200g'], ['g200plus', '200g+'], ['darkUnder100g', 'Dark under 100g'], ['dark100gPlus', 'Dark 100g+']
  ];

  async function loadAll() {
    const [receiving, drying, grading, gradingRanched, cooking] = await Promise.all([
      getRecord('formrecord:abalone-receiving'),
      getRecord('formrecord:drying-process'),
      getRecord('formrecord:grading-production-log-cultivated'),
      getRecord('formrecord:grading-production-log-ranched'),
      getRecord('formrecord:dry-cooking')
    ]);
    CACHE = { receiving, drying, grading, gradingRanched, cooking };
  }

  // REC 7.4.1 is an entry log: many entries per job. Everything job-level is worked out here from ALL of the
  // job's submitted entries (same rules as the v_dry_job_progress database view). Weights that no longer live
  // on 7.4.1 come from where they now live: whole weight from receiving, yield / dried weight / size grades /
  // graded date from the grading logs (REC 7.4.3.1 / 7.4.3.2), cooking date from REC 7.4.0.
  function buildReport(jobNo) {
    const receiving = forJob(CACHE.receiving, jobNo);
    const entries = submitted(forJob(CACHE.drying, jobNo))
      .sort((a, b) => String((a.values || {}).entryDate || '').localeCompare(String((b.values || {}).entryDate || '')));
    const grading = submitted(forJob(CACHE.grading, jobNo));
    const gradingRanched = submitted(forJob(CACHE.gradingRanched, jobNo));
    const cooking = submitted(forJob(CACHE.cooking, jobNo));
    const gradingAll = grading.concat(gradingRanched);

    const harvest = harvestRows(receiving);
    const totalMass = harvest.reduce((a, h) => a + (h.mass || 0), 0);
    const totalAnimals = harvest.reduce((a, h) => a + (h.animals || 0), 0);
    const wholeWeight = totalMass || pickNum(receiving, 'intakeWeight') || pickNum(entries, 'wholeWeightOld');

    // movements: the entry where each was answered Yes (server stamp; migrated ones are typed dates, midnight)
    const moved = (flag, stamp) => {
      const e = entries.find((x) => (x.values || {})[flag] === 'Yes' && (x.values || {})[stamp]);
      return e ? { at: e.values[stamp], typed: e.values.stampSource === 'migrated_typed' } : null;
    };
    const intoDry = moved('movedIntoDryRoom', 'dateIntoDryRoomAt');
    const intoContainer = moved('movedIntoDryContainer', 'dateIntoDryContainerAt');
    const intoGrading = moved('movedIntoGradingRoom', 'dateIntoGradingRoomAt');

    // steams from every entry, in steam-number order
    const steams = [];
    entries.forEach((e) => (e.roster || []).forEach((r) => { if (r) steams.push(r); }));
    steams.sort((a, b) => (parseInt(a.steamNo, 10) || 0) - (parseInt(b.steamNo, 10) || 0));

    // cooking date: the latest submitted REC 7.4.0 entry that has a Cooking card
    const cookEntry = cooking.filter((e) => (e.roster || []).some((r) => r && r.process === 'Cooking'))
      .sort((a, b) => String((b.values || {}).cookingDate || '').localeCompare(String((a.values || {}).cookingDate || '')))[0];
    const cookingDate = cookEntry ? (cookEntry.values || {}).cookingDate : null;

    const latestNum = (key) => { for (let i = entries.length - 1; i >= 0; i--) { const n = num((entries[i].values || {})[key]); if (n != null) return n; } return null; };
    const cookedWeight = latestNum('cookedWeight');
    const trolleys = latestNum('noOfTrolleys');

    const gradedDried = gradingAll.reduce((a, s) => a + (num((s.values || {}).actualDriedWeight) || 0), 0) || null;
    const oldDried = pickNum(entries, 'dryWeightOld');
    const driedWeight = gradedDried != null ? gradedDried : oldDried;
    const driedSource = gradedDried != null ? '' : (oldDried != null ? ' (old)' : '');
    const gradingYield = pickNum(gradingAll, 'yield');
    const actualYield = (driedWeight != null && wholeWeight) ? (driedWeight / wholeWeight * 100)
      : (gradingYield != null ? gradingYield : pickNum(entries, 'estimateYieldPctOld'));
    const dryingLoss = (cookedWeight && driedWeight != null) ? ((cookedWeight - driedWeight) / cookedWeight * 100) : null;

    const gradedDate = pick(gradingAll, 'gradingDate') || pick(entries, 'gradedDateOld');
    const dateIntoGrading = intoGrading ? dayOf(intoGrading.at) : (pick(gradingAll, 'dateIntoGradingRoom') || gradedDate);
    // drying days = date into grading room - date into dry room (7.4.1), falling back to the 7.4.3 dates
    const dryingDays = (intoDry && dateIntoGrading) ? daysBetween(dayOf(intoDry.at), dateIntoGrading) : pickNum(entries, 'totalDryingDaysOld');

    const timeline = [];
    if (cookingDate) timeline.push({ label: 'Cooking date (REC 7.4.0)', when: fmtWhen(cookingDate) });
    if (intoDry) timeline.push({ label: 'Moved into drying rooms', when: fmtWhen(intoDry.at, !intoDry.typed) });
    steams.forEach((r) => {
      const bits = [];
      if (r.steamingTempC) bits.push(r.steamingTempC + ' \u00b0C');
      if (r.steamingTimeMin) bits.push(r.steamingTimeMin + ' min');
      if (r.startTime) bits.push('start ' + r.startTime);
      timeline.push({ label: 'Steam ' + (r.steamNo || ''), when: fmtWhen(r.steamDate), detail: bits.join(', ') });
    });
    if (intoContainer) timeline.push({ label: 'Moved into dry container', when: fmtWhen(intoContainer.at, !intoContainer.typed) });
    if (intoGrading) timeline.push({ label: 'Moved into grading room', when: fmtWhen(intoGrading.at, !intoGrading.typed) });
    else if (dateIntoGrading) timeline.push({ label: 'Into grading room (REC 7.4.3)', when: fmtWhen(dateIntoGrading) });
    if (gradedDate) timeline.push({ label: 'Graded', when: fmtWhen(gradedDate) });

    const gradeSets = [];
    if (grading.length) gradeSets.push({ title: 'Cultivated', grades: SIZE_GRADES, subs: grading });
    if (gradingRanched.length) gradeSets.push({ title: 'Ranched', grades: SIZE_GRADES_RANCHED, subs: gradingRanched });
    gradeSets.forEach((gs) => {
      gs.rows = gs.grades.map(([k, label]) => ({ label, weight: sumNum(gs.subs, k) })).filter((r) => r.weight != null);
      gs.bGrade = sumNum(gs.subs, 'bGrade');
      const total = pickNum(gs.subs, 'actualGradedWeight');
      gs.total = total != null ? total : ((gs.rows.reduce((a, r) => a + (r.weight || 0), 0) + (gs.bGrade || 0)) || null);
    });

    return {
      jobNo, harvest, totalMass, totalAnimals,
      wholeWeight, cookedWeight, trolleys, driedWeight, driedSource, actualYield, dryingLoss,
      timeline, dryingDays, gradeSets,
      header: (receiving[0] && receiving[0].values) || {},
      counts: { receiving: receiving.length, drying: entries.length, grading: gradingAll.length, cooking: cooking.length }
    };
  }

  function render(rep, statusRow) {
    const closed = statusRow && statusRow.status === 'closed';
    const h = rep.header;
    const missing = [];
    if (!rep.counts.receiving) missing.push('Abalone Receiving (REC 7.1.2)');
    if (!rep.counts.drying) missing.push('Drying Process (REC 7.4.1)');
    if (!rep.counts.grading) missing.push('Grading Production Log (REC 7.4.3.1 / 7.4.3.2)');
    if (!rep.counts.cooking) missing.push('Dry Cooking (REC 7.4.0)');

    $('reportPanel').innerHTML = `
      <div class="jobline">
        <span class="muted">Drying Job No.</span>
        <span class="jobno">${esc(rep.jobNo)}</span>
        <span class="pill ${closed ? 'closed' : 'open'}">${closed ? 'Closed' : 'Open'}</span>
        <span class="grow"></span>
        <span class="muted">Generated ${new Date().toLocaleString()}</span>
      </div>

      <dl class="kv" style="margin-bottom:6px;">
        <dt>Drying process for</dt><dd>${esc(h.toBeProcessedFor || '—')}</dd>
        <dt>Received from</dt><dd>${esc(h.receivedFrom || '—')}</dd>
        <dt>Receiving date</dt><dd>${esc(h.receivingDate || '—')}</dd>
      </dl>

      <h2 class="sec">Yield summary</h2>
      <table>
        <thead><tr><th>Measure</th><th class="num">Value</th></tr></thead>
        <tbody>
          <tr><td>Whole weight (in)</td><td class="num">${fmt(rep.wholeWeight)} kg</td></tr>
          <tr><td>Cooked weight (REC 7.4.0)</td><td class="num">${fmt(rep.cookedWeight)} kg</td></tr>
          <tr><td>No. of trolleys</td><td class="num">${rep.trolleys == null ? '—' : rep.trolleys}</td></tr>
          <tr><td>Actual dried weight${esc(rep.driedSource)}</td><td class="num">${fmt(rep.driedWeight)} kg</td></tr>
          <tr><td>Drying loss (cooked to dried)</td><td class="num">${fmt(rep.dryingLoss)} %</td></tr>
          <tr class="total"><td>Actual yield</td><td class="num statbig">${fmt(rep.actualYield)} %</td></tr>
        </tbody>
      </table>
      <div class="muted" style="margin-top:4px;">Yield = dried weight ÷ whole weight × 100. Dried weight and grading come from REC 7.4.3.1 / 7.4.3.2; an old REC 7.4.1 dry weight is used only when there is no grading record and is marked (old).</div>

      <h2 class="sec">Harvest breakdown (receiving)</h2>
      <table>
        <thead><tr>
          <th>Receiving date</th><th>Size range</th><th class="num">Whole mass (kg)</th>
          <th class="num">Animals</th><th class="num">Weight per animal (g)</th>
        </tr></thead>
        <tbody>
          ${rep.harvest.length ? rep.harvest.map((r) => `<tr>
            <td>${esc(r.date || '—')}</td>
            <td>${esc(r.sizeRange || '—')}</td>
            <td class="num">${fmt(r.mass, 3)}</td>
            <td class="num">${r.animals == null ? '—' : r.animals}</td>
            <td class="num">${(r.mass != null && r.animals) ? (r.mass / r.animals * 1000).toFixed(1) : '—'}</td>
          </tr>`).join('') : '<tr><td colspan="5" class="muted">No Abalone Receiving records for this job.</td></tr>'}
          ${rep.harvest.length ? `<tr class="total">
            <td>TOTAL</td><td></td>
            <td class="num">${fmt(rep.totalMass, 2)} kg</td>
            <td class="num">${rep.totalAnimals || '—'}</td>
            <td class="num">${rep.totalAnimals ? (rep.totalMass / rep.totalAnimals * 1000).toFixed(1) : '—'}</td>
          </tr>` : ''}
        </tbody>
      </table>

      <h2 class="sec">Drying process timeline</h2>
      <table>
        <thead><tr><th>Step</th><th>Date</th><th>Detail</th></tr></thead>
        <tbody>
          ${rep.timeline.length ? rep.timeline.map((r) => `<tr>
            <td>${esc(r.label)}</td><td class="num">${esc(r.when)}</td><td>${esc(r.detail || '')}</td>
          </tr>`).join('') : '<tr><td colspan="3" class="muted">No Drying Process entries recorded for this job.</td></tr>'}
          <tr class="total"><td>Total drying time</td><td class="num" colspan="2">${rep.dryingDays == null ? '—' : rep.dryingDays + ' days'}</td></tr>
        </tbody>
      </table>

      <h2 class="sec">Size grade breakdown</h2>
      ${rep.gradeSets.length ? rep.gradeSets.map((gs) => `
      ${rep.gradeSets.length > 1 ? `<h3 style="margin:10px 0 4px;font-size:13px;">${esc(gs.title)}</h3>` : ''}
      <table>
        <thead><tr><th>Size range</th><th class="num">Weight (kg)</th></tr></thead>
        <tbody>
          ${gs.rows.length ? gs.rows.map((r) => `<tr><td>${esc(r.label)}</td><td class="num">${fmt(r.weight, 2)}</td></tr>`).join('')
            : '<tr><td colspan="2" class="muted">No grading weights recorded.</td></tr>'}
          ${gs.bGrade != null ? `<tr><td>B-grade</td><td class="num">${fmt(gs.bGrade, 2)}</td></tr>` : ''}
          ${gs.total != null ? `<tr class="total"><td>TOTAL (actual graded weight)</td><td class="num">${fmt(gs.total, 2)}</td></tr>` : ''}
        </tbody>
      </table>`).join('') : '<table><tbody><tr><td class="muted">No grading weights recorded for this job.</td></tr></tbody></table>'}

      ${missing.length ? `<div class="warn no-print"><strong>No data yet from:</strong> ${esc(missing.join(', '))}. Those sections stay blank until those records are submitted against this job.</div>` : ''}
    `;
  }

  let CURRENT_JOB = null;
  function currentJob() { return CURRENT_JOB; }

  function downloadCsv() {
    if (!currentJob()) { alert('No job specified.'); return; }
    const rep = buildReport(currentJob());
    const q = (s) => `"${String(s == null ? '' : s).replace(/"/g, '""')}"`;
    const lines = [];
    lines.push(q('Drying Report'), '');
    lines.push(q('JOB HEADER'));
    lines.push([q('Job no.'), q(rep.jobNo)].join(','));
    lines.push([q('Processing for'), q(rep.header.toBeProcessedFor)].join(','));
    lines.push([q('Received from'), q(rep.header.receivedFrom)].join(','));
    lines.push([q('Receiving date'), q(rep.header.receivingDate)].join(','));
    lines.push('');
    lines.push(q('YIELD SUMMARY'));
    lines.push(['Measure', 'Value'].map(q).join(','));
    lines.push([q('Whole weight (kg)'), q(fmt(rep.wholeWeight))].join(','));
    lines.push([q('Cooked weight (kg)'), q(fmt(rep.cookedWeight))].join(','));
    lines.push([q('No. of trolleys'), q(rep.trolleys)].join(','));
    lines.push([q('Actual dried weight (kg)' + rep.driedSource), q(fmt(rep.driedWeight))].join(','));
    lines.push([q('Drying loss (%)'), q(fmt(rep.dryingLoss))].join(','));
    lines.push([q('Actual yield (%)'), q(fmt(rep.actualYield))].join(','));
    lines.push('');
    lines.push(q('HARVEST BREAKDOWN'));
    lines.push(['Receiving date', 'Size range', 'Whole mass (kg)', 'Animals', 'Weight per animal (g)'].map(q).join(','));
    rep.harvest.forEach((r) => lines.push([
      q(r.date), q(r.sizeRange), q(fmt(r.mass, 3)), q(r.animals),
      q((r.mass != null && r.animals) ? (r.mass / r.animals * 1000).toFixed(1) : '')
    ].join(',')));
    lines.push([q('TOTAL'), '', q(fmt(rep.totalMass, 2)), q(rep.totalAnimals), ''].join(','));
    lines.push('');
    lines.push(q('DRYING TIMELINE'));
    lines.push(['Step', 'Date', 'Detail'].map(q).join(','));
    rep.timeline.forEach((r) => lines.push([q(r.label), q(r.when), q(r.detail || '')].join(',')));
    lines.push([q('Total drying time (days)'), q(rep.dryingDays), ''].join(','));
    lines.push('');
    rep.gradeSets.forEach((gs) => {
      lines.push(q('SIZE GRADE BREAKDOWN' + (rep.gradeSets.length > 1 ? ' - ' + gs.title : '')));
      lines.push(['Size range', 'Weight (kg)'].map(q).join(','));
      gs.rows.forEach((r) => lines.push([q(r.label), q(fmt(r.weight, 2))].join(',')));
      if (gs.bGrade != null) lines.push([q('B-grade'), q(fmt(gs.bGrade, 2))].join(','));
      if (gs.total != null) lines.push([q('TOTAL (actual graded weight)'), q(fmt(gs.total, 2))].join(','));
      lines.push('');
    });

    const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `drying-report-${rep.jobNo}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  let STATUSES = [];
  let JOB_STATUSES = [];

  function isDryingJob(jobNo) {
    const j = String(jobNo || '').toUpperCase();
    return j.startsWith('3DP') || j.startsWith('DPR');
  }

  async function show(jobNo) {
    $('jobLabel').textContent = jobNo || '—';
    if (!jobNo) {
      $('reportPanel').innerHTML = '<div class="muted">No job specified. Open this report from <a href="job-status.html">Job Status Updates</a>.</div>';
      return;
    }
    const rep = buildReport(jobNo);
    render(rep, JOB_STATUSES.find((s) => String(s.job_no) === String(jobNo)));
    $('statusLine').textContent =
      `${rep.counts.receiving} receiving · ${rep.counts.drying} drying process entr${rep.counts.drying === 1 ? 'y' : 'ies'} · ${rep.counts.grading} grading log record(s) for this job`;
  }

  async function refresh() {
    $('statusLine').textContent = 'Loading…';
    [STATUSES] = await Promise.all([window.JobStatus.list(), loadAll()]);
    JOB_STATUSES = STATUSES.filter((s) => isDryingJob(s.job_no));
    CURRENT_JOB = new URLSearchParams(location.search).get('job');
    await show(currentJob());
  }

  async function init() {
    if (window.LoginUI) { await window.LoginUI.ensureAuthenticated(); }
    $('refreshBtn').addEventListener('click', refresh);
    $('csvBtn').addEventListener('click', downloadCsv);
    $('printBtn').addEventListener('click', () => window.print());
    await refresh();
  }

  init();
})();
</script>
</body>
</html>
