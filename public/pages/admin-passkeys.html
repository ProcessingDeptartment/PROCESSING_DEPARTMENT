<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passkey Management</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#A9763A">
  <link rel="stylesheet" href="../styles/record-theme.css?v=1">
  <style>
    .admin-panel {
      max-width: 960px;
      margin: 20px auto;
      padding: 20px;
    }
    .passkey-form {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .form-row.full { grid-template-columns: 1fr; }
    input, button { padding: 8px; font-size: 14px; }
    .users-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .users-table th, .users-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
      font-size: 13px;
    }
    .users-table th { background: #f0f0f0; font-weight: bold; }
    .status-active { color: green; font-weight: bold; }
    .status-inactive { color: red; }
    button.danger { background: #d32f2f; color: white; cursor: pointer; border: none; border-radius: 3px; }
    button.danger:hover { background: #b71c1c; }
    button.edit-btn {
      background: #1565c0;
      color: white;
      cursor: pointer;
      border: none;
      border-radius: 3px;
      padding: 6px 10px;
      margin-right: 4px;
    }
    button.edit-btn:hover { background: #0d47a1; }
    button.enable-btn {
      background: #2e7d32;
      color: white;
      cursor: pointer;
      border: none;
      border-radius: 3px;
      padding: 6px 10px;
    }
    button.enable-btn:hover { background: #1b5e20; }
    .alert {
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    .alert-success {
      background: #c8e6c9;
      color: #2e7d32;
      border: 1px solid #66bb6a;
    }
    .alert-error {
      background: #ffcdd2;
      color: #c62828;
      border: 1px solid #ef5350;
    }
    .back-link { display:inline-block; margin-bottom:10px; padding:8px 14px; border:1px solid #c9cfd4; border-radius:4px; background:#fff; color:#1d2b38; text-decoration:none; font-size:14px; }
    .back-link:hover { background:#eef1f4; }

    /* Edit Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 8px;
      padding: 28px;
      width: 460px;
      max-width: 95vw;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .modal-box h2 { margin: 0 0 18px; font-size: 18px; }
    .modal-field { margin-bottom: 14px; }
    .modal-field label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .modal-field input { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .modal-field input:focus { outline: none; border-color: #1565c0; box-shadow: 0 0 0 2px rgba(21,101,192,0.15); }
    .modal-hint { font-size: 11px; color: #888; margin-top: 3px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .modal-actions button { padding: 9px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-save { background: #1565c0; color: white; }
    .btn-save:hover { background: #0d47a1; }
    .btn-cancel { background: #e0e0e0; color: #333; }
    .btn-cancel:hover { background: #bdbdbd; }

    /* Search/filter bar */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
    .filter-bar input { flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .user-count { font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <div class="admin-panel">
    <a class="back-link" href="../index.html">&larr; Back to home</a>
    <h1>🔐 Passkey Management</h1>
    <p>Admin only: Create and manage user passkeys for signature verification.</p>

    <div class="passkey-form">
      <h2>Create / Reset Passkey</h2>
      <div class="form-row">
        <input type="text" id="username" placeholder="Username (email)" />
        <input type="text" id="displayName" placeholder="Full name" />
        <input type="text" id="title" placeholder="Job title" />
        <input type="text" id="passkey" placeholder="Passkey (4–8 digits)" maxlength="8" />
      </div>
      <div class="form-row full">
        <button onclick="createPasskey()" class="btn btn-primary">
          Create / Reset Passkey
        </button>
      </div>
      <div id="message" style="display: none;"></div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:24px;">
      <h2 style="margin:0;">Active Users</h2>
      <div class="filter-bar" style="flex:0 0 auto; width:280px;">
        <input type="text" id="searchInput" placeholder="Search name or email…" oninput="filterUsers()" />
      </div>
    </div>
    <p class="user-count" id="userCount"></p>

    <table class="users-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email / Username</th>
          <th>Title</th>
          <th>Status</th>
          <th>Last Used</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="usersList">
        <tr><td colspan="7" style="text-align: center; color: #999;">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <h2>✏️ Edit User</h2>
      <input type="hidden" id="editUsername" />
      <div class="modal-field">
        <label>Email / Username</label>
        <input type="text" id="editUsernameDisplay" readonly style="background:#f5f5f5; color:#777;" />
      </div>
      <div class="modal-field">
        <label>Full Name</label>
        <input type="text" id="editDisplayName" placeholder="Full name" />
      </div>
      <div class="modal-field">
        <label>Job Title</label>
        <input type="text" id="editTitle" placeholder="e.g. Quality Supervisor" />
      </div>
      <div class="modal-field">
        <label>New Passkey <span style="font-weight:400;text-transform:none;">(leave blank to keep existing)</span></label>
        <input type="text" id="editPasskey" placeholder="4–8 digits (optional)" maxlength="8" />
        <div class="modal-hint">Only fill this in if you want to reset their passkey.</div>
      </div>
      <div id="editMessage" style="display:none; margin-top:10px;"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
        <button class="btn-save" onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="../lib/palette-map.js"></script>
  <script src="../lib/api-backend.js?v=18"></script>
  <script src="../lib/permission-rules.js?v=6"></script>
  <script src="../lib/auth.js?v=2"></script>
  <script src="../lib/login-ui.js?v=3"></script>
  <script>
    let allUsers = [];

    // ── Create / Reset ────────────────────────────────────────────────────────
    async function createPasskey() {
      const username    = document.getElementById('username').value.trim();
      const displayName = document.getElementById('displayName').value.trim();
      const title       = document.getElementById('title').value.trim();
      const passkey     = document.getElementById('passkey').value.trim();

      if (!username || !displayName || !passkey) {
        showMessage('Username, full name and passkey are required', 'error');
        return;
      }
      if (!/^\d{4,8}$/.test(passkey)) {
        showMessage('Passkey must be 4–8 digits', 'error');
        return;
      }

      try {
        const response = await FacilityApi.fetch('/api/admin/passkeys/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, displayName, title, passkey })
        });
        const result = await response.json();
        if (!response.ok) { showMessage(result.error || 'Error creating passkey', 'error'); return; }

        showMessage(`✓ Passkey created for ${displayName}`, 'success');
        ['username','displayName','title','passkey'].forEach(id => document.getElementById(id).value = '');
        loadUsers();
      } catch (error) {
        showMessage('Error: ' + error.message, 'error');
      }
    }

    // ── Load Users ────────────────────────────────────────────────────────────
    async function loadUsers() {
      try {
        const response = await FacilityApi.fetch('/api/admin/passkeys/list', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const result = await response.json();
        allUsers = result.passkeys || [];
        renderUsers(allUsers);
      } catch (error) {
        const tbody = document.getElementById('usersList');
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:red;">Error: ${error.message}</td></tr>`;
      }
    }

    function renderUsers(users) {
      const tbody = document.getElementById('usersList');
      tbody.innerHTML = '';
      document.getElementById('userCount').textContent = `${users.length} user${users.length !== 1 ? 's' : ''}`;

      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;">No users found</td></tr>';
        return;
      }

      users.forEach(user => {
        const row = tbody.insertRow();
        const lastUsed = user.lastUsedAt ? new Date(user.lastUsedAt).toLocaleDateString('en-ZA') : 'Never';
        const created  = new Date(user.createdAt).toLocaleDateString('en-ZA');

        row.innerHTML = `
          <td><strong>${user.displayName}</strong></td>
          <td><code style="font-size:12px;">${user.username}</code></td>
          <td>${user.title || '<span style="color:#bbb;">—</span>'}</td>
          <td class="status-${user.isActive ? 'active' : 'inactive'}">
            ${user.isActive ? '✓ Active' : '✗ Disabled'}
          </td>
          <td>${lastUsed}</td>
          <td>${created}</td>
          <td>
            <button class="edit-btn" onclick="openEditModal(${JSON.stringify(user).split('"').join('&quot;')})">Edit</button>
            ${user.isActive
              ? `<button class="danger" onclick="disableUser('${user.username}')">Disable</button>`
              : `<button class="enable-btn" onclick="enableUser('${user.username}')">Enable</button>`
            }
          </td>
        `;
      });
    }

    // ── Filter ────────────────────────────────────────────────────────────────
    function filterUsers() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      if (!q) { renderUsers(allUsers); return; }
      const filtered = allUsers.filter(u =>
        u.displayName.toLowerCase().includes(q) ||
        u.username.toLowerCase().includes(q) ||
        (u.title || '').toLowerCase().includes(q)
      );
      renderUsers(filtered);
    }

    // ── Edit Modal ────────────────────────────────────────────────────────────
    function openEditModal(user) {
      document.getElementById('editUsername').value        = user.username;
      document.getElementById('editUsernameDisplay').value = user.username;
      document.getElementById('editDisplayName').value     = user.displayName;
      document.getElementById('editTitle').value           = user.title || '';
      document.getElementById('editPasskey').value         = '';
      document.getElementById('editMessage').style.display = 'none';
      document.getElementById('editModal').classList.add('open');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('open');
    }

    async function saveEdit() {
      const username    = document.getElementById('editUsername').value;
      const displayName = document.getElementById('editDisplayName').value.trim();
      const title       = document.getElementById('editTitle').value.trim();
      const passkey     = document.getElementById('editPasskey').value.trim();

      if (!displayName) { showEditMessage('Full name is required', 'error'); return; }
      if (passkey && !/^\d{4,8}$/.test(passkey)) {
        showEditMessage('Passkey must be 4–8 digits if provided', 'error');
        return;
      }

      const body = { username, displayName, title };
      if (passkey) body.passkey = passkey;

      try {
        const response = await FacilityApi.fetch('/api/admin/passkeys/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const result = await response.json();
        if (!response.ok) { showEditMessage(result.error || 'Error saving', 'error'); return; }

        closeEditModal();
        showMessage(`✓ Updated ${displayName}`, 'success');
        loadUsers();
      } catch (error) {
        showEditMessage('Error: ' + error.message, 'error');
      }
    }

    function showEditMessage(msg, type) {
      const el = document.getElementById('editMessage');
      el.textContent = msg;
      el.className = 'alert alert-' + type;
      el.style.display = 'block';
    }

    // Close modal on overlay click
    document.getElementById('editModal').addEventListener('click', function(e) {
      if (e.target === this) closeEditModal();
    });

    // ── Disable / Enable ──────────────────────────────────────────────────────
    async function disableUser(username) {
      if (!confirm(`Disable passkey for ${username}?`)) return;
      try {
        const response = await FacilityApi.fetch('/api/admin/passkeys/disable', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });
        const result = await response.json();
        if (!response.ok) { showMessage(result.error || 'Error', 'error'); return; }
        showMessage('✓ Passkey disabled', 'success');
        loadUsers();
      } catch (error) {
        showMessage('Error: ' + error.message, 'error');
      }
    }

    async function enableUser(username) {
      try {
        const response = await FacilityApi.fetch('/api/admin/passkeys/enable', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });
        const result = await response.json();
        if (!response.ok) { showMessage(result.error || 'Error', 'error'); return; }
        showMessage('✓ Passkey re-enabled', 'success');
        loadUsers();
      } catch (error) {
        showMessage('Error: ' + error.message, 'error');
      }
    }

    // ── Global Message ────────────────────────────────────────────────────────
    function showMessage(msg, type) {
      const el = document.getElementById('message');
      el.textContent = msg;
      el.className = 'alert alert-' + type;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    loadUsers();
  </script>
</body>
</html>
