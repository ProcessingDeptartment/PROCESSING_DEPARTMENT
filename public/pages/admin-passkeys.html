<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passkey Management</title>
  <link rel="stylesheet" href="../styles/record-theme.css?v=1">
  <style>
    .admin-panel {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
    }
    .passkey-form {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .form-row.full { grid-template-columns: 1fr; }
    input, button { padding: 8px; font-size: 14px; }
    .users-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .users-table th, .users-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    .users-table th { background: #f0f0f0; font-weight: bold; }
    .status-active { color: green; font-weight: bold; }
    .status-inactive { color: red; }
    button.danger { background: #d32f2f; color: white; cursor: pointer; }
    button.danger:hover { background: #b71c1c; }
    .alert {
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    .alert-success {
      background: #c8e6c9;
      color: #2e7d32;
      border: 1px solid #66bb6a;
    }
    .alert-error {
      background: #ffcdd2;
      color: #c62828;
      border: 1px solid #ef5350;
    }
  </style>
</head>
<body>
  <div class="admin-panel">
    <h1>🔐 Passkey Management</h1>
    <p>Admin only: Create and manage user passkeys for signature verification.</p>

    <div class="passkey-form">
      <h2>Create/Reset Passkey</h2>
      <div class="form-row">
        <input type="text" id="username" placeholder="Username (email)" />
        <input type="text" id="displayName" placeholder="Full name" />
      </div>
      <div class="form-row">
        <input type="text" id="title" placeholder="Job title" />
        <input type="text" id="passkey" placeholder="Passkey (4-8 digits)" maxlength="8" />
      </div>
      <div class="form-row full">
        <button onclick="createPasskey()" class="btn btn-primary">
          Create Passkey
        </button>
      </div>
      <div id="message" style="display: none;"></div>
    </div>

    <h2>Active Users</h2>
    <table class="users-table">
      <thead>
        <tr>
          <th>Username</th>
          <th>Name</th>
          <th>Title</th>
          <th>Status</th>
          <th>Last Used</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="usersList">
        <tr><td colspan="7" style="text-align: center; color: #999;">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    async function createPasskey() {
      const username = document.getElementById('username').value.trim();
      const displayName = document.getElementById('displayName').value.trim();
      const title = document.getElementById('title').value.trim();
      const passkey = document.getElementById('passkey').value.trim();

      if (!username || !displayName || !passkey) {
        showMessage('All fields required', 'error');
        return;
      }

      if (!/^\d{4,8}$/.test(passkey)) {
        showMessage('Passkey must be 4-8 digits', 'error');
        return;
      }

      try {
        const response = await fetch('/api/admin/passkeys/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-User-Role': 'ADMINISTRATOR',
            'X-User-Id': 'admin'
          },
          body: JSON.stringify({ username, displayName, title, passkey })
        });

        const result = await response.json();
        if (!response.ok) {
          showMessage(result.error || 'Error creating passkey', 'error');
          return;
        }

        showMessage(`✓ Passkey created for ${displayName}`, 'success');
        document.getElementById('username').value = '';
        document.getElementById('displayName').value = '';
        document.getElementById('title').value = '';
        document.getElementById('passkey').value = '';
        loadUsers();
      } catch (error) {
        showMessage('Error: ' + error.message, 'error');
      }
    }

    async function loadUsers() {
      try {
        const response = await fetch('/api/admin/passkeys/list', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-User-Role': 'ADMINISTRATOR'
          }
        });

        const result = await response.json();
        const tbody = document.getElementById('usersList');
        tbody.innerHTML = '';

        if (!result.passkeys || result.passkeys.length === 0) {
          const row = tbody.insertRow();
          row.innerHTML = '<td colspan="7" style="text-align: center; color: #999;">No users yet</td>';
          return;
        }

        (result.passkeys || []).forEach(user => {
          const row = tbody.insertRow();
          const lastUsed = user.lastUsedAt ? new Date(user.lastUsedAt).toLocaleDateString() : 'Never';
          const created = new Date(user.createdAt).toLocaleDateString();

          row.innerHTML = `
            <td><code>${user.username}</code></td>
            <td><strong>${user.displayName}</strong></td>
            <td>${user.title || '-'}</td>
            <td class="status-${user.isActive ? 'active' : 'inactive'}">
              ${user.isActive ? '✓ Active' : '✗ Disabled'}
            </td>
            <td>${lastUsed}</td>
            <td>${created}</td>
            <td>
              ${user.isActive ? `
                <button class="danger" onclick="disableUser('${user.username}')">Disable</button>
              ` : '–'}
            </td>
          `;
        });
      } catch (error) {
        const tbody = document.getElementById('usersList');
        const row = tbody.insertRow();
        row.innerHTML = `<td colspan="7" style="text-align: center; color: red;">Error: ${error.message}</td>`;
      }
    }

    async function disableUser(username) {
      if (!confirm(`Disable passkey for ${username}?`)) return;

      try {
        const response = await fetch('/api/admin/passkeys/disable', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-User-Role': 'ADMINISTRATOR'
          },
          body: JSON.stringify({ username })
        });

        const result = await response.json();
        if (!response.ok) {
          showMessage(result.error || 'Error', 'error');
          return;
        }

        showMessage('✓ Passkey disabled', 'success');
        loadUsers();
      } catch (error) {
        showMessage('Error: ' + error.message, 'error');
      }
    }

    function showMessage(msg, type) {
      const el = document.getElementById('message');
      el.textContent = msg;
      el.className = 'alert alert-' + type;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    // Load on page load
    loadUsers();
  </script>
</body>
</html>
