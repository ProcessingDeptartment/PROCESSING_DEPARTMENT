<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certification Updates — Admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#A9763A">
  <link rel="stylesheet" href="../styles/record-theme.css?v=1">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; background: #f4f5f3; color: #1b2330; margin: 0; }
    .brand-bar { background: #fff; border-bottom: 3px solid #a9763a; padding: 10px 20px; }
    .brand-bar a { text-decoration: none; color: #1b2330; font-weight: 600; font-size: 14px; }
    .container { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .subtitle { color: #5c6771; font-size: 12px; margin-bottom: 24px; }

    .card { background: #fff; border: 1px solid #e2e4e3; border-radius: 6px; padding: 20px; margin-bottom: 20px; }
    .card h2 { margin: 0 0 14px; font-size: 14px; font-weight: 700; color: #1d2b38; }

    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #374151; }
    input, select, textarea {
      width: 100%; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 4px;
      font-size: 13px; box-sizing: border-box; font-family: inherit;
    }
    textarea { resize: vertical; min-height: 60px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid.three { grid-template-columns: 1fr 1fr 1fr; }
    .full { grid-column: 1 / -1; }

    .btn { padding: 8px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-primary { background: #1d2b38; color: #fff; }
    .btn-primary:hover { background: #2d3f52; }
    .btn-amber { background: #f59e0b; color: #fff; }
    .btn-amber:hover { background: #d97706; }
    .btn-sm { padding: 5px 12px; font-size: 12px; }

    .status-badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;
    }
    .status-draft     { background: #e5e7eb; color: #374151; }
    .status-pending   { background: #fef3c7; color: #92400e; }
    .status-complete  { background: #d1fae5; color: #065f46; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #f0f0ef; text-align: left; }
    th { background: #f9fafb; font-weight: 700; color: #374151; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
    tr:last-child td { border-bottom: none; }

    .record-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0f0ef; }
    .record-row:last-child { border-bottom: none; }
    .record-row label { margin: 0; font-weight: 400; }
    .record-row input[type=checkbox] { width: auto; margin-top: 2px; flex-shrink: 0; }
    .record-reason { color: #5c6771; font-size: 11px; margin-top: 2px; }
    .record-label-wrap { flex: 1; }

    .not-affected-section { margin-top: 16px; }
    .not-affected-section details summary { cursor: pointer; font-size: 12px; color: #5c6771; }

    .loading { color: #6b7280; font-style: italic; padding: 12px 0; }
    .error-msg { color: #dc2626; background: #fef2f2; border: 1px solid #fca5a5; border-radius: 4px; padding: 8px 12px; }
    .success-msg { color: #065f46; background: #ecfdf5; border: 1px solid #6ee7b7; border-radius: 4px; padding: 8px 12px; }
    .progress-bar { background: #e5e7eb; border-radius: 10px; height: 6px; margin-top: 4px; }
    .progress-fill { background: #f59e0b; height: 100%; border-radius: 10px; transition: width .3s; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="brand-bar"><a href="/index.html">← Processing Department</a></div>
<div class="container">
  <h1>Certification Version Updates</h1>
  <p class="subtitle">Log a new edition of a standard, let the AI identify affected forms, then confirm and track sign-offs.</p>

  <!-- Step 1: Log update -->
  <div class="card" id="stepLogCard">
    <h2>Step 1 — Log a certification update</h2>
    <div id="logMsg"></div>
    <form id="logForm">
      <div class="form-grid three">
        <div>
          <label>Certification</label>
          <select name="certId" id="certSelect" required>
            <option value="">Loading…</option>
          </select>
        </div>
        <div>
          <label>Previous version</label>
          <input type="text" name="prevVersion" id="prevVersionInput" placeholder="e.g. 2019">
        </div>
        <div>
          <label>New version *</label>
          <input type="text" name="newVersion" placeholder="e.g. 2024" required>
        </div>
        <div class="full">
          <label>What changed (notes for the agent) *</label>
          <textarea name="notes" placeholder="e.g. Revised moisture limits in clause 5.2; new labelling requirements in clause 8." required></textarea>
        </div>
        <div>
          <label>Your email</label>
          <input type="email" name="detectedBy" value="michaela@abagold.co.za" required>
        </div>
        <div>
          <label>Source file (optional)</label>
          <input type="text" name="sourceFile" placeholder="e.g. SANS 2329 2024.pdf">
        </div>
      </div>
      <div style="margin-top:14px">
        <button type="submit" class="btn btn-primary" id="analyseBtn">Analyse affected records…</button>
      </div>
    </form>
  </div>

  <!-- Step 2: Review agent proposal -->
  <div class="card hidden" id="stepReviewCard">
    <h2>Step 2 — Review agent proposal</h2>
    <p id="proposalSummary" style="color:#5c6771;font-size:12px;margin:0 0 14px"></p>
    <div id="reviewMsg"></div>

    <div id="affectedList"></div>
    <div class="not-affected-section" id="notAffectedSection"></div>

    <div style="margin-top:16px;display:flex;gap:10px;align-items:center">
      <button class="btn btn-amber" id="confirmBtn">Confirm list &amp; create review tasks</button>
      <button class="btn btn-sm" id="backBtn" style="background:#f3f4f6">← Start over</button>
    </div>
  </div>

  <!-- Step 3: Live progress -->
  <div class="card" id="stepProgressCard">
    <h2>Open cert-revision reviews</h2>
    <div id="progressList"><span class="loading">Loading…</span></div>
  </div>
</div>

<script>
  const API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? 'http://localhost:3001'
    : 'https://processing-department-api.onrender.com';

  const apiKey = (() => { try { return localStorage.getItem('facility_api_key') || sessionStorage.getItem('facility_api_key') || ''; } catch { return ''; } })();
  function headers(extra) { return { 'Content-Type': 'application/json', ...(apiKey ? { Authorization: 'Bearer ' + apiKey } : {}), ...(extra||{}) }; }

  // --- Load certifications dropdown ---
  let certsData = [];
  async function loadCerts() {
    try {
      const r = await fetch('/certifications/certifications.json');
      const d = await r.json();
      certsData = d.certifications || [];
      const sel = document.getElementById('certSelect');
      sel.innerHTML = '<option value="">Select a certification…</option>' +
        certsData.map(c => `<option value="${c.id}">${c.name} (${c.version || 'current'})</option>`).join('');
    } catch(e) { console.warn('Could not load certifications.json', e); }
  }
  loadCerts();

  // Auto-fill prevVersion when a cert is selected
  document.getElementById('certSelect').addEventListener('change', function() {
    const cert = certsData.find(c => c.id === this.value);
    document.getElementById('prevVersionInput').value = cert ? (cert.currentVersion || cert.version || '') : '';
  });

  // --- Step 1: submit ---
  let draftRevisionId = null;
  let proposalData = null;

  document.getElementById('logForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('analyseBtn');
    const msg = document.getElementById('logMsg');
    msg.innerHTML = '<span class="loading">Analysing record forms… this may take 20–30 seconds.</span>';
    btn.disabled = true;

    const fd = new FormData(this);
    const body = Object.fromEntries(fd.entries());

    try {
      const r = await fetch(API + '/api/cert-revisions', {
        method: 'POST', headers: headers(), body: JSON.stringify(body),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.statusText);

      draftRevisionId = d.draftRevisionId;
      proposalData    = d;
      showProposal(body, d);
      msg.innerHTML = '';
    } catch(err) {
      msg.innerHTML = `<div class="error-msg">${err.message}</div>`;
    } finally {
      btn.disabled = false;
    }
  });

  function showProposal(formBody, d) {
    const certEntry = certsData.find(c => c.id === formBody.certId);
    const label     = certEntry ? certEntry.name : formBody.certId;

    document.getElementById('proposalSummary').textContent =
      `${label} → v${formBody.newVersion}. Agent analysed all record forms and suggests:`;

    // Affected list with checkboxes (all pre-checked)
    const affDiv = document.getElementById('affectedList');
    if (d.affected.length) {
      affDiv.innerHTML = '<strong style="font-size:12px;color:#92400e">⚠ Suggested affected (review recommended)</strong>' +
        d.affected.map(r => `
          <div class="record-row">
            <input type="checkbox" id="aff_${r.recordKey}" data-key="${r.recordKey}"
              data-label="${esc(r.recordTitle)}" data-reason="${esc(r.agentReason)}" checked>
            <div class="record-label-wrap">
              <label for="aff_${r.recordKey}">${esc(r.recordTitle)} <span style="color:#9ca3af">(${r.recordKey})</span></label>
              <div class="record-reason">${esc(r.agentReason)}</div>
            </div>
          </div>`).join('');
    } else {
      affDiv.innerHTML = '<p style="color:#6b7280;font-size:12px">No records flagged as affected.</p>';
    }

    // Not-affected list (collapsed, with "include" toggles)
    const naDiv = document.getElementById('notAffectedSection');
    if (d.not_affected.length) {
      naDiv.innerHTML = `<details><summary>${d.not_affected.length} records suggested as not affected (click to expand and add any)</summary>` +
        d.not_affected.map(r => `
          <div class="record-row">
            <input type="checkbox" id="na_${r.recordKey}" data-key="${r.recordKey}"
              data-label="${esc(r.recordTitle)}" data-reason="${esc(r.agentReason)}">
            <div class="record-label-wrap">
              <label for="na_${r.recordKey}">${esc(r.recordTitle)} <span style="color:#9ca3af">(${r.recordKey})</span></label>
              <div class="record-reason">${esc(r.agentReason)}</div>
            </div>
          </div>`).join('') + '</details>';
    } else {
      naDiv.innerHTML = '';
    }

    document.getElementById('stepLogCard').classList.add('hidden');
    document.getElementById('stepReviewCard').classList.remove('hidden');
  }

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  document.getElementById('backBtn').addEventListener('click', function() {
    document.getElementById('stepReviewCard').classList.add('hidden');
    document.getElementById('stepLogCard').classList.remove('hidden');
    document.getElementById('reviewMsg').innerHTML = '';
  });

  document.getElementById('confirmBtn').addEventListener('click', async function() {
    const msg = document.getElementById('reviewMsg');
    const confirmed = [];
    document.querySelectorAll('#affectedList input[type=checkbox]:checked, #notAffectedSection input[type=checkbox]:checked')
      .forEach(cb => confirmed.push({ recordKey: cb.dataset.key, recordLabel: cb.dataset.label, agentReason: cb.dataset.reason }));

    if (!confirmed.length) { msg.innerHTML = '<div class="error-msg">No records selected.</div>'; return; }

    this.disabled = true;
    msg.innerHTML = '<span class="loading">Saving…</span>';
    try {
      const r = await fetch(API + '/api/cert-revisions/' + draftRevisionId + '/confirm', {
        method: 'POST', headers: headers(), body: JSON.stringify({ confirmedRecords: confirmed }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.statusText);

      msg.innerHTML = `<div class="success-msg">Done — ${d.affectedCount} record review tasks created. Amber banners will appear on those forms.</div>`;
      document.getElementById('confirmBtn').disabled = true;
      loadProgress();
    } catch(err) {
      msg.innerHTML = `<div class="error-msg">${err.message}</div>`;
      this.disabled = false;
    }
  });

  // --- Step 3: progress ---
  async function loadProgress() {
    const el = document.getElementById('progressList');
    try {
      const r = await fetch(API + '/api/cert-revisions', { headers: headers() });
      const revisions = await r.json();
      const pending = revisions.filter(rv => rv.reviewStatus === 'pending');
      if (!pending.length) { el.innerHTML = '<span style="color:#6b7280;font-size:12px">No open reviews.</span>'; return; }

      el.innerHTML = pending.map(rv => {
        const total     = rv.recordReviews.length;
        const done      = rv.recordReviews.filter(rr => rr.status !== 'pending').length;
        const pct       = total ? Math.round(done / total * 100) : 0;
        return `
          <div style="margin-bottom:16px">
            <div style="display:flex;justify-content:space-between;align-items:baseline">
              <strong style="font-size:13px">${esc(rv.certLabel)} → v${esc(rv.newVersion)}</strong>
              <span class="status-badge status-pending">${done}/${total} reviewed</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">
              ${rv.recordReviews.map(rr => `
                <span style="font-size:11px;padding:3px 8px;border-radius:10px;background:${rr.status==='pending'?'#fef3c7':'#d1fae5'};color:${rr.status==='pending'?'#92400e':'#065f46'}">
                  ${esc(rr.recordLabel||rr.recordKey)}
                </span>`).join('')}
            </div>
          </div>`;
      }).join('');
    } catch(e) {
      el.innerHTML = '<span style="color:#6b7280;font-size:12px">Could not load reviews.</span>';
    }
  }
  loadProgress();
</script>
</body>
</html>
