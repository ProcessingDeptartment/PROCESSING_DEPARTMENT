<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>

<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#A9763A">
<style>
  body{ font-family:'Segoe UI',system-ui,sans-serif; color:#1b2330; background:#f4f5f3; font-size:13px; line-height:1.4; margin:0; }
  .header{ background:#1d2b38; color:#f4f1e8; padding:16px 20px; }
  .header h1{ margin:0; font-size:18px; font-weight:600; }
  .header p{ margin:4px 0 0; color:#b9c3cc; font-size:12px; }
  .back-link{ display:inline-block; margin-top:6px; color:#b9c3cc; text-decoration:none; font-size:12px; }
  .back-link:hover{ color:#fff; }
  .container{ max-width:1200px; margin:0 auto; padding:20px 20px 140px; }

  .who{ display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; margin-bottom:14px; }
  .who strong{ font-size:16px; }
  .who .muted{ color:#5c6771; }

  .state{ padding:10px 12px; border-radius:6px; font-size:12.5px; font-weight:600; margin-bottom:14px; }
  .state.ok{ background:#e8f3ec; color:#2f7a52; }
  .state.bad{ background:#fbe8e6; color:#a3352d; }
  .state.info{ background:#e6eefb; color:#1d4ed8; }

  .toolbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .seg{ display:inline-flex; border:1px solid #d0d5db; border-radius:6px; overflow:hidden; }
  .seg button{ padding:7px 14px; border:none; background:#fff; font-size:12px; cursor:pointer; }
  .seg button.active{ background:#2f4356; color:#fff; }
  .btn{ padding:7px 12px; border:1px solid #d0d5db; background:#fff; border-radius:6px; font-size:12px; cursor:pointer; }
  .btn:hover{ background:#f2f4f6; }

  .grp{ background:#fff; border:1px solid #e2e4e3; border-radius:8px; margin-bottom:14px; overflow:hidden; }
  .grp-head{ padding:10px 14px; background:#fbfbfa; border-bottom:1px solid #e2e4e3; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grp-head h2{ margin:0; font-size:13px; }
  .grp-head a{ color:#1d4ed8; text-decoration:none; }
  .grp-head a:hover{ text-decoration:underline; }
  .grp-head .count{ background:#fbe8e6; color:#a3352d; border-radius:20px; padding:2px 9px; font-size:11px; font-weight:700; }
  .grp-head .roles{ color:#5c6771; font-size:11px; margin-left:auto; }

  table{ width:100%; border-collapse:collapse; }
  th,td{ border-bottom:1px solid #eceeef; padding:8px 12px; text-align:left; font-size:12px; vertical-align:top; }
  th{ background:#fbfbfa; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; color:#5c6771; font-weight:700; white-space:nowrap; }
  tbody tr:hover{ background:#f9fafb; }
  td.chk,th.chk{ width:28px; text-align:center; }
  td.when{ white-space:nowrap; font-family:'IBM Plex Mono',monospace; font-size:11.5px; }
  .age.old{ color:#a3352d; font-weight:700; }
  .rev{ background:transparent; border:none; color:#1d4ed8; cursor:pointer; font-size:11.5px; padding:0; text-decoration:underline; }
  tr.detail td{ background:#f8fafc; }
  dl.vals{ margin:0; display:grid; grid-template-columns:max-content 1fr max-content 1fr; gap:4px 18px; align-items:baseline; font-size:12px; }
  @media (max-width:760px){ dl.vals{ grid-template-columns:max-content 1fr; } }
  dl.vals dt{ color:#5c6771; font-weight:600; white-space:nowrap; }
  dl.vals dd{ margin:0; font-weight:500; color:#1b2330; word-break:break-word; }
  tr.foreign td{ color:#8a939b; }

  .empty{ padding:24px; text-align:center; color:#8a939b; background:#fff; border:1px solid #e2e4e3; border-radius:8px; }

  .verifybar{ position:fixed; left:0; right:0; bottom:0; background:#1d2b38; color:#f4f1e8; padding:12px 20px; z-index:50;
    display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; box-shadow:0 -6px 20px rgba(0,0,0,.18); }
  .verifybar.hidden{ display:none; }
  .verifybar .sel{ font-weight:700; font-size:13px; padding-bottom:6px; }
  .verifybar label{ display:flex; flex-direction:column; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:#b9c3cc; gap:3px; }
  .verifybar input{ padding:7px 9px; border:1px solid #55636e; border-radius:5px; font-size:12px; background:#fff; color:#1b2330; min-width:150px; }
  .verifybar input[readonly]{ background:#e9edf1; }
  .verifybar .go{ background:#2f7a52; color:#fff; border:none; border-radius:6px; padding:9px 18px; font-size:13px; font-weight:700; cursor:pointer; }
  .verifybar .go:disabled{ background:#5c6771; cursor:default; }

  .pk-field { display:flex; flex-direction:column; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:#b9c3cc; gap:3px; }
  .pk-field input{ padding:7px 9px; border:1px solid #55636e; border-radius:5px; font-size:12px; background:#fff; color:#1b2330; min-width:150px; cursor:pointer; }
  .pk-field .pk-label{ display:flex; gap:6px; align-items:baseline; }
  .pk-field .pk-status{ font-size:11px; font-weight:600; color:#2f7a52; }
  .pk-field.is-verified input{ background:#e8f3ec; border-color:#2f7a52; }
  .note{ margin-top:18px; background:#fbf0dc; color:#8a5a10; border-radius:6px; padding:11px 13px; font-size:11.5px; }
  #toast{ position:fixed; left:50%; bottom:88px; transform:translateX(-50%); background:#1b2330; color:#fff; padding:10px 16px; border-radius:6px; font-size:12.5px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60; }
  #toast.show{ opacity:1; }
  @media (max-width:640px){ .container{ padding:12px 12px 200px; } .verifybar input{ min-width:120px; } }
  .verification-alert-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:9999; display:flex; align-items:center; justify-content:center; }
  .verification-alert-box{ background:#fff; border-radius:12px; padding:2rem 2.5rem; max-width:420px; width:90%; text-align:center; box-shadow:0 8px 32px rgba(0,0,0,.18); }
  .verification-alert-icon{ font-size:2.5rem; margin-bottom:.5rem; color:#b45309; }
  .verification-alert-title{ font-size:1.3rem; font-weight:700; color:#b45309; margin-bottom:.75rem; }
  .verification-alert-body{ font-size:1rem; color:#374151; margin-bottom:1.5rem; }
  .verification-alert-actions{ display:flex; gap:1rem; justify-content:center; }
  .verification-alert-btn-primary{ background:#b45309; color:#fff; padding:.6rem 1.4rem; border-radius:6px; text-decoration:none; font-weight:600; font-size:.95rem; cursor:pointer; border:none; }
  .verification-alert-btn-primary:hover{ background:#92400e; }
  .verification-alert-btn-secondary{ background:#f3f4f6; color:#374151; padding:.6rem 1.4rem; border-radius:6px; border:1px solid #d1d5db; font-weight:600; font-size:.95rem; cursor:pointer; }
  .verification-alert-btn-secondary:hover{ background:#e5e7eb; }
  @media (prefers-color-scheme: dark){ .verification-alert-box{ background:#1f2937; color:#f3f4f6; } .verification-alert-title{ color:#fbbf24; } .verification-alert-body{ color:#e5e7eb; } .verification-alert-btn-secondary{ background:#374151; color:#f3f4f6; border-color:#4b5563; } .verification-alert-btn-secondary:hover{ background:#4b5563; } }
</style>
</head>
<body>
<script src="/lib/page-nav.js?v=1"></script>

<div class="header">
  <h1>Awaiting Verification</h1>
  <p>Every submitted entry waiting for <em>your</em> verification, in one place &mdash; review and sign them off without opening each record.</p>
  <a class="back-link" href="../index.html">&larr; Back to Processing Department</a>
</div>

<div class="container">
  <div class="who" id="who"></div>
  <div class="state info" id="state">Loading&hellip;</div>

  <div class="toolbar" id="toolbar" style="display:none;">
    <div class="seg">
      <button data-scope="mine" class="active">My queue</button>
      <button data-scope="all">All pending</button>
    </div>
    <button class="btn" id="btnRefresh">Refresh</button>
    <button class="btn" id="btnExpandAll">Expand all</button>
    <button class="btn" id="btnSelectAll" style="display:none;" title="Administrator: select every previewed entry shown">Select all previewed</button>
    <button class="btn" id="btnClearSel" style="display:none;">Clear selection</button>
  </div>

  <div id="groups"></div>

  <div class="note" id="note"></div>
</div>

<div class="verifybar hidden" id="verifybar">
  <span class="sel" id="selCount">0 selected</span>
  <label>Verified by<input id="vfy_by" readonly></label>
  <label>Title<input id="vfy_jobtitle" readonly></label>
  <label>Date<input id="vfy_date" type="date" readonly></label>
  <label class="pk-field">
    <span class="pk-label"><span>Signature</span><span class="pk-status" id="vfy_signature_display" aria-live="polite"></span></span>
    <input id="vfy_signature" type="text" placeholder="Tap to enter passkey" readonly inputmode="none" autocomplete="off"
           onclick="window.PasskeyInput && PasskeyInput.openForField('vfy_signature')">
  </label>
  <button class="go" id="btnVerify">Verify selected</button>
</div>

<div id="toast"></div>

<script>
  try {
    fetch('https://processing-department-api.onrender.com/api/health',
          { mode: 'cors', cache: 'no-store', keepalive: true }).catch(function () {});
  } catch (e) {  }
</script>

<script src="../lib/master-index-data.js?v=4"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/api-backend.js?v=18"></script>
<script src="../lib/permission-rules.js?v=8"></script>
<script src="../lib/auth.js?v=5"></script>
<script src="../lib/login-ui.js?v=6"></script>
<script src="../lib/nc-login-alert.js?v=1"></script>
<script src="../lib/signoff-block.js?v=8"></script>
<script src="../lib/passkey-input.js?v=4"></script>
<script src="../lib/verification-queue.js?v=3"></script>
<script src="../lib/verification-alert.js?v=3"></script>
<script>(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  };

  function openPdfTab(href) {
    var url = href.includes('?') ? href + '&closeAfter=1' : href + '?closeAfter=1';
    var pdfWin = window.open(url, 'pdfPrint' + Date.now());
    if (!pdfWin) return;
    var fallbackTimer;
    var closeListener = function (ev) {
      try {
        if (ev.source === pdfWin && ev.data && ev.data.pdfReady === 1) {
          window.removeEventListener('message', closeListener);
          clearTimeout(fallbackTimer);
          setTimeout(function () { if (!pdfWin.closed) pdfWin.close(); }, 500);
        }
      } catch (_) {}
    };
    window.addEventListener('message', closeListener);
    fallbackTimer = setTimeout(function () {
      window.removeEventListener('message', closeListener);
      try { if (!pdfWin.closed) pdfWin.close(); } catch (_) {}
    }, 30000);
  }

  var ROLE_LABELS = (window.PermissionRules && window.PermissionRules.ROLE_LABELS) || {};
  var indexByKey = {};
  ((window.MasterIndexData && window.MasterIndexData.rows) || []).forEach(function (row) {
    if (row.recordKey) indexByKey[row.recordKey] = { name: row.name, docNo: row.docNo, href: row.href };
  });

  function labelRoles(roles) {
    return (roles || []).map(function (r) { return ROLE_LABELS[r] || r.replace(/_/g, ' '); }).join(', ');
  }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2400);
  }
  function setState(cls, html) { var s = $('state'); s.className = 'state ' + cls; s.innerHTML = html; }
  function today() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function fmtDate(ts) {
    if (!ts) return '—';
    var d = new Date(ts); if (isNaN(d.getTime())) return '—';
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function daysAgo(ts) { return ts ? Math.floor((Date.now() - ts) / 86400000) : null; }

  var DATEISH = /date/i;
  function entryDate(values) {
    if (!values) return '';
    var k = Object.keys(values).find(function (key) { return DATEISH.test(key) && values[key]; });
    return k ? String(values[k]) : '';
  }
  function entryRef(values) {
    if (!values) return '';
    var jk = Object.keys(values).find(function (k) { return /job.*(no|number)/i.test(k) && values[k]; });
    if (jk) return String(values[jk]);
    var k = Object.keys(values).find(function (key) {
      var v = values[key];
      return v != null && typeof v !== 'object' && !DATEISH.test(key) && String(v).trim() !== '' && String(v).length <= 30;
    });
    return k ? String(values[k]) : '';
  }
  function nameOf(v) {
    if (!v) return '';
    if (typeof v === 'object') return String(v.by || v.name || v.displayName || '').trim();
    return String(v).trim();
  }
  function personOf(values) {
    if (!values) return '';
    var k = Object.keys(values).find(function (key) {
      return /(completed|recorded|checked|done|performed|submitted|filled|signed).*by|^operator$|^name$|by.*(name|who)/i.test(key) && values[key];
    });
    return k ? String(values[k]) : '';
  }
  function isAwaiting(entry) {
    if (!entry || typeof entry !== 'object') return false;
    var submitted = entry.status == null || entry.status === 'submitted';
    return submitted && !entry.verification;
  }
  function whenOf(entry) { return entry.submittedAt || entry.updatedAt || entry.createdAt || 0; }

  var STATE = { scope: 'mine', role: null, user: null, rows: [], picked: {}, open: {}, previewed: {} };
  var DEFS = {};   // recordKey -> parsed record-def (or null if unavailable)
  var PREVIEW_CONFIG = {};   // recordKey -> string[] from storage (admin override)

  async function loadPreviewConfig() {
    try {
      var raw = await window.storage.get('verification_preview_config', true);
      if (raw && raw.value) {
        var parsed = JSON.parse(raw.value);
        if (parsed && typeof parsed === 'object') PREVIEW_CONFIG = parsed;
      }
    } catch (e) {  }
  }

  async function scan() {
    var pair = await Promise.all([
      window.storage.getByPrefix('formrecord:', true),
      window.storage.getByPrefix('monitoring_log:', true)
    ]);
    var rows = [];
    pair.forEach(function (map, i) {
      var prefix = i === 0 ? 'formrecord:' : 'monitoring_log:';
      var engine = i === 0 ? 'form' : 'log';
      Object.keys(map || {}).forEach(function (storageKey) {
        var suffix = storageKey.slice(prefix.length);
        var recordKey = suffix.replace(/__.*$/, '').split(':')[0];
        if (!recordKey) return;
        var list;
        try { list = JSON.parse(map[storageKey]); } catch (e) { return; }
        list = Array.isArray(list) ? list : [list];
        var allowed = window.VerificationQueue.rolesFor(recordKey);
        var meta = indexByKey[recordKey] || {};
        list.forEach(function (entry) {
          if (!isAwaiting(entry)) return;
          rows.push({
            storageKey: storageKey, engine: engine, recordKey: recordKey,
            id: entry.id || '', name: meta.name || recordKey, docNo: meta.docNo || '',
            href: meta.href ? '../records/' + meta.href : null,
            values: entry.values || {},
            roster: Array.isArray(entry.roster) ? entry.roster : null,
            entryDate: entryDate(entry.values), ref: entryRef(entry.values),
            rosterCount: (function () {
              if (Array.isArray(entry.roster)) return entry.roster.length;
              var arr = null;
              Object.keys(entry.values || {}).forEach(function (k) {
                if (Array.isArray(entry.values[k])) arr = entry.values[k];
              });
              return arr ? arr.length : null;
            })(),
            who: nameOf(entry.completedBy) || nameOf(entry.stage && entry.stage.submittedBy) || nameOf(entry.submittedBy) || nameOf(entry.submittedByName) || personOf(entry.values),
            submittedAt: whenOf(entry), allowedRoles: allowed,
            mine: STATE.role === 'ADMINISTRATOR' || allowed.indexOf(STATE.role) !== -1
          });
        });
      });
    });
    rows.sort(function (a, b) { return (a.submittedAt || Infinity) - (b.submittedAt || Infinity); });
    STATE.rows = rows;
    await loadDefs(rows.map(function (r) { return r.recordKey; }));
  }

  function visibleRows() {
    return STATE.rows.filter(function (r) { return STATE.scope === 'all' || r.mine; });
  }

  function groupRows(rows) {
    var groups = [];
    var byKey = {};
    rows.forEach(function (r) {
      var g = byKey[r.recordKey];
      if (!g) { g = byKey[r.recordKey] = { recordKey: r.recordKey, name: r.name, docNo: r.docNo, href: r.href, allowedRoles: r.allowedRoles, mine: r.mine, rows: [] }; groups.push(g); }
      g.rows.push(r);
    });
    return groups;
  }

  function rowId(r) { return r.storageKey + '|' + r.id; }

  function render() {
    var user = STATE.user, roleLabel = ROLE_LABELS[STATE.role] || (STATE.role || '').replace(/_/g, ' ');
    $('who').innerHTML = '<strong>' + esc(user || 'Not signed in') + '</strong>' +
      '<span class="muted">' + (STATE.role ? '(' + esc(roleLabel) + ')' : '') + '</span>';

    var mineCount = STATE.rows.filter(function (r) { return r.mine; }).length;
    var anyVerifierRecords = STATE.rows.some(function (r) { return r.mine; }) ||
      window.VerificationQueue.baseVerifierRoles().indexOf(STATE.role) !== -1;

    if (!anyVerifierRecords) {
      setState('info', 'Your role (' + esc(roleLabel) + ') carries no verification duties, so nothing is assigned to you here.');
    } else if (!mineCount) {
      setState('ok', 'Nothing is waiting for your verification right now.');
    } else {
      setState('bad', '<strong>' + mineCount + '</strong> ' + (mineCount === 1 ? 'entry is' : 'entries are') + ' awaiting your verification.');
    }
    $('toolbar').style.display = '';
    var isAdmin = STATE.role === 'ADMINISTRATOR';
    $('btnSelectAll').style.display = isAdmin ? '' : 'none';
    $('btnClearSel').style.display = isAdmin ? '' : 'none';

    var rows = visibleRows();
    var groups = groupRows(rows);
    var box = $('groups');
    if (!groups.length) {
      box.innerHTML = '<div class="empty">' +
        (STATE.scope === 'all' ? 'No submitted entries are awaiting verification anywhere.' : 'Nothing in your queue.') + '</div>';
    } else {
      box.innerHTML = groups.map(renderGroup).join('');
    }
    wireGroups();
    renderBar();
    $('note').innerHTML =
      'Verification is restricted: only the role assigned to a record can sign it off, and the ' +
      '<em>Verified by</em> name is taken from your login. Rows for other roles are shown greyed under ' +
      '<strong>All pending</strong> and cannot be selected. The signed verification stored on each record ' +
      'remains the evidence — this page is a work queue.';
  }

  function renderGroup(g) {
    var selectable = g.mine;
    return '<div class="grp" data-record="' + esc(g.recordKey) + '">' +
      '<div class="grp-head">' +
        (selectable ? '<input type="checkbox" class="grp-all" title="Select all in this record">' : '') +
        '<h2>' + (g.href ? '<a href="' + esc(g.href) + '">' + esc(g.docNo ? g.docNo + ' — ' + g.name : g.name) + '</a>'
                         : esc(g.docNo ? g.docNo + ' — ' + g.name : g.name)) + '</h2>' +
        '<span class="count">' + g.rows.length + '</span>' +
        '<span class="roles">Verifier: ' + esc(labelRoles(g.allowedRoles)) + (selectable ? '' : ' — not you') + '</span>' +
      '</div>' +
      '<table><thead><tr>' +
        '<th class="chk"></th><th>Entry date</th><th>Ref</th><th>Submitted by</th><th>Submitted</th><th>Waiting</th><th></th>' +
      '</tr></thead><tbody>' +
      g.rows.map(function (r) {
        var d = daysAgo(r.submittedAt);
        var ageCls = (d != null && d >= 7) ? 'age old' : 'age';
        var submittedDate = r.submittedAt ? fmtDate(r.submittedAt) : '—';
        var waitDays = d == null ? '—' : d + 'd';
        var rid = rowId(r);
        var open = !!STATE.open[rid];
        if (open) STATE.previewed[rid] = true;   // no preview, no verify
        var canPick = !!STATE.previewed[rid];
        var main = '<tr class="' + (r.mine ? '' : 'foreign') + '">' +
          '<td class="chk">' + (r.mine
            ? '<input type="checkbox" class="row-pick" data-rid="' + esc(rid) + '"' + (STATE.picked[rid] ? ' checked' : '') + (canPick ? '' : ' disabled title="Preview this entry before verifying it"') + '>'
            : '') + '</td>' +
          '<td class="when">' + esc(r.entryDate || '—') + '</td>' +
          '<td>' + esc(r.ref || '—') + (r.rosterCount != null ? '<br><span style="color:#5c6771;font-size:11px;">' + r.rosterCount + ' rows</span>' : '') + '</td>' +
          '<td>' + esc(r.who || '—') + '</td>' +
          '<td class="when">' + submittedDate + '</td>' +
          '<td class="' + ageCls + '">' + waitDays + '</td>' +
          '<td><button type="button" class="rev" data-rid="' + esc(rid) + '">' + (open ? 'Hide' : 'Preview') + '</button></td>' +
        '</tr>';
        var formLink = r.href && r.id
          ? '<div style="margin-top:10px;">' +
              '<a href="' + esc(r.href) + '#' + encodeURIComponent(r.id) + '" target="_blank" ' +
                 'style="font-size:12px;color:#1d4ed8;font-weight:600;text-decoration:none;border:1px solid #c3d4f7;padding:4px 10px;border-radius:4px;background:#f0f5ff;">' +
                'Open full record &rarr;' +
              '</a>' +
              '<a href="print-entry.html?rec=' + encodeURIComponent(r.recordKey) + '&engine=' + (r.engine === 'log' ? 'log' : 'form') +
                 '&entry=' + encodeURIComponent(r.id) + '&print=1&printonly=1" class="pdf-open" ' +
                 'style="font-size:12px;color:#1d4ed8;font-weight:600;text-decoration:none;border:1px solid #c3d4f7;padding:4px 10px;border-radius:4px;background:#f0f5ff;margin-left:8px;">' +
                'View PDF &rarr;' +
              '</a>' +
            '</div>'
          : '';
        var detail = open ? '<tr class="detail"><td></td><td colspan="6">' + previewDl(r) + formLink + '</td></tr>' : '';
        return main + detail;
      }).join('') +
      '</tbody></table></div>';
  }

  function humanLabel(k) {
    return k
      .replace(/([a-z])([A-Z])/g, '$1 $2')
      .replace(/[_-]+/g, ' ')
      .replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  async function loadDefs(recordKeys) {
    var unique = recordKeys.filter(function (k, i, a) { return a.indexOf(k) === i && !(k in DEFS); });
    await Promise.all(unique.map(async function (rk) {
      try {
        var res = await fetch('../data/record-defs/' + encodeURIComponent(rk) + '.json', { cache: 'default' });
        DEFS[rk] = res.ok ? await res.json() : null;
      } catch (e) {
        DEFS[rk] = null;
      }
    }));
  }

  // Mirrors form-record.js roster.totals: count rows, or sum a column (optionally filtered by `where`).
  function rosterRowsOf(row) {
    if (row.roster) return row.roster;
    var rows = null;
    Object.keys(row.values || {}).forEach(function (k) { if (Array.isArray(row.values[k])) rows = row.values[k]; });
    return rows;
  }
  function rosterTotal(def, row, idx) {
    var t = def && def.roster && def.roster.totals && def.roster.totals[idx];
    if (!t) return '—';
    var rows = rosterRowsOf(row);
    if (!rows) return '—';
    var match = function (r) {
      return !t.where || Object.keys(t.where).every(function (k) {
        return t.where[k].indexOf(String(r[k] == null ? '' : r[k])) !== -1;
      });
    };
    if (t.count) {
      return String(rows.filter(function (r) {
        return match(r) && Object.keys(r).some(function (k) { return String(r[k] || '').trim() !== ''; });
      }).length);
    }
    var sum = 0;
    rows.forEach(function (r) {
      if (!match(r)) return;
      var parts = String(r[t.sum] == null ? '' : r[t.sum]).split(/[+,;\s]+/).filter(Boolean);
      parts.forEach(function (p) { if (/^-?\d+(\.\d+)?$/.test(p)) sum += parseFloat(p); });
    });
    return sum.toFixed(2);
  }

  // OOSW (REC 7.1.5) vs total cooked weight for roster.jobWeights records (REC 7.4.0).
  // Fetched once per job and cached; the preview re-renders when the figures arrive.
  var JOBW = {};   // recordKey|job -> { oosw, cooked } or 'loading'
  function jobWeightsFor(row, def) {
    var jw = def && def.roster && def.roster.jobWeights;
    if (!jw) return null;
    var job = String((row.values || {})[def.batchField || 'jobNo'] || '').trim();
    if (!job) return null;
    var rows = rosterRowsOf(row);
    var thisCooked = 0;
    (rows || []).forEach(function (r) {
      if (r[jw.processColumn] === jw.cook) thisCooked += parseFloat(r[jw.column]) || 0;
    });
    var key = row.recordKey + '|' + job + '|' + (row.id || '');
    var c = JOBW[key];
    if (c === undefined) {
      JOBW[key] = 'loading';
      var base = (window.FACILITY_API_BASE || 'https://processing-department-api.onrender.com');
      var why = '';
      var get = function (path) {
        return (window.FacilityApi ? window.FacilityApi.fetch(path) : fetch(base + path))
          .then(function (r) { if (!r.ok) { why = 'lookup failed (HTTP ' + r.status + ')'; return null; } return r.json(); });
      };
      var enc = encodeURIComponent;
      Promise.all([
        get('/api/lookup/' + enc(jw.capSource) + '/' + enc(jw.capMatchField) + '/' + enc(job)),
        get('/api/lookup/' + enc(row.recordKey) + '/' + enc(def.batchField || 'jobNo') + '/' + enc(job) +
          '?excludeId=' + enc(row.id || '') + '&rosterCol=' + enc(jw.column) + '&groupCol=' + enc(jw.processColumn))
      ]).then(function (res) {
        var cap = res[0] && res[0].__rosterSums && res[0].__rosterSums[jw.capSumColumn];
        var g = (res[1] && res[1].__matchRosterGroupSums) || {};
        var oosw = cap != null && !isNaN(parseFloat(cap)) ? parseFloat(cap) : null;
        if (oosw == null && !why) {
          why = !res[0] ? 'no REC 7.1.5 entry found for job ' + job
            : 'REC 7.1.5 entry for job ' + job + ' has no numeric "' + jw.capSumColumn + '" total';
        }
        JOBW[key] = { oosw: oosw, why: why, cooked: (parseFloat(g[jw.cook]) || 0) + thisCooked };
      }).catch(function (e) { JOBW[key] = { oosw: null, why: 'lookup error: ' + (e && e.message || e), cooked: thisCooked }; })
        .then(function () { render(); });
      return 'loading';
    }
    return c;
  }

  // REC 7.4.2 style scoring: one coloured block per side (overdrying / underdrying), built only from the
  // scores actually submitted. Block colour = worst score on that side; each flagged sign lists the
  // score it got and the comment that goes with that score (the option's detail text).
  var SIDE_COLOURS = {
    Green:    { bg: '#e8f3ec', bd: '#2f7a52', fg: '#1f5a3a' },
    Amber:    { bg: '#fff6d6', bd: '#d9a400', fg: '#7a5b00' },
    Red:      { bg: '#fbe8e6', bd: '#c0392b', fg: '#8f2a20' },
    Critical: { bg: '#f3d3cf', bd: '#7d1d14', fg: '#5c120c' }
  };
  function scoringBlock(def, values, side) {
    var sc = def && def.scoring;
    if (!sc) return '';
    var overKeys = sc.over || [], underKeys = (sc.under || []).map(function (u) { return u.key; });
    var keys = side === 'over' ? overKeys : side === 'under' ? underKeys
      : (sc.signs || []).filter(function (k) { return overKeys.indexOf(k) === -1 && underKeys.indexOf(k) === -1; });
    if (!keys.length) return '';
    var minFor = {};
    if (side === 'under') (sc.under || []).forEach(function (u) { minFor[u.key] = u.min; });
    var fieldBy = {};
    (def.entryFields || []).forEach(function (f) { fieldBy[f.key] = f; });
    var title = side === 'over' ? 'Overdrying' : side === 'under' ? 'Underdrying' : 'Other signs';
    var entered = 0, worst = 0, flagged = [];
    keys.forEach(function (k) {
      var raw = values[k];
      if (raw === '' || raw == null || !isFinite(Number(raw))) return;
      entered++;
      var n = Number(raw);
      if (n > worst) worst = n;
      if (n >= (minFor[k] != null ? minFor[k] : 1)) flagged.push({ key: k, score: n });
    });
    if (!entered) return '<div style="color:#8a939b;font-size:11.5px;">' + title + ': no scores recorded.</div>';
    var statuses = sc.statuses || ['Green', 'Amber', 'Red', 'Critical'];
    var status = statuses[Math.min(worst, statuses.length - 1)];
    // a side with nothing flagged is Green regardless of a lone score below that sign's minimum
    if (!flagged.length) status = statuses[0];
    var c = SIDE_COLOURS[status] || SIDE_COLOURS.Green;
    var optLabel = function (k, n) {
      var f = fieldBy[k] || {};
      var o = (f.scoreOptions || []).filter(function (x) { return String(x.value) === String(n); })[0];
      return o ? o.label : '';
    };
    var worstSigns = flagged.filter(function (fl) { return fl.score === worst; }).map(function (fl) {
      return ((fieldBy[fl.key] || {}).label || humanLabel(fl.key)) + ': ' + optLabel(fl.key, fl.score);
    }).join(', ');
    var html = '<div style="padding:5px 9px;border-radius:6px;border:1px solid ' + c.bd + ';border-left-width:4px;background:' + c.bg + ';color:' + c.fg + ';">' +
      '<div style="font-weight:700;font-size:11.5px;">' + esc(title) + ' — ' + esc(status) +
        (worstSigns ? '<span style="font-weight:500;"> · worst: ' + esc(worstSigns) + '</span>' : '') + '</div>';
    if (!flagged.length) {
      html += '<div style="font-size:11px;margin-top:2px;">No ' + title.toLowerCase() + ' signs recorded.</div>';
    } else {
      html += '<ul style="margin:3px 0 0;padding-left:16px;font-size:11px;line-height:1.4;">' + flagged.map(function (fl) {
        var f = fieldBy[fl.key] || {};
        var opt = (f.scoreOptions || []).filter(function (o) { return String(o.value) === String(fl.score); })[0] || {};
        return '<li><b>' + esc(f.label || humanLabel(fl.key)) + '</b> — ' + esc(opt.label || 'Flagged') +
          (opt.detail ? ': ' + esc(opt.detail) : '') + '</li>';
      }).join('') + '</ul>';
      var steps = (sc.steps && sc.steps[side]) || [];
      if (steps.length) html += '<div style="font-size:11px;margin-top:3px;font-style:italic;">' + steps.map(esc).join(' ') + '</div>';
    }
    return html + '</div>';
  }

  function previewDl(row) {
    var def = DEFS[row.recordKey];
    var values = row.values || {};

    var labelMap = {};
    if (def) {
      (def.sections || []).forEach(function (sec) {
        (sec.fields || []).forEach(function (f) {
          if (f.key && f.label) labelMap[f.key] = f.label;
        });
      });
      if (def.roster && def.roster.columns) {
        def.roster.columns.forEach(function (c) {
          if (c.key && c.label) labelMap[c.key] = c.label;
        });
      }
    }

    var cols = [];
    var configCols = PREVIEW_CONFIG[row.recordKey];   // admin override
    var fallbackCols = def && def.listColumns && def.listColumns.length ? def.listColumns : null;
    var source = (configCols && configCols.length) ? configCols : fallbackCols;
    if (!(source && source.length) && def && def.scoring) {
      // scored records (REC 7.4.2) with nothing configured: key facts plus both assessment blocks
      var have = {};
      (def.entryFields || []).forEach(function (f) { have[f.key] = true; });
      source = ['jobNo', 'entryDate', 'dryRoomArea', 'noOfTrolleys', 'estimatedDryDate', 'batchStatus']
        .filter(function (k) { return have[k]; }).concat(['scoring:over', 'scoring:under', 'scoring:other'])
        .concat(['correctiveActions', 'comments'].filter(function (k) { return have[k]; }));
    }
    if (source && source.length) {
      source.forEach(function (col) {
        var tm = /^roster:total:(\d+)$/.exec(col);
        if (tm) {
          var tdef = def && def.roster && def.roster.totals && def.roster.totals[+tm[1]];
          cols.push({ key: '__roster_total', idx: +tm[1], label: (tdef && tdef.label) || 'Roster total' });
        } else if (col === 'scoring:over' || col === 'scoring:under' || col === 'scoring:other') {
          cols.push({ key: '__' + col.replace(':', '_'), block: col.split(':')[1] });
        } else if (col === 'jobweights:oosw' || col === 'jobweights:cooked') {
          cols.push({ key: '__' + col.replace(':', '_'), label: col === 'jobweights:oosw' ? 'OOSW total (kg)' : 'Total cooked weight (kg)' });
        } else if (col === 'roster:count') {
          cols.push({ key: '__roster_count', label: ((def.roster && def.roster.title) || 'Roster') + ' entries' });
        } else {
          cols.push({ key: col, label: labelMap[col] || humanLabel(col) });
        }
      });
    } else {
      var shown = 0;
      Object.keys(values).forEach(function (k) {
        if (shown >= 8) return;
        var v = values[k];
        if (v == null || v === '' || typeof v === 'object') return;
        cols.push({ key: k, label: labelMap[k] || humanLabel(k) });
        shown++;
      });
    }

    var blocks = cols.filter(function (c) { return c.block; }).map(function (c) { return scoringBlock(def, values, c.block); }).join('');
    if (blocks) blocks = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px;margin-top:10px;align-items:start;">' + blocks + '</div>';
    cols = cols.filter(function (c) { return !c.block; });
    var longKeys = {};
    (def && def.entryFields || []).concat([].concat.apply([], ((def && def.sections) || []).map(function (sec) { return sec.fields || []; })))
      .forEach(function (f) { if (f.type === 'textarea') longKeys[f.key] = true; });
    var notes = cols.filter(function (c) { return longKeys[c.key] && String(values[c.key] == null ? '' : values[c.key]).trim() !== ''; })
      .map(function (c) {
        return '<div style="margin-top:10px;padding:8px 12px;border-radius:7px;border:1px solid #d6dadf;border-left:4px solid #5c6771;background:#f7f8f9;font-size:12px;">' +
          '<div style="font-weight:700;color:#5c6771;margin-bottom:2px;">' + esc(c.label) + '</div>' +
          '<div style="white-space:pre-wrap;color:#1b2330;">' + esc(String(values[c.key]).trim()) + '</div></div>';
      }).join('');
    blocks += notes;
    cols = cols.filter(function (c) { return !longKeys[c.key]; });
    var pairs = cols.map(function (col) {
      var v;
      var red = false;
      if (col.key === '__jobweights_oosw' || col.key === '__jobweights_cooked') {
        var jwf = jobWeightsFor(row, def);
        if (jwf === 'loading') v = 'Loading…';
        else if (!jwf) v = '—';
        else {
          var isOosw = col.key === '__jobweights_oosw';
          var n = isOosw ? jwf.oosw : jwf.cooked;
          v = n == null ? (isOosw && jwf.why ? 'Not available — ' + jwf.why : 'Not recorded') : n.toFixed(2);
          // cooked weight above OOSW = possible batch mix
          red = jwf.oosw != null && jwf.oosw < jwf.cooked;
          if (isOosw && jwf.oosw == null) red = false;
        }
      } else if (col.key === '__roster_total') {
        v = rosterTotal(def, row, col.idx);
        var rt = def && def.roster && def.roster.totals && def.roster.totals[col.idx];
        var jw0 = def && def.roster && def.roster.jobWeights;
        if (rt && jw0 && rt.sum === jw0.column && rt.where && (rt.where[jw0.processColumn] || []).indexOf(jw0.cook) !== -1) {
          var jwr = jobWeightsFor(row, def);
          red = !!(jwr && jwr !== 'loading' && jwr.oosw != null && jwr.oosw < jwr.cooked);
        }
      } else if (col.key === '__roster_count') {
        v = row.rosterCount != null ? String(row.rosterCount) : '—';
      } else {
        var raw = values[col.key];
        if (raw == null || raw === '') v = '—';
        else if (typeof raw === 'object') v = JSON.stringify(raw);
        else v = String(raw);
      }
      return { label: col.label, value: v, red: red };
    }).filter(function (p) { return p.value !== '—' || cols.length <= 4; });

    if (!pairs.length && blocks) return blocks;
    if (!pairs.length) {
      return '<span style="color:#8a939b;font-size:12px;">No field values captured on this entry.</span>';
    }
    return '<dl class="vals">' + pairs.map(function (p) {
      return '<dt' + (p.red ? ' style="color:#a3352d;font-weight:700;"' : '') + '>' + esc(p.label) + '</dt>' +
        '<dd' + (p.red ? ' style="color:#fff;background:#c0392b;font-weight:700;padding:1px 8px;border-radius:4px;display:inline-block;" title="OOSW is lower than the total cooked weight — possible batch mix"' : '') + '>' +
        esc(p.value) + (p.red ? ' ⚠ OOSW lower than cooked weight' : '') + '</dd>';
    }).join('') + '</dl>' + blocks;
  }

  // View PDF opens inside this page (full-screen panel) so no new tab is made and the queue state is kept.
  function openPdfPanel(url) {
    var old = $('pdfPanel'); if (old) old.remove();
    var wrap = document.createElement('div');
    wrap.id = 'pdfPanel';
    wrap.style.cssText = 'position:fixed;inset:0;z-index:100000;background:#fff;display:flex;flex-direction:column;';
    wrap.innerHTML = '<div style="display:flex;align-items:center;gap:12px;padding:8px 12px;background:#1d2b38;color:#fff;font-size:13px;font-weight:600;">' +
        '<button type="button" id="pdfClose" style="background:#fff;color:#1d2b38;border:none;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer;">&larr; Back to verifications</button>' +
        '<span id="pdfMsg">Preparing PDF…</span></div>' +
      '<iframe id="pdfFrame" style="flex:1;border:0;width:100%;background:#fff;"></iframe>';
    document.body.appendChild(wrap);
    var fr = $('pdfFrame');
    // the frame's first load is just the blank print page: keep "Preparing" up until it says the sheet (or an error) is showing
    var slow = setTimeout(function () { var m = $('pdfMsg'); if (m && m.textContent) m.textContent = 'Still preparing — the server may be waking up…'; }, 12000);
    function onMsg(ev) {
      if (ev.origin !== location.origin || !ev.data || !ev.data.pdfReady) return;
      var m = $('pdfMsg'); if (m) m.textContent = '';
      clearTimeout(slow);
    }
    window.addEventListener('message', onMsg);
    fr.src = url;
    $('pdfClose').addEventListener('click', function () {
      clearTimeout(slow); window.removeEventListener('message', onMsg); wrap.remove();
    });
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a.pdf-open');

  function syncGroupAll() {

  async function doVerify() {
    var picked = pickedRows();
    if (!picked.length) return;

    var unseen = picked.filter(function (r) { return !STATE.previewed[rowId(r)]; });
    if (unseen.length) { toast('Preview every selected entry before verifying (' + unseen.length + ' not previewed).'); return; }

    var foreign = picked.filter(function (r) { return !r.mine; });
    if (foreign.length) { toast('Some selected entries are not assigned to your role. Refresh and retry.'); return; }

    var sigEl = $('vfy_signature');
    if (!sigEl || sigEl.dataset.verified !== 'true') {
      toast('Please enter your passkey to verify.');
      if (window.PasskeyInput) window.PasskeyInput.openForField('vfy_signature');
      return;
    }
    var v = {
      verifiedBy: ($('vfy_by').value || '').trim(),
      verifiedSig: (STATE.user || '').trim(),
      verifiedDate: $('vfy_date').value,
      verifiedSignature: ($('vfy_signature').value || '').trim()
    };
    if (!v.verifiedBy || !v.verifiedDate) { toast('Passkey sign-in and date are required.'); return; }
    if (!v.verifiedSig) { toast('You must be logged in (with a title) to verify.'); return; }

    $('btnVerify').disabled = true;
    try {
      // group picked entry ids by storage key, and record keys for the history log
      var byStore = {}, byRecord = {};
      picked.forEach(function (r) {
        (byStore[r.storageKey] || (byStore[r.storageKey] = [])).push(r.id);
        (byRecord[r.recordKey] || (byRecord[r.recordKey] = [])).push(r.id);
      });

      var record = { verifiedBy: v.verifiedBy, verifiedSig: v.verifiedSig, verifiedDate: v.verifiedDate, verifiedSignature: v.verifiedSignature, loggedAt: Date.now() };
      if (STATE.role === 'ADMINISTRATOR' && picked.length > 1) {
        record.bulkVerified = true;
        record.bulkVerifiedBy = STATE.user;
      }

      // 1. write verification onto each affected entry, per storage key
      for (var storeKey in byStore) {
        var ids = new Set(byStore[storeKey]);
        var raw = await window.storage.get(storeKey, true);
        var list;
        try { list = JSON.parse(raw ? raw.value : '[]'); } catch (e) { list = []; }
        if (!Array.isArray(list)) continue;
        list.forEach(function (entry) {
          if (entry && ids.has(entry.id) && !entry.verification) entry.verification = record;
        });
        var ok = await window.storage.set(storeKey, JSON.stringify(list), true);
        if (ok === false) throw new Error('save failed for ' + storeKey);
      }

      // 2. append to each record's verification history log
      for (var rk in byRecord) {
        try { await window.SignOffBlock.logVerification({ recordKey: rk, values: v, picked: byRecord[rk] }); }
        catch (e) { console.error('history log failed for ' + rk, e); }
      }

      var n = picked.length;
      STATE.picked = {};
      var sigEl2 = $('vfy_signature');
      if (sigEl2) { sigEl2.value = ''; sigEl2.dataset.verified = ''; }
      var dispEl = $('vfy_signature_display');
      if (dispEl) dispEl.textContent = '';
      var pkField = sigEl2 && sigEl2.closest('.pk-field');
      if (pkField) pkField.classList.remove('is-verified');
      $('vfy_by').value = '';
      $('vfy_date').value = today();
      await scan();
      render();
      toast('Verified ' + n + ' ' + (n === 1 ? 'entry' : 'entries') + '.');
    } catch (e) {
      console.error('verification failed', e);
      toast('Verification could not be saved — please retry.');
    } finally {
      $('btnVerify').disabled = false;
    }
  }

  function wireStatic() {
    document.querySelectorAll('.seg button').forEach(function (b) {
      b.addEventListener('click', function () {

    $('btnVerify').addEventListener('click', doVerify);
    $('btnSelectAll').addEventListener('click', function () {
      var n = 0;
      visibleRows().forEach(function (r) {
        var rid = rowId(r);
        if (r.mine && STATE.previewed[rid]) { STATE.picked[rid] = true; n++; }
      });
      render();
      if (!n) toast('Preview entries first (Expand all), then select.');
    });
    $('btnClearSel').addEventListener('click', function () { STATE.picked = {}; render(); });
  }

  async function start() {
    STATE.user = window.Auth.getCurrentUsername();
    STATE.role = window.Auth.getCurrentRole();
    $('vfy_jobtitle').value = STATE.user || '';   // title = logged-in user's title
    $('vfy_by').value = '';   // passkey auto-fills name from the verified identity
    $('vfy_date').value = today();
    try { await window.storage.whenReady(); } catch (e) {  }
    try { await window.VerificationQueue.loadAssignments(); } catch (e) {  }
    try {
      // Load both config AND scan in parallel, but ensure both complete before render
      await Promise.all([
        loadPreviewConfig(),
        scan()
      ]);
      render();
    } catch (e) {
      console.error(e);
      setState('bad', 'Could not load the queue. If this device has no access key, an empty queue does not mean ' +
        'there is nothing waiting — set one on <a href="api-key.html">the API key page</a>.');
    }
  }

  window.addEventListener('load', async function () {
    wireStatic();
    if (window.LoginUI && window.LoginUI.ensureAuthenticated) {
      try { await window.LoginUI.ensureAuthenticated(); } catch (e) {  }
    }
    if (!window.Auth || !window.Auth.isAuthenticated()) {
      setState('bad', 'Sign in to see what is waiting for your verification.');
      $('toolbar').style.display = 'none';
      if (window.LoginUI) window.LoginUI.showLoginModal();
      document.addEventListener('authSuccess', function once() {
        document.removeEventListener('authSuccess', once);
        start();
      });
      return;
    }
    start();
  });
})();
</script>

<div id="verification-alert-overlay" class="verification-alert-overlay" style="display:none;">
  <div class="verification-alert-box">
    <div class="verification-alert-icon">&#9888;</div>
    <h2 class="verification-alert-title">Outstanding Verifications</h2>
    <p class="verification-alert-body">
      There are <strong id="verification-alert-count">0</strong> record(s) awaiting verification.
    </p>
    <div class="verification-alert-actions">
      <a href="/pages/awaiting-verification.html" class="verification-alert-btn-primary">View Verifications</a>
      <button type="button" id="verification-alert-dismiss" class="verification-alert-btn-secondary">Dismiss</button>
    </div>
  </div>
</div>
</body>
</html>
