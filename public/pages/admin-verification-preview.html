<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Preview Fields — Administrator</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#A9763A">
<link rel="stylesheet" href="../styles/record-theme.css?v=1">
<script src="/lib/page-nav.js?v=1"></script>
<script src="../lib/master-index-data.js?v=4"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/api-backend.js?v=18"></script>
<script src="../lib/permission-rules.js?v=8"></script>
<script src="../lib/auth.js?v=5"></script>
<script src="../lib/login-ui.js?v=6"></script>
<style>
body { font-family: 'Segoe UI', system-ui, sans-serif; color: #1b2330; background: #f4f5f3; font-size: 13px; margin: 0; }

.page-header { background: #1d2b38; color: #f4f1e8; padding: 16px 20px; }
.page-header h1 { margin: 0; font-size: 18px; font-weight: 600; }
.page-header p { margin: 4px 0 0; color: #b9c3cc; font-size: 12px; }
.back-link { display: inline-block; margin-top: 6px; color: #b9c3cc; text-decoration: none; font-size: 12px; }
.back-link:hover { color: #fff; }

.container { max-width: 960px; margin: 0 auto; padding: 20px 20px 80px; }

.state { padding: 10px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 600; margin-bottom: 14px; }
.state.ok  { background: #e8f3ec; color: #2f7a52; }
.state.bad { background: #fbe8e6; color: #a3352d; }
.state.info { background: #e6eefb; color: #1d4ed8; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.search-box { padding: 7px 11px; border: 1px solid #c9cdd1; border-radius: 6px; font-size: 13px; flex: 1; min-width: 200px; max-width: 360px; }
.btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #c9cdd1; background: #fff; }
.btn:hover { background: #f2f4f6; }
.btn-primary { background: #2f4356; color: #fff; border-color: #2f4356; }
.btn-primary:hover { background: #1d2b38; }
.btn-sm { padding: 5px 10px; font-size: 12px; font-weight: 500; }
.btn-ghost { background: transparent; color: #5c6771; border-color: #c9cdd1; }

.rec-list { display: flex; flex-direction: column; gap: 8px; }
.rec-card { background: #fff; border: 1px solid #e2e4e3; border-radius: 8px; overflow: hidden; }
.rec-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; user-select: none; }
.rec-head:hover { background: #f9fafb; }
.rec-chevron { color: #8a939b; font-size: 11px; transition: transform .15s; }
.rec-head.open .rec-chevron { transform: rotate(90deg); }
.rec-name { font-weight: 600; font-size: 13px; flex: 1; }
.rec-doc { color: #8a939b; font-size: 11.5px; }
.rec-badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: #e8f3ec; color: #2f7a52; font-weight: 700; white-space: nowrap; }
.rec-badge.custom { background: #fff3dd; color: #8a5a10; }
.rec-badge.empty { background: #f4f5f3; color: #8a939b; }
.rec-unsaved { font-size: 11px; color: #8a5a10; font-weight: 600; }
.rec-body { display: none; padding: 14px 16px; border-top: 1px solid #e2e4e3; }
.rec-body.open { display: block; }

.editor-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .editor-layout { grid-template-columns: 1fr; } }
.editor-col h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #5c6771; margin: 0 0 8px; }

.sel-list { display: flex; flex-direction: column; gap: 4px; min-height: 40px; }
.sel-item { display: flex; align-items: center; gap: 6px; background: #f4f5f3; border: 1px solid #e2e4e3; border-radius: 5px; padding: 6px 8px; font-size: 12.5px; }
.sel-item .item-label { flex: 1; }
.item-key { font-size: 11px; color: #8a939b; font-family: 'IBM Plex Mono', monospace; }
.sel-move { background: none; border: none; cursor: pointer; color: #8a939b; padding: 1px 3px; font-size: 13px; line-height: 1; }
.sel-move:hover:not(:disabled) { color: #1b2330; }
.sel-move:disabled { opacity: .35; cursor: default; }
.sel-remove { background: none; border: none; cursor: pointer; color: #c0392b; padding: 1px 4px; font-size: 14px; font-weight: 700; line-height: 1; }
.sel-remove:hover { color: #a3352d; }
.sel-empty { color: #8a939b; font-size: 12px; font-style: italic; padding: 8px 0; }

.avail-list { display: flex; flex-direction: column; gap: 3px; max-height: 280px; overflow-y: auto; border: 1px solid #e2e4e3; border-radius: 5px; padding: 6px 8px; background: #fafafa; }
.avail-item { display: flex; align-items: center; gap: 8px; padding: 4px 2px; font-size: 12.5px; cursor: pointer; }
.avail-item:hover { background: #f2f4f6; border-radius: 3px; }
.avail-item input[type=checkbox] { cursor: pointer; }
.avail-loading { color: #8a939b; font-size: 12px; font-style: italic; padding: 8px; }

.rec-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; border-top: 1px solid #e2e4e3; padding-top: 12px; }

#toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: #1b2330; color: #fff; padding: 10px 18px; border-radius: 7px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
#toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="page-header">
  <h1>Verification Preview Fields</h1>
  <p>Configure which fields a verifier sees when they expand an entry in the Awaiting Verification queue — without opening the full record.</p>
  <a class="back-link" href="../index.html">&larr; Back to Processing Department</a>
</div>

<div class="container">
  <div class="state info" id="state">Loading…</div>

  <div class="toolbar" id="toolbar" style="display:none;">
    <input class="search-box" id="search" type="search" placeholder="Filter records…" autocomplete="off">
    <button class="btn btn-primary" id="btnSaveAll">Save all changes</button>
  </div>

  <div class="rec-list" id="recList"></div>
</div>

<div id="toast"></div>

<script>(function () {
  'use strict';
  var STORAGE_KEY = 'verification_preview_config';
  var DEFS = {};      // recordKey -> parsed record-def (null if unavailable)
  var CONFIG = {};    // recordKey -> string[] — saved override config
  var PENDING = {};   // recordKey -> string[] | null — unsaved edits (null = reset to default)
  var OPEN = {};      // recordKey -> bool — accordion open state

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function toast(msg, duration) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, duration || 2400);
  }
  function setState(cls, html) { var s = $('state'); s.className = 'state ' + cls; s.innerHTML = html; }
  function humanLabel(k) {
    return String(k || '').replace(/_/g, ' ').replace(/([a-z0-9])([A-Z])/g, '$1 $2')
      .replace(/^./, function (c) { return c.toUpperCase(); });
  }
  function rows() {
    return ((window.MasterIndexData && window.MasterIndexData.rows) || []).filter(function (r) { return r.recordKey; });
  }
  function findRow(rk) { return rows().find(function (r) { return r.recordKey === rk; }); }

  async function loadConfig() {
    try {
      var raw = await window.storage.get(STORAGE_KEY, true);
      if (raw && raw.value) {
        var parsed = JSON.parse(raw.value);
        if (parsed && typeof parsed === 'object') CONFIG = parsed;
      }
    } catch (e) {  }
  }

  async function saveConfig(singleRecordKey) {
    var keys = singleRecordKey ? [singleRecordKey] : Object.keys(PENDING);
    var prevConfig = JSON.parse(JSON.stringify(CONFIG));
    var prevPending = {};
    keys.forEach(function (rk) {
      if (PENDING[rk] === undefined) return;
      prevPending[rk] = PENDING[rk];
      if (PENDING[rk] === null) delete CONFIG[rk];
      else CONFIG[rk] = PENDING[rk].slice();
      delete PENDING[rk];
    });
    var ok = await window.storage.set(STORAGE_KEY, JSON.stringify(CONFIG), true);
    if (ok === false) {
      // roll back so unsaved edits are not lost
      CONFIG = prevConfig;
      Object.keys(prevPending).forEach(function (rk) { PENDING[rk] = prevPending[rk]; });
      throw new Error('storage write failed');
    }
  }

  async function loadDef(rk) {
    if (DEFS[rk] !== undefined) return DEFS[rk];
    try {
      var res = await fetch('../data/record-defs/' + encodeURIComponent(rk) + '.json', { cache: 'default' });
      DEFS[rk] = res.ok ? await res.json() : null;
    } catch (e) {
      DEFS[rk] = null;
    }
    return DEFS[rk];
  }

  // Hidden fields that are internal bookkeeping (ids, audit stamps), not worth previewing.
  var INTERNAL_KEY = /(SourceIds?|SourceSubmissionId|TypedManually|RawJson|stampSource|movementReversed|warningAck|warningNote|calculatedBy|ncEntryId)$/i;

  function fieldsFromDef(def) {
    var seen = {};
    var fields = [];
    function add(f) {
      if (!f || !f.key || seen[f.key]) return;
      if (INTERNAL_KEY.test(f.key) || /Old$/.test(f.key)) return;
      seen[f.key] = true;
      fields.push({ key: f.key, label: f.label || humanLabel(f.key) });
    }
    // Form-engine records keep fields in sections; monitoring-log records in entryFields.
    (def.sections || []).forEach(function (sec) {
      if (sec.legacyBlock) return;
      (sec.fields || []).forEach(add);
    });
    (def.entryFields || []).forEach(add);
    if (def.roster) {
      fields.push({ key: 'roster:count', label: (def.roster.title || 'Roster') + ' count' });
      (def.roster.totals || []).forEach(function (t, i) {
        fields.push({ key: 'roster:total:' + i, label: (t.label || 'Total ' + (i + 1)) + ' (roster total)' });
      });
    }
    // Records that compare cooked weight against OOSW (roster.jobWeights) get both figures;
    // the queue preview shows them in red when OOSW is lower than the total cooked weight.
    if (def.roster && def.roster.jobWeights) {
      fields.push({ key: 'jobweights:oosw', label: 'OOSW total (kg) — from REC 7.1.5' });
      fields.push({ key: 'jobweights:cooked', label: 'Total cooked weight (kg) — whole job' });
    }
    // Scored records (REC 7.4.2): coloured overdrying / underdrying blocks built from the submitted scores.
    if (def.scoring) {
      fields.push({ key: 'scoring:over', label: 'Overdrying assessment (colour block + flagged signs)' });
      fields.push({ key: 'scoring:under', label: 'Underdrying assessment (colour block + flagged signs)' });
      fields.push({ key: 'scoring:other', label: 'Other signs (e.g. wrinkles) — flagged signs on neither side' });
    }
    return fields;
  }

  function currentFields(rk) {
    if (PENDING[rk] !== undefined) {
      if (PENDING[rk] !== null) return PENDING[rk];
      var d0 = DEFS[rk];
      return (d0 && d0.listColumns) ? d0.listColumns.slice() : [];
    }
    if (CONFIG[rk] !== undefined) return CONFIG[rk] || [];
    var def = DEFS[rk];
    return (def && def.listColumns) ? def.listColumns.slice() : [];
  }
  function isCustom(rk) {
    if (PENDING[rk] !== undefined) return PENDING[rk] !== null;
    return CONFIG[rk] !== undefined;
  }

  function badgeFor(rk) {
    var n = currentFields(rk).length;
    var custom = isCustom(rk);
    return {
      cls: n === 0 ? 'empty' : (custom ? 'custom' : ''),
      text: n === 0 ? 'No preview set' : n + ' field' + (n !== 1 ? 's' : '') + (custom ? ' (custom)' : '')
    };
  }

  function renderRecordList(filterText) {
    var q = (filterText || '').toLowerCase().trim();
    var filtered = rows().filter(function (r) {
      return !q || String(r.name || '').toLowerCase().includes(q) ||
        String(r.docNo || '').toLowerCase().includes(q) || r.recordKey.toLowerCase().includes(q);
    });
    var box = $('recList');
    if (!filtered.length) {
      box.innerHTML = '<div style="padding:20px;text-align:center;color:#8a939b;">No records match "' + esc(filterText) + '".</div>';
      return;
    }
    box.innerHTML = filtered.map(renderRecordCard).join('');
    filtered.forEach(function (r) { if (OPEN[r.recordKey]) openRecord(r.recordKey); });
  }

  function renderRecordCard(row) {
    var rk = row.recordKey;
    var open = !!OPEN[rk];
    var b = badgeFor(rk);
    return '<div class="rec-card" data-rk="' + esc(rk) + '">' +
      '<div class="rec-head' + (open ? ' open' : '') + '" data-rk="' + esc(rk) + '">' +
        '<span class="rec-chevron">&#9654;</span>' +
        '<span class="rec-name">' + esc(row.name) + '</span>' +
        '<span class="rec-doc">' + esc(row.docNo || '') + '</span>' +
        (PENDING[rk] !== undefined ? '<span class="rec-unsaved" data-pending>&#9679; unsaved</span>' : '') +
        '<span class="rec-badge ' + b.cls + '">' + esc(b.text) + '</span>' +
      '</div>' +
      '<div class="rec-body' + (open ? ' open' : '') + '" data-body="' + esc(rk) + '">' +
        (open ? '<div class="avail-loading" data-editor="' + esc(rk) + '">Loading fields…</div>' : '') +
      '</div>' +
    '</div>';
  }

  async function openRecord(rk) {
    var def = await loadDef(rk);
    var host = document.querySelector('[data-editor="' + rk + '"]');
    if (!host) return;
    host.outerHTML = buildEditorHtml(rk, def);
  }

  function buildEditorHtml(rk, def) {
    var selected = currentFields(rk);
    var available = def ? fieldsFromDef(def) : [];
    var selectedKeys = {};
    selected.forEach(function (k) { selectedKeys[k] = true; });
    var unselected = available.filter(function (f) { return !selectedKeys[f.key]; });
    var labelMap = {};
    available.forEach(function (f) { labelMap[f.key] = f.label; });
    function labelFor(k) { return labelMap[k] || humanLabel(k); }

    var selHtml = selected.length
      ? selected.map(function (k, i) {
          return '<div class="sel-item">' +
            '<button class="sel-move" data-action="up" data-key="' + esc(k) + '" title="Move up"' + (i === 0 ? ' disabled' : '') + '>&uarr;</button>' +
            '<button class="sel-move" data-action="down" data-key="' + esc(k) + '" title="Move down"' + (i === selected.length - 1 ? ' disabled' : '') + '>&darr;</button>' +
            '<span class="item-label">' + esc(labelFor(k)) + '</span>' +
            '<span class="item-key">' + esc(k) + '</span>' +
            '<button class="sel-remove" data-action="remove" data-key="' + esc(k) + '" title="Remove">&times;</button>' +
          '</div>';
        }).join('')
      : '<div class="sel-empty">No fields selected — verifier will see a fallback dump.</div>';

    var availHtml = unselected.length
      ? unselected.map(function (f) {
          return '<label class="avail-item">' +
            '<input type="checkbox" class="avail-check" data-key="' + esc(f.key) + '">' +
            '<span class="item-label">' + esc(f.label) + '</span>' +
            '<span class="item-key">' + esc(f.key) + '</span>' +
          '</label>';
        }).join('')
      : '<div class="avail-loading">' + (def ? 'All available fields are already selected.' : 'Record definition unavailable.') + '</div>';

    return '<div data-editor-live="' + esc(rk) + '">' +
      '<div class="editor-layout">' +
        '<div class="editor-col"><h3>Shown in preview (in order)</h3><div class="sel-list">' + selHtml + '</div></div>' +
        '<div class="editor-col"><h3>Available to add</h3><div class="avail-list">' + availHtml + '</div>' +
          '<div style="margin-top:8px;"><button class="btn btn-sm" data-action="add">+ Add checked fields</button></div>' +
        '</div>' +
      '</div>' +
      '<div class="rec-actions">' +
        (isCustom(rk) ? '<button class="btn btn-sm btn-ghost" data-action="reset">Reset to record default</button>' : '') +
        '<button class="btn btn-sm btn-primary" data-action="save">Save this record</button>' +
      '</div>' +
    '</div>';
  }

  function refreshEditor(rk) {
    var live = document.querySelector('[data-editor-live="' + rk + '"]');
    if (live) {
      var wrap = document.createElement('div');
      wrap.innerHTML = buildEditorHtml(rk, DEFS[rk]);
      live.replaceWith(wrap.firstElementChild);
    }
    var head = document.querySelector('.rec-head[data-rk="' + rk + '"]');
    if (!head) return;
    var b = badgeFor(rk);
    var badge = head.querySelector('.rec-badge');
    badge.className = 'rec-badge ' + b.cls;
    badge.textContent = b.text;
    var pend = head.querySelector('[data-pending]');
    if (PENDING[rk] !== undefined && !pend) {
      badge.insertAdjacentHTML('beforebegin', '<span class="rec-unsaved" data-pending>&#9679; unsaved</span>');
    } else if (PENDING[rk] === undefined && pend) {
      pend.remove();
    }
  }

  function refreshCard(rk) {
    var card = document.querySelector('.rec-card[data-rk="' + rk + '"]');
    var row = findRow(rk);
    if (!card || !row) return;
    var wrap = document.createElement('div');
    wrap.innerHTML = renderRecordCard(row);
    card.replaceWith(wrap.firstElementChild);
    if (OPEN[rk]) openRecord(rk);
  }

  async function onListClick(e) {
    var head = e.target.closest('.rec-head');
    if (head) {
      var hrk = head.dataset.rk;
      var body = document.querySelector('[data-body="' + hrk + '"]');
      OPEN[hrk] = !OPEN[hrk];
      head.classList.toggle('open', OPEN[hrk]);
      body.classList.toggle('open', OPEN[hrk]);
      if (OPEN[hrk]) {
        body.innerHTML = '<div class="avail-loading" data-editor="' + esc(hrk) + '">Loading fields…</div>';
        openRecord(hrk);
      }
      return;
    }
    var btn = e.target.closest('[data-action]');
    var card = e.target.closest('.rec-card');
    if (!btn || !card) return;
    var rk = card.dataset.rk;
    var action = btn.dataset.action;
    var fields = currentFields(rk).slice();

    if (action === 'up' || action === 'down' || action === 'remove') {
      var idx = fields.indexOf(btn.dataset.key);
      if (idx === -1) return;
      if (action === 'remove') fields.splice(idx, 1);
      else if (action === 'up' && idx > 0) { var t = fields[idx - 1]; fields[idx - 1] = fields[idx]; fields[idx] = t; }
      else if (action === 'down' && idx < fields.length - 1) { var t2 = fields[idx + 1]; fields[idx + 1] = fields[idx]; fields[idx] = t2; }
      PENDING[rk] = fields;
      refreshEditor(rk);
    } else if (action === 'add') {
      var checked = Array.from(card.querySelectorAll('.avail-check:checked')).map(function (cb) { return cb.dataset.key; });
      if (!checked.length) { toast('Check at least one field to add.'); return; }
      checked.forEach(function (k) { if (fields.indexOf(k) === -1) fields.push(k); });
      PENDING[rk] = fields;
      refreshEditor(rk);
    } else if (action === 'reset') {
      if (!confirm('Reset to the record\'s built-in default fields? This removes any custom config.')) return;
      PENDING[rk] = null;
      refreshEditor(rk);
    } else if (action === 'save') {
      btn.disabled = true;
      try {
        await saveConfig(rk);
        
        // Verify the save actually persisted
        var raw = await window.storage.get(STORAGE_KEY, true);
        var saved = {};
        try {
          if (raw && raw.value) saved = JSON.parse(raw.value);
        } catch (e) { }
        var didSave = saved[rk] && JSON.stringify(saved[rk]) === JSON.stringify(CONFIG[rk]);
        
        if (!didSave) {
          toast('Save failed — data was not stored. Check network and retry.');
          btn.disabled = false;
          return;
        }
        
        toast('✓ Saved preview fields for this record.');
        refreshCard(rk);
      } catch (err) {
        toast('Save failed — ' + (err && err.message || 'unknown error'));
        btn.disabled = false;
      }
    }
  }

  async function start() {
    setState('info', 'Loading…');
    try {
      await window.storage.whenReady();
      await loadConfig();
      // load defs up front so badges show the true default field count
      await Promise.all(rows().map(function (r) { return loadDef(r.recordKey); }));
      $('toolbar').style.display = '';
      renderRecordList('');
      setState('ok', 'Configure which fields appear in the verification preview. Changes take effect after saving.');
    } catch (e) {
      setState('bad', 'Could not load configuration. Check the API access key on <a href="api-key.html">this page</a>.');
    }
  }

  window.addEventListener('load', async function () {
    if (window.LoginUI && window.LoginUI.ensureAuthenticated) {
      try { await window.LoginUI.ensureAuthenticated(); } catch (e) {  }
    }
    var role = window.Auth && window.Auth.getCurrentRole ? window.Auth.getCurrentRole() : null;
    var labels = (window.PermissionRules && window.PermissionRules.ROLE_LABELS) || {};

    $('recList').addEventListener('click', onListClick);
    $('search').addEventListener('input', function () { renderRecordList(this.value); });
    $('btnSaveAll').addEventListener('click', async function () {
      var btn = this;
      btn.disabled = true;
      try {
        await saveConfig();
        toast('All changes saved.');
        renderRecordList($('search').value);
      } catch (e) {
        toast('Save failed — please retry.');
      } finally {
        btn.disabled = false;
      }
    });

    if (!role) {
      setState('bad', 'Sign in to access this page.');
      if (window.LoginUI && window.LoginUI.showLoginModal) window.LoginUI.showLoginModal();
      document.addEventListener('authSuccess', function once() {
        document.removeEventListener('authSuccess', once);
        var r = window.Auth.getCurrentRole();
        if (r === 'ADMINISTRATOR') { start(); return; }
        setState('bad', 'Administrator access required.');
      });
      return;
    }
    if (role !== 'ADMINISTRATOR') {
      setState('bad', 'Administrator access required. You are signed in as ' + esc(labels[role] || role) + '.');
      return;
    }
    start();
  });
})();
</script>
</body>
</html>
