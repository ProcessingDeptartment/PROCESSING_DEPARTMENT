    {
      "key": "policy",
      "heading": "1. Policy",
      "html": "<p>Any product that is dropped on the floor or another non-food grade or sanitised surface will be treated in a manner that effectively eliminates any contamination to product or process.</p>"
    },
    {
      "key": "responsibility",
      "heading": "2. Responsibility",
      "html": "<ul><li>Quality members are responsible for training staff in this policy.</li><li>Supervisors are responsible for making sure that the policy is adhered to.</li><li>All staff are responsible for keeping the drop of product to a minimum.</li></ul>"
    },
    {
      "key": "procedure",
      "heading": "3. Procedure",
      "html": "<p>The staff must follow the best possible practice to handle products that have fallen on the floor.</p><p>The following must be adhered to:</p><ul><li>Live abalone must be rinsed with sea water and placed back into the tank as soon as possible.</li><li>Abalone in the processing facility that falls on non-food contact / un-sanitised surfaces must be scrubbed thoroughly with sea water before being placed back into production.</li></ul>"
    }
