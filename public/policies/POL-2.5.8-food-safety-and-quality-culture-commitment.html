  "sections": [
    {
      "key": "statement",
      "heading": "",
      "html": "<p>At Abagold, producing safe, high-quality abalone is at the heart of everything we do.</p><p>Food safety and quality are not just requirements &mdash; they are part of who we are and what we stand for.</p><p>We are committed to building a culture where:</p><ul><li>Everyone is responsible for food safety and quality, no matter their role.</li><li>Staff feel safe to raise concerns and know they will be listened to without blame.</li><li>We are open and transparent, sharing information through training, meetings, and updates.</li><li>Monthly Food Safety &amp; Quality Toolbox Talks to demonstrate ongoing engagement with employees.</li><li>Food safety and quality responsibilities are part of job descriptions and induction training for all employees.</li><li>Senior management will lead by example by following the rules, being visible on the floor, and supporting continuous improvement.</li><li>We will run an anonymous culture survey each year to hear directly from our staff about how we can improve.</li><li>Results and progress will be reviewed in our annual management review, and improvements will be communicated back to staff.</li></ul><p>Together, we will keep improving, keep learning, and keep producing safe, high-quality abalone that we can all be proud of.</p>"
