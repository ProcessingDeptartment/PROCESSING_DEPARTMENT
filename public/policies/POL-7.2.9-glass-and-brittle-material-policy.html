  "startRev": 8,

  "sections": [
    {
      "key": "purpose",
      "heading": "1. Purpose",
      "html": "<p>To ensure that there are suitable control measures and systems in place to prevent product contamination by physical objects. To ensure that staff follow the best possible practice to handle a glass breakage situation.</p>"
    },
    {
      "key": "policy",
      "heading": "2. Policy",
      "html": "<p>As glass is a significant potential physical food safety hazard, it is the policy of Abagold Ltd that all practical steps shall be taken to prevent contamination of food products from glass and hard plastics, as well as fragments thereof.</p><ul><li>No glass items or items containing brittle material are allowed to be taken into the production or storage areas.</li><li>If any staff member notices any broken glass or brittle plastic, or accidentally breaks any glass or glass equipment, it is their responsibility to report the incident to management immediately.</li><li>Procedures shall be established and documented, detailing the action to be taken in the case of breakage of glass or other brittle items.</li><li>In the event of breakage occurring in the production areas, a documented Glass Breakage Clearance Certificate must be completed to demonstrate that all necessary steps were taken to ensure affected product was isolated and rejected and that the affected area is suitably cleaned before production may continue.</li></ul><h3>2.1 Overhead Lights</h3><ul><li>Overhead light fittings will be located at a suitable distance from work and storage surfaces and in such a way to prevent accidental damage as a result of normal day to day production and product handling activities.</li><li>All light fittings located directly above open product inside the production area will be suitably covered to protect the product in the event of possible breakages.</li><li>The condition of light fittings and its protective covers will be routinely monitored.</li><li>Records of monitoring shall be maintained.</li><li>Production should be stopped when light bulbs are replaced by the maintenance team, to prevent any possible product contamination.</li><li>Light fittings and covers will only be cleaned when there are no production activities taking place in the area.</li></ul><h3>2.2 Windows</h3><ul><li>All windows inside the production and storage facilities will be protected from breakage and shattering to prevent glass fragments contaminating the production and storage areas.</li><li>Where possible, and where there is a risk to product, windows will be manufactured of Perspex or at least covered with a protective layer of plastic film to protect it from breakage.</li></ul>"
