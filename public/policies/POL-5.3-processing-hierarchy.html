    "objective": "This policy sets out the Abagold Processing Department management hierarchy and reporting lines, so that roles, responsibilities and lines of authority within the Processing Management Team are clear to all staff.",
    "roles": "<ul><li>The Chief Operating Officer holds overall accountability for the Processing Department.</li><li>Department Managers (Production &amp; Export, Production Planning &amp; Continuous Improvement, Quality Assurance) are responsible for their respective functions and report to the Chief Operating Officer.</li><li>Shift Managers, Supervisors and department coordinators are responsible for day-to-day execution within their areas and report up through this hierarchy.</li><li>All staff are responsible for knowing their reporting line and escalating issues through the correct channel.</li></ul>",
