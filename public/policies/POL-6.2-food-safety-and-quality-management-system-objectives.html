  "sections": {
    "objective": "This policy sets out Abagold’s Food Safety and FSQMS Objectives register: the measurable objectives management uses to demonstrate that the Food Safety Policy (POL 5.2) is being achieved, covering quality, food safety culture, legality, traceability, and continual improvement.",
    "roles": "<ul><li>The Quality and Food Safety team own, monitor and report against the objectives.</li><li>Department Managers and Top Management provide the resources needed to achieve each objective and review progress at Management Review.</li><li>All staff contribute to achieving objectives relevant to their role, particularly food safety culture and cleaning/hygiene objectives.</li></ul>",
    "process": "<p>Objectives are tracked against strategic goals with a defined method of maintenance and review, resources needed, responsible person, measurable target and reporting frequency. Current objectives include:</p><ul><li><b>Quality — TQMS across the supply chain:</b> Maintain FSSC 22000 certification in Processing, FG02 &amp; FG01. Target: 0 major and 0 critical findings, reviewed annually.</li><li><b>Quality — Compliance:</b> Comply with FSSC 22000 standards via internal audit and facility inspection. Target: no critical findings during FSSC 22000 audits, annually.</li><li><b>Quality — Food safety complaints:</b> Target 0 food safety complaints, reviewed bi-annually.</li><li><b>Quality — Internal auditor training:</b> QA Department to have a trained internal auditor, reviewed annually.</li><li><b>Quality — HACCP training:</b> HACCP team members to have up-to-date external HACCP training, reviewed annually.</li><li><b>Quality — Cleaning standard:</b> Maintain a cleaning inspection level of ≥90% via daily/weekly inspection, monthly surface and drain swabs, reviewed monthly.</li><li><b>Quality — Customer partnership:</b> Achieve 0 critical and 0 major findings on NRCS HACCP audits and 0 critical findings on NRCS facility inspections, annually.</li><li><b>Food Safety &amp; Quality Culture — Reporting of concerns:</b> Increase the percentage of employees comfortable raising food safety/quality concerns from 71% to at least 90%, via monthly toolbox talks and an annual culture questionnaire.</li><li><b>Food Safety &amp; Quality Culture — Management commitment:</b> Increase positive responses on management’s visible commitment to food safety and quality from 42% to at least 70%.</li><li><b>Food Safety &amp; Quality Culture — Management presence:</b> Increase positive responses on management presence on the factory floor from 42% to at least 75%.</li><li><b>Communication:</b> 100% completion of planned Food Safety Toolbox Talks and training activities, reviewed quarterly.</li><li><b>Performance measurement:</b> Comply with and maintain food safety standards via competency testing and weekly verification of quality documents, reviewed monthly.</li><li><b>Legality:</b> No critical findings on NRCS inspections; ensure compliance with the National Compulsory Specification Act 5 of 2008, annually.</li><li><b>Traceability:</b> Complete a forward/backward traceability exercise in under 4 hours with 100% traceability from FG02 to FG01, after each exercise / annually.</li><li><b>Quality — Complaints:</b> Quality and valid customer complaints kept below 1% of total production year to date, annually.</li><li><b>Food Safety:</b> 0% food safety related complaints of total production year to date, annually.</li><li><b>Product Safety:</b> 80% GMP audit result target, via daily hygiene inspection and monthly GMP audits with close-out in the same month.</li><li><b>Legality — Suppliers:</b> All Food Contact Information on file for substrates used, supplier records up to date, annually.</li><li><b>Continual Improvement:</b> ≥95% of corrective actions arising from audits, inspections, complaints, non-conforming products and internal findings closed within the agreed target date, reviewed monthly and at Management Review.</li></ul>",
    "review": "Objectives are reviewed and reset at least annually as part of the FSMS Management Review, and progress against each objective is tracked at the stated reporting frequency (monthly, quarterly, bi-annually or annually)."
