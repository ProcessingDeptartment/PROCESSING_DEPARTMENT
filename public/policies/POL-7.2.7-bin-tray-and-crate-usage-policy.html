  "name": "Bin, Tray and Crate Usage Policy",
  "area": "Hygiene & Contamination Control",
  "startRev": 1,
  "baselineDate": "",
  "sections": {
    "objective": "The purpose of this policy is to ensure that all bins, trays, and crates used within the abalone processing facility are handled in a hygienic and controlled manner to prevent contamination, protect product quality, and maintain traceability throughout the production process. Proper use and management of bins, trays, and crates helps prevent physical contamination, cross-contamination between product types, microbiological contamination, and product mix-ups between batches or processing stages. This policy applies to all bins, trays and crates used for handling or transporting raw abalone meat, by-products or waste, processed abalone products (canned, braised, dried), work-in-progress product, rework material and packaging materials, across all production, processing, packing and storage areas.",
    "roles": "<ul><li><b>Production Staff:</b> Use containers correctly, report damaged or dirty containers, and maintain product identification.</li><li><b>Supervisors:</b> Ensure containers are used according to this policy, monitor hygiene practices, and ensure damaged containers are removed.</li><li><b>Quality / Food Safety Team:</b> Verify compliance with this policy, monitor container hygiene during inspections, and review the policy annually.</li></ul>",
    "process": "<p><b>Types of Containers Used:</b> Only food-grade containers that are clean, intact, and approved for food contact may be used, including plastic food-grade bins, food-grade trays and plastic crates. Damaged containers (cracked, chipped, or difficult to clean) must not be used and must be removed from service.</p><p><b>Identification and Dedicated Use</b> — containers are colour coded / labelled by area to prevent cross-contamination:</p><ul><li><b>Bins (big ones):</b> Shucking and sorting area — Blue; Guts (by-product) — Red; Scrubbed (clean) product — White; Product after precooking — White; Cans packed with abalone ready to be closed — White.</li><li><b>Crates:</b> Shells (by-product) — tall crates, no specific colour; Dirty abalone at washing area — grey shallow crates; Product to chiller after second wash — grey shallow crates; Dried product pull-down/grading — red shallow crates; Precooking — yellow tall crates; Dry product already cooked (before stringing) — yellow shallow crates; Crates for other crates on the floor — black crates; Ice pack freezing — tall crates, multiple colours.</li><li><b>Trays:</b> Dry product after 1st wash — white &amp; blue trays with holes; Canned product in chiller after first wash — red trays; Canning product during scrubbing — white trays without holes.</li></ul><p><b>Hygiene and Cleaning Requirements:</b> All bins, trays and crates must be cleaned and sanitised before use, cleaned between different production batches when required, and stored in designated clean storage areas, following the facility’s Cleaning and Sanitation Procedure. Containers that fall on the floor or become contaminated must be rewashed before reuse.</p><p><b>Handling Practices:</b></p><ul><li>Do not place bins or trays directly on the floor where product contact occurs.</li><li>Do not overload containers, and ensure containers are stable when stacked.</li><li>Handle containers carefully to avoid damage.</li><li>Avoid contact between containers used for raw and cooked products.</li><li>Product containers must never be used for waste or non-food items.</li></ul><p><b>Product Identification and Traceability:</b> Where product is held in bins or trays during processing, the container must be clearly identified with product name (if applicable — canning product), job number, size range, and intake date (if applicable), to ensure traceability and prevent product mix-ups.</p><p><b>Storage of Containers:</b> Clean containers must be stored off the floor, in designated storage areas, protected from contamination. Dirty containers must be placed in the designated cleaning area and must not be stored with clean containers.</p><p><b>Inspection and Maintenance:</b> Bins, trays and crates must be inspected regularly for cracks, breakage, rough surfaces and signs of contamination. Any damaged containers must be removed from use immediately and either repaired or discarded.</p><p><b>Training:</b> All employees involved in product handling must receive training on correct use of bins, trays and crates, cross-contamination prevention, and hygienic handling practices, conducted during induction and refresher training.</p>",
    "review": "This policy is reviewed when changes occur in production processes, equipment, or food safety requirements."
  },
