    "objective": "This procedure defines the use and issuing of protective wear and utensils used within the abalone processing facility.",
    "roles": "<ul><li>QC personnel are responsible for issuing blue disposable gloves for product handling, and for coats. Gloves are signed out in the presence of a QC.</li><li>Staff must report to QC personnel when blue gloves are no longer in good condition so they can be thrown away and replaced.</li><li>Staff are observed daily for proper use of protective wear and utensils.</li><li>Utensils (knives, needles, scissors, brushes) are issued by Supervisors, and each person is responsible for their issued utensil, returning it at the end of shift.</li><li>All staff are required to adhere to this policy.</li></ul>",
    "process": "<p><b>Protective Wear (PPE)</b></p><ul><li>Gloves are used in the shucking and de-beaking areas, and only in the canning area for handling rework product and sauce filling. Gloves are also issued to staff with cuts, sores, burns or lesions on the hands by first aiders. Blue gloves are for product handling only.</li><li>Disposable arm protector sleeves are issued to all staff with long-sleeve personal clothing.</li><li>Mop caps must be removed and disposed of when exiting the production facilities.</li><li>Staff must wear gloves and arm sleeves prior to entering production.</li><li>Plasters are issued by the first aider — only blue waterproof plasters may be used.</li></ul><p><b>Coats:</b> Issued by QCs. Colour coding: Washing / Dry cooking / Canning = White; Shucking / Sorting / LHA = Blue; Live packing = White; FG02 = Blue. Coats should be put on before entering the processing areas and removed after leaving; storage rails are available at the entrance of each section.</p><p><b>Boots:</b> Each staff member is issued a pair of white boots and black boots, scrubbed and rinsed at entrances before entering the processing areas. Colour coding: Washing / Dry cooking / Canning = White; Shucking / Sorting / LHA = Black; Live packing = Black; FG02 = Black.</p><p><b>Mop caps:</b> Available outside the chemical room. Colour coding: General worker (canning side) = White; General worker (shucking/live side) = Blue; Supervisors, QCs and Management = Red.</p><p><b>Gloves — employees must:</b> wash hands thoroughly prior to putting on gloves and when gloves are changed, and change gloves when changing work area or when gloves become dirty or torn, or when going for tea/lunch breaks, to the toilets, or outside the production area.</p><p><b>Disposable arm sleeves — employees must:</b> change sleeves when changing work area or when sleeves become dirty or torn, and when going for tea/lunch breaks, to the toilets, or outside the production area.</p><p><b>Plasters:</b> used to cover cuts and sores on hands, including fingernails, with clean bandages. If hands are bandaged, clean gloves or finger cots should always be worn to protect the bandage and prevent it falling into food. Plasters are checked during the day by the first aider on duty.</p><p><b>Utensils — Knives:</b> Each staff member working in de-beaking and gutting is issued a numbered knife. It is each person’s responsibility to return their knife; damaged or lost knives must be reported to the supervisor immediately. In case of damaged or broken utensils during production, all work must stop and an inspection conducted — if a metal piece is involved, the product is discarded.</p><p><b>Shucking Tools:</b> Damaged or worn-out tools must be reported to the supervisor and discarded.</p><p><b>Dry stitching needles and strings:</b> Needles are issued and signed out/in by Supervisors; all needles must be returned to the supervisor after stringing is complete; rusted or damaged needles must be reported and discarded correctly.</p><p><b>Scissors:</b> Damaged or broken scissors must be reported.</p><p><b>Scrubbing brushes:</b> Brushes with loose or broken bristles must be reported and replaced, and kept clean and stored correctly.</p>",
