    {
      "key": "purpose",
      "heading": "1. Purpose",
      "html": "<p>This procedure defines the use and issuing of protective wear and utensils used within the abalone processing facility.</p>"
    },
    {
      "key": "responsibility",
      "heading": "2. Responsibility",
      "html": "<ul><li>QC personnel are responsible for the issuing of blue disposable gloves, for product handling only.</li><li>Staff to report to the QC personnel when blue gloves are no longer in a good condition, to throw gloves away and QCs will then issue them with a new pair of gloves. Gloves will be signed out in the presence of a QC.</li><li>Staff will be observed daily for proper use of protective wear and utensils.</li><li>All staff are required to adhere to this policy.</li><li>Utensils are issued by Supervisors, and each person is responsible for the issued knife. Knives to be returned at the end of shift to his/her Supervisor.</li></ul>"
    },
    {
      "key": "procedure",
      "heading": "3. Procedure",
      "html": "<h3>3.1 Protective Wear (PPE)</h3><ul><li>Gloves will be used in the following areas: shucking area &amp; de-beaking areas, only used in canning area for handling product for rework and for sauce filling. Gloves are also to be issued to staff members with cuts, sores, burns, or lesions on the hands of food handlers by the first aiders. Blue gloves to be used for product handling only.</li><li>Disposable arm protector sleeves to be issued to all staff with long sleeve personal clothing.</li><li>Mop caps must be removed and disposed of when exiting the production facilities.</li><li>Staff to wear gloves and arm sleeves prior to entering production.</li><li>Plasters are issued by first aider, only blue waterproof plasters to be used.</li><li><b>Coats:</b><ul><li>Issued by QCs.</li><li>Colour coding: Washing/Dry cooking/Canning = White; Shucking/Sorting/LHA = Blue; Live packing = White; FG02 = Blue.</li><li>Should be put on before entering the processing areas and removed after leaving the processing areas. Storage rails are available at the entrances of each section.</li></ul></li><li><b>Boots:</b><ul><li>Each staff member is issued with a pair of white boots and black boots.</li><li>Boots are to be scrubbed and rinsed at entrances before entering the processing areas.</li><li>Colour coding: Washing/Dry cooking/Canning = White; Shucking/Sorting/LHA = Black; Live packing = Black; FG02 = Black.</li></ul></li><li><b>Mop caps:</b><ul><li>Available outside the chemical room.</li><li>Colour coding: General worker in canning side of factory = White; General worker in shucking/live side of factory = Blue; Supervisors, QCs and Management = Red.</li></ul></li><li><b>Gloves &ndash; employees must:</b><ul><li>Wash hands thoroughly prior to putting on gloves and when gloves are changed.</li><li>Change gloves when changing work area or when gloves become dirty or torn, when going for tea and lunch breaks and to the toilets or outside the production area.</li></ul></li><li><b>Disposable arm sleeve protectors &ndash; employees must:</b><ul><li>Change sleeves when changing work area or when sleeves become dirty or torn, when going for tea and lunch breaks and to the toilets or outside the production area.</li></ul></li><li><b>Plasters:</b><ul><li>Are used to cover cuts and sores on hands, including fingernails, with clean bandages.</li><li>If hands are bandaged, clean gloves or finger cots (protective coverings) should always be worn to protect the bandage and to prevent it from falling into food.</li><li>Plasters are checked during the course of the day by the first aider on duty.</li></ul></li></ul><h3>3.2 Utensils</h3><ul><li><b>Knives:</b><ul><li>Each staff member working in the de-beaking and gutting area will be issued with a knife; the knives are marked with a number.</li><li>It is the responsibility of each person to return knives. Damaged or lost knives must be reported to the supervisor immediately. In case of damaged or broken utensils during production all work must be stopped, and an inspection must be conducted.</li><li>If it is a metal piece, the product will be discarded.</li></ul></li><li><b>Shucking tools:</b><ul><li>Damaged or worn-out tools must be reported to the supervisor and discarded.</li></ul></li><li><b>Dry stitching needles and strings:</b><ul><li>Needles are issued to staff and signed out and in by Supervisors.</li><li>All needles to be returned to the supervisor after stringing has been completed.</li><li>Rusted or damaged needles to be reported and discarded of in the correct manner.</li></ul></li><li><b>Scissors:</b><ul><li>Damaged or broken scissors must be reported.</li></ul></li><li><b>Scrubbing brushes:</b><ul><li>Brushes with loose or broken bristles must be reported and replaced.</li><li>Brushes to be kept clean and stored correctly.</li></ul></li></ul>"
    }
