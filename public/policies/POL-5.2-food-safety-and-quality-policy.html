    {
      "key": "purpose",
      "heading": "1. Purpose",
      "html": "<p>This policy defines top management&rsquo;s commitment to produce safe food within the framework of a structured management system based on the Food Safety Management System (ISO 22000) and FSSC version 6.0 additional requirements.</p><h3>1.1 Scope</h3><p>The scope covers the receiving of live abalone and processing into canned, dried, and live packed abalone.</p>"
    },
    {
      "key": "responsibilities",
      "heading": "2. Responsibilities",
      "html": "<p>Top management shall ensure that the Food Safety Policy:</p><ul><li>is appropriate to the role of the organisation in the food chain,</li><li>conforms with both statutory and regulatory requirements and with mutually agreed food safety requirements of customers,</li><li>is communicated, understood, implemented and maintained regularly at all levels of the organisation,</li><li>is reviewed and approved for continued suitability,</li><li>adequately addresses communication, and</li><li>is supported by measurable objectives.</li></ul>"
    },
    {
      "key": "policy-statement",
      "heading": "3. Policy Statement",
      "html": "<p>Abagold is committed to the handling and supply of abalone products that are safe for human consumption and of consistent quality, and to meet and exceed customer expectations. The company endeavours to comply with all statutory, regulatory, quality and customer requirements. Management intends to accomplish this through commitment to communicate, implement, maintain, and continually improve the Food Safety Management System (FSMS). All processes included in the scope of the FSMS must be determined and controlled. This is to achieve the intended results according to the Food Safety Policy.</p><p>The FSMS will be designed and managed to:</p><ul><li>Ensure prevention of microbiological, chemical, physical, and allergenic contamination of the products produced.</li><li>Establish and maintain standards and procedures for the control and monitoring of all processes that present potential Food Safety Hazards.</li><li>Utilise Hazard Analysis and Critical Control Points (HACCP) and Good Manufacturing Practices (GMP) principles to ensure food safety of all products produced.</li><li>Maintain a system of traceability of all products from raw materials used in all production phases to the final product delivered.</li><li>Enable recall of any product should such products be identified as potentially unsafe for human consumption.</li><li>Encourage a culture of continuous improvement, HACCP awareness, and commitment to both food safety and product quality.</li><li>Continuously train employees on HACCP principles.</li><li>Continually review and improve our Food Safety Management System and support this through formal communication channels, training, and audits.</li><li>Identify and evaluate food safety risks using HACCP principles to be able to effectively control the identified food safety risks.</li><li>Ensure that agreed product quality characteristics are consistently achieved through defined standards, monitoring, and continual improvement.</li><li>Ensure that Food Safety and Quality Objectives are set and achieved annually.</li></ul><p>Abagold shall take all reasonable precautions and exercise all due diligence to ensure that all canned abalone produced will be approved by the NRCS based on conformance to the requirements of Compulsory Specification for Canned Fish, Canned Marine Molluscs and Canned Crustaceans and products derived therefrom (VC 8014).</p><p>Precautions to be taken for all live abalone produced for export by Abagold to comply with the requirements of Compulsory Specifications for Live Aquaculture Abalone (VC 9001). Precautions to be taken for all dried abalone product to comply with the requirements of Compulsory Specifications for Dried Abalone (VC 9108).</p><p>Satisfactory food hygiene standards will be maintained to ensure that no local authority will be required to take formal statutory action against Abagold.</p><p>Management shall ensure that responsibilities and accountabilities are clearly defined and effectively communicated to relevant staff.</p><p>Management is furthermore committed to provide the necessary resources, including time, competent personnel, suitable and adequate infrastructure, work environment, equipment and funding to ensure the FSMS is implemented, maintained and continually improved.</p><p>Abagold is committed to the responsible management of food resources and will actively work to reduce and prevent food loss and waste throughout our operations, in line with our Food Safety and Quality objectives.</p><p>All staff shall be made aware of the Food Safety &amp; Quality Policy during annual induction training.</p>"
    },
