  "sections": {
    "objective": "This policy defines top management’s commitment to produce safe food within the framework of a structured management system based on the Food Safety Management System (ISO 22000) and FSSC version 6.0 additional requirements. The scope covers the receiving of live abalone and processing into canned, dried, and live packed abalone.",
    "roles": "<ul><li>Top management shall ensure that the Food Safety Policy is appropriate to the role of the organisation in the food chain.</li><li>Top management shall ensure the policy conforms with both statutory and regulatory requirements and with mutually agreed food safety requirements of customers.</li><li>Top management shall ensure the policy is communicated, understood, implemented, and maintained regularly at all levels of the organisation.</li><li>Top management shall ensure the policy is reviewed and approved for continued suitability.</li><li>Top management shall ensure the policy adequately addresses communication and is supported by measurable objectives.</li><li>Management shall ensure that responsibilities and accountabilities are clearly defined and effectively communicated to relevant staff.</li></ul>",
    "process": "<p>Abagold is committed to the handling and supply of abalone products that are safe for human consumption and of consistent quality, and to meet and exceed customer expectations. The company endeavours to comply with all statutory, regulatory, quality and customer requirements. Management intends to accomplish this through commitment to communicate, implement, maintain, and continually improve the Food Safety Management System (FSMS). All processes included in the scope of the FSMS must be determined and controlled to achieve the intended results according to the Food Safety Policy.</p><p>The FSMS will be designed and managed to:</p><ul><li>Ensure prevention of microbiological, chemical, physical, and allergenic contamination of the products produced.</li><li>Establish and maintain standards and procedures for the control and monitoring of all processes that present potential Food Safety Hazards.</li><li>Utilise Hazard Analysis and Critical Control Points (HACCP) and Good Manufacturing Practices (GMP) principles to ensure food safety of all products produced.</li><li>Maintain a system of traceability of all products from raw materials used in all production phases to the final product delivered.</li><li>Enable recall of any product should such products be identified as potentially unsafe for human consumption.</li><li>Encourage a culture of continuous improvement, HACCP awareness, and commitment to both food safety and product quality.</li><li>Continuously train employees on HACCP principles.</li><li>Continually review and improve our Food Safety Management System and support this through formal communication channels, training, and audits.</li><li>Identify and evaluate food safety risks using HACCP principles to be able to effectively control the identified food safety risks.</li><li>Ensure that agreed product quality characteristics are consistently achieved through defined standards, monitoring, and continual improvement.</li><li>Ensure that Food Safety and Quality Objectives are set and achieved annually (see POL 6.2 Food Safety &amp; FSQMS Objectives).</li></ul><p>Abagold shall take all reasonable precautions and exercise all due diligence to ensure that all canned abalone produced will be approved by the NRCS based on conformance to the requirements of the Compulsory Specification for Canned Fish, Canned Marine Molluscs and Canned Crustaceans and products derived therefrom (VC 8014). Precautions will be taken for all live abalone produced for export to comply with the Compulsory Specifications for Live Aquaculture Abalone (VC 9001), and for all dried abalone product to comply with the Compulsory Specifications for Dried Abalone (VC 9108).</p><p>Satisfactory food hygiene standards will be maintained to ensure that no local authority will be required to take formal statutory action against Abagold. Management is committed to providing the necessary resources, including time, competent personnel, suitable and adequate infrastructure, work environment, equipment and funding to ensure the FSMS is implemented, maintained and continually improved. Abagold is committed to the responsible management of food resources and will actively work to reduce and prevent food loss and waste throughout our operations, in line with our Food Safety and Quality objectives (see POL 2.5.16). All staff shall be made aware of the Food Safety &amp; Quality Policy during annual induction training.</p>",
    "review": "This policy is reviewed to ensure continued suitability, and is formally reviewed and approved at least annually as part of the FSMS Management Review process."
