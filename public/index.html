<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shift Handover Report</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 40px; }
    .container { max-width: 720px; margin: 0 auto; }
    h1 { margin-bottom: 0.5rem; font-size: 2rem; }
    p { margin-top: 0; color: #475569; }
    .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 24px; margin-top: 24px; box-shadow: 0 10px 30px rgba(15,23,42,0.05); }
    .report-list { list-style: none; padding: 0; margin: 0; }
    .report-list li { margin-bottom: 12px; }
    .report-link { display: inline-block; padding: 12px 16px; background: #1d4ed8; color: #ffffff; text-decoration: none; border-radius: 999px; font-weight: 700; transition: background 0.2s ease; }
    .report-link:hover { background: #2563eb; }
    .note { margin-top: 14px; color: #64748b; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Shift Handover Reports</h1>
    <p>Select report</p>

    <div class="card">
      <ul class="report-list">
        <li><a class="report-link" href="/quality-handover-report.html" target="_blank">Quality Handover Report</a></li>
      </ul>
      <p class="note">The server must be running. Open <code>http://localhost:4000</code> in your browser and click the report link.</p>
    </div>
  </div>
</body>
</html>
