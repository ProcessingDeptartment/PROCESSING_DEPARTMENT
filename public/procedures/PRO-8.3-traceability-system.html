  "sections": {
    "objective": "This procedure describes the system that enables identification of product lots and their relation to batches of raw materials, processing, and delivery records, to enable backward and forward trace of the entire system from supplier to customer on all products. When establishing and implementing the traceability system, the relation of lots of received materials/ingredients/intermediate products to end products, reworking of materials/products, and distribution of end products are considered as a minimum.",
    "roles": "<ul><li>Management is responsible for assigning responsibility for maintaining traceability.</li><li>The Production Manager sets the can code (based on production date), the drying code for dried abalone (traceable to intake date), and the sauce code (based on batch number and production date).</li><li>QCs/Supervisors are responsible for verification of can, dry, live and sauce codes during production as part of visual inspection.</li><li>The Production Manager verifies production traceability codes and the drying code when the drying report is generated.</li><li>The Quality Department confirms batches issued a Certificate of Compliance by the NRCS.</li></ul>",
    "process": "<p>Upon receipt of raw materials, ingredients or packaging materials, batch information is recorded and product specifications confirmed; pallet ID numbers for cans and can ends are recorded on the incoming inspection report and Double Seam inspection report; a COC and COA are received on delivery and FIFO is applied. Delivery notes and invoices are maintained; product is sampled on receipt.</p><p>For each batch during processing, the batch codes of raw materials used are recorded on QC and production records.</p><p><b>Canned abalone:</b> incoming baskets are identified as one batch, traceable by intake date, and assigned a unique job number starting with CPR on SYSPRO. Each batch produced is ink-stamped with a unique can code based on the NRCS Processing Code (AG) followed by the processing date as “ddmmyy” (e.g. AG 060420). Cans filled with sauce are traceable to a sauce batch code (e.g. SB2808-1). A retort report is generated for each canned batch, referencing the facility code (AG) and production date, and is also recorded on the NRCS-issued COC.</p><p><b>Dried abalone:</b> incoming baskets are assigned a unique job number starting with DPR, traceable by intake date. The drying code is DA (Dried Abalone) followed by the packing date as “ddmmyy”, referenced back to the intake date on the drying report.</p><p><b>Live packed abalone:</b> the IDN packing sheet provides customer details and shipment date; the farm transfer document to the live holding area provides grading details. A job number is assigned starting with LPA. The intake sheet identifies bag numbers per size and quantity; bag/tag numbers enable each lot to be traced back to sales week and harvest date. Bags packed on the day are assigned a production date as “ddmmyy”.</p><p>All products carry the assigned production code on boxes, pallets, and dispatch/delivery sheets. Appropriate inventory control and dispatch records are maintained for traceability.</p><p><b>Record Keeping:</b> traceability records are maintained for a minimum of 5 years + 6 months for canned abalone, 10 years for dried abalone, and 1 year for live abalone, to enable traceability and handling of potentially unsafe products and product withdrawals. Records are stored for easy retrieval during a withdrawal (actual or mock recall), in accordance with statutory, regulatory and customer requirements, based on end product lot identification. Mass balance is included in traceability exercises. The organisation verifies and tests the effectiveness of the traceability system at least annually.</p>",
    "review": "The organisation verifies and tests the effectiveness of the traceability system at least annually."
