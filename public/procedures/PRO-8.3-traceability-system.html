  "sections": [
    {
      "title": "Purpose",
      "html": "<p>This procedure describes the system that enables the identification of product lots and their relation to batches of raw materials, processing, and delivery records. To enable backward and forward trace of the entire system from supplier to customer on all products.</p><p>When establishing and implementing the traceability system, the following shall be considered as a minimum:</p><p>a) Relation of lots of received materials, ingredients, and intermediate products to the end products.</p><p>b) reworking of materials/products.</p><p>c) distribution of the end products.</p>"
    },
    {
      "title": "Responsibilities",
      "html": "<ul><li>Management is responsible for assigning responsibility for maintaining traceability.</li><li>The can code is set by the production manager based on the date of production.</li><li>The Drying Code for dried abalone is set by the production manager, traceable to the date of intake of live animals.</li><li>The sauce code is set by production manager based on the batch number and date of production.</li><li>The QCs /supervisor(s) are responsible for verification of can, dry &amp; live and sauce codes during production as part of the visual inspection.</li><li>The production manager is responsible to verify the production traceability codes and drying code when the drying report is generated.</li><li>The quality department confirms batches that are issued Certificate of Compliance by the NRCS.</li></ul>"
    },
    {
      "title": "Instructions",
      "html": "<ul><li>Upon receipt of raw materials, ingredients or packaging materials, record batch information and confirm product specifications are adhered to. Pallet number identification numbers for cans and can ends are recorded on incoming inspection report and on the Double seam inspection report. A COC &amp; COA is received on delivery and FIFO (first in first out) is applied on receiving. Delivery notes, invoices are maintained on record. Sampling of product is done upon receiving. COA and receiving documents of the labels and packaging materials.</li><li>For each batch during processing, the batch codes of the raw materials used during processing are recorded on the QC and production records.</li><li>Canned abalone- all incoming baskets are identified as one batch and are traceable by intake date during processing and are assigned a unique job number starting with CPR code on the SYSPRO system.  Each batch of canned abalone produced is identified with a specific code, ink stamped onto the can for traceability purposes. The can code is assigned based on the Processing Code issued by the NRCS (AG), followed by the processing date, referenced as “ddmmyy” e.g. AG 060420.</li></ul><p>The cans filled with sauce are traceable to each canning code or can with a unique code. The sauce batch is assigned a production code after sauce mixing referenced with batch number, date, month of production and run of the day.e.g. SB2808-1. Production records maintained are also identified with the traceability record for reference purposes. A retort report must be generated for each canned batch that is identified with a specific traceability code, which contains reference to the facility, abbreviated as AG, as well as the date of production, referenced as “ddmmyy”. This traceability code is also recorded on the COC issued by the NRCS upon product approval. Records of batches are completed and maintained during processing.</p><ul><li>Dried abalone - The incoming baskets are assigned a unique job number starting with DPR and traceable by intake date during processing. The drying code for dried abalone is made up of a prefix, DA (Dried Abalone), followed by the packing date, referenced as “ddmmyy”. The drying code can be referenced to the intake date of the live animals on the drying report.</li><li>Live packed abalone - The IDN packing sheet will provide customer details, shipment date. The farm transfer document to live holding area will provide farm details with regards to grading. A job number is assigned starting with LPA.  The intake sheet identifies bag numbers per size and quantity as per customer requirements. The bag/tag number will enable for each lot to be traceable back to sales week. The tag/code number includes date of harvest etc. All bags packed on the day are assigned a production date referenced as “ddmmyy”.</li><li>All products will carry the assigned production code on boxes, pallets and on dispatch and delivery sheets/notes. Appropriate inventory control and dispatch records are maintained for traceability.</li><li>The organization shall verify and test the effectiveness of the traceability system at least annually.</li></ul>"
    },
    {
      "title": "Record Keeping",
      "html": "<ul><li>Traceability records shall be maintained for a minimum of 5 years + 6 months for canned abalone, 10 years for dried abalone &amp; 1 year for live abalone to enable the traceability and handling of potentially unsafe products and actual product withdrawals.</li><li>Records shall be stored in such a way that it is easily retrievable in the event of product withdrawal (actual and mock recall).</li><li>Records shall be in accordance with statutory and regulatory requirements and customer requirements and are based on the end product lot identification.</li><li>Mass balance will be included in the traceability exercises.</li><li>The organization will verify and test the effectiveness of the traceability system at least annually.</li></ul>"
    },
