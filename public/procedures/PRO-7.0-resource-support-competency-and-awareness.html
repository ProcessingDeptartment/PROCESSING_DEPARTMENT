    "objective": "To ensure the organisation provides adequate resources for the establishment, implementation, maintenance, updating and continual improvement of the FSMS, considering the capability and constraints of existing resources and the need for external resources.",
    "roles": "<ul><li>Top management makes resources available as declared in the Food Safety and Quality Policy, and ensures the food safety team and all personnel handling food products are competent with appropriate education, training, skills and experience.</li><li>Responsibility for compliance to specific tasks and duties is assigned to competent supervisory personnel.</li></ul>",
    "process": "<p><b>Resource Provision:</b> resource needs are identified as an output of Management Meetings; each Head of Department motivates required resources and their impact on the process. Top Management ensures necessary competencies are identified, training is provided, monitoring/correction/corrective action personnel are trained, effectiveness is evaluated, personnel understand the relevance of their activities, effective communication is understood, training records are maintained, temporary staff and contractors are trained before commencing work, staff are adequately supervised, and staff receive annual induction training on safe food handling. Resource needs are discussed during Management Review, HACCP Team meetings, Food Safety System review meetings, internal audits, production meetings and validation activities.</p><p><b>Human Resources:</b> a training plan specifying all planned training for the year is documented by the QA Manager; training records are kept by Management.</p><p><b>Infrastructure:</b> buildings and work areas are inspected regularly as part of the GMP pre-requisite programme; a preventative maintenance plan exists for equipment and supporting services affecting product quality.</p><p><b>Work Environment:</b> the workplace conforms to the Occupational Health and Safety Act; staff are issued necessary safety equipment; contractors, suppliers, service providers and clients are made aware of company safety regulations.</p><p><b>Externally Developed FSMS Elements:</b> where externally developed elements (PRPs, hazard analysis, hazard control plan) are used, Abagold ensures they conform to this document’s requirements, are applicable to its sites/processes/products, are adapted by the food safety team, are implemented/maintained/updated as required, and are retained as documented information.</p><p><b>Control of Externally Provided Processes, Products and Services:</b> evaluation, selection, monitoring and re-evaluation criteria for external providers are documented in the Supplier Approval Procedure; the Communication Procedure ensures requirements are communicated; effectiveness is verified via Internal Audit; documented information of evaluations/actions is maintained; external provider performance is addressed during Management Review.</p><p><b>Competency and Awareness:</b> training follows the Training Plan; only competent staff or reputable external training organisations provide training; HACCP Team members and personnel responsible for food handling, monitoring, record keeping, CCPs, OPRPs and PRPs must be deemed competent (this applies to external providers and subcontractors too). New employees attend induction covering the Food Safety and Quality Policy, Personal Hygiene Policy, 6-step hand washing, GMP/PRPs, Allergen Awareness, regulatory/customer requirements, the relevance of their activities, effective communication, and relevant SOPs, and are introduced to their managers and given a facility tour. All relevant personnel are trained within a week of commencement and supervised throughout. Induction is repeated annually and whenever retraining needs are identified. Training records include the training curriculum reference, provider, date, duration, trainee name and signature, and competency declaration. Copies of training material are maintained. Competency is confirmed via written examination, verbal confirmation, or visual inspection, and new staff are declared competent through practical assessment by the relevant supervisor/manager; if not yet competent, corrective action and retraining plans are put in place.</p>",
    "review": "This procedure is reviewed periodically as part of the document review cycle; the induction training section was most recently reviewed."
