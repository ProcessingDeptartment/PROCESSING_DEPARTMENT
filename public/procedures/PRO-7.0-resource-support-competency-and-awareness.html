  "sections": [
    {
      "title": "Purpose",
      "html": "<ul><li>To ensure that the organisation provide adequate resources for the establishment, implementation, maintenance and updating and continual improvement of the Food Safety Management System. While considering the capability &amp; constraints of existing resources as well as the need for external resources in the determination of resources needed.</li></ul>"
    },
    {
      "title": "Responsibilities",
      "html": "<ul><li>Top management shall make resources available as declared in the Food Safety and Quality Policy.</li><li>Top management must ensure that the food safety team and all personnel who engage in the handling of food products are competent and have the appropriate education, training, skills and experience to carry out their assigned tasks.</li><li>Responsibility for assuring compliance to specific tasks and duties by all personnel will be clearly assigned to competent supervisory personnel.</li></ul>"
    },
    {
      "title": "Resource provision",
      "html": "<ul><li>The identification of resources needed for the implementation and the achievement of quality objectives, would often be an output of the Management Meeting. All resources required need to be motivated by the individual Head of Department and the impact that the resource will have on the process must be clearly stated.</li><li>Top Management is responsible to make resources available to:</li><li>Identify the necessary competencies for personnel whose activities have an impact on food safety and quality.</li><li>Provide training or take other action to ensure personnel have the necessary competencies.</li><li>Ensure that personnel responsible for monitoring, corrections and corrective actions of the food safety and quality management system are trained.</li><li>Evaluate the implementation and the effectiveness of a), b) and c).</li><li>Ensure that the personnel are aware of the relevance and importance of their individual activities in contributing to food safety;</li><li>Ensure that the requirement for effective communication is understood by all personnel whose activities have an impact on food safety and quality;</li><li>Maintain appropriate records of training and actions described in b) and c);</li><li>Ensure all relevant personnel, including temporary staff and contractors, are appropriately trained prior to commencing work;</li><li>Ensure staff are adequately supervised;</li><li>Ensure staff receives annual induction training regarding the safe handling of food in accordance with food safety requirements as stipulated in the company’s hygiene policy.</li><li>Resource needs will be discussed and identified during scheduled:</li><li>Management Review meetings</li><li>HACCP Team meetings</li><li>Food Safety System review meetings</li><li>Internal audits</li><li>Resource needs will also be discussed during production meetings and validation activities.</li></ul><h3>Human Resources</h3><ul><li>A training plan, which specifies all training planned for the year, is documented by the QA Manager.</li><li>Records of training done are kept by Management.</li><li>We believe that by creating opportunities for staff to learn and grow we will add value to both the company and staff as well as become an employer of preference.</li></ul><h3>Infrastructure</h3><ul><li>As part of the Pre-requisite Program (GMP) of Abagold, buildings and work areas are inspected on a regular basis. A preventative maintenance plan exists for all equipment and supporting services which can have an impact on the quality of the product during the realization thereof.</li></ul><h3>Work environment</h3><ul><li>The workplace needs to conform to safety regulations as set out in the Occupational Health and Safety Act. Staff is issued with the necessary safety equipment needed to perform work within the guidelines as set out in the Occupational Health and Safety Act.</li><li>Contractors, suppliers, service providers and clients entering the plant must be made aware of the safety regulations of the company.</li></ul><h3>Externally developed elements of the food safety management system</h3><ul><li>In the event that the organization establishes, maintains, updates and continually improves its FSMS by using externally developed elements of a FSMS, including PRPs, the hazard analysis and the hazard control plan, we will ensure that the provided elements are:</li></ul><p>a)\tdeveloped in conformance with requirements of this document;</p><p>b)\tapplicable to the sites, processes and products of the organization;</p><p>c)\tspecifically adapted to the processes and products of the organization by the food safety team;</p><p>d)\timplemented, maintained and updated as required by this document;</p><p>e)\tretained as documented information.</p><h3>Control of externally provided processes, products and services</h3><ul><li>The establishment and application criteria for the evaluation, selection, monitoring of performance and re- evaluation of external providers of processes, products and/or services are documented in the Supplier Approval Procedure.</li></ul><p>b)\tThe communication procedure ensures adequate communication of requirements to the external provider(s);</p><p>c)\tTo ensure that externally provided processes, products or services do not adversely affect the organization's ability to consistently meet the requirements of the FSMS verification of effectiveness is assessed via Internal Audit.</p><p>d)\tDocumented information of these activities and any necessary actions as a result of the evaluations and re-evaluations is maintained.</p><p>e)\tPerformance of external providers will be addressed during the Management Review.</p>"
    },
    {
      "title": "Competency and Awareness",
      "html": "<ul><li>Training shall be conducted in accordance with the Training Plan.</li><li>Only competent and educated staff or reputable external training organisations may provide the training.</li><li>HACCP Team members must be deemed competent to form part of the team.</li><li>Personnel responsible for food handling and monitoring are to have a background of education or experience, or a combination thereof, to provide the minimum level of competency needed to produce safe food.</li><li>Personnel responsible for monitoring and record keeping shall be able to read and write fluently to ensure competency requirements are met for the recording, monitoring and reporting activities associated with their specific tasks.</li><li>Personnel responsible for the operation of the hazard control plan will be trained and must be deemed competent in their role.</li><li>Personnel responsible for performing tasks related to CCPs, OPRPs and PRPs must be deemed competent, this applies to external providers too.</li><li>Determine the necessary competence of person(s), including external providers, doing work under the company’s control that affects the food safety performance and effectiveness of the FSMS.</li><li>Subcontractors must be deemed competent.</li><li>The requirements of each staff member shall be assessed, and refresher training presented based on the review of the effectiveness of previous training attended.</li><li>New employees attend an induction orientation that includes training on:</li><li>The Food Safety and Quality Policy</li><li>Personal Hygiene Policy</li><li>6 Step hand washing techniques</li><li>GMP/PRPs</li><li>Allergen Awareness</li><li>The importance of meeting regulatory, statutory and customer requirements</li><li>The relevance and importance of their activities and how they contribute to the achievement of the food safety and quality objectives</li><li>The requirement for effective communication by all personnel whose activities have an impact on food safety and quality.</li><li>Relevant SOPs</li><li>New staff will be introduced to their immediate managers / process leaders and taken on a tour of the facility to point out production areas, storage areas, staff facilities and designated smoking areas.</li><li>All relevant personnel, including temporary staff and contractors, shall be appropriately trained within a week of commencement of employment and adequately supervised throughout the working period.</li><li>All responsibilities, reporting channels and guidelines will be discussed; including formal training on operational procedures related to the employee’s tasks.</li><li>The induction training will be repeated for all employees at least annually and whenever management has identified the need to retrain employees.</li><li>The company shall routinely review the competencies of its staff and provide the relevant training required.</li><li>All personnel responsible for monitoring activities, corrections and corrective actions of the food safety system are trained on those specific activities and relevant procedures and must be deemed competent.</li><li>Training shall be presented in a language that is clearly understood by the trainee.</li><li>Training activities may include on-the-job training, group training, or external training courses.</li><li>Records of training shall be maintained, including detail regarding:</li><li>Reference to the training curriculum;</li><li>Name of the training provider;</li><li>Date of training;</li><li>Duration of training;</li><li>Name of the trainee attending the training course;</li><li>Signature of the trainee to confirm attendance</li><li>Competency declaration</li><li>Copies of training material / course content shall be maintained.</li><li>Confirmation of competency shall be recorded on the training plan following evaluation of the effectiveness of training.</li><li>Competency can be evaluated either through written examination, verbal confirmation, or visual inspection from the trainer or appropriate manager / supervisor.</li><li>New staff will be declared competent through practical assessment, performed by the relevant section manager / supervisor.</li><li>If the trainee was found to not yet be competent, corrective actions plans must be put in place regarding retraining and evaluation activities.</li><li>Practical assessment will be performed and only when this is successfully completed will an employee be declared competent.</li><li>All personnel are responsible for reporting issues with the FSMS.</li></ul>"
    },
