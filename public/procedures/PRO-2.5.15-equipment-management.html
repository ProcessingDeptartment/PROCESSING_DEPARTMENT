  "baselineDate": "02/10/2025",
  "sections": {
    "objective": "To ensure that all equipment used in the abalone processing facility is suitable for its intended use, meets hygienic design requirements, and is managed through a risk-based change management process when new equipment is purchased or existing equipment is modified. Applies to all production equipment including stainless steel working tables, tumblers and washing machines, cooking pots, grading machines, can filler, seamer machine, and retorts.",
    "roles": "<ul><li><b>Production Planning &amp; Continuous Improvement Manager and Factory Technician/Maintenance team:</b> ensure purchase specifications and risk assessments are completed, and manage installation and commissioning.</li><li><b>Quality Manager:</b> reviews risks to food safety and quality, updates hazard analysis and related programmes.</li><li><b>Production Supervisors:</b> ensure staff are trained on new/modified equipment and that control measures are followed.</li><li><b>Food Safety Team:</b> reviews risk assessments and approves changes prior to implementation.</li></ul>",
    "process": "<p><b>Equipment Purchase &amp; Design Requirements:</b> new equipment is ordered against documented purchase specifications covering hygienic design (accessibility, cleanability, drainability, surface finish, material compatibility), legal/customer compliance, and intended use. Suppliers must provide evidence that equipment meets specifications before installation.</p><p><b>Risk-Based Change Management:</b> any new equipment or change to existing equipment follows a documented risk assessment process: a Change Request is raised by the Continuous Improvement Manager/Maintenance or Production; the Food Safety Team evaluates whether the change affects existing or introduces new hazards, the potential for microbiological/chemical/physical contamination, and the impact on cleaning, sanitation, maintenance, environmental monitoring and allergen controls. Control measures are defined to mitigate risks (new cleaning schedule, operator training, protective barriers, new swab sites); commissioning evidence of successful installation is documented; hazard analysis, cleaning procedures, maintenance programme, training matrix, monitoring plans and records are updated as required; and no equipment is used until approved by the Quality Manager and Continuous Improvement/Production Manager.</p><p><b>Monitoring and Review:</b> equipment undergoes planned maintenance and cleaning per relevant procedures; after installation or modification, effectiveness of control measures is verified (e.g. environmental monitoring, QC checks); risks and performance are reviewed during Management Review.</p><p><b>Training:</b> staff operating or cleaning new/modified equipment receive training before use, covering hazard awareness, correct operation, cleaning methods, and reporting of issues.</p><p><b>Records:</b> purchase specifications, risk assessments, commissioning reports, training records, maintenance and cleaning schedules, and verification records.</p>",
