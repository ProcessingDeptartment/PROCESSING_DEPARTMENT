  "baselineDate": "02/10/2025",
  "sections": [
    {
      "title": "Purpose",
      "html": "<p>To ensure that all equipment used in our abalone processing facility is suitable for its intended use, meets hygienic design requirements, and is managed through a risk-based change management process when new equipment is purchased or existing equipment is modified.</p>"
    },
    {
      "title": "Scope",
      "html": "<p>This procedure applies to all production equipment used at Abagold, including:</p><ul><li>Stainless steel working tables</li><li>Tumblers and washing machines</li><li>Stainless steel cooking pots</li><li>Grading machines</li><li>Can filler</li><li>Seamer machine</li><li>Retorts</li></ul>"
    },
    {
      "title": "Responsibility",
      "html": "<ul><li>Production Planning &amp; Continuous Improvement Manager along with Factory Technician/Maintenance team: Ensures purchase specifications and risk assessments are completed, manages installation and commissioning.</li><li>Quality Manager: Reviews risks to food safety and quality, updates hazard analysis and related programmes.</li><li>Production Supervisors: Ensure staff are trained on new/modified equipment and that control measures are followed.</li><li>Food Safety Team: Reviews risk assessments and approves changes prior to implementation.</li></ul>"
    },
    {
      "title": "Equipment Purchase & Design Requirements",
      "html": "<p>All new equipment must be ordered against documented purchase specifications that cover:</p><ul><li>Hygienic design (accessibility, cleanability, drainability, surface finish, material compatibility).</li><li>Compliance with legal and customer requirements.</li><li>Intended use (e.g., shucking table, cooking pot, can seamer).</li></ul><p>Suppliers must provide evidence that equipment meets specifications prior to installation.</p>"
    },
    {
      "title": "Risk-Based Change Management",
      "html": "<p>Any new equipment, or change to existing equipment, must follow a documented risk assessment process:</p><ul><li>Change Request: Raised by Continuous Improvement Manager/ Maintenance or Production.</li><li>Risk Assessment: Food Safety Team evaluates:</li><li>Whether the change affects existing hazards or introduces new hazards.</li><li>Potential for microbiological, chemical, or physical contamination.</li><li>Impact on cleaning, sanitation, maintenance, environmental monitoring, and allergen controls.</li><li>Control Measures: Define actions to mitigate risks (e.g., new cleaning schedule, operator training, protective barriers, new swab sites).</li><li>Commissioning: Evidence of successful installation and commissioning must be documented.</li><li>Updates Required: Hazard analysis, cleaning procedures, maintenance programme, training matrix, monitoring plans, and records must all be updated as required.</li><li>Approval: No equipment may be used until approved by the Quality Manager and Continuous Improvement Manager/ Production Manager.</li></ul>"
    },
    {
      "title": "Monitoring and review",
      "html": "<ul><li>Equipment shall be subject to planned maintenance and cleaning as per relevant procedures.</li><li>After installation or modification, effectiveness of control measures shall be verified (e.g., environmental monitoring, QC checks).</li><li>Risks and performance are reviewed during Management Review.</li></ul>"
    },
    {
      "title": "Training",
      "html": "<ul><li>Staff operating or cleaning new/modified equipment must receive training before use.</li><li>Training will include hazard awareness, correct operation, cleaning methods, and reporting of issues.</li></ul>"
    },
    {
      "title": "Records",
      "html": "<ul><li>Purchase specifications</li><li>Risk assessments</li><li>Commissioning reports</li><li>Training records</li><li>Maintenance and cleaning schedules</li><li>Verification records</li></ul>"
    },
