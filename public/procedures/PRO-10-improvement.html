    {
      "title": "Purpose",
      "html": "<p>To define the measures and activities that are established to ensure continuous improvement of the suitability, adequacy and effectiveness of the Food Safety Management System.</p>"
    },
    {
      "title": "Responsibility",
      "html": "<p>Top management needs to drive continual improvement.</p><p>The Food Safety Team considers the necessity to review the Hazard Analysis, the established PRPs and the Hazard Control Plan.</p>"
    },
    {
      "title": "Nonconformity and corrective action",
      "html": "<p>When nonconformity occurs, the organization shall:</p><ul><li>React to the nonconformity and, as applicable:</li><li>Take action to control and correct it;</li><li>Deal with the consequences;</li><li>Evaluate the need for action to eliminate the causes of the nonconformity, in order that it does nt recur or occur elsewhere, by:</li><li>Reviewing the nonconformity;</li><li>Determining the causes of the nonconformity;</li><li>Determining if similar nonconformities exist, or could potentially occur;</li><li>Implement any action needed;</li><li>Review the effectiveness of any corrective action taken;</li><li>Make changes to the FSMS, if necessary.</li></ul><p>Corrective actions shall be appropriate to the effects of the nonconformities encountered.</p><p>The organization shall retail documented information as evidence of:</p><ul><li>The nature of the nonconformities and subsequent actions taken;</li><li>The results of any corrective action.</li></ul>"
    },
    {
      "title": "Continual improvement",
      "html": "<p>The organisation shall continuously improve the suitability, adequacy and effectiveness of the Food Safety Management System.</p><p>Top management ensures that the company continually improves the effectiveness of the FSMS through the use of communication, management reviews, internal audits, analysis of results of verification activities, validation of control measure(s) and combinations of control measures, corrective actions and food safety management system planning and updating.</p>"
    },
    {
      "title": "Update of the food safety management system",
      "html": "<p>Top management ensures that the FSMS is continually updated. Therefore the Food Safety Team will evaluate the FSMS at planned intervals. Thereafter the team will consider whether it is necessary to review the hazard analysis, the hazard control plan and the PRPs.</p><p>Evaluation and improvement/ update is based on:</p><ul><li>Input from communication (both internal and external)</li><li>Input from other information concerning the suitability, adequacy and effectiveness of the FSMS</li><li>Output from analysis of results of verification activities (audits, laboratory results, scale verification)</li><li>Output from management reviews</li><li>Customer complaints and Recall / Withdrawals</li><li>Output from internal and external audits</li><li>Corrective &amp; preventative actions relating to non-conforming products</li><li>Trending results</li></ul><p>Information from evaluation activities is documented appropriately and reported as input to the management review and to direct or amend the measurable objectives and targets as described in the Food Safety Policy.</p>"
    },
    {
      "title": "Review",
      "html": "<p>This procedure is reviewed on an annual basis to ensure compliance with food safety standards, customer as well as legislative requirements.</p>"
    },
