    "objective": "To define the measures and activities established to ensure continuous improvement of the suitability, adequacy and effectiveness of the Food Safety Management System.",
    "roles": "<ul><li>Top management drives continual improvement.</li><li>The Food Safety Team considers the necessity to review the Hazard Analysis, established PRPs and the Hazard Control Plan.</li></ul>",
    "process": "<p><b>Nonconformity and Corrective Action:</b> when nonconformity occurs, the organisation reacts to it by taking action to control and correct it, dealing with the consequences, and evaluating the need for action to eliminate the causes so it does not recur or occur elsewhere — by reviewing the nonconformity, determining its causes, determining if similar nonconformities exist or could occur, implementing needed action, reviewing the effectiveness of corrective action taken, and making changes to the FSMS if necessary. Corrective actions are appropriate to the effects of the nonconformities encountered. The organisation retains documented information on the nature of nonconformities and subsequent actions, and the results of corrective action.</p><p><b>Continual Improvement:</b> the organisation continuously improves the suitability, adequacy and effectiveness of the FSMS. Top management ensures the company continually improves FSMS effectiveness through communication, management reviews, internal audits, analysis of verification results, validation of control measures, corrective actions, and FSMS planning and updating.</p><p><b>Update of the FSMS:</b> the Food Safety Team evaluates the FSMS at planned intervals and considers whether it is necessary to review the hazard analysis, hazard control plan and PRPs, based on input from internal/external communication, other suitability/adequacy/effectiveness information, verification result analysis, management review output, customer complaints and recalls/withdrawals, internal/external audit output, corrective/preventive actions on non-conforming products, and trending results. Evaluation information is documented and reported as input to management review, and used to direct or amend measurable objectives and targets described in the Food Safety Policy.</p>",
    "review": "This procedure is reviewed on an annual basis to ensure compliance with food safety standards, customer as well as legislative requirements."
