  "sections": [
    {
      "title": "Purpose",
      "html": "<ul><li>This procedure outlines the process for providing evidence that monitoring and measuring methods and equipment are suitable and capable of ensuring the performance of the measuring and monitoring activities related to the PRP(s) and the Hazard Control Plan.</li></ul>"
    },
    {
      "title": "Responsibilities",
      "html": "<ul><li>The company must list all monitoring and measuring equipment related to monitoring of food safety and quality parameters.</li><li>Equipment shall be readable and be of a suitable accuracy for the measurements it is required to perform.</li><li>Measuring and monitoring devices used to monitor food safety and quality parameters shall be listed on an Equipment Register.</li><li>All measuring and monitoring devices shall be calibrated according to a schedule to ensure accuracy of results.</li><li>Measuring and monitoring devices shall be regularly verified for accuracy.</li></ul>"
    },
    {
      "title": "Instructions",
      "html": "<ul><li>Where necessary to ensure valid results, the measuring equipment and methods used:</li><li>Shall be calibrated or verified at specified intervals prior to use, against measurement standards traceable to international or national measurement standards;</li><li>Shall be adjusted or re-adjusted as necessary;</li><li>Shall be identified to enable the calibration status to be determined;</li><li>Shall be safeguarded from adjustments that would invalidate the measurement results; and</li><li>Shall be protected from damage and deterioration.</li><li>Before new measuring equipment is put into use, an initial verification is done and documented. Only equipment that passes the verification will be put into use.</li><li>Equipment is handled, preserved and stored in a manner that protects its accuracy and fitness for use.</li><li>If the measuring equipment is non-conforming, the company shall act appropriate for the equipment and any product affected.</li><li>The company must assess the validity of previous measurement results when the equipment or process is found not to conform to specified requirements.</li><li>Records of such assessment and resulting corrective actions shall be recorded on the Corrective Action Request form.</li></ul>"
    },
    {
      "title": "Maintenance and Calibration of measuring equipment",
      "html": "<ul><li>All equipment is handled, preserved and stored in a manner that protects its accuracy and fitness for use.</li><li>Calibrations are performed against certified equipment having a known valid relationship to internationally or nationally recognized standards. Where no such standard exists, the basis used for calibration is documented.</li><li>All maintenance and calibration of measuring equipment shall be documented.</li><li>The calibration status of equipment is clearly labeled on the equipment, stating the date of the most recent calibration.</li><li>The date of next calibration is recorded on the Equipment Register.</li><li>A label stating, “Out of Service” indicates that the equipment is not in use. The reason that the equipment is out of service is indicated on the Equipment Register.</li><li>Where test software is used as a form of inspection, it is checked to prove it can verify the acceptability of product or the monitoring required prior to its release for use during production. It will be listed on the equipment list and checked at prescribed intervals.</li><li>Whenever there are changes, including software configuration/modifications to commercial off-the-shelf software, they shall be authorized, documented and validated before implementation.</li></ul>"
    },
    {
