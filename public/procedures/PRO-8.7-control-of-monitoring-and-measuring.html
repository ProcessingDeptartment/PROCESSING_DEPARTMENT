  "sections": {
    "objective": "To outline the process for providing evidence that monitoring and measuring methods and equipment are suitable and capable of ensuring the performance of monitoring activities related to the PRP(s) and the Hazard Control Plan.",
    "roles": "<ul><li>The company lists all monitoring and measuring equipment related to food safety and quality parameters on an Equipment Register.</li><li>Equipment must be readable and of suitable accuracy for the measurements required, and calibrated according to a schedule.</li></ul>",
    "process": "<p>Where necessary to ensure valid results, measuring equipment and methods are calibrated or verified at specified intervals prior to use, against measurement standards traceable to international/national standards; adjusted as necessary; identified to enable calibration status to be determined; safeguarded from adjustments that would invalidate results; and protected from damage and deterioration. New measuring equipment undergoes initial verification before use — only equipment that passes is put into use. Equipment is handled, preserved and stored to protect its accuracy. If measuring equipment is found non-conforming, the company assesses the validity of previous measurement results and takes appropriate corrective action, recorded on the Corrective Action Request form.</p><p><b>Maintenance and Calibration:</b> equipment is calibrated against certified equipment with known valid relationship to internationally/nationally recognised standards (or the documented basis where none exists). All maintenance and calibration is documented; calibration status is labelled on the equipment with the date of most recent calibration, and the date of next calibration is recorded on the Equipment Register. Equipment out of service is labelled \"Out of Service\" with the reason recorded on the Equipment Register. Test software used as a form of inspection is checked to verify it can confirm product acceptability prior to release for use in production, and is listed and checked at prescribed intervals; changes to software configuration are authorised, documented and validated before implementation.</p>",
    "review": "This procedure is reviewed periodically as part of the FSMS document review cycle."
