  "sections": {
    "objective": "To describe the process for controlling records and Food Safety System documents, ensuring the correct and most current documents are in use, tracking changes made to documents, and setting a standard for archiving.",
    "roles": "<ul><li>Management assigns authors to documents.</li><li>The author writes the document, creates related forms, specifies a unique document number, and submits it to the department manager for review.</li><li>Department managers approve documents for their area of responsibility.</li><li>The Document Control Coordinator (QA Manager) assigns document revision numbers, maintains and updates documents, stores new/revised documents on the network, distributes hard copies, and revises documents.</li><li>All employees review documents as they use them and submit document change requests as necessary.</li><li>Production management maintains software programs that control equipment.</li></ul>",
    "process": "<p><b>Document Creation and Updating:</b> when a document/record need is identified, management assigns an author; the author writes the document and prepares related forms. All documents are in English and available in hard and soft copy, generated electronically, comprising the Food Safety System Manual, Procedures, Work Instructions, Attachments, Records and References.</p><p><b>Approval:</b> the author submits documents to the department manager for review and approval. The Document Control Coordinator inserts the approver’s name into electronic copies when posting to the network; documents are password protected against unintended or unauthorised changes.</p><p><b>Document Identification and Distribution:</b> documents contain the company logo, document name, a unique document reference number, current revision number, page number, prepared/reviewed-by and approval-by details, effective date, review date and approval for distribution. Procedures, work instructions and attachments are numbered referencing the ISO 22000 clause where possible, with a prefix indicating HACCP, procedural, policy or PRP/OPRP/CCP monitoring status; records are numbered per the flow of procedures. The current revision level and change date are recorded under Change Notification on the last page of each document. Documents of external origin are listed on the External Document List (REC 02).</p><p><b>Control of Documented Information:</b> copies are available to authorised staff and workstations. Approved documents are entered on the Master Document Index List (REC 01); original-signature copies are the “Master” copies kept in the Master Food Safety System Manual file. The Document Control Coordinator posts new/revised documents on the network and distributes hard copies per the Master Index List, listing retrieval of old versions and distribution of revised ones. Documents/records may only be printed from the approved FINAL record folder; a document without an approver’s name is an unauthorised copy.</p><p><b>Control of Records:</b> access is limited to employees and authorised visitors; all employees have access to records they need. Records are readily retrievable via the Master Index List (REC 01) and stored to prevent damage, deterioration or loss. Retention period is at least the declared shelf life plus six months for manufactured products — minimum 5 years for canned abalone, 10 years for dried abalone, and at least 1 year for live abalone. Records past retention are archived on the company’s premises.</p><p><b>Change to Documents and Records:</b> documents are reviewed during regular use and internal audits and updated electronically as necessary. Amended documents are approved by management prior to release, indicated by adding the approver’s name. All reasons for previous and current change to Policies, Procedures and HACCP documents are indicated on the document’s last page; for Records, Work Instructions and schematic diagrams, reasons are indicated on the Master Document Index List (REC 01). Revisions go through the same approval, identification and distribution steps, and are approved by an individual in the same function that performed the original review.</p><p><b>Obsolete Document Disposition:</b> superseded documents are withdrawn on issue of the new revision. Obsolete documents (except Records) are retained electronically in an “Archive/Obsolete” folder. Only the most updated version of records is kept electronically; obsolete records are saved in an “Obsolete” folder with an “Obsolete/Do not copy” watermark.</p><p><b>Control of Data:</b> no correction fluid is used on completed records — corrections are indicated in ink with a signature. Electronic and hard copies are kept of each document; the electronic version backs up the hard copy and is regularly backed up. Access to electronic documents is limited to staff with the necessary computer passwords.</p>",
