  "area": "Support",
  "startRev": 8,
  "baselineDate": "30/09/2024",
  "sections": [
    {
      "title": "Purpose",
      "html": "<ul><li>This procedure describes the process for controlling records and Food Safety Systems documents to ensure that the correct and most current documents are in use, to keep track of changes made to documents and to set a standard for archiving of documents.</li></ul>"
    },
    {
      "title": "Responsibilities",
      "html": "<ul><li>Management is responsible for assigning authors to documents.</li><li>The author is responsible for writing the document, creating related forms, specifying a unique document number, and submitting the document to the department manager for review.</li><li>Department managers are responsible for approving documents for their area of responsibility.</li><li>The document control coordinator (QA Manager) is responsible for assigning document revision numbers, maintaining the updating of documents, storing new and revised documents on the network, distributing hard copies of documents and revising documents.</li><li>All employees are responsible for reviewing the documents as they use them and submitting document change requests to update documents, as necessary.</li><li>Production management is responsible for maintaining software programs that control equipment.</li><li>Records are to be completed for every identified PRP, oPRP and CCP to demonstrate effective implementation and monitoring of activities by trained operators.</li><li>Records completed on site will be reviewed by management.</li><li>Management will ensure that employees are informed of changes to documents through the document control coordinator and review of training programs.</li></ul>"
    },
    {
      "title": "Definitions",
      "html": "<p><b>Master Document: Is the only document from which authorized copies may be made under the control of the Factory Manager / Document Controller.</b></p><ul><li>Procedure: Document outlining specific work processes and how the requirements of the FSSC standard are being met.</li><li>Work Instructions: Step by step directions on how a task should be done.</li><li>Records: Completed forms or information generated as a result of the process described in a document and retained as indicated in the control of Quality Records Procedure.</li><li>References (reference in index): External documents or sources used in preparing documentation or completing work.</li></ul>"
    },
    {
      "title": "Controls",
      "html": "<ul><li>The document and record control procedure are required to:</li><li>Approve documents for adequacy prior to use</li><li>Review and update documents as necessary and re-approve documents</li><li>Ensure that changes and the current revision status of documents are identified</li><li>Ensure that relevant versions of applicable documents are available at points of use</li><li>Ensure that relevant documents of external origin are identified, and their distribution controlled</li><li>Prevent the unintended use of obsolete documents and to ensure that they are suitably identified as such if they are to be retained.</li><li>Provide evidence of conformity to requirements and evidence of the effective operation of the Food Safety System</li><li>Ensure records are legible, readily identifiable, and retrievable</li><li>Define the controls needed for the identification, storage, protection, retrieval, retention, and disposition of records.</li></ul>"
    },
    {
      "title": "General",
      "html": "<ul><li>Abagold’s FSMS shall include:</li><li>Documented information required by this document;</li><li>Documented information determined by the organization as being necessary for the effectiveness of the FSMS;</li><li>Documented information and food safety requirements required by statutory, regulatory authorities and customers.</li></ul>"
    },
    {
      "title": "Document Creation and Updating",
      "html": "<ul><li>When the need for a document or record is identified, management will assign an author for the document. Any employee or approved consultant may be assigned as an author for documents in their area of expertise.</li><li>The author writes the document and prepares related forms.</li><li>All documents will be in English and copies will be available in both hard - and soft copy.</li><li>All documents are generated electronically and will include:</li><li>The Food Safety System Manual</li><li>Procedures</li><li>Work Instructions</li><li>Attachments</li><li>Records</li><li>References</li></ul>"
    },
    {
      "title": "Approval",
      "html": "<ul><li>The author submits the documents to the department manager for review and approval for suitability and adequacy.</li><li>The Document Control Coordinator inserts the approver’s name and surname into the electronic copies when posting approved documents to the network, the document shall be password protected to avoid unintended or unauthorized changes to the document.</li></ul>"
    },
    {
      "title": "Document Identification and Distribution",
      "html": "<ul><li>All documents will contain the following identification and description information:</li><li>Company logo</li><li>Document name</li><li>A unique document reference number</li><li>Current Revision number</li><li>Page number</li><li>Prepared/reviewed by details</li><li>Approval by details</li><li>Effective date</li><li>Review date</li><li>Approval for distribution</li></ul>"
    },
    {
      "title": "Document numbering",
      "html": "<ul><li>Procedures, work instructions, and attachments are numbered using a number scheme that reference the clause of the ISO 22000 standard as far as possible, including a prefix to indicate if the document is related to the HACCP principles, a procedural document, policy or monitoring of a PRP, oPRP or CCP.</li><li>Records are numbered according to the flow of procedures.</li><li>The most current revision level and date of change is recorded under change of notification on last page of each document.</li><li>Documents of External Origin and other References are listed on external document list (REC02).</li></ul>"
    },
    {
      "title": "Control of documented information",
      "html": "<ul><li>Copies of documents shall be available to authorised staff and workstations.</li><li>Approved documents are submitted to the Document Control Coordinator and entered on the Master Document Index List (REC01).</li><li>Approved documents containing original signatures are the “Master” copies and are kept in the Master Food Safety System Manual file.</li><li>The Document Control Coordinator posts new and revised documents on the network and distributes hard copies to points of use according to the Master Index List.</li><li>Hard copies are controlled by listing the retrieval of the old version and the distribution of the revised document on the Master Document Index List (REC01).</li><li>Documents and records issued are only allowed to be printed from the approved documents under the FINAL record folder.</li><li>A document without an approver’s name will be classified as an unauthorized copy.</li><li>Documented information of external origin determined by the organization to be necessary for the planning and operation of the FSMS shall be identified, as appropriate, and controlled.</li></ul>"
    },
    {
      "title": "Control of records",
      "html": "<ul><li>Access to documents and records is limited to employees and authorized visitors.</li><li>All employees have access to the quality records that they need for carrying out responsibilities.</li><li>Records are readily retrievable by referring to the Master Index List (REC01).</li><li>Records are stored in such a way to prevent damage, deterioration, or loss. Records may be stored in files, drawers, boxes, or other designated storage compartments.</li><li>Retention period of records is equivalent to at least the declared shelf life + six (6) months of manufactured products canned abalone, dried abalone, and live abalone. These are set at a minimum of 5, 10 respectively and at least 1 year for live abalone.</li><li>Records that have passed the retention period will be stored in archive on the company’s premises.</li></ul>"
    },
    {
      "title": "Change to documents and records",
      "html": "<ul><li>Documents are reviewed during regular use and during internal audits. Documents are updated electronically as found necessary during these reviews.</li><li>Amended documents will be approved by management prior to release. Approval will be indicated by the addition of the approver’s name to the revised document.</li><li>Revisions on Policies; Procedures and HACCP documents, all the reasons for previous and current change to documents shall be indicated on the last page of the document.</li><li>Revisions on records, Work instructions and schematic diagrams, all the reasons for change or review shall be indicated on the Master Document Index List (REC01).</li><li>Revisions to documents go through the preceding document approval, identification, and distribution steps. Document changes are approved by an individual in the same function that performed the original review and signed the original document indicating approval.</li></ul>"
    },
    {
      "title": "Obsolete Document Disposition",
      "html": "<ul><li>Documents replaced by new revisions will be withdrawn when issuing the new, revised document.</li><li>Obsolete documents (except Records) are retained electronically and moved to an ‘’Archive/Obsolete’’ electronic folder by the document control coordinator.</li><li>To avoid confusion and the potential of using outdated records, only the most updated version of records will be kept electronically. Only when a record is no longer in use will it be saved in an “Obsolete” folder and the record will have an “Obsolete/Do not copy” watermark.</li></ul>"
    },
    {
      "title": "Control of data",
      "html": "<ul><li>No correction fluid is allowed to be used on any records completed by staff. All corrections are to be indicated in ink, including a signature to indicate authorization of the amendment made by the operator.</li><li>An electronic as well as a hard copy is kept of each document.</li><li>The electronic version is the back up for the hard copy; the electronic versions are backed up regularly.</li><li>Access to the electronic documents is limited to staff with the necessary passwords on the computer.</li></ul>"
    },
    {
      "title": "Related Documents",
      "html": "<ul><li>REC 01 - Master index list</li><li>REC 02 – External document list</li></ul>"
    }
