  "sections": {
    "objective": "This document analyses the external and internal issues relevant to Abagold’s purpose and strategic direction that may affect the FSMS’s ability to achieve its intended results. It maps interested parties and issues to a Priority × Relevance “Power” score (1–16) so that the most significant risks and opportunities are prioritised for action, feeding directly into the Risk and Opportunity Register (PRO 6.1.1) and Interested Party Analysis (PRO 4.2).",
    "roles": "<ul><li>Top Management is responsible for reviewing and approving the Context of the Organisation Analysis.</li><li>The Quality Assurance Manager prepares and maintains the analysis and proposes actions.</li><li>Department Managers provide input on issues and risks/opportunities relevant to their areas.</li></ul>",
    "process": "<p>Each issue is scored for Priority (effect on decisions, 1–4) and Relevance (effect on activity, 1–4); Priority × Relevance gives a Power score used to prioritise action. Issues are grouped by category, each with identified risks/opportunities, causes, associated interested parties and proposed actions. Categories analysed include:</p><ul><li><b>Legal Compliance:</b> legislative change, market access barriers — mitigated by newsletter subscriptions, government gazette monitoring, and maintaining the external document/legislation register.</li><li><b>Technological:</b> R&amp;D and AI tools in food safety management, cyber-attack/data corruption risk, electronic access control — mitigated by anti-virus, IT support, backups, two-step verification.</li><li><b>Competitive &amp; Market:</b> pricing, competition from other SA farms, demand shifts, brand risk, market intelligence gaps — mitigated by customer relationships, market research, diversification, NPD investment.</li><li><b>Cultural:</b> food safety and quality culture, loss of key management personnel, staff training and motivation, labour relations — mitigated by succession/retention plans, internal audit, communication and training programmes.</li><li><b>Social:</b> crime and security risk, community unrest — mitigated by 24-hour security monitoring, access control, CCTV, community leader engagement, the Critical Event Management Plan (CEMAP).</li><li><b>Economy:</b> currency and input cost exposure — mitigated by FEC cover, business plan review, cost-cutting measures, supplier relationship management.</li><li><b>Climate Change:</b> rising sea temperature and water quality affecting abalone growth and food safety — mitigated by water monitoring, treatment and filtration.</li><li><b>Contamination / Food Fraud / Food Defence:</b> supplier control, staff sabotage risk, IP theft — mitigated by supplier evaluation, food fraud/food defence programmes, password controls.</li><li><b>Organisational Knowledge, Political and BBBEE:</b> industry growth and development, regulatory/BBBEE compliance — mitigated by training, upskilling and preferential procurement programmes.</li><li><b>Quality and Food Safety:</b> export rejection risk, yield variability — mitigated by GMP/HACCP/FSSC compliance, NRCS inspection sign-off, quality control and CAR management.</li><li><b>Emergency Preparedness, Health &amp; Safety, Environmental, Process Performance, Buildings &amp; Equipment, and Suppliers/Materials/Chemicals:</b> each assessed with specific risks (e.g. red tide, injury, algal blooms, equipment breakdown, supplier reliability) and corresponding mitigations (water quality monitoring, H&amp;S committee and toolbox talks, maintenance plans, supplier evaluation).</li></ul><p>The full scored register of individual issues, causes, interested parties and proposed actions is maintained in the Context of the Organisation Analysis working document and feeds the Risk and Opportunity Register (PRO 6.1.1).</p>",
    "review": "This analysis is reviewed at least annually, and following Management Review, to ensure it continues to reflect the organisation’s external and internal context."
