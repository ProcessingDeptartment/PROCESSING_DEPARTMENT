    {
      "title": "1. Purpose",
      "html": "<p>This document analyses the external and internal issues relevant to Abagold&rsquo;s purpose and strategic direction that may affect the FSMS&rsquo;s ability to achieve its intended results. Interested Parties are those stakeholders who receive our products, who may be impacted by them, or who otherwise have a significant interest in our organisation. This information underpins our organisation&rsquo;s policies and provides a road map to achieve future goals, feeding directly into the Risk and Opportunity Register (PRO 6.1.1) and Interested Party Analysis (PRO 4.2).</p>"
    },
