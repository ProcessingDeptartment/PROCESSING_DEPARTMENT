  "baselineDate": "19/12/2025",
  "sections": [
    {
      "title": "1. Purpose",
      "html": "<p>To ensure that all raw material, packaging, ingredient, finished product, and service specifications are controlled, current, accurate, and formally agreed with relevant parties.</p>"
    },
    {
      "title": "2. Scope",
      "html": "<p>This procedure applies to:</p><ul><li>Raw materials (including abalone, ingredients, additives)</li><li>Packaging materials (cans, lids, labels, cartons, plastics)</li><li>Finished product specifications (canned, dried, live abalone)</li><li>External services that impact food safety and quality (laboratories, pest control, logistics providers)</li></ul>"
    },
    {
      "title": "3. Responsibilities",
      "html": "<ul><li>Quality Manager – ensures specifications are created, reviewed, updated, and approved.</li><li>Procurement Manager – obtains supplier specifications and confirms compliance.</li><li>Food Safety Team – reviews specifications for food safety/quality risks.</li><li>Production Supervisors – implement changes in operations when specifications are updated.</li></ul>"
    },
    {
      "title": "4. Specification Review Requirements",
      "html": "<ul><li>Routine Review Frequency: All specifications must be reviewed at least every 3 years or sooner if required.</li><li>Triggers for Immediate Review:</li><li>Change in product, formulation, ingredient, packaging, or supplier.</li><li>Process changes that affect product characteristics.</li><li>Updates in legislation, regulatory requirements, or customer requirements.</li><li>Non-conformities, complaints, or audit findings linked to specifications.</li><li>Reviews are conducted during Food Safety Team meetings, with outcomes recorded in minutes.</li><li>Specifications to be cross reviewed alongside the End Product Characteristics (HACCP 8.5.1.3) to ensure consistency across documentation.</li></ul>"
    },
    {
      "title": "5. Approval & Change Control",
      "html": "<ul><li>Specifications must be formally approved by the Quality Manager and the Processing Manager.</li><li>Changes are version-controlled, with previous versions archived.</li><li>Updated specifications must be communicated to:</li><li>Internal staff (via training, noticeboards, updated SOPs).</li><li>External parties (suppliers, customers, service providers) as applicable.</li></ul>"
    },
    {
      "title": "6. Communication & Training",
      "html": "<ul><li>All relevant employees must be trained on specification changes before implementation.</li><li>Customers and suppliers must acknowledge updated specifications in writing (email confirmation, signed agreement, or electronic system confirmation).</li></ul>"
    },
    {
      "title": "7. Records",
      "html": "<ul><li>Specification documents (raw materials, packaging, finished products, services).</li><li>Review records (meeting minutes, review checklists).</li><li>Approval signatures.</li><li>Change notification log.</li><li>Communication/training records.</li></ul>"
    },
    {
      "title": "8. Related Documents",
      "html": "<ul><li>PRO 7.4 Communication</li><li>PRO 7.0 Resource Support, Competency &amp; Awareness</li><li>PRO 8.2.7 Management of Suppliers and Services</li><li>POL 5.2 Food Safety and Quality Policy</li></ul>"
