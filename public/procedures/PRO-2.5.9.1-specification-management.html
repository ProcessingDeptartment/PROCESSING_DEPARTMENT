  "startRev": 2,
  "baselineDate": "19/12/2025",
  "sections": {
    "objective": "To ensure that all raw material, packaging, ingredient, finished product, and service specifications are controlled, current, accurate, and formally agreed with relevant parties. Applies to raw materials (including abalone, ingredients, additives), packaging materials (cans, lids, labels, cartons, plastics), finished product specifications (canned, dried, live abalone), and external services impacting food safety and quality (laboratories, pest control, logistics providers).",
    "roles": "<ul><li><b>Quality Manager:</b> ensures specifications are created, reviewed, updated and approved.</li><li><b>Procurement Manager:</b> obtains supplier specifications and confirms compliance.</li><li><b>Food Safety Team:</b> reviews specifications for food safety/quality risks.</li><li><b>Production Supervisors:</b> implement operational changes when specifications are updated.</li></ul>",
    "process": "<p><b>Review Requirements:</b> all specifications are reviewed at least every 3 years, or sooner when triggered by a change in product, formulation, ingredient, packaging or supplier; process changes affecting product characteristics; updates in legislation, regulatory or customer requirements; or non-conformities, complaints or audit findings linked to specifications. Reviews are conducted during Food Safety Team meetings, with outcomes recorded in minutes. Specifications are cross-reviewed alongside the End Product Characteristics (HACCP 8.5.1.3) to ensure consistency across documentation.</p><p><b>Approval &amp; Change Control:</b> specifications are formally approved by the Quality Manager and Processing Manager; changes are version-controlled with previous versions archived. Updated specifications are communicated internally (training, noticeboards, updated SOPs) and externally to suppliers, customers and service providers as applicable.</p><p><b>Communication &amp; Training:</b> all relevant employees are trained on specification changes before implementation; customers and suppliers must acknowledge updated specifications in writing (email confirmation, signed agreement, or electronic system confirmation).</p>",
    "review": "Specifications are reviewed at least every 3 years or sooner when triggered, with outcomes recorded at Food Safety Team meetings."
  },
