      "title": "Management System Planning: Addressing Risks & Opportunities",
      "html": "<p>For our organization to have a successful food safety management system, we consider and manage the risks and opportunities relating to our stakeholders, and our external and internal context. This process uses the information retained from our context and strategy evaluations and stakeholder and interested party analysis.</p><p>Risk and opportunity management is undertaken as part of the organization day-to-day operations to capture and react to perceived risk and opportunity, ensuring each issue is managed at the most appropriate level within our organization.</p><p>The aim of risk and opportunity management within the organization is to ensure that organizational capabilities and resources are employed in an efficient and effective manner to take advantage of opportunities and to mitigate risk to:</p><ul><li>Strategic direction and business planning (4.1).</li><li>Interested parties (4.2)</li><li>Management system and processes (4.3).</li><li>Products (8.1).</li><li>Suppliers (8.4</li></ul><p>The organization considers and manages the risks and opportunities relating to our stakeholders, our external and internal context, and ultimately the Food Safety Management System.</p><p>This process uses the information collected during context and strategy evaluations, context and interested party analysis, and from the evaluation of food safety standard aspects.</p><p>All risk and opportunity management activities and related decisions are recorded in the Risk and Opportunities Register as well as addressed in Management Review Minutes.</p><p>Top management are responsible for incorporating risk-based thinking into our organization culture. This includes the establishment of risk management procedures and processes to ensure the effective risk and opportunity management principles are undertaken throughout the lifecycle of our management system, products, services and activities by:</p><p>-  \tProviding sufficient resources to carry out risk and opportunity management activities.</p><p>- \tAssigning responsibilities and authorities for risk and opportunity management activities.</p><p>- \tReviewing information and results from audits and risk and opportunity management activities</p>"
