    "objective": "For the organisation to have a successful food safety management system, Abagold considers and manages the risks and opportunities relating to its stakeholders and its external and internal context, using information from context and strategy evaluations and stakeholder/interested party analysis.",
    "roles": "<ul><li>Top management is responsible for incorporating risk-based thinking into the organisation’s culture, including establishing risk management procedures and processes.</li><li>Top management provides sufficient resources to carry out risk and opportunity management activities, assigns responsibilities and authorities, and reviews information and results from audits and risk and opportunity management activities.</li></ul>",
    "process": "<p>Risk and opportunity management is undertaken as part of day-to-day operations to capture and react to perceived risk and opportunity, ensuring each issue is managed at the most appropriate level within the organisation. The aim is to ensure organisational capabilities and resources are employed efficiently and effectively to take advantage of opportunities and mitigate risk to:</p><ul><li>Strategic direction and business planning (PRO 4.1)</li><li>Interested parties (PRO 4.2)</li><li>Management system and processes (PRO 4.3)</li><li>Products (PRO 8.1)</li><li>Suppliers</li></ul><p>This process uses information collected during context and strategy evaluations, context and interested party analysis, and evaluation of food safety standard aspects. All risk and opportunity management activities and related decisions are recorded in the Risk and Opportunities Register and addressed in Management Review Minutes.</p>",
