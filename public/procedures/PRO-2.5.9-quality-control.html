  "sections": [
    {
      "title": "Purpose",
      "html": "<p>This procedure ensures that Abagold consistently produces abalone products that meet defined quality parameters, in line with finished product specifications and FSSC 22000 v6 (section 2.5.9). Quality control is critical to maintaining product integrity, consumer satisfaction, and compliance with legal and customer requirements.</p>"
    },
    {
      "title": "Scope",
      "html": "<p>This procedure applies to all abalone products processed at this facility: canned, dried, and live abalone.</p>"
    },
    {
      "title": "Responsibility",
      "html": "<ul><li>Quality Manager: Oversees the quality control programme, ensures compliance, reviews results, and approves corrective actions.</li><li>Quality Controllers: Carry out inspections, sampling, testing, and record results.</li><li>Production Supervisors: Ensure corrective actions are implemented when out-of-spec results occur.</li></ul>"
    },
    {
      "title": "Quality Parameters",
      "html": "<p>4.1 Canned Abalone</p><p>Each batch of canned abalone shall be tested for the following quality parameters:</p><ul><li>pH – measured using calibrated pH meter.</li><li>Salt % – measured using calibrated salt meter.</li><li>Brix % – measured using calibrated refractometer.</li><li>Texture – firmness test using standard texture analysis.</li><li>Size – weight and grading verification.</li><li>Visual inspection – colour, defects, fill level, sealing integrity.</li><li>Sensory inspection – taste and odour evaluation by trained panel.</li></ul><p>4.2 Dried Abalone</p><p>Each lot of dried abalone shall be assessed for:</p><ul><li>Visual inspection – general appearance, absence of mould, foreign matter, or defects.</li><li>Size – conformity to grading standards.</li><li>Colour – uniformity and compliance with product specification.</li><li>Texture – firmness and dryness level.</li></ul><p>4.3 Live Abalone</p><p>Each consignment of live abalone shall be inspected for:</p><ul><li>Visual inspection of shell condition – cracks, damage, abnormalities.</li><li>Shell colour – in line with specification and market expectation.</li><li>General vitality – live product must be active and healthy in holding tanks.</li></ul>"
    },
    {
      "title": "Monitoring and Frequency",
      "html": "<ul><li>QC checks are performed per batch before product release.</li><li>Sampling and testing methods are defined in work instructions.</li><li>Frequency: Minimum per production run; additional tests as required by customer specifications or regulatory requirements.</li></ul>"
    },
    {
      "title": "Records and Documentation",
      "html": "<ul><li>Results are documented in QC report REC 7.2.11 and signed by the responsible technician.</li><li>Out-of-specification (OOS) results are escalated to the Quality Manager.</li><li>Non-conformities trigger corrective actions in accordance with the Corrective Action Procedure stated in PRO 8.9 Control of Product and Process Nonconformities</li></ul>"
    },
    {
      "title": "Review and Continuous Improvement",
      "html": "<ul><li>QC data is trended and reviewed monthly by the QA department.</li><li>Annual review of quality parameters is carried out during the Management Review meeting to ensure ongoing suitability and improvement.</li></ul>"
    },
