  "sections": {
    "objective": "To ensure Abagold consistently produces abalone products meeting defined quality parameters, in line with finished product specifications and FSSC 22000 v6 (section 2.5.9). Quality control is critical to product integrity, consumer satisfaction, and legal/customer compliance. Applies to all abalone products processed at this facility: canned, dried and live abalone.",
    "roles": "<ul><li><b>Quality Manager:</b> oversees the quality control programme, ensures compliance, reviews results and approves corrective actions.</li><li><b>Quality Controllers:</b> carry out inspections, sampling, testing and record results.</li><li><b>Production Supervisors:</b> ensure corrective actions are implemented when out-of-spec results occur.</li></ul>",
    "process": "<p><b>Canned Abalone</b> — each batch is tested for: pH (calibrated pH meter); Salt % (calibrated salt meter); Brix % (calibrated refractometer); Texture (standard texture analysis); Size (weight and grading verification); Visual inspection (colour, defects, fill level, sealing integrity); and Sensory inspection (taste and odour by a trained panel).</p><p><b>Dried Abalone</b> — each lot is assessed for visual appearance (absence of mould/foreign matter/defects), size conformity to grading standards, colour uniformity, and texture (firmness and dryness level).</p><p><b>Live Abalone</b> — each consignment is inspected for shell condition (cracks, damage, abnormalities), shell colour, and general vitality (active and healthy in holding tanks).</p><p><b>Monitoring and Frequency:</b> QC checks are performed per batch before product release; sampling and testing methods are defined in work instructions; minimum frequency is per production run, with additional tests as required by customer or regulatory requirements.</p><p><b>Records:</b> results are documented on QC report REC 7.2.11 and signed by the responsible technician. Out-of-specification (OOS) results are escalated to the Quality Manager, and non-conformities trigger corrective actions per PRO 8.9.</p><p><b>Review:</b> QC data is trended and reviewed monthly by the QA department; an annual review of quality parameters is carried out during Management Review.</p>",
