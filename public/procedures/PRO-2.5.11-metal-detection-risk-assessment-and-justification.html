  "sections": [
    {
      "title": "Purpose",
      "html": "<p>To justify, through documented risk assessment, that a metal detection system is not required within Abagold’s abalone processing operation, based on the nature of the product, the manufacturing environment, and the effective alternative controls in place to prevent metal contamination.</p>"
    },
    {
      "title": "Scope",
      "html": "<p>Applies to all abalone product categories processed at this facility:</p><ul><li>Canned abalone</li><li>Dried abalone</li><li>Live abalone</li></ul>"
    },
    {
      "title": "Rationale and Risk-Based Justification",
      "html": "<p>3.1 Product Characteristics and Handling</p><ul><li>Each abalone is handled and visually inspected individually by trained staff throughout processing, grading, and packing.</li><li>The natural product and manual handling process make any foreign material, including metal, immediately visible.</li><li>Canned, dried, and live abalone are large, intact products, not fine products where metal fragments could remain undetected.</li><li>In the past 5 years Abagold hasn’t had any customer complaints or non-conformances related to foreign objects (physical contamination).</li></ul><p>3.2 Likelihood of Metal Contamination</p><p>Potential metal sources and control measures:</p><table class=\"proc-table\"><tr><th>Potential Hazard</th><th>Process Step</th><th>Likelihood (L)</th><th>Severity (S)</th><th>Risk (L×S)</th><th>Existing Controls</th></tr><tr><td>Metal swarf from can-seamer chuck</td><td>Seaming</td><td>1 (Rare)</td><td>4 (Serious)</td><td>4</td><td>Daily chuck inspection; weekly preventative maintenance; third-party (NRCS) seam teardown verification on each batch</td></tr><tr><td>Knife tip / blade fragment in mince</td><td>Mincing</td><td>2 (Unlikely)</td><td>4 (Serious)</td><td>8</td><td>10 mm grid filter after mincer; monthly blade integrity check</td></tr><tr><td>Staples or nails from secondary packaging</td><td>End-of-line</td><td>1 (Rare)</td><td>2 (Minor)</td><td>2</td><td>Only glue-sealed cartons permitted – staples/nails banned</td></tr></table><p>Risk levels ≤ 8 are considered low to moderate and controlled through existing preventive maintenance and GMP programmes.</p><p>3.3 Preventive Controls</p><ul><li>Preventive Maintenance Programme: Includes scheduled inspection, lubrication, and replacement of all metallic moving parts (blades, chucks, sieves).</li><li>Pre-operation inspections: Operators check equipment integrity at the start of each shift.</li><li>Cleaning &amp; visual checks: Cleaning staff and quality controllers identify and report any damaged or missing parts.</li><li>Tool control: Only food-grade, accounted tools are used; missing tools trigger investigation.</li><li>No metal fasteners used on packaging or labels.</li><li>Quality and production staff trained to recognise and report any signs of metal contamination immediately.</li></ul><p>3.4 Product Suitability and Customer Safety</p><p>Because abalone is a solid, manually handled product, any metal fragment would be immediately visible and removed before packing. The product is not consumed without further handling (e.g., opening of cans or cooking), providing an additional opportunity to detect any unlikely contamination.</p><p>3.5 Customer &amp; Regulatory Requirements</p><ul><li>No customer or regulatory contract currently specifies the use of metal detection.</li><li>Risk assessment outcomes are reviewed annually or if process changes occur.</li></ul>"
    },
    {
      "title": "Conclusion",
      "html": "<p>Based on the documented risk assessment and preventive measures in place, the likelihood of metal contamination is very low and adequately controlled without the need for an in-line metal detector.</p><p>This justification is reviewed during:</p><ul><li>The annual hazard analysis review by the Food Safety Team;</li><li>Internal and external audits;</li><li>Whenever new equipment or process changes are introduced.</li></ul><p>If any future change increases the risk of metal contamination, the requirement for metal detection will be re-evaluated.</p>"
    }
  ],
