  "sections": {
    "objective": "To justify, through documented risk assessment, that a metal detection system is not required within Abagold’s abalone processing operation, based on the nature of the product, the manufacturing environment, and the effective alternative controls in place to prevent metal contamination. Applies to all abalone product categories: canned, dried and live abalone.",
    "roles": "<ul><li>Quality and production staff are trained to recognise and immediately report any signs of metal contamination.</li><li>The Food Safety Team reviews this justification annually as part of the hazard analysis review, and whenever new equipment or process changes are introduced.</li></ul>",
    "process": "<p><b>Product Characteristics:</b> each abalone is handled and visually inspected individually by trained staff throughout processing, grading and packing; the natural product and manual handling make foreign material, including metal, immediately visible. Canned, dried and live abalone are large, intact products, not fine products where metal fragments could remain undetected. In the past 5 years Abagold has had no customer complaints or non-conformances related to physical (foreign object) contamination.</p><p><b>Likelihood of Metal Contamination and Existing Controls:</b></p><ul><li>Metal swarf from can-seamer chuck (Seaming) — Likelihood 1 (Rare), Severity 4 (Serious), Risk 4 — controlled via daily chuck inspection, weekly preventative maintenance, and third-party (NRCS) seam teardown verification on each batch.</li><li>Knife tip / blade fragment in mince (Mincing) — Likelihood 2 (Unlikely), Severity 4 (Serious), Risk 8 — controlled via a 10mm grid filter after the mincer and monthly blade integrity checks.</li><li>Staples or nails from secondary packaging (End-of-line) — Likelihood 1 (Rare), Severity 2 (Minor), Risk 2 — controlled by permitting only glue-sealed cartons; staples/nails are banned.</li></ul><p>Risk levels ≤8 are considered low to moderate and adequately controlled through existing preventive maintenance and GMP programmes.</p><p><b>Preventive Controls:</b> a preventive maintenance programme covers scheduled inspection, lubrication and replacement of metallic moving parts; pre-operation inspections check equipment integrity each shift; cleaning staff and quality controllers identify and report damaged/missing parts; only food-grade, accounted tools are used with missing tools triggering investigation; no metal fasteners are used on packaging or labels; and staff are trained to recognise and report metal contamination signs.</p><p><b>Product Suitability and Customer Safety:</b> because abalone is a solid, manually handled product, any metal fragment would be immediately visible and removed before packing, and the product typically requires further handling (opening/cooking) before consumption, providing an additional detection opportunity. No customer or regulatory contract currently specifies the use of metal detection.</p><p><b>Conclusion:</b> based on the documented risk assessment and preventive measures in place, the likelihood of metal contamination is very low and adequately controlled without an in-line metal detector. If any future change increases the risk of metal contamination, the requirement will be re-evaluated.</p>",
    "review": "This justification is reviewed during the annual hazard analysis review by the Food Safety Team, during internal and external audits, and whenever new equipment or process changes are introduced."
  },
