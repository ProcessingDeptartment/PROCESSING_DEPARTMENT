    "objective": "To outline the process for monitoring, measuring, analysing and evaluating the performance of the FSMS.",
    "roles": "<ul><li>The Food Safety Team is responsible for the implementation of this procedure.</li></ul>",
    "process": "<p>The organisation determines: what needs to be monitored and measured; the methods for monitoring, measurement, analysis and evaluation to ensure valid results; when monitoring/measuring is performed; when results are analysed and evaluated; and who analyses and evaluates the results. Appropriate documentation is retained as evidence of results, and the organisation evaluates the performance and effectiveness of the FSMS.</p><p><b>Analysis and Evaluation:</b> the organisation analyses and evaluates data and information from monitoring and measurement, including results of verification activities related to PRPs and the Hazard Control Plan, internal audits and external audits. The analysis confirms overall system performance meets planned arrangements and FSMS requirements; identifies the need for updating or improving the FSMS; identifies trends indicating higher incidence of potentially unsafe products or process failures; establishes information for internal audit programme planning; and provides evidence that corrections and corrective actions are effective. Results are retained as documented information, reported to top management, and used as input to Management Review and FSMS updating.</p>",
