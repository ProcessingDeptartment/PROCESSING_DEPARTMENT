  "sections": [
    {
      "title": "Purpose",
      "html": "<ul><li>This procedure outlines the process monitoring, measuring, analyzing and evaluating the performance of the FSMS.</li></ul>"
    },
    {
      "title": "Responsibilities",
      "html": "<ul><li>The Food Safety Team is responsible for the implementation of this procedure.</li></ul>"
    },
    {
      "title": "Instructions",
      "html": "<ul><li>The organization shall determine:</li><li>What needs to be monitored and measured;</li><li>The methods for monitoring, measurement, analysis and evaluation, as applicable, to ensure valid results;</li><li>When the monitoring and measuring shall be performed;</li><li>When the results from monitoring and measurement shall be analyzed and evaluated;</li><li>Who shall analyse and evaluate the results from monitoring and measurement.</li><li>The organization shall retain appropriate documentation as evidence of the results.</li><li>The organization shall evaluate the performance and effectiveness of the FSMS.</li></ul>"
    },
    {
      "title": "Analysis and evaluation",
      "html": "<ul><li>The organization shall analyze and evaluate appropriate data and information arising from monitoring and measurement, including the results of verification activities related to PRPs and the Hazard Control Plan, the Internal Audits and external audits.</li><li>The analysis shall be carried out:</li><li>To confirm that the overall performance of the system meets the planned arrangements and the FSMS requirement by the organization;</li><li>To identify the need for updating or improving the FSMS;</li><li>To identify trends which indicate a higher incidence of potentially unsafe products or process failures;</li><li>To establish information for planning of internal audit program related to the status and importance of areas to be audited;</li><li>To provide evidence that corrections and corrective actions are effective.</li><li>The results of the analysis and the resulting activities shall be retained as documented information.</li><li>The results shall be reported to top management and used as input to the Management Review and the updating of the FSMS.</li></ul>"
    },
