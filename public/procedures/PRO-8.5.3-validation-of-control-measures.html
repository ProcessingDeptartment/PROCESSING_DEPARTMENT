  "sections": {
    "objective": "To describe the process for validating control measure combinations, demonstrating that the Food Safety and Quality System is reliable and delivers the level of control needed to ensure food safety and consistency of product quality.",
    "roles": "<ul><li>The Food Safety Team is responsible for establishing and reviewing validation plans and identifying the need for revalidation to ensure maintenance and improvement of the Food Safety System.</li><li>The team systematically reviews and evaluates results of planned verification, including internal audit reports, deviation and corrective action analysis, complaints and customer feedback, product testing and compliance activities, process performance review, incident reporting, and outcomes of dummy/mock withdrawals.</li></ul>",
    "process": "<p>All operational PRP and HACCP control measures are validated before implementation and after any change. Operational PRPs and CCPs are validated per the method stated on the OPRP and HACCP Plans. Validation shows that selected control measures can achieve the intended control of identified food safety hazards and are effective and capable of ensuring control. If validation cannot confirm this, the control measures are modified and reassessed — modifications may include changes in control measures (e.g. process parameters; Supervisors will not load recipes on the retort), raw materials, manufacturing technologies, end product characteristics, distribution methods, or intended use.</p><p><b>Revalidation:</b> the Food Safety Team identifies the need for revalidation at defined intervals, after a significant change to a product, raw material or process, after unexpected system failure, or when new requirements or standards arise. Revalidation includes verification of flow diagrams and CCPs.</p>",
