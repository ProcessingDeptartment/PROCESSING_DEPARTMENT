  "sections": [
    {
      "title": "Purpose",
      "html": "<ul><li>This procedure describes the process for the validation of control measure combinations to demonstrate that the Food Safety and Quality System is reliable and delivers the level of control to ensure food safety and consistency in quality of product.</li></ul>"
    },
    {
      "title": "Responsibilities",
      "html": "<ul><li>The food safety team is responsible for establishing and reviewing the validation plans and identifying the need for revalidation to ensure maintenance and improvement of the Food Safety System.</li><li>The food safety team shall systematically review and evaluate individual results of planned verification, including activities such as:</li><li>Internal Audit reports</li><li>Deviation and corrective action analysis</li><li>Complaints and customer feedback received</li><li>Product testing and compliance activities</li><li>Process performance review activities</li><li>Handling of incident reporting</li><li>Outcome of dummy / mock withdrawals</li></ul>"
    },
    {
      "title": "Instructions",
      "html": "<ul><li>All operational PRP and HACCP control measures are validated before implementation and after any change.</li><li>Validation Plan</li><li>Operational PRPs and CCPs are validated following the method stated on the OPRP and HACCP Plans.</li><li>Validation shows that the selected control measures can achieve the intended control of the identified food safety hazards and effective and capable of ensuring control of the food safety hazards.</li><li>If validation shows that the above cannot be confirmed the control measures will be modified and reassessed.</li><li>Modification may include changes in:</li><li>Control measures (e.g., process parameters), Supervisor’s will not be loading recipe on retort.</li><li>Raw materials</li><li>Manufacturing technologies</li><li>End product characteristics</li><li>Methods of distribution</li><li>Intended use of the end product</li><li>Revalidation</li></ul><p>The food safety team is responsible for identifying the need for revalidation:</p><ul><li>At defined intervals</li><li>After a significant change to a product, raw material or process</li><li>After unexpected system failure</li><li>When new requirements or standards arise</li><li>Revalidation includes verification of flow diagrams and CCP’s.</li></ul>"
    },
