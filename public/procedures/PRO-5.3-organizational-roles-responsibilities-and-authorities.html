  "sections": [
    {
      "title": "Purpose",
      "html": "<p>The purpose of this document is to ensure that the responsibilities and authorities for relevant roles are assigned, communicated and understood within the organization.</p>"
    },
    {
      "title": "Responsibility",
      "html": "<p>The top management shall assign the responsibility and authority for:</p><p>a) ensuring that the FSMS conforms and adheres to regulatory and statutory requirements</p><p>b) feedback on the performance of the FSMS to top management.</p><p>c) Appointing the food safety team and the food safety team leader</p><p>d) designating individuals with defined responsibility and authority to initiate and document actions</p><p>The Management Representative is responsible for:</p><p>a) coordinating the integration between the functions of quality, safety, legality, and other systems through interfacing with management and obtaining inputs through the system, output on consultation with the food safety team leader.</p><p>The food safety team leader will be responsible for:</p><p>a) ensuring the establishment, implementation, maintenance and updating of the FSMS</p><p>b) managing and organising the work of the food safety team</p><p>c) ensuring that employees receive relevant training</p><p>d) ensuring competency of the food safety team members</p><p>e) reporting to top management on the effectiveness and suitability of the FSMS</p><p>All employees shall have the responsibility to:</p><p>a) report any problems or issues regarding the FSMS to the identified person(s)</p>"
