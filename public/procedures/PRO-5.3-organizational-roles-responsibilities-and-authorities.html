    "objective": "To ensure that the responsibilities and authorities for relevant roles are assigned, communicated and understood within the organisation.",
    "roles": "<ul><li><b>Top Management</b> shall assign responsibility and authority for: ensuring the FSMS conforms and adheres to regulatory and statutory requirements; feedback on FSMS performance to top management; appointing the food safety team and food safety team leader; and designating individuals with defined responsibility and authority to initiate and document actions.</li><li><b>The Management Representative</b> is responsible for coordinating the integration between the functions of quality, safety, legality and other systems, interfacing with management and obtaining inputs through the system, and outputs in consultation with the food safety team leader.</li><li><b>The Food Safety Team Leader</b> is responsible for ensuring the establishment, implementation, maintenance and updating of the FSMS; managing and organising the work of the food safety team; ensuring employees receive relevant training; ensuring competency of food safety team members; and reporting to top management on the effectiveness and suitability of the FSMS.</li><li><b>All employees</b> have the responsibility to report any problems or issues regarding the FSMS to the identified person(s).</li></ul>",
    "process": "<p>Roles, responsibilities and authorities are formally assigned as set out above and communicated to relevant staff via job descriptions, induction training, and the organisational hierarchy (POL 5.3). Individuals designated with responsibility and authority are empowered to initiate and document actions relating to the FSMS. The Management Representative liaises between quality, safety, legality and other management functions, and the Food Safety Team Leader is accountable for the day-to-day establishment, maintenance and updating of the FSMS.</p>",
