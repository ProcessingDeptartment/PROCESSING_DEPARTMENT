  "sections": [
    {
      "title": "Purpose",
      "html": "<p>The purpose of this procedure is to ensure that a strong and positive food safety and quality culture is developed, maintained, and continuously improved at our abalone processing factory.</p>"
    },
    {
      "title": "Scope",
      "html": "<p>This procedure applies to all employees, contractors, and visitors working within the facility.</p>"
    },
    {
      "title": "Policy Statement",
      "html": "<p>At Abagold, we believe that food safety and quality are everyone’s responsibility. We want to create a culture where staff feel empowered to speak up, share concerns, and participate in making our factory safer — not one where mistakes are hidden out of fear. Our aim is that food safety and quality are seen as a natural part of daily work, never as an obstacle.</p>"
    },
    {
      "title": "Leadership Commitment",
      "html": "<ul><li>Senior management will lead by example by following all food safety rules, taking part in training and audits, and being visible on the factory floor.</li><li>Food safety and quality culture will form part of job descriptions and induction training for all new and existing staff.</li><li>Culture performance and improvement will be included in the annual management review.</li></ul>"
    },
    {
      "title": "Staff involvement",
      "html": "<ul><li>Monthly Food Safety &amp; Quality Toolbox Talks to demonstrate ongoing engagement with employees. These sessions will be short (5–10 minutes), practical, relevant to employees' daily work, interactive (ask a few questions), recorded on a training attendance register</li><li>Employees are encouraged to raise concerns and make suggestions without fear of blame. Issues will be viewed as opportunities to improve, not as personal failures.</li></ul>"
    },
    {
      "title": "Communication and Training",
      "html": "<ul><li>Key food safety and quality messages will be shared during induction, refresher training, daily meetings, and noticeboards.</li><li>Training will include not only “what to do” but also “why it matters” to ensure staff understand the bigger picture.</li><li>Messages will be delivered in clear, accessible language.</li><li>A suggestion/complaint box is available in the canteen for staff to drop letters in anonymously.</li></ul>"
    },
    {
      "title": "Measuring Culture",
      "html": "<ul><li>An anonymous food safety and quality culture survey will be conducted annually with all staff. Results will be analysed and compared year-on-year to identify improvements or areas needing more focus.</li><li>Key culture KPIs (e.g., training coverage, employee engagement, management visibility, incident reporting trends) will be tracked and reviewed.</li><li>Findings will be discussed at the management review meeting, and action plans will be agreed where needed.</li></ul>"
    },
    {
      "title": "Continuous Improvement",
      "html": "<ul><li>Results from surveys, audits, employee feedback, and culture KPIs will be used to strengthen our food safety and quality practices.</li><li>Management will ensure that improvements are communicated back to staff so they can see the value of their input.</li></ul>"
    },
    {
