  "sections": {
    "objective": "To ensure a strong and positive food safety and quality culture is developed, maintained and continuously improved at Abagold’s abalone processing factory. Applies to all employees, contractors and visitors within the facility.",
    "roles": "<ul><li>Senior management leads by example by following food safety rules, taking part in training and audits, and being visible on the factory floor.</li><li>Food safety and quality culture forms part of job descriptions and induction training for all staff.</li><li>Culture performance and improvement are included in the annual management review.</li></ul>",
    "process": "<p><b>Policy Statement:</b> at Abagold, food safety and quality are everyone’s responsibility. The aim is a culture where staff feel empowered to speak up, share concerns and participate in making the factory safer — not one where mistakes are hidden out of fear — so food safety and quality are a natural part of daily work, not an obstacle.</p><p><b>Staff Involvement:</b> Monthly Food Safety &amp; Quality Toolbox Talks (5–10 minutes, practical, relevant, interactive, recorded on a training attendance register) demonstrate ongoing engagement. Employees are encouraged to raise concerns and make suggestions without fear of blame — issues are viewed as improvement opportunities, not personal failures.</p><p><b>Communication and Training:</b> key messages are shared during induction, refresher training, daily meetings and noticeboards, covering both \"what to do\" and \"why it matters\" in clear, accessible language. A suggestion/complaint box is available in the canteen for anonymous input.</p><p><b>Measuring Culture:</b> an anonymous food safety and quality culture survey is conducted annually with all staff; results are analysed and compared year-on-year. Key culture KPIs (training coverage, employee engagement, management visibility, incident reporting trends) are tracked and reviewed, with findings discussed at management review and action plans agreed where needed.</p><p><b>Continuous Improvement:</b> results from surveys, audits, employee feedback and culture KPIs are used to strengthen food safety and quality practices, and improvements are communicated back to staff.</p>",
    "review": "Culture performance and improvement are reviewed as part of the annual management review."
