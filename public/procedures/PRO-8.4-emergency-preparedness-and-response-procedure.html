    "objective": "To describe the process for managing any incidents that seriously compromise the hygiene or food safety and quality of product, personnel, or premises.",
    "roles": "<ul><li>Top management is responsible for ensuring the organisation is prepared to respond to emergency situations and that procedures are in place.</li><li>Management effectively manages incidents and potential emergency situations impacting food safety and quality, and assigns responsibility to initiate and coordinate the response if an incident occurs.</li></ul>",
    "process": "<p>The organisation responds to actual emergencies/incidents by identifying applicable statutory/regulatory requirements, communicating internally and externally (suppliers, customers, authorities, media), taking action to reduce consequences proportionate to the incident, periodically testing procedures where practical, and maintaining and reviewing documented information on incident management after any incident, emergency or test.</p><p><b>Incidents related to emergency situations</b> include power outages, strikes, transport disruption, water service disruption/contamination, malicious contamination or sabotage, environmental contamination, and natural disasters (pandemics, flood, fire, wind).</p><p><b>Power Outage:</b> Abagold has backup generators for the retort and refrigeration processes; the compressor, boiler, retort and chillers restart automatically.</p><p><b>Water Service Disruption &amp; Contamination:</b> manufacturing is closed until water service is restored; if contaminated, local health authorities are informed to determine the nature and abatement procedure, and processing remains closed until the local health department approves reopening.</p><p><b>Algal Blooms (\"Red Tide\"):</b> if detected and reported, and monitored mortality on the farms exceeds ~0.001% (1g per 100kg) of standing stock, the factory stops manufacturing all live export, canning and dried abalone.</p><p><b>Strikes &amp; Transportation:</b> where staff or transport is affected, in consultation with customers, consignment may be rescheduled.</p><p><b>Chemical Incident:</b> if release occurs inside the building, operations stop immediately, everyone covers mouth/nose with a wet cloth, the building is evacuated, and emergency services are called; if release occurs nearby, everyone stays inside with windows closed and ventilation off.</p><p><b>Flood:</b> finished product is stored safely away from contaminated water; the contingency team assesses live/in-process product for discard or reprocessing; equipment and utensils are washed, rinsed and sanitised.</p><p><b>Wind:</b> during high wind the facility is closed due to risks of downed power lines, flying debris and blown glass; affected areas are examined for glass fragments and suspected/damaged products discarded.</p><p><b>Pest Control in a Disaster:</b> doors/windows kept closed, gaps sealed, incoming vehicles checked, and pest control providers contacted (spraying, fumigation, traps).</p><p><b>Blood Spillage:</b> dealt with immediately with protective clothing to avoid skin/eye/mucous membrane contamination; cuts and lesions are covered with a waterproof plaster in a colour contrasting the product; affected product is isolated in a quarantine area for disposal. High-concentration chlorine-releasing disinfectants are used; a blood spillage kit is available in the Factory Office.</p><p><b>Biological Tampering / Bioterrorism:</b> Abagold maintains a food product security system; security inspects for suspicious items and staff report unusual activity (unauthorized vehicles, people, theft, sabotage, vandalism).</p><p><b>Dirty Bomb:</b> if it explodes in/next to the facility, operations stop immediately and the building is evacuated with mouth/nose covered; if several blocks away, everyone stays inside with windows closed and ventilation off. Focus remains on keeping people safe first.</p><p><b>Maintaining Food Safety in Emergencies:</b> strict hand washing/GHP is practised; employees are trained on procedure changes; only safe/approved water is used; chemicals remain stored and labelled; processing areas are thoroughly cleaned and sanitised; waste is properly disposed of; pest control is intensified where infestation is observed.</p><p>Where released products may be affected, management investigates the need to withdraw or recall product. Products still under site control that may be affected are isolated/quarantined for investigation. Where product is deemed unsafe, the incident planning committee and coordinator research risks/hazards, government/association plans, industry best practice, and required resources; the Withdrawal Record documents the designated investigator, affected stakeholders, communication, training/practice runs, resources and other plan items.</p><p><b>Incident Planning Committee:</b> Managing Director, Processing Manager, Human Resource Director, Factory Manager, Procurement Manager, Technical &amp; Engineering Manager, Assistant Production Manager, Quality Assurance Manager, Health &amp; Safety Officer, and Continuous Improvement Manager — full contact details are maintained in the procedure addendum.</p>",
