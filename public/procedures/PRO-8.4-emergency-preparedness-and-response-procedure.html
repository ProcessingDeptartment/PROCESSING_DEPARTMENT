  "sections": [
    {
      "title": "Purpose",
      "html": "<ul><li>This procedure describes the process for managing any incidents that seriously compromises the hygiene or food safety and quality of product, personnel, or premises.</li></ul>"
    },
    {
      "title": "Responsibilities",
      "html": "<ul><li>Top management is responsible for ensuring that the organisation is prepared to respond to emergency situations. And that procedures are in place to follow during these emergencies/incidents.</li><li>Management shall effectively manage incidents and potential emergency situations that impact on food safety and quality.</li><li>Management will assign responsibility to initiate and coordinate response if an incident occurs.</li></ul>"
    },
    {
      "title": "Handling of emergencies and incidents",
      "html": "<p>The organisation shall:</p><p>a) respond to actual emergency situations or incidents by:</p><ul><li>Ensuring applicable statutory and regulatory requirements are identified.</li><li>Communication internally.</li><li>Communication externally (suppliers, customers, authorities, media etc.)</li></ul><p>b) take action to reduce the consequences of emergency situations, appropriate to the magnitude of the emergency or incident and the potential food safety impact.</p><p>c) periodically test procedures where practical.</p><p>d) Management will establish and maintain documented information regarding the management of incidents, this information will be reviewed, and where necessary, updated after the occurrence of any incident, emergency situation or test.</p>"
    },
    {
      "title": "Definitions",
      "html": "<p>Emergency: An event that can have a negative impact on food safety and on quality, that is not controlled by the normal day-to-day controls of the Food Safety System. To counteract and plan against natural and man-made calamities, a contingency plan has been established.</p><p>Incidents related to emergency situations include:</p><p>Power Outage, Strikes, transportation, Water service disruption &amp; contamination, malicious contamination or sabotage, contamination of the environment or any other natural disaster i.e. pandemics, flood, fires,&amp; wind etc.</p><p><b>Power Outage</b></p><p>In the event of power outage for both the retort &amp; refrigeration processes, Abagold has backup generators. These will be started; the compressor and boiler will be switched back on and the retort and chillers will start operating automatically.</p><p><b>Water Service Disruption &amp; Contamination</b></p><ul><li>A broken main water line, malfunctioning can create unsafe condition for products establishment as there will be problem in hand washing &amp; cleaning. In such unlikely event manufacturing process will be closed until water service is restored.</li></ul><p>A contaminated water supply may contain chemicals, toxins, bacteria, viruses, parasites and other harmful microbes that cause human illness and can result in fatal diseases as safe water is essential to operate a safe food business.</p><p>In such an unlikely event, local health authorities will be informed as they need to determine the nature and type of the contamination and prescribe appropriate abatement procedure. The processing will be closed until safe water service is restored and the local health department approves reopening.</p><p><b>Algal Blooms “Red tide” contamination</b></p><p>In the event of a red tide being detected and reported, the processing factory will stop manufacturing all live export, canning &amp; dried abalone if the monitored mortality rate on the farms increase above normal (0.001%) of standing stock i.e., above 1 gram per 100 kgs is considered abnormal in mortality rate.</p><p><b>Strikes &amp; Transportation</b></p><p>Should staff not be available due to strikes and means of production and /or transportation is affected, in consultation with the customers may choose to provide consignment at reschedule delivery period.</p><p><b>Chemical Incident</b></p><p>Any release of a hazardous chemical that threatens public health, contaminates food or water, or does harm to the environment is a chemical incident.</p><p>If chemical release occurs inside the building, operations will be stopped immediately. Everyone will be advised to cover mouth and nose with wet cloth to prevent inhalation of chemicals. The building will be evacuated immediately. Emergency services will be called, and directions of emergency responders will be followed.</p><p>If chemical release occurs near the building, everyone inside the building will stay inside. All the windows will be closed, and ventilation system will be turned off.</p><p><b>Flood</b></p><p>The finished product will be stored in the area that will be safe out of the way of contaminated water in case of flooding.</p><p>In the event of live and in process product being contaminated with flood water, the contingency team assesses the situation and decides whether the products are to be discarded or reprocessed. In case where the product cannot be reprocessed for sale, it will be discarded, and a new lot/order will be prepared and dispatched in alternate delivery dates.</p><p>Wash all the equipment and utensils thoroughly with soap and hot water, rinse and then sanitise them by immersing them in a sanitiser.</p><p><b>Wind</b></p><p>During high-wind situations potential risks include downed live power lines, flying debris, wind-blown broken glass and heavy objects, the facility will be closed.</p><p>Broken glass blown by high winds is a significant food safety hazard. The area will be carefully examined for glass fragments that may have impaled food packaging or embedded products, even if not clearly visible. All suspected or damaged products and items will be discarded.</p><p><b>Pest Control in a Disaster</b></p><p>Pests will be excluded by keeping doors &amp; windows closed, sealing the gaps around the doors, checking all the incoming vehicles for pests. Pest control service providers will be contacted for their services (spraying, fumigation, traps etc.)</p><p><b>Blood Spillage</b></p><ul><li>Routine Safety Procedures</li></ul><p>Deal with any spillage of blood/bodily fluids immediately. Care must be taken to avoid skin, eye, and mucous membrane contamination during the cleaning and disinfection of spillages, protective clothing must be worn. This protective clothing is to be changed once the spillage has been cleared.</p><p>Staff must always cover cuts and lesions with a waterproof plaster in a colour in contrast to the product whilst on duty. All affected product will be isolated and placed in the quarantine area for disposal.</p><p><b>Protective Clothing</b></p><p>Wear disposable gloves.</p><p>Protect eyes and mouth with goggles and mask if splash or spray is anticipated.</p><p><b>Disinfection of Blood and bodily fluid spills</b></p><p>Disinfection aims to reduce the number of microorganisms to a safe level. Whilst a variety of chemical disinfectants are available, high concentration chlorine-releasing compounds provide an effective method of treating bodily fluid spills with activity against a range of bacteria and viruses. A blood spillage kit will be available in the Factory Office.</p><p><b>Biological Tampering or Bioterrorism</b></p><ul><li>Abagold has a good food product security system in place. Unauthorized access is eliminated where food product is open, vulnerable and easily targeted. The security inspects for suspicious items &amp; staff are supposed to report all unusual activities to authorities’ i.e. (unauthorized vehicles, people, theft, sabotage, vandalism etc.).</li></ul><p><b>Dirty Bomb</b></p><ul><li>If dirty bomb explodes in or next to facility, operation is to be stopped immediately and building is to be evacuated with mouth and nose covered. If a dirty bomb explodes several blocks away from facility, everyone inside building should stay inside the building, all windows to be closed; ventilation system is to be turned off.</li><li>Focus will remain on keeping people safe and deal with food safety later.</li></ul><p><b>Maintaining Food safety and quality in emergency situations</b></p><ul><li>Product handlers: All workers will practice strict hand washing/sanitation and Good Hygiene Practices as it is done regularly.</li><li>Employees will be trained on any changes in procedure due to the emergency to ensure public health protection.</li><li>Product and Storage: Water will be used only from a safe and approved source. All chemicals are always stored away in a chemical storage room and clearly identified /labelled.</li><li>Cleaning and Sanitation: All the processing areas will be thoroughly cleaned and sanitised. All utensils will be properly washed, rinsed and sanitised. Waste will be properly disposed of. Insects and rodents will be controlled in all processing areas if any infestation is observed. Cleaning and sanitation of outside and inside the establishment will be focused.</li><li>Where products which have been released from the site may be affected by an incident, management shall consider and investigate the need to withdraw or recall the product.</li><li>In the event of an incident occurring that might result in the production of unsafe or illegal products, management shall evaluate the situation to determine if there will be an impact on the safety and suitability of the product.</li><li>Products affected by an incident that is still under the control and management of the site shall be isolated/quarantined to be investigated in order to determine if the product is safe and suitable for release to clients.</li><li>Where product is deemed unsafe, the incident planning committee and incident coordinator identify:</li><li>Research risks and hazards as they apply to the company and products;</li><li>Research government or association plans to identify relevant issues or existing plans;</li><li>Identify best practices for the industry or area for emergency response;</li><li>Identify resources</li><li>For each incident or situation identified, investigation of the incident is required.</li><li>The Withdrawal Record must be completed to indicate:</li><li>Designated Investigator;</li><li>Stakeholders or those who may be impacted by the emergency;</li><li>Communication with stakeholders;</li><li>Training or practice runs required;</li><li>Resources;</li><li>Other items required for an effective plan for the specific risk</li></ul>"
    },
