  "sections": {
    "objective": "To ensure that any new product development, recipe modification, or process change is carried out in a controlled and systematic manner that maintains product safety, legality and quality in accordance with the FSMS and FSSC 22000 v6 requirement 2.5.13. Applies to minor and major recipe/process changes, new packaging or presentation formats, and any product modification affecting food safety, quality or regulatory compliance of canned, dried or live abalone products.",
    "roles": "<ul><li><b>Managing Director:</b> authorises all new product developments or significant recipe changes, and gives final approval for commercial production.</li><li><b>Quality Manager:</b> ensures product safety, legal and labelling compliance; updates hazard analysis and related procedures.</li><li><b>Processing Manager and Planning Manager:</b> assess feasibility and equipment requirements; ensure staff training on new/modified processes.</li><li><b>Procurement:</b> sources and verifies new ingredients, packaging or materials.</li><li><b>Food Safety Team:</b> reviews food safety risks associated with all new or changed products before approval.</li></ul>",
    "process": "<p><b>4.1 Initiation and Approval:</b> development begins from a customer request, market feedback, or internal improvement proposal. A Product Development Request Form describes the product name/type, purpose, customer/regulatory requirements, and expected production process and packaging. The Processing Manager must approve initiation before any trials occur.</p><p><b>4.2 Feasibility and Risk Assessment:</b> the Food Safety Team assesses whether new hazards are introduced, whether existing control measures remain valid, and whether allergen, chemical or microbiological risks change. Supplier verification is completed for new ingredients/materials, and equipment capability and hygienic design are evaluated before use.</p><p><b>4.3 Product Trials and Testing:</b> pilot/small-scale trials are conducted under controlled conditions. Samples are tested for key quality and safety parameters — canned abalone (pH, salt %, brix %, texture, size, visual and sensory quality), dried abalone (colour, size, texture, dryness, visual quality), live abalone (shell condition, colour, vitality). Shelf-life/stability testing is carried out where relevant.</p><p><b>4.4 Review and Approval of Results:</b> trial results are reviewed by the Food Safety Team and Quality Department; identified risks or non-conformances must be resolved before production approval; label accuracy and regulatory compliance are verified before release; the Managing Director gives final approval for commercial production.</p><p><b>4.5 Implementation and Communication:</b> approved recipes, work instructions and quality parameters are updated in the FSMS documentation; staff are trained before full-scale production begins; updated labels and specifications are communicated to relevant departments and customers.</p><p><b>4.6 Post-Launch Review:</b> after the first three production runs, the Food Safety Team reviews performance against specification (yield, quality, customer feedback) and adjusts as necessary to optimise product quality and process efficiency.</p><p><b>Documentation and Records:</b> Product Development Request Form, Risk Assessment and Approval Checklist, Trial and Test Results, Updated Specifications and Labels, Training and Communication Records, and Management Approval Form.</p>",
    "review": "This procedure and all related product design records are reviewed annually, or whenever a product, process or ingredient change occurs that may affect food safety, quality or regulatory compliance."
