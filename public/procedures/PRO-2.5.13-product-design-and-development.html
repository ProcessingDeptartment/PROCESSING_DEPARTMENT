  "sections": [
    {
      "title": "1. Purpose",
      "html": "<p>To ensure that any new product development, recipe modification, or process change is carried out in a controlled and systematic manner that maintains product safety, legality, and quality in accordance with the Food Safety Management System and FSSC 22000 v6 requirement 2.5.13.</p>"
    },
    {
      "title": "2. Scope",
      "html": "<p>This procedure applies to:</p><ul><li>Minor and major recipe or process changes made to meet customer, market, or regulatory requirements.</li><li>Development of new packaging or presentation formats.</li><li>Any product modification that may affect the food safety, quality, or regulatory compliance of canned, dried, or live abalone products.</li></ul>"
    },
    {
      "title": "3. Responsibilities",
      "html": "<ul><li>Managing Director: Authorises all new product developments or significant recipe changes.</li><li>Quality Manager: Ensures product safety, legal, and labelling compliance are maintained; updates hazard analysis and related procedures.</li><li>Processing Manager and Planning Manager: Assesses feasibility and equipment requirements; ensures staff training on new or modified processes.</li><li>Procurement: Sources and verifies new ingredients, packaging, or materials.</li><li>Food Safety Team: Reviews food safety risks associated with all new or changed products before approval.</li></ul>"
    },
    {
      "title": "4. Design and Development Process",
      "html": ""
    },
    {
      "title": "4.1 Initiation and Approval",
      "html": "<ul><li>Product development begins when a request is received from a customer, market feedback, or internal improvement proposal.</li><li>A Product Development Request Form is completed, describing:</li><li>Product name and type.</li><li>Purpose of development/change.</li><li>Customer or regulatory requirements.</li><li>Expected production process and packaging.</li><li>The Processing Manager must approve the initiation before any trials occur.</li></ul>"
    },
    {
      "title": "4.2 Feasibility and Risk Assessment",
      "html": "<ul><li>The Food Safety Team conducts a risk assessment to determine whether:</li><li>New hazards are introduced.</li><li>Existing control measures are still valid.</li><li>Any allergen, chemical, or microbiological risks change.</li><li>If applicable, supplier verification is completed for new ingredients or materials.</li><li>Equipment capability and hygienic design are evaluated before use.</li></ul>"
    },
    {
      "title": "4.3 Product Trials and Testing",
      "html": "<ul><li>Pilot or small-scale trials are conducted under controlled conditions.</li><li>Samples are tested for key quality and safety parameters, including:</li><li>Canned abalone: pH, salt %, brix %, texture, size, visual and sensory quality.</li><li>Dried abalone: colour, size, texture, dryness, visual quality.</li><li>Live abalone: shell condition, colour, vitality.</li><li>Where relevant, shelf-life or stability testing is carried out.</li></ul>"
    },
    {
      "title": "4.4 Review and Approval of Results",
      "html": "<ul><li>Trial results are reviewed by the Food Safety Team and Quality Department.</li><li>Any identified risks or non-conformances must be resolved before approval for production.</li><li>Label accuracy and regulatory compliance are verified before product release.</li><li>The Managing Director gives final approval for commercial production.</li></ul>"
    },
    {
      "title": "4.5 Implementation and Communication",
      "html": "<ul><li>Approved recipes, work instructions, and quality parameters are updated in the FSMS documentation system.</li><li>Staff are trained before full-scale production begins.</li><li>Updated labels and specifications are communicated to relevant departments and customers.</li></ul>"
    },
    {
      "title": "4.6 Post-Launch Review",
      "html": "<ul><li>After the first three production runs, the Food Safety Team reviews performance against specification (yield, quality, customer feedback).</li><li>Adjustments are made where necessary to optimise product quality and process efficiency.</li></ul>"
    },
    {
      "title": "5. Documentation and Records",
      "html": "<p>The following records must be maintained:</p><ul><li>Product Development Request Form</li><li>Risk Assessment and Approval Checklist</li><li>Trial and Test Results</li><li>Updated Specifications and Labels</li><li>Training and Communication Records</li><li>Management Approval Form</li></ul>"
    },
    {
      "title": "6. Review and Continuous Improvement",
      "html": "<p>This procedure and all related product design records will be reviewed:</p><ul><li>Annually, or</li><li>Whenever a product, process, or ingredient change occurs that may affect food safety, quality, or regulatory compliance.</li></ul>"
    }
