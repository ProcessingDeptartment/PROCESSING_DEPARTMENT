  "baselineDate": "14/05/2026",
  "sections": [
    {
      "title": "1. PURPOSE",
      "html": "<p>The purpose of this procedure is to define how the organisation identifies, evaluates, manages, monitors, and reviews risks and opportunities that may affect food safety, product quality, legal compliance, customer requirements, and the effectiveness of the Food Safety and Quality Management System (FSQMS).</p><p>This procedure ensures that risks and opportunities are addressed in a systematic, proactive, and documented manner, in line with ISO 22000 and FSSC 22000 Version 6 requirements.</p>"
    },
    {
      "title": "2. SCOPE",
      "html": "<p>This procedure applies to all activities, processes, products, and services within the abalone processing facility that may impact:</p><ul><li>Food safety</li><li>Product quality</li><li>Legal and regulatory compliance</li><li>Operational continuity</li><li>Continual improvement of the FSQMS</li></ul>"
    },
    {
      "title": "3. REFERENCES",
      "html": "<ul><li>ISO 22000:2018 – Clause 6.1</li><li>FSSC 22000 Version 6</li><li>Food Safety and Quality Policy</li><li>Management Review Procedure</li></ul>"
    },
    {
      "title": "4. DEFINITIONS",
      "html": "<p>Risk:\nThe effect of uncertainty on achieving intended food safety and quality outcomes.</p><p>Opportunity:\nA circumstance that can lead to improvement of food safety, quality, efficiency, or system performance.</p><p>Risk Significance:\nThe combined evaluation of likelihood and severity, with severity assessed based on potential impact on food safety and quality.</p>"
    },
    {
      "title": "5. RESPONSIBILITIES",
      "html": "<p><b>Top Management</b></p><ul><li>Approves identified risks, opportunities, and mitigation strategies</li><li>Reviews risks and opportunities during management review</li></ul><p><b>Food Safety Team Leader / QA Manager</b></p><ul><li>Maintains the Risk and Opportunity Register</li><li>Coordinates risk assessments and reviews</li><li>Ensures effectiveness of actions is monitored</li></ul><p><b>Department Managers</b></p><ul><li>Identify risks and opportunities within their areas</li><li>Implement and monitor assigned actions</li></ul>"
    },
    {
      "title": "6. PROCEDURE",
      "html": ""
    },
    {
      "title": "6.1 Identification of Risks and Opportunities",
      "html": "<p>Risks and opportunities are identified considering, but not limited to:</p><ul><li>Food safety hazards and quality risks</li><li>Legal and regulatory requirements</li><li>Customer and market requirements</li><li>Changes to processes, equipment, products, or suppliers</li><li>Audit findings and corrective actions</li><li>Food safety and quality culture outcomes</li><li>Food loss and waste considerations</li><li>External and internal issues affecting the organisation</li></ul><p>Identified risks and opportunities are recorded in the Risk and Opportunity Register.</p>"
    },
    {
      "title": "6.2 Risk Evaluation and Scoring",
      "html": "<p>Each identified risk is evaluated using a defined risk matrix based on:</p><ul><li>Potential Impact on Food Safety / Quality\n1 = Negligible/ 2 = Minor/ 3 = Major/ 4 = Severe</li></ul><p><b>Legal</b></p><p>1 = No regulations / 2 = Guidelines and Code of Practice / 3 = Standards / 4 = Law and Regulations</p><p><b>Likelihood</b></p><p>Based on probability with current controls in place</p><p>1 = Unlikely / 2 = Somewhat likely / 3 = Regularly / 4 = Certain</p><p><b>Frequency</b></p><p>1 = Almost never / 2 = Rare / 3 = Regularly / 4 = Always</p><p><b>Risk Significance = (Impact + Legal + Likelihood) x Frequency</b></p><table class=\"proc-table\"><tr><th>Low = 3 – 13</th><th>Medium = 14 – 29</th><th>High = 30 – 39</th><th>Critical = 40-48</th></tr></table>"
    },
    {
      "title": "6.2.1 Escalation of Significant Risks",
      "html": "<p>Where identified risks have the potential to significantly impact the organisation beyond normal operational control, the risk shall be escalated to Top Management and/or the Board for review and decision-making.</p><p>Risks requiring escalation may include, but are not limited to those that could impact:</p><ul><li>Export continuity or export approvals</li><li>FSSC 22000 certification status</li><li>Product release decisions</li><li>Customer confidence or customer requirements</li><li>Product safety or quality</li><li>Legal or regulatory compliance</li><li>Significant financial performance</li><li>Major utility disruptions (electricity, water, steam, compressed air)</li><li>Business continuity</li></ul><p>Escalation requirements shall be applied as follows:</p><table class=\"proc-table\"><tr><th>Risk Rating</th><th>Escalation Requirement</th><th>Responsibility</th></tr><tr><td>Low</td><td>Managed within department</td><td>Department Manager</td></tr><tr><td>Medium</td><td>Reviewed by Food Safety Team Leader / QA Manager</td><td>Department Manager / QA</td></tr><tr><td>High</td><td>Escalated to Top Management</td><td>Food Safety Team Leader / QA Manager</td></tr><tr><td>Critical*</td><td>Escalated to Top Management and Board where applicable</td><td>Top Management</td></tr></table><p>*Critical risks include those with the potential to significantly affect certification status, export continuity, customer confidence, major product safety events, or material financial performance.</p><p>Actions and decisions resulting from escalated risks shall be documented in the Risk and Opportunity Register, Management Review minutes, or relevant meeting records.</p>"
    },
    {
      "title": "6.3 Determination of Actions",
      "html": "<p>For risks and opportunities rated as significant, appropriate actions are defined, which may include:</p><ul><li>Preventive or mitigation controls</li><li>Process or procedural changes</li><li>Monitoring activities</li><li>Training or awareness initiatives</li><li>Improvement projects</li></ul><p>Each action is assigned:</p><ul><li>A responsible person</li><li>A target completion date</li></ul>"
    },
    {
      "title": "6.4 Implementation and Monitoring",
      "html": "<p>Assigned actions are implemented by responsible persons.</p><p>The effectiveness of actions is monitored through:</p><ul><li>Internal audits</li><li>Trend analysis (complaints, non-conformances, KPIs)</li><li>Verification activities</li><li>Management review outcomes</li></ul><p>If actions are found to be ineffective, risks are re-evaluated and additional controls implemented.</p>"
    },
    {
      "title": "6.5 Review of Risks and Opportunities",
      "html": "<p>Risks and opportunities are formally reviewed:</p><p><b>At least annually</b></p><p><b>During management review or another date with Management present</b></p><ul><li>When any of the following occur:</li><li>Changes to legislation or certification requirements</li><li>Introduction or modification of products, processes, or equipment</li><li>Food safety or quality incidents</li><li>Internal or external audit findings</li><li>Significant customer complaints or market changes</li></ul><p>The review ensures risks remain current, controls remain effective, and new risks are identified.</p>"
    },
    {
      "title": "6.6 Link to Objectives and Management Review",
      "html": "<p>Outputs from the risk and opportunity assessment are used as inputs to:</p><ul><li>Food safety and quality objectives</li><li>Continual improvement planning</li><li>Management review</li></ul><p>High-priority risks and opportunities are considered when setting or revising objectives.</p>"
    },
    {
      "title": "7. RECORDS",
      "html": "<p>The following records are maintained:</p><ul><li>Risk and Opportunity Register</li><li>Evidence of action implementation</li><li>Management review minutes</li><li>Internal audit reports</li></ul><p>All records are retained in accordance with the document control procedure.</p>"
    },
    {
      "title": "8. VERIFICATION OF EFFECTIVENESS",
      "html": "<p>The effectiveness of this procedure is verified through:</p><ul><li>Internal audits</li><li>Management review</li><li>Certification and surveillance audits</li></ul>"
    }
  ],
