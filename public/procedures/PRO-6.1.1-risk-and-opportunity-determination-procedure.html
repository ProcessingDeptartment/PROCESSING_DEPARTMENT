  "baselineDate": "14/05/2026",
  "sections": {
    "objective": "To define how the organisation identifies, evaluates, manages, monitors, and reviews risks and opportunities that may affect food safety, product quality, legal compliance, customer requirements, and the effectiveness of the FSQMS, in a systematic, proactive and documented manner, in line with ISO 22000 and FSSC 22000 Version 6 requirements. This procedure applies to all activities, processes, products and services within the abalone processing facility that may impact food safety, product quality, legal/regulatory compliance, operational continuity, and continual improvement of the FSQMS.",
    "roles": "<ul><li><b>Top Management:</b> approves identified risks, opportunities and mitigation strategies; reviews risks and opportunities during management review.</li><li><b>Food Safety Team Leader / QA Manager:</b> maintains the Risk and Opportunity Register; coordinates risk assessments and reviews; ensures effectiveness of actions is monitored.</li><li><b>Department Managers:</b> identify risks and opportunities within their areas; implement and monitor assigned actions.</li></ul>",
    "process": "<p><b>6.1 Identification:</b> Risks and opportunities are identified considering food safety hazards and quality risks, legal/regulatory requirements, customer/market requirements, changes to processes/equipment/products/suppliers, audit findings, food safety culture outcomes, food loss and waste considerations, and external/internal issues. Identified items are recorded in the Risk and Opportunity Register.</p><p><b>6.2 Risk Evaluation and Scoring:</b> Each risk is scored on Impact (1 Negligible – 4 Severe), Legal (1 No regulations – 4 Law and Regulations), Likelihood (1 Unlikely – 4 Certain) and Frequency (1 Almost never – 4 Always). Risk Significance = (Impact + Legal + Likelihood) × Frequency. Bands: Low = 3–13, Medium = 14–29, High = 30–39, Critical = 40–48.</p><p><b>6.2.1 Escalation of Significant Risks:</b> Risks with potential to significantly impact the organisation beyond normal operational control are escalated to Top Management and/or the Board. Escalation requirements: Low — managed within department; Medium — reviewed by Food Safety Team Leader/QA Manager; High — escalated to Top Management; Critical — escalated to Top Management and Board where applicable. Critical risks include those with potential to affect certification status, export continuity, customer confidence, major product safety events, or material financial performance. Actions and decisions from escalated risks are documented in the Risk and Opportunity Register, Management Review minutes, or relevant meeting records.</p><p><b>6.3 Determination of Actions:</b> for significant risks/opportunities, actions may include preventive or mitigation controls, process/procedural changes, monitoring activities, training/awareness initiatives, or improvement projects. Each action is assigned a responsible person and target completion date.</p><p><b>6.4 Implementation and Monitoring:</b> assigned actions are implemented by responsible persons; effectiveness is monitored through internal audits, trend analysis (complaints, non-conformances, KPIs), verification activities, and management review outcomes. If actions are ineffective, risks are re-evaluated and additional controls implemented.</p><p><b>6.5 Review:</b> Risks and opportunities are formally reviewed at least annually, during management review, and whenever legislation/certification requirements change, products/processes/equipment are introduced or modified, food safety or quality incidents occur, audit findings arise, or significant customer complaints/market changes occur.</p><p><b>6.6 Link to Objectives and Management Review:</b> outputs from the risk and opportunity assessment feed food safety and quality objectives, continual improvement planning, and management review; high-priority items are considered when setting or revising objectives.</p>",
    "review": "The effectiveness of this procedure is verified through internal audits, management review, and certification/surveillance audits."
  },
