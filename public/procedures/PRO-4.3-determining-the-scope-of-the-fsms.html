  "sections": [
    {
      "title": "1.\tOBJECTIVE",
      "html": "<p>To determine the boundaries and applicability of the FSMS to establish the scope. The scope will specify the products and services, processes and production sites that are included in the FSMS. The scope will include the activities, processes, products, or services that have an influence on food safety and its end products.</p>"
    },
    {
      "title": "2. \tRELEVANT DOCUMENTS",
      "html": "<ul><li>PRO 4.1 \t– Context of the Organisation Analysis</li><li>PRO 4.2 \t– Interested Party – Needs and Expectation Analysis</li><li>POL 5.2\t\t– Food Safety Policy</li></ul>"
    },
    {
      "title": "3.\tRESPONSIBILITY",
      "html": "<p>Management is responsible for:</p><ul><li>Determining the scope of the FSMS</li><li>Managing significant risks that have been determined</li></ul><p>When determining the scope, we shall consider:</p><ul><li>The external and internal issues referred to in PRO 4.1</li><li>The requirements referred to in PRO 4.2</li></ul>"
    },
    {
      "title": "THE SCOPE OF THE FSMS",
      "html": "<p>This is the scope of Abagold (Pty) Ltd situated in Hermanus, Western Cape, South Africa.</p><p>The premises consist of an abalone processing facility and associated support services involved in the receiving, storage, processing, packing and dispatch of abalone products.</p><p>The Food Safety and Quality Management System (FSQMS) apply to the receiving of live abalone and raw materials, storage, processing, packing and dispatch of canned abalone (including abalone in brine and sauce), dried abalone and live packed abalone at Abagold (Pty) Ltd, Hermanus.</p><p>The FSQMS covers all activities, personnel, infrastructure and support processes that may affect food safety, legality and product quality, from receipt of raw materials through to dispatch of finished product, in accordance with customer, statutory, regulatory and certification requirements.</p><p>Processing activities included within the scope comprise:</p><ul><li>Receiving of live abalone and raw materials</li><li>Storage of live abalone, raw materials and packaging materials</li><li>Preparation and processing of abalone products</li><li>Thermal processing and canning of abalone products</li><li>Drying of abalone products</li><li>Live packing of abalone products</li><li>Labelling and packing</li><li>Storage of finished products</li><li>Dispatch of finished products</li></ul><p>The organisation manages its significant risks and opportunities in accordance with PRO 6.1 – Risk and Opportunity Determination. All actions, evaluations, reviews, monitoring activities and improvements relating to identified risks and opportunities form part of the FSQMS scope.</p><p>The significant interested parties relevant to the FSQMS include:</p><ul><li>Customers</li><li>Regulatory Authorities</li><li>Certification Bodies</li><li>Employees</li><li>Shareholders and Top Management</li><li>Suppliers and Service Providers</li><li>Local Community</li></ul><p>The needs and expectations of interested parties are determined and maintained in accordance with PRO 4.2 – Interested Parties Analysis and are considered when establishing, implementing, maintaining and continually improving the FSQMS.</p><p>Food Chain Category:\nC – Food Manufacturing</p><p>Traceability:\nAll products manufactured by Abagold (Pty) Ltd are traceable one step back and one step forward through the company's traceability system.</p><p>Applicable standards and legal requirements include, but are not limited to:</p><ul><li>FSSC 22000 Version 6</li><li>ISO 22000:2018 – Food Safety Management Systems</li><li>Applicable South African food safety legislation</li><li>Export market requirements</li><li>Customer-specific requirements</li><li>Occupational Health and Safety legislation</li><li>Environmental legislation where applicable</li></ul>"
    },
    {
      "title": "5.\tREVIEW",
      "html": "<p>The scope shall be maintained as documented information and reviewed annually, or when significant changes occur to products, processes, facilities, interested parties, legal requirements, or the context of the organisation.</p>"
    }
