  "sections": {
    "objective": "To determine the boundaries and applicability of the FSMS and establish its scope, specifying the products, services, processes and production sites included, and the activities, processes, products or services that have an influence on food safety and the end products.",
    "roles": "<ul><li>Management is responsible for determining the scope of the FSMS and managing significant risks that have been determined.</li><li>When determining the scope, Management considers the external and internal issues from PRO 4.1 and the requirements from PRO 4.2.</li></ul>",
    "process": "<p>This is the scope of Abagold (Pty) Ltd, situated in Hermanus, Western Cape, South Africa. The premises consist of an abalone processing facility and associated support services involved in the receiving, storage, processing, packing and dispatch of abalone products.</p><p>The Food Safety and Quality Management System (FSQMS) applies to the receiving of live abalone and raw materials, storage, processing, packing and dispatch of canned abalone (including abalone in brine and sauce), dried abalone and live packed abalone at Abagold (Pty) Ltd, Hermanus. It covers all activities, personnel, infrastructure and support processes that may affect food safety, legality and product quality, from receipt of raw materials through to dispatch of finished product, in accordance with customer, statutory, regulatory and certification requirements.</p><p>Processing activities included within the scope comprise:</p><ul><li>Receiving of live abalone and raw materials</li><li>Storage of live abalone, raw materials and packaging materials</li><li>Preparation and processing of abalone products</li><li>Thermal processing and canning of abalone products</li><li>Drying of abalone products</li><li>Live packing of abalone products</li><li>Labelling and packing</li><li>Storage of finished products</li><li>Dispatch of finished products</li></ul><p>The organisation manages its significant risks and opportunities in accordance with PRO 6.1.1 – Risk and Opportunity Determination Procedure. All actions, evaluations, reviews, monitoring activities and improvements relating to identified risks and opportunities form part of the FSQMS scope.</p><p>The significant interested parties relevant to the FSQMS include: Customers, Regulatory Authorities, Certification Bodies, Employees, Shareholders and Top Management, Suppliers and Service Providers, and the Local Community, as determined and maintained in accordance with PRO 4.2.</p><p><b>Food Chain Category:</b> C – Food Manufacturing.</p><p><b>Traceability:</b> All products manufactured by Abagold (Pty) Ltd are traceable one step back and one step forward through the company’s traceability system.</p><p>Applicable standards and legal requirements include, but are not limited to: FSSC 22000 Version 6; ISO 22000:2018 – Food Safety Management Systems; applicable South African food safety legislation; export market requirements; customer-specific requirements; Occupational Health and Safety legislation; and environmental legislation where applicable.</p>",
    "review": "The scope is maintained as documented information and reviewed annually, or when significant changes occur to products, processes, facilities, interested parties, legal requirements, or the context of the organisation."
