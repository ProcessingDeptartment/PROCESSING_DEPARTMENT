    "objective": "To carry out the hazard analysis, preliminary documented information is collected, maintained and updated by the Food Safety Team, including applicable statutory/regulatory/customer requirements, the organisation’s products/processes/equipment, and relevant food safety hazards. Applies to all products manufactured at Abagold — canned, dried and live abalone — across all processing steps from raw materials to final product dispatch.",
    "roles": "<ul><li>The company ensures all hazards are identified and control measures are in place to achieve control.</li><li>The Food Safety Team is responsible for reviewing the suitability of control measures.</li></ul>",
    "process": "<p><b>HACCP Preliminary Steps</b></p><ul><li><b>Step 1 – Assemble the HACCP Team:</b> a multidisciplinary team led by the Quality Manager, including Production, Maintenance, Food Safety and Management representatives, with collective knowledge of products, processes, equipment, hazards and food safety regulations.</li><li><b>Step 2 – Describe the Product:</b> for each product category (canned, dried, live) a full description is created, including physical/chemical characteristics (pH, brix, salt %, moisture, texture), raw material/ingredient/product contact material characteristics, packaging, storage conditions, shelf life and distribution method.</li><li><b>Step 3 – Identify Intended Use:</b> abalone is intended for general consumption, typically cooked before consumption unless otherwise specified.</li><li><b>Step 4 – Construct the Process Flow Diagram:</b> a detailed flow diagram is prepared for each product category covering intake, shucking, washing, salting, cooking, cooling, filling, seaming, retorting, drying (where applicable), labelling, packing and dispatch.</li><li><b>Step 5 – On-Site Confirmation:</b> the HACCP team performs a physical walk-through to confirm the flow diagram is accurate; deviations are corrected immediately.</li><li><b>Step 6 – List All Potential Hazards:</b> biological, chemical, physical and allergen hazards are identified at each process step.</li><li><b>Step 7 – Conduct Hazard Analysis:</b> each hazard is assessed for severity and likelihood; control measures are identified; hazards requiring CCP/OPRP control are carried forward into the HACCP plan.</li></ul><p><b>HACCP Principles</b></p><ul><li><b>Principle 1 — Hazard Analysis:</b> conducted using the risk assessment matrix; significant hazards requiring control are selected with documented justification.</li><li><b>Principle 2 — Determine CCPs:</b> using the Codex decision tree. Abagold’s CCPs include can seaming integrity and retort processing/Fo value; CCPs may change based on process adjustments and re-evaluation.</li><li><b>Principle 3 — Establish Critical Limits:</b> measurable limits for each CCP (e.g. minimum internal temperature, Fo-value, retort pressure, seam measurements) and action criteria for each OPRP (e.g. temperature, humidity, water activity), validated and approved before implementation by the Food Safety Team.</li><li><b>Principle 4 — Establish Monitoring Procedures:</b> for every CCP, specifying what is monitored, who monitors, frequency, equipment used, and how results are recorded, sufficient to detect loss of control in time to prevent unsafe product.</li><li><b>Principle 5 — Establish Corrective Actions:</b> isolating affected product, evaluating its safety, determining disposition, documenting the corrective action, and preventing recurrence.</li><li><b>Principle 6 — Establish Verification Procedures:</b> internal audits of CCP monitoring, calibration of measuring devices, review of records, review of consumer complaints, environmental and product testing, and validation of retort and cooking processes.</li><li><b>Principle 7 — Documentation and Record Keeping:</b> hazard analysis worksheets, CCP monitoring sheets, verification/validation records, corrective action reports, HACCP team meeting minutes, process flow diagrams, product descriptions, and final product specifications are maintained, controlled and cross-reviewed where necessary, with retention per FSMS document control requirements.</li></ul><p><b>Review, Validation and Updating:</b> the hazard control plan is established, implemented and maintained, with critical limits and action criteria monitored at defined frequencies and validated externally for OPRPs. The plan is reviewed and revalidated annually, when process/equipment changes occur, when new hazards emerge, when customer/regulatory requirements change, and after deviations or incidents; updates are approved by the HACCP team and Management. Hazard identification review mandatorily includes time-temperature hazards, packaging interactions and relevant Codex guidance.</p>",
