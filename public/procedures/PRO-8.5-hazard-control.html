  "sections": [
    {
      "title": "Purpose",
      "html": "<ul><li>To carry out the hazard analysis, preliminary documented information shall be collected, maintained, and updated by the Food Safety Team. This shall include, but not be limited to:</li><li>Applicable statutory, regulatory and customer requirements.</li><li>The organization’s products, processes, and equipment.</li><li>Food safety hazards relevant to the FSMS.</li></ul>"
    },
    {
      "title": "Scope",
      "html": "<ul><li>This procedure applies to all products manufactured at Abagold, including canned abalone, dried abalone, and live abalone, and covers all processing steps from raw materials to final product dispatch.</li></ul>"
    },
    {
      "title": "Responsibilities",
      "html": "<ul><li>The company shall ensure that all hazards are identified and that control measures are in place to achieve control.</li><li>The food safety team is responsible for reviewing the suitability of control measures.</li></ul>"
    },
    {
      "title": "HACCP Preliminary Steps",
      "html": ""
    },
    {
      "title": "Step 1: Assemble the HACCP Team",
      "html": "<ul><li>A multidisciplinary HACCP team is appointed and led by the Quality Manager. The team includes representatives from Production, Maintenance, Food Safety, and Management. The team must collectively have knowledge of products, processes, equipment, hazards, and food safety regulations.</li></ul><p><b>Step 2: Describe the Product</b></p><p>For each abalone product category (canned, dried, live), a full product description is created, including:</p><ul><li>physical and chemical characteristics (pH, brix, salt %, moisture, texture)</li><li>Characteristics of raw materials, ingredients, and product contact materials</li><li>Characteristics of end products</li><li>packaging materials</li><li>storage conditions</li><li>shelf life</li><li>intended distribution method</li></ul><p><b>Step 3: Identify Intended Use</b></p><p>The intended use is identified. Abalone is intended for general consumption, typically cooked before consumption unless otherwise specified.</p>"
    },
    {
      "title": "Step 4: Construct the Process Flow Diagram and description of processes",
      "html": "<p>A detailed flow diagram is prepared for each product category. It includes all steps such as intake, shucking, washing, salting, cooking, cooling, filling, seaming, retorting, drying (where applicable), labelling, packing and dispatch.</p><p><b>Step 5: On-Site Confirmation of the Flow Diagram</b></p><p>The HACCP team performs a physical walk-through of the facility to confirm that the flow diagram accurately reflects the process. Any deviations are corrected immediately.</p>"
    },
    {
      "title": "Step 6: List All Potential Hazards",
      "html": "<p>At each step of the process, all potential hazards are identified:</p><ul><li>biological hazards</li><li>chemical hazards</li><li>physical hazards</li><li>allergen hazards</li></ul><p><b>Step 7: Conduct Hazard Analysis</b></p><p>Each hazard is assessed for severity and likelihood. Severity of the health impact must remain consistent regardless of the process step. However, the likelihood of the hazard occurring can differ at each of the process steps. Control measures are identified. Hazards that require control through CCPs or OPRPs are carried forward into the HACCP plan using Abagold’s hazard analysis methodology.</p>"
    },
    {
      "title": "HACCP Principles",
      "html": ""
    },
    {
      "title": "Principle 1: Conduct a Hazard Analysis",
      "html": "<p>Hazard analysis will be conducted, based on preliminary information, to determine the hazards needed to be controlled in the processing steps. The degree of control shall ensure food safety.</p><p>All identified hazards are analysed using the risk assessment matrix. Significant hazards requiring control are selected. Justification for significance is documented.</p>"
    },
    {
      "title": "Principle 2: Determine the Critical Control Points (CCPs)",
      "html": "<p>The Codex decision tree is used to determine CCPs. For Abagold, the CCPs include:</p><ul><li>can seaming integrity</li><li>retort processing / Fo value\nCCPs may change based on process adjustments and hazard re-evaluation.</li></ul><p><b>Principle 3: Establish Critical Limits</b></p><p>Measurable critical limits are established for each CCP (e.g., minimum internal temperature, Fo-value, retort pressure, seam measurements). Action criteria are established for each OPRP (e.g., temperature, humidity, water activity). Critical limits and action criteria are validated and approved before implementation.</p><p>Validation of control measures shall be done by the food safety team to ensure that the selected control measures can achieve the intended control of significant food safety hazards.</p>"
    },
    {
      "title": "Principle 4: Establish Monitoring Procedures",
      "html": "<p>For every CCP, monitoring procedures specify:</p><ul><li>what is monitored</li><li>who performs monitoring</li><li>monitoring frequency</li><li>equipment used</li><li>how results are recorded</li><li>Monitoring must detect loss of control in time to prevent unsafe product.</li></ul>"
    },
    {
      "title": "Principle 5: Establish Corrective Actions",
      "html": "<p>Corrective actions describe what must be done when CCP monitoring exceeds critical limits. This includes:</p><ul><li>isolating affected product</li><li>evaluating safety of affected product</li><li>determining disposition</li><li>documenting the corrective action</li><li>preventing recurrence</li></ul>"
    },
    {
      "title": "Principle 6: Establish Verification Procedures",
      "html": "<p>Verification activities include:</p><ul><li>internal audits of CCP monitoring</li><li>calibration of measuring devices</li><li>review of records</li><li>review of consumer complaints</li><li>environmental and product testing</li><li>validation of retort and cooking processes</li><li>Verification ensures the HACCP plan works effectively.</li></ul><p>Control measures will be re-assessed or modified if the verification shows that they are not capable of achieving the intended control.</p>"
    },
    {
      "title": "Principle 7: Establish Documentation and Record Keeping",
      "html": "<p>All HACCP documents and records are maintained, controlled and cross-reviewed where necessary, including:</p><ul><li>hazard analysis worksheets</li><li>CCP monitoring sheets</li><li>verification and validation records</li><li>corrective action reports</li><li>HACCP team meeting minutes</li><li>process flow diagrams</li><li>product descriptions</li><li>final product specifications</li><li>Retention time complies with FSMS document control requirements.</li></ul>"
    },
    {
      "title": "Review, Validation, and Updating of the HACCP Plan",
      "html": "<p>A hazard control plan will be established, implemented, and maintained. Critical limits for CCPs and action criteria for OPRPs will be determined and monitored at a defined frequency. Validation of OPRPs will be done externally.</p><p>Actions will be determined when critical limits or action criteria are not met.</p><p>The HACCP plan is reviewed and revalidated:</p><ul><li>annually</li><li>when process or equipment changes occur</li><li>when new hazards emerge</li><li>when customer or regulatory requirements change</li><li>after deviations or incidents</li><li>Updates are approved by the HACCP team and Management.</li></ul><p>The hazard identification review will include mandatory review of time-temperature hazards, packaging interactions, and relevant Codex guidance during HACCP reviews.</p>"
    }
  ],
