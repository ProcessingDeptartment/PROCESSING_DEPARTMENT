    "objective": "To demonstrate top management’s commitment to the operation, maintenance, development and improvement of the Quality and Food Safety System — maintaining focus on customers, establishing quality policy and objectives, defining the Food Safety System structure, ensuring regular Management Reviews, promoting continual improvement, demonstrating leadership, and supporting other relevant management roles.",
    "roles": "<ul><li>Top management is responsible for ensuring this procedure is implemented and followed.</li><li>The Quality Assurance Manager functions as the Management Representative, coordinating integration between quality, safety, legality and other systems, interfacing with management and the food safety team leader.</li><li>Every category of employee has a detailed job description defining specific responsibilities.</li></ul>",
    "process": "<p><b>Management Commitment</b> is evidenced by communication of quality and food safety requirements to all staff, the use of the quality and food safety policy and objectives, conducting Management Reviews, and ensuring adequate resources are available.</p><p><b>Customer Focus:</b> the company ensures customer needs are specified and translated into defined requirements.</p><p><b>Quality &amp; Food Safety Policy:</b> established, approved by management, displayed at strategic points throughout the company, and all employees are trained on its content.</p><p><b>Planning:</b> Quality &amp; Food Safety Objectives are established and reviewed as part of the annual system review and communicated per the Communication Procedure (PRO 7.4); objectives are defined in the FSMS (POL 6.2). Quality planning is defined in the Annual Quality Planning Schedule, considering Quality Management, Product Realisation and Storage, Perimeter, Buildings and Equipment, Supplier Management, and Human Capital Management.</p><p><b>Quality &amp; Food Safety Management System:</b> updated at least annually and whenever changes occur, and includes policies, procedures, work instructions, records and SOPs. A companywide organisation chart (POL 5.3) is maintained identifying reporting lines for all positions.</p><p><b>Management Representation:</b> the Quality Assurance Manager is appointed as Management Representative, as per Organisation Chart and Appointment Letter.</p><p><b>Internal Communication:</b> a formalised process describes how FSMS-related information is communicated between levels (PRO 7.4).</p><p><b>Management Review:</b> held annually, chaired by the Food Safety Team Leader and attended by the top management team, to review ongoing suitability, adequacy and effectiveness of the Quality and Food Safety System, including as a minimum: review of previous actions, internal/external audit results, PRP/OPRP/CCP performance, quality control results and trends, environmental monitoring results, allergen management performance, food safety and quality culture review, food loss and waste review, equipment management and change control review, label management and FSSC logo compliance, supplier performance, customer feedback and complaints, food fraud and food defence review, food safety incidents/recalls/withdrawals, FSMS changes, organisational context review, corrective action review, changes to PRPs, new product/design review, adequacy of resources, verification and validation outcomes, policy review, objectives review, and FSSC BoS decision list changes. The output (minutes and actions) is documented.</p>",
    "review": "This procedure is reviewed as part of the FSMS document review cycle and whenever additional requirements are introduced."
