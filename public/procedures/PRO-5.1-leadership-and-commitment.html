  "sections": [
    {
      "title": "Purpose",
      "html": "<ul><li>The purpose of this document is to demonstrate commitment to operation, maintenance, development and improvement of the Quality and Food Safety System.</li><li>Maintain focus on the company’s customers.</li><li>Establish quality policy and planning objectives and to communicate these to the staff.</li><li>Define the company’s Food Safety System structure.</li><li>Ensure that regular and systematic Management Reviews are held.</li><li>Promoting continual improvement</li><li>Demonstrating leadership, and</li><li>Supporting other relevant management roles</li></ul>"
    },
    {
      "title": "Responsibility",
      "html": "<p>The top management is responsible for ensuring that this procedure is implemented and followed.</p>"
    },
    {
      "title": "Method",
      "html": "<ul><li>Management Commitment</li><li>Management is committed to developing and improving the quality and food safety system as is evidenced by the following activities:</li><li>Communication.</li><li>Informing and making aware to all staff the need for meeting quality and food safety requirement.</li><li>The use of quality and food safety policy and food safety objectives.</li><li>Conducting Management Reviews.</li><li>Ensuring adequate resources are available.</li><li>Customer Focus</li></ul><p>The company ensures that Customer needs are specified and translated into defined requirements.</p><ul><li>Quality &amp; Food Safety Policy</li></ul><p>Quality and Food Safety Policy has been established. This Policy has been approved by management and is displayed at strategic points throughout the company. All employees are trained in the content of the Policy to ensure that it is understood.</p><p><b>Planning</b></p><ul><li>Quality &amp; Food Safety Objectives</li></ul><p>These are established and reviewed as part of the annual Quality and Food Safety system review. They are communicated by means of the mechanisms described in the Communication Procedure.</p><p>The objectives are defined in the Food Safety Management System.</p><ul><li>Quality Planning</li></ul><p>The Quality Plan is defined in Annual Quality Planning Schedule considering the following: Quality Management, Product Realization and Storage, Perimeter, Buildings and Equipment, Supplier Management and Human Capital Management.</p><ul><li>Quality &amp; Food Safety Management System</li></ul><p>The system is updated at least annually and whenever changes occur.</p><p><b>Document Structure</b></p><ul><li>It includes policies, procedures, work instructions, records, and SOPs for all those practices that affect Abagold Ltd. product and service quality &amp; safety.</li></ul>"
    },
    {
      "title": "Organisation Charts",
      "html": "<ul><li>A companywide organisation chart is maintained which identifies reporting lines for all positions within the company.</li><li>Quality and Food Safety Management Representation</li></ul><p>The Quality Assurance Manager functions as the management representative of the system and has been assigned with the food safety and quality control functions as per Organisation Chart and Appointment Letter. The Management Representative coordinates the integration between the functions of quality, safety, legality, and other systems through interfacing with management and obtaining inputs through the system, output on consultation with the food safety team leader.</p><ul><li>Job Descriptions</li></ul><p>Every category of employee has a detailed job description, which details specific responsibilities.</p><ul><li>Management Representative</li></ul><p>The Quality Assurance Manager is appointed as a Management Representative.</p><ul><li>Internal Communication</li></ul><p>An internal communication process is formalized which describes how the Quality and Food Safety Management System related information is communicated between levels in Communication Procedure.</p><p><b>Management Review</b></p><ul><li>Management Reviews are annually and are chaired by the Food Safety Team Leader. These are attended by the top management team. At this meeting, the Quality and Food Safety System is reviewed to ensure its ongoing suitability, adequacy, and effectiveness. Company policies and objectives must be reviewed to assess if they need to change.</li><li>The following areas are reviewed and discussed (as a minimum):</li><li>Review of Previous Management Review Actions</li><li>Internal Audit Results</li><li>External Audit Results (Certification, Regulatory, Customer)</li><li>PRP, OPRP, and CCP Performance</li><li>Quality Control Results &amp; Trends (e.g., pH, salt %, brix %, texture, sensory evaluations, size grading)</li><li>Environmental Monitoring Programme Results &amp; Trends</li><li>Allergen Management Performance</li><li>Food Safety &amp; Quality Culture Review</li><li>Food Loss &amp; Waste Review</li><li>Equipment Management &amp; Change Control Review</li><li>Label Management &amp; FSSC Logo Use Compliance</li><li>Supplier Performance &amp; Raw Material Quality</li><li>Customer Feedback &amp; Complaints</li><li>Food Fraud &amp; Food Defence Review</li><li>Food Safety Incidents, Recalls, or Withdrawals</li><li>Changes Affecting the FSMS (including legislation, process, products, and team changes)</li><li>Management System Review (including organisational context and needs and expectations of interested parties)</li><li>Corrective Action Review</li><li>Changes to PRPs</li><li>New Product / Product Design &amp; Development Review</li><li>Adequacy of Resources</li><li>Verification &amp; Validation Outcomes</li><li>Food Safety and Quality Policy Review</li><li>Review of Objectives</li><li>Changes made on FSSC BoS (Board of Stakeholders) Decision list that impact FSMS</li><li>Overall FSMS Performance &amp; Opportunities for Improvement</li><li>The output of the Management Review (minutes and actions required) is documented.</li></ul>"
    },
