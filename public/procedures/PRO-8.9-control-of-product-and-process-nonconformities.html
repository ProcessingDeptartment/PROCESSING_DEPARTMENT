  "sections": {
    "objective": "To describe the process for corrections taken when critical control limits and action criteria are exceeded, and for eliminating the cause of non-conformances using the corrective action report system.",
    "roles": "<ul><li>Data derived from monitoring of OPRPs and CCPs is evaluated by designated persons who are competent and have the authority to initiate corrections and corrective actions.</li><li>Management designates persons with sufficient knowledge and authority to initiate corrective actions.</li><li>The Quality Manager is responsible for tracking Corrective Action Requests and maintaining the database.</li></ul>",
    "process": "<p>When monitoring shows critical control limits at CCPs exceeded or OPRP action criteria not met, correction is carried out immediately — affected products are identified and controlled regarding use and release. The Hazard Control Plan and Corrective Action Request record identify the planned correction and responsibilities. Appropriate actions identify and eliminate the cause of detected non-conformities to prevent reoccurrence and return the process/system to control, including: reviewing non-conformities (including customer complaints); reviewing monitoring trends indicating loss of control; determining causes; evaluating the need for action; determining and implementing needed actions; recording results; and reviewing effectiveness. The Quality Manager records all Corrective Actions on the Corrective Action Log to identify trends.</p><p><b>Corrections:</b> a corrective action is initiated when critical limits at CCPs are exceeded, OPRP action criteria are not met, an auditor identifies non-conformances during internal/second-party/third-party audits, customer complaints are received, meetings identify follow-up actions, or an incident with potential food safety impact is reported. Where CCP limits are not met, affected product is handled per the Handling of Potentially Unsafe Products procedure; where OPRP action criteria are not met, the consequences and cause of failure are determined and affected products handled accordingly.</p><p><b>Corrective Actions:</b> need is evaluated when CCP limits or OPRP action criteria are not met. The CAR specifies actions to identify and eliminate the cause, prevent reoccurrence, and return the process to control, including reviewing non-conformities/complaints/inspection reports, reviewing monitoring trends, determining causes, implementing preventive actions, documenting results, and verifying effectiveness. The relevant responsible manager completes a Corrective Action Request form; responsibility for review and close-out is agreed with the relevant section manager and recorded on the CAR form. The root cause is identified and recorded to conclude a suitable preventive action plan. The initiator, HACCP team or designated manager reviews the suitability of corrective actions for close-out. A unique ID code is recorded for each non-conformance, summarised on a Corrective Action Log to identify trends; the log is reviewed at Management Review.</p>",
    "review": "This procedure is reviewed periodically as part of the FSMS document review cycle."
