  "sections": [
    {
      "title": "Purpose",
      "html": "<p>This procedure describes the process for corrections taken when critical control limits and action criteria are exceeded and for eliminating the cause of non-conformances using the corrective action report system.</p>"
    },
    {
      "title": "Responsibilities",
      "html": "<ul><li>The organization shall ensure that data derived from the monitoring of OPRPs and at CCPs are evaluated by designated persons who are competent and have the authority to initiate corrections and corrective actions.</li><li>Management is responsible for designating a person(s) with sufficient knowledge and authority to initiate corrective actions.</li><li>It is the responsibility of the Quality Manager to track the Corrective Action Requests and maintain the database according to this procedure.</li></ul>"
    },
    {
      "title": "Instructions",
      "html": "<ul><li>When monitoring shows that critical control limits at CCPs has been exceeded or action criteria for OPRP are not met, correction shall be carried out immediately – products affected are identified and controlled with regard to their use and release.</li><li>The Hazard Control Plan and Corrective Action Request record identify the planned correction and responsibilities.</li><li>The company shall ensure that appropriate actions are taken to identify and eliminate the cause of the detected non-conformities, to prevent reoccurrence and to bring the process or system back into control after non-conformity is encountered.</li></ul><p>3.3.1 \tThese actions include:</p><ul><li>Reviewing non-conformities (including customer complaints),</li><li>Reviewing trends in monitoring results that may indicate development towards loss of control,</li><li>Determining the cause(s) of non-conformities,</li><li>Evaluating the need for action to ensure that non-conformities do not reoccur,</li><li>Determining and implementing the actions needed,</li><li>Recording the results of corrective actions taken, and</li><li>Reviewing corrective actions taken to ensure that they are effective.</li><li>The Quality manager must record all Corrective Actions on the Corrective Action Log to help identify trends of non-conformance.</li></ul>"
    },
    {
      "title": "Corrections",
      "html": "<ul><li>Designated individuals initiate a corrective action when:</li><li>Critical limits at CCPs are exceeded</li><li>Action criteria at OPRPs are not met</li><li>The auditor initiates a corrective action for non-conformances identified during internal, second party and third-party audits</li><li>Customer complaints are received</li><li>Management, Food Safety and production meetings identify the requirement for follow up actions to maintain and improve the Food Safety System</li><li>Any incidents are reported that will have a potential impact on the safety of the product.</li><li>When critical limits at CCPs are not met, affected product shall be identified and handled according to the Handling of Potentially Unsafe Products procedure.</li><li>Where action criteria for an OPRP are not met, the following shall be carried out:</li><li>Determination of the consequences of that failure with respect to food safety</li><li>Determination of the cause of failure</li><li>Identification of affected products and handling in accordance with Potentially Unsafe Products.</li><li>When monitoring shows an operational PRP or CCP is out of control, corrective action is taken immediately.</li><li>The Hazard Control Plan identifies the planned correction and responsibilities.</li></ul>"
    },
    {
      "title": "Corrective Actions",
      "html": "<ul><li>The need for corrective actions shall be evaluated when critical limits at CCPs and/or action criteria at OPRPs are not met.</li><li>The CAR will specify appropriate actions to identify and eliminate the cause of detected non-conformities, to prevent reoccurrence, and to return the process to control after a non-conformity is identified.</li><li>These actions shall include:</li><li>Reviewing non-conformities identified by customers and/or customer complaints and /or regulatory inspection reports.</li><li>Reviewing trends in monitoring results that can indicate loss of control</li><li>Determining the cause(s) of non-conformities</li><li>Determining and implementing actions to ensure that non-conformities do not recur</li><li>Documenting the results of corrective actions taken</li><li>Verifying corrective actions taken to ensure that they are effective.</li><li>The relevant responsible manager fills out a Corrective Action Request form to initiate corrective action.</li><li>Responsibility for review and clear out of the identified non-conformance will be agreed with the relevant section manager and recorded on the CAR form.</li><li>The root cause of the non-conformance must be identified and recorded to conclude a suitable preventive action plan to prevent reoccurrence of the non-conformance.</li><li>The initiator, HACCP team or designated individual from management shall review the suitability of corrective actions for close out purposes.</li><li>A unique identification code will be recorded for each non-conformance identified.</li><li>Each non-conformance recorded on the CAR form will be summarised on a Corrective Action Log to help identify trends in occurrence.</li><li>The NC log will be reviewed at the Management Review meeting.</li></ul>"
    },
