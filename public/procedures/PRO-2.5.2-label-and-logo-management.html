  "sections": [
    {
      "title": "1. Purpose",
      "html": "<p>To ensure that all product labels are accurate, compliant with regulatory and customer requirements, and controlled under a documented procedure. This includes the proper management of the FSSC 22000 logo in line with certification rules.</p>"
    },
    {
      "title": "2. Scope",
      "html": "<p>This procedure applies to all labels used on Abagold products, including:</p><ul><li>Canned abalone labels</li><li>Dried abalone labels</li><li>Live abalone packaging labels</li><li>Any labels or artwork used on secondary packaging, cartons, or promotional material that refer to certification.</li></ul>"
    },
    {
      "title": "3. Responsibilities",
      "html": "<ul><li>Marketing Manager / Product Development Team: Responsible for creating and designing product labels.</li><li>Quality Manager: Reviews labels for compliance with food safety, regulatory, allergen, and quality requirements.</li><li>Managing Director (or delegated Senior Manager): Final approval authority for new or revised labels.</li><li>Food Safety Team: Reviews labels as part of specification reviews to ensure alignment with food safety requirements.</li></ul>"
    },
    {
      "title": "4. Label Design & Approval Process",
      "html": "<ul><li>Design: Labels are drafted by the Marketing and Sales Manager or designated graphic designer in line with customer and regulatory requirements.</li><li>Compliance Review: Quality Manager verifies:</li><li>Product name and description</li><li>Ingredient list, allergens, additives, and processing aids</li><li>Net weight and drained weight declarations</li><li>Storage and preparation instructions</li><li>Date coding and traceability information</li><li>Regulatory and customer labelling requirements (South African labelling legislation, export market requirements).</li></ul><p><b>Approval:</b></p><ul><li>Quality Manager signs off for compliance.</li><li>Marketing &amp; Sales Manager (or delegate) provides final approval before printing.</li></ul><p><b>Version Control:</b></p><ul><li>Each approved label is assigned a version number and stored in the controlled document system.</li><li>Obsolete labels are withdrawn, clearly marked “OBSOLETE,” and securely disposed of to prevent accidental use.</li></ul>"
    },
    {
      "title": "5. Label Review Frequency",
      "html": "<ul><li>Labels must be formally reviewed at least every 3 years.</li><li>Additional reviews must take place when:</li><li>There are product formulation changes (e.g., salt % or additives).</li><li>There are regulatory or market requirement changes.</li><li>There are customer requests for modifications.</li><li>A non-conformity, recall, or complaint indicates labelling issues.</li></ul>"
    },
    {
      "title": "6. Printing and Storage Control",
      "html": "<ul><li>Labels may only be printed by approved suppliers.</li><li>Printed labels are received under controlled conditions, checked against the approved master copy, and stored securely to prevent mix-ups.</li><li>Only the current approved version may be used in production.</li></ul>"
    },
    {
      "title": "7. Use of the FSSC 22000 Logo (Requirement 2.5.5)",
      "html": "<ul><li>The FSSC 22000 logo will only be used in marketing materials, websites, brochures, or corporate communications to show certification.</li><li>The logo will not be used directly on product labels, packaging, or in a way that implies the certification applies to the product itself.</li><li>Any use of the FSSC logo will comply with the official FSSC 22000 Logo Guidelines.</li><li>The Quality Manager is responsible for ensuring compliance before any public use.</li></ul>"
    },
    {
      "title": "8. Records",
      "html": "<ul><li>Approved label master files (electronic and/or printed).</li><li>Approval forms signed by Quality Manager and Managing Director.</li><li>Label review records and meeting minutes.</li><li>Disposal records for obsolete labels.</li></ul>"
    },
