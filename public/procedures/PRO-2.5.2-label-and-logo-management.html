  "sections": {
    "objective": "To ensure that all product labels are accurate, compliant with regulatory and customer requirements, and controlled under a documented procedure, including proper management of the FSSC 22000 logo in line with certification rules.",
    "roles": "<ul><li><b>Marketing Manager / Product Development Team:</b> creates and designs product labels.</li><li><b>Quality Manager:</b> reviews labels for compliance with food safety, regulatory, allergen and quality requirements, and signs off before printing.</li><li><b>Managing Director (or delegated Senior Manager):</b> final approval authority for new or revised labels.</li><li><b>Food Safety Team:</b> reviews labels as part of specification reviews for alignment with food safety requirements.</li></ul>",
    "process": "<p><b>Design:</b> labels are drafted by the Marketing and Sales Manager or a designated graphic designer per customer and regulatory requirements.</p><p><b>Compliance Review:</b> the Quality Manager verifies product name/description, ingredient list, allergens, additives and processing aids, net/drained weight declarations, storage and preparation instructions, date coding and traceability information, and regulatory/customer labelling requirements (South African labelling legislation, export market requirements).</p><p><b>Approval:</b> the Quality Manager signs off for compliance; the Marketing &amp; Sales Manager (or delegate) provides final approval before printing.</p><p><b>Version Control:</b> each approved label is assigned a version number and stored in the controlled document system; obsolete labels are withdrawn, marked \"OBSOLETE\", and securely disposed of.</p><p><b>Review Frequency:</b> labels are formally reviewed at least every 3 years, and additionally whenever there is a product formulation change (e.g. salt % or additives), a regulatory/market requirement change, a customer request for modification, or a non-conformity/recall/complaint indicating labelling issues.</p><p><b>Printing and Storage Control:</b> labels are printed only by approved suppliers; printed labels are received under controlled conditions, checked against the approved master copy, and stored securely to prevent mix-ups. Only the current approved version may be used in production.</p><p><b>Use of the FSSC 22000 Logo (Requirement 2.5.5):</b> the logo is used only in marketing materials, websites, brochures or corporate communications to show certification — not directly on product labels or packaging, or in a way implying certification applies to the product itself. Any use complies with the official FSSC 22000 Logo Guidelines; the Quality Manager ensures compliance before any public use.</p>",
    "review": "Labels are formally reviewed at least every 3 years, or sooner when triggered by formulation, regulatory, customer or non-conformity events."
