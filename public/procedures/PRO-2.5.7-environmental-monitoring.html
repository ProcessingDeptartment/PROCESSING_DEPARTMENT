  "sections": [
    {
      "title": "Purpose",
      "html": "<p>This procedure outlines the Environmental Monitoring Program (EMP) for Abagold’s abalone processing facility, designed to comply with the FSSC 22000 guidance document. The EMP ensures that food safety risks associated with microbial contamination are controlled by monitoring high-risk areas and applying corrective actions when necessary. This document will serve as both a training resource and a step-by-step guide to help staff understand and execute effective monitoring.</p>"
    },
    {
      "title": "Objective of the EMP",
      "html": "<p>The objective of this EMP is to prevent microbial contamination within the abalone processing facility by routinely monitoring designated zones and taking necessary actions to maintain a safe and hygienic environment.</p>"
    },
    {
      "title": "Importance of Environmental Monitoring",
      "html": "<p>Microbial contamination can occur in food processing environments, posing risks to consumer safety. By monitoring the environment, we can detect potential contamination sources early and take corrective measures to prevent foodborne illnesses.</p>"
    },
    {
      "title": "Facility Zones and Risk Matrix",
      "html": "<p>The facility is divided into zones based on contamination risk levels. Each zone is defined by its proximity to food and the likelihood of contamination.</p>"
    },
    {
      "title": "Risk Matrix Overview: high = 9 (Zone 1), medium-high = 7-8, medium = 5-6, low = 3-4",
      "html": "<table class=\"proc-table\"><tr><th>Risk Factor</th><th>High Risk (3)</th><th>Medium Risk (2)</th><th>Low Risk (1)</th></tr><tr><td>Traffic Patterns</td><td>Heavy movement between Zones 1 and 2, increasing cross-contamination risk.</td><td>Controlled movement between zones with less exposure to product contact.</td><td>Minimal movement in non-critical areas (e.g., Zone 4).</td></tr><tr><td>Moisture Levels</td><td>Areas with persistent condensation (e.g., under cooling units).</td><td>Periodic moisture presence with regular cleaning.</td><td>Dry areas with controlled humidity.</td></tr><tr><td>Historical Data/ Industry Trends</td><td>Documented incidents of contamination (e.g., Salmonella outbreaks).</td><td>Occasional minor contamination events.</td><td>No recorded contamination incidents.</td></tr></table>"
    },
    {
      "title": "Reference: Environmental Monitoring Risk Assessment & Sampling Plan",
      "html": ""
    },
    {
      "title": "Environmental Monitoring Risk Assessment",
      "html": "<table class=\"proc-table\"><tr><th>high = 9 (Zone 1)</th><th>medium-high = 7-8 (Zone 2)</th><th>medium = 5-6 (Zone 3)</th><th>low = 3-4 (Zone 4)</th></tr></table><table class=\"proc-table\"><tr><th>Area</th><th>Traffic Patterns</th><th>Moisture Levels</th><th>Historical Data/ Industry Trends</th><th>Risk Rating</th><th>Zone Class</th></tr><tr><td>Entrance areas x 3</td><td>2</td><td>2</td><td>1</td><td>5</td><td>Zone 3</td></tr><tr><td>Shucking area</td><td>2</td><td>3</td><td>2</td><td>7</td><td>Zone 2</td></tr><tr><td>Live sorting area</td><td>1</td><td>2</td><td>1</td><td>4</td><td>Zone 4</td></tr><tr><td>Live holding area</td><td>1</td><td>2</td><td>1</td><td>4</td><td>Zone 4</td></tr><tr><td>Live packing area</td><td>2</td><td>2</td><td>2</td><td>6</td><td>Zone 3 and some Zone 1</td></tr><tr><td>Washing and salting area</td><td>2</td><td>3</td><td>2</td><td>7</td><td>Zone 2</td></tr><tr><td>Dry &amp; sauce cooking area</td><td>2</td><td>2</td><td>1</td><td>5</td><td>Zone 3 and some Zone 1</td></tr><tr><td>Dry room</td><td>1</td><td>1</td><td>1</td><td>3</td><td>Zone 4</td></tr><tr><td>Scrubbing area</td><td>3</td><td>2</td><td>2</td><td>7</td><td>Zone 2 with some Zone 1</td></tr><tr><td>Chillers and freezer</td><td>2</td><td>3</td><td>2</td><td>7</td><td>Zone 2</td></tr><tr><td>Canning and retort area</td><td>3</td><td>3</td><td>3</td><td>9</td><td>Zone 1</td></tr><tr><td>FG02</td><td>1</td><td>1</td><td>1</td><td>3</td><td>Zone 4 and some Zone 3</td></tr><tr><td>Dry grading room</td><td>1</td><td>1</td><td>1</td><td>3</td><td>Zone 4</td></tr><tr><td>Raw material &amp; Packaging store</td><td>1</td><td>1</td><td>1</td><td>3</td><td>Zone 4</td></tr><tr><td>Canteen &amp; locker rooms</td><td>1</td><td>1</td><td>1</td><td>3</td><td>Zone 4</td></tr><tr><td>Chemical storeroom</td><td>1</td><td>1</td><td>1</td><td>3</td><td>Zone 4</td></tr><tr><td>Factory office</td><td>1</td><td>1</td><td>1</td><td>3</td><td>Zone 4</td></tr></table>"
    },
    {
      "title": "Zone Definitions and Risk Rating",
      "html": "<table class=\"proc-table\"><tr><th>Zone</th><th>Risk</th><th>Definition</th></tr><tr><td>Zone 1<br>Direct product contact / high-risk</td><td>Highest — any contamination directly contaminates product.</td><td>All food-contact surfaces and tools that directly contact abalone (post-lethality RTE surfaces included). Examples: conveyor contact belts, canning seamer surfaces, cooking pots, cutting blades, sieves, packaging surfaces, trays, belts, product tables, live-pack packing surfaces, seamer head, manual trimming tools, food-contact areas of retorts.</td></tr><tr><td>Zone 2<br>Adjacent non-food contact near product</td><td>Medium–high — can be transferred to Zone 1 by people/equipment.</td><td>Non-contact surfaces inside production rooms close to product handling: control panels, chiller door handles, trolley handles, equipment frames, motor housings, overhead rails, switchgear near processing lines.</td></tr><tr><td>Zone 3<br>Processing environment / plant infrastructure</td><td>Medium — environmental reservoir for spoilage organisms.</td><td>Non-processing surfaces in the production area but not adjacent to product lines: floors (away from direct contact areas but inside processing room), drains, drains’ grating, walls, ceilings, storage bin exteriors, storage room doors.</td></tr><tr><td>Zone 4<br>Non-processing / support areas</td><td>Low — can introduce pathogens via people but lower immediate product risk.</td><td>Locker rooms, canteen, offices, corridors, external loading bays, quality lab benches.</td></tr></table>"
    },
    {
      "title": "Reference: Environmental Monitoring Plan REC 2.5.7",
      "html": ""
    },
    {
      "title": "5. \tSampling Plan",
      "html": ""
    },
    {
      "title": "Sampling frequency and sample counts:",
      "html": "<table class=\"proc-table\"><tr><th>Location</th><th>Frequency</th><th>Sample count</th><th>Tests</th><th>Acceptance</th></tr><tr><td>Zone 1 (high risk — product contact)</td><td>Monthly validation</td><td>4 swabs per month (choose highest risk contact points; rotate to cover all equipment over the month)</td><td>Listeria spp. (L. monocytogenes confirmation), TPC, Salmonella spp.</td><td>Listeria spp. — Not detected; <br>Salmonella spp. — Not detected; <br>TPC— &lt;100 cfu per swab</td></tr><tr><td>Zone 2 (adjacent non-contact)</td><td>Bi-Monthly validation</td><td>4 swabs every second month (representative locations).</td><td>TPC, Escherichia Coli</td><td>TPC— &lt;100 cfu per swab;<br>Escherichia Coli— Not detected</td></tr><tr><td>Zone 3 (processing environment)</td><td>Monthly monitoring of drains; Quarterly verification of other areas depending on historical performance.</td><td>2 swabs per month (drains)<br>4 swabs per quarter (floors, walls, bin exteriors).</td><td>Drain swabs for Listeria spp. (L. monocytogenes confirmation;<br>TPC, Escherichia Coli.</td><td>Listeria spp. — Not detected; <br>TPC— &lt;100 cfu per swab;<br>Escherichia Coli— Not detected</td></tr><tr><td>Zone 4 (non-processing)</td><td>Bi-Annually (or annually if very low risk).</td><td>2–4 swabs per six months.</td><td>TPC, Escherichia Coli.</td><td>TPC— &lt;100 cfu per swab;<br>Escherichia Coli— Not detected</td></tr></table>"
    },
    {
      "title": "Sample types & methods",
      "html": "<ul><li>Surface swabs: Standardised area (e.g., 25 cm²)</li><li>Drain samples: Use specific drain swabs (sponge swabs) and test for Listeria spp. monthly.</li><li>Air samples: Use agar air plates for a Total Plate Count (TPC), expose sterile, pre-poured plates with the correct agar medium (like nutrient agar) to the air for a specific time, typically 10-15 minutes (e.g., dry rooms / freeze driers);</li></ul>"
    },
    {
      "title": "Target organisms and alert/action limits",
      "html": "<ul><li>Listeria spp. (environmental)</li><li>Action: Any detection of Listeria spp. in Zone 1 → immediate hold on affected area, deep clean, re-swab, product assessment.</li><li>Zone 2/3: detection → escalate to increased cleaning and targeted Z1 sampling.</li><li>Listeria monocytogenes</li><li>Action: Any detection anywhere → escalate to plant hold, product hold &amp; investigation / recall assessment as per procedure.</li><li>Escherichia coli</li><li>Action: Any detection of E.coli. in Zone 1 → immediate hold on affected area, deep clean, re-swab, product assessment.</li><li>Zone 2/3: detection → escalate to increased cleaning and targeted Z1 sampling.</li><li>Salmonella spp.</li><li>Action: Any detection of Salmonella spp. in Zone 1 → immediate hold on affected area, deep clean, re-swab, product assessment.</li><li>Zone 2/3: detection → escalate to increased cleaning and targeted Z1 sampling.</li><li>Total Plate Count (TPC)</li><li>Alert level: &gt;100 cfu per swab→ review cleaning; increased sampling.</li></ul>"
    },
    {
      "title": "Evaluation of Results, Corrective action & escalation",
      "html": "<p>Results must be analysed to ensure they fall within safe and acceptable limits. Any detection of pathogens or high levels of hygiene indicators will prompt immediate corrective actions, such as intensified cleaning, employee retraining, or process adjustments.</p><ul><li>Alert level exceeded (e.g., TPC &gt;100 cfu per swab):</li><li>Action: Increase frequency of cleaning for that area; re-swab, increase sampling. Log the incident in EMP log.</li><li>Action level exceeded (e.g., Listeria spp. &gt; action limit):</li><li>Action: Stop production on affected line if contamination source is directly linked to product touchpoints; perform deep sanitation; full clean verification; product review for affected batches; inform Senior Management. Re-sampling required and documented before restart.</li><li>Pathogen detected (Listeria spp. / Salmonella / L. monocytogenes):</li><li>Action: Immediate line hold; isolate product, hold suspect lots; escalate to Emergency Response Team; notify Regulatory and customers if required; perform full root-cause investigation; verify corrective actions via external lab if required. Document all actions and outcomes.</li><li>Persistent positive trend (&gt;= 3 fails in 30 days at same location):</li><li>Action: Full review including maintenance, equipment design, traffic flow, staff hygiene; engineer permanent controls (e.g., replace/modify equipment); retrain staff.</li></ul><p>Record all corrective actions, person responsible, date completed and verification results.</p>"
    },
    {
      "title": "9.\tTrending & Review",
      "html": "<ul><li>Monthly QA review: compile monthly EMP report showing % passes/fails, trending graphs, hotspot mapping.</li><li>Annual management review: include EMP outcomes, corrective actions, resource needs and changes to sampling frequency.</li><li>Trigger-based increases:</li></ul><p>The environmental monitoring plan is evaluated against the following triggers; these events will cause temporary intensification of sampling (double sample counts for 4 weeks after an incident):</p><ul><li>Changes: Significant changes related to products, process or legislation</li><li>Improvements: Equipment maintenance or construction work</li><li>Positive Trend: No positive testing results have been obtained over an extended period.</li><li>Microbiological Outbreaks or Incidents: foodborne illness outbreaks or microbiological contamination incidents.</li><li>Data Analysis and Trends: microbiological data (out of specification results) and identifying trends, such as recurring contaminants, specific facility location or related to both intermediate and finished products.</li><li>Pathogen Detection: Repeat detection of pathogens during routine environmental monitoring</li><li>New Microbiological Hazards: newly discovered microbiological hazards or pathogens.</li><li>Supplier Changes: changes in suppliers of raw materials prone to microbiological contamination.</li><li>Alerts, Product Recalls or Withdrawals: food recalls or withdrawals linked to microbiological hazards.</li><li>Internal Audit Findings: identified gaps and improve processes on issues related to microbiological hazards.</li><li>Customer Complaints or Feedback: customer complaints about foodborne illnesses or microbial contamination.</li></ul>"
    },
    {
      "title": "Validation & verification",
      "html": "<ul><li>Initial validation: When starting EMP or when adding a new line/equipment, perform an initial validation plan (intensive sampling over several weeks) to set baseline limits.</li><li>Method verification: confirm swab area and lab method (e.g., ISO / USDA / AOAC method references) and record choice in procedure.</li><li>External lab testing: for pathogens or confirmation, use accredited lab and retain certificates.</li></ul>"
    },
    {
      "title": "Training and Compliance",
      "html": "<p>Training sessions will be conducted for staff to understand the importance of environmental monitoring, sampling techniques, and response actions. Regular training updates will be provided to ensure compliance with FSSC 22000 requirements.</p>"
    }
