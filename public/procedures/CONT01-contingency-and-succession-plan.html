  "baselineDate": "30/11/2024",
  "sections": {
    "objective": "To provide guidelines allowing Abagold Ltd to protect resources, minimise customer inconvenience, and identify key staff with specific responsibilities in the context of recovery. This procedure is applicable to Abagold Ltd Management. Refer to the Emergency Preparedness and Response Procedure (PRO 8.4) for handling sudden or unexpected situations including Red Tide, pandemics, natural disasters and IT infrastructure failure; this Plan is revised when shortcomings become known during drills or after an actual emergency.",
    "roles": "<ul><li>Management is responsible for maintaining and executing the succession plan and site-arrangement stand-in structure.</li><li>The Emergency Controller allocates cleaning personnel to clear drainage during firefighting recovery and communicates with the waste service provider, and identifies a separate area for waste collection during salvage and recovery.</li></ul>",
    "process": "<p><b>Definitions:</b> Salvage — to rescue or save; Contingency — provision for a possible event or circumstance; Succession — identifying people with potential to fill key business leadership positions.</p><p><b>Salvage and Recovery:</b> activities commence only once the initial emergency is under control to the point that no persons, biological assets, infrastructure, equipment, finished product or documentation are exposed to further injury, damage, pollution or contamination. Separation priority: persons; then biological assets; then inventory including work in progress; then equipment not damaged or contaminated.</p><p><b>Contingency for Biological Assets:</b> initiate the Adverse Water Quality system to minimise impact on stock; periodically test recirculation water quality; possible harvest of biological assets to warehouse product.</p><p><b>Energy Contingency:</b> execute the back-up generator protocol during load shedding or blackouts; ensure sufficient diesel supply for extended outages; possible harvest of biological assets to warehouse product.</p><p><b>Infrastructure Contingency:</b> offsite facilities and server accessed per SLA; IT disaster recovery plan implemented with skeleton staff; non-key staff work from home.</p><p><b>Processing Contingency:</b> food safety, hygiene and employee safety remain priorities at all times; additional stock is kept on hand for resource shortages; processing ceases if there is a shortage of production specialists; office staff work from home.</p><p><b>Succession Plan:</b> a succession plan is in place for top management and key personnel to ensure business decision-making continues, with defined site arrangements for daily stand-in across senior roles (MD, CFO, Marketing Manager, Engineering Manager, COO, Research Manager, Production Manager, IT Manager and Financial Controller).</p>",
    "review": "This Plan and the Emergency Procedure are revised when shortcomings become known during drills, or after an actual emergency."
