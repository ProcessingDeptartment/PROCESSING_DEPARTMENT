    {
      "title": "Purpose",
      "html": "<ul><li>To establish a protocol for the market withdrawal and/or recall of finished products. Abagold systems are in place to identify, locate and remove, from all necessary points of the supply chain, product failing to meet required food safety standards.</li></ul>"
    },
    {
      "title": "Responsibility",
      "html": "<p>The Recall Committee is responsible for directing all company communication regarding the recalled product, ensuring that all recalled product has been collected/returned and responding to all customer questions, concerns and complaints.</p>"
    },
    {
      "title": "Withdrawal Requirements",
      "html": "<ul><li>A list of key contacts in the event of a withdrawal is maintained and key members are appointed. All affected customer(s) are notified immediately of withdrawal situations.</li><li>Where product is withdrawn due to immediate health hazards, the food safety of other food products produced under the same conditions is also evaluated.</li></ul><p>3.1   Type of Classification:</p><ul><li>Class 1: A situation where there is a reasonable probability that the use of, or exposure to, a volatile product will cause serious adverse health consequences or death.</li><li>Class 2: A situation where the use of, or exposure to, a volatile product may cause temporary or medically reversible adverse health consequences or where the probability of serious adverse health consequences is remote.</li><li>Class 3: A Situation where the use of exposure to, a volatile product is not likely to cause adverse health consequences.</li></ul>"
    },
    {
      "title": "Procedure",
      "html": "<ul><li>When communication has been received indicating a contaminated product or raw material has been released for sale or used, a full traceability of the product or raw material shall be conducted.</li><li>The recall/traceability committee shall be contacted immediately, and a meeting will be set up to initiate the product withdrawal or recall. During this meeting responsibilities will be determined and the timeline set.</li><li>If the product has left the control of the company, the appointed personnel notify all interested parties and initiate a withdrawal.</li><li>The local authorities, clients and, if necessary, supplier(s) and certification body shall be contacted and informed of the contaminated product.</li><li>The clients and/or supplier(s) shall be instructed to determine how much each product has been sold to consumers to reconcile stock.</li><li>Details recorded as part of the investigation shall include all detail / proof as part of tracing all materials back to the raw material supplier.</li><li>Feedback regarding the withdrawal process and investigation regarding the cause and preventive actions shall be reported to Senior Management and affected clients as soon as possible within a maximum time frame of 72 hours.</li><li>The affected product shall either be collected by the company from the client or request the client to destroy the product. Verification testing shall be done on products returned to the company by an independent, SANAS accredited laboratory to determine the extent of contamination.</li><li>Product under evaluation that is still under the control of the company will be identified and segregated in a dedicated, clearly marked quarantine area to avoid unauthorized use or accidental release.</li><li>Disposal of product will be recorded on the Disposal Investigation record.</li><li>Appointed personnel will determine through the investigation if the product:</li><li>is safe for the intended use;</li><li>should be used for purposes other than originally intended;</li><li>could be reprocessed in a manner to ensure it becomes food safe;</li><li>should be destroyed.</li><li>contaminated food products that are deemed unsafe for human consumption shall not be reworked and shall be rejected and destroyed.</li><li>A simulation exercise (mock recall) must be conducted to verify that the system can effectively identify, locate, and remove affected products from the supply chain.</li><li>Mock recalls shall be initiated and documented on the Withdrawal Record at least annually for each product, tracing all raw materials, packaging and production records from supplier to client.</li><li>All production records and other necessary documents related to the batch should be retrieved within 4 hours of initiation of the mock recall.</li><li>All records and correspondence must be attached to the documented mock recall.</li><li>The effectiveness of the mock recall and traceability system will be verified as part of the Internal Audit program.</li><li>The cause, extent and result of withdrawal, including mock recalls, will be discussed and reviewed as part of the Management Review process. This information includes:</li><li>Exact quantity of product manufactured (number of units)</li><li>Quantity still in stock</li><li>Quantity dispatched</li><li>Quantity at clients (product that can be brought back to manufacturer).</li><li>Recall Percentage</li></ul>"
    },
    {
      "title": "Communication Plan",
      "html": "<table class=\"proc-table\"><tr><th>Product Recall – Customer Identified</th><th>Product Recall – Customer Identified</th><th>Product Recall – Customer Identified</th></tr><tr><td>Procedure</td><td>Responsibility</td><td>Action</td></tr><tr><td>Receive notification</td><td>Sales Team</td><td>Customers send complaints via sales team or company contact</td></tr><tr><td>Identify product</td><td>Quality Manager</td><td>Production codes provide details of all customers that received the identified product. </td></tr><tr><td>Conduct traceability </td><td>Traceability Team</td><td>Immediately investigate and segregate the affected product(s).<br>All customers that received affected products are contacted and informed to mark the product with “DO NOT USE - RECALLED” sticker and segregated.</td></tr><tr><td>Assess risk</td><td>Quality Manager</td><td>What constitutes an incident must first be established based on risk assessment by scientific evaluation of known/potential adverse health effects resulting from exposure to food hazards or risk. The method is decided at the time of incident as there are different types of hazards and risks.</td></tr><tr><td>Communicate/Recover<br>Act based on risk</td><td>Managing Director/ Sales Manager</td><td>Possible actions: <br>Communication with the customers is done by the Managing Director and or the Sales Manager.<br>Contact details of all interested parties and customer contact list are stored on file.<br>Return recall product. Once at premises, it will be segregated to quarantine area. <br>All remaining raw materials in the batch received to be evaluated and decided on, action based on the result of the risk assessment. </td></tr><tr><td>Corrective Action </td><td>Quality Manager</td><td>Review of recalls to conduct root cause analysis and implement appropriate improvements.</td></tr></table><table class=\"proc-table\"><tr><th>Product Recall - Internally Identified</th><th>Product Recall - Internally Identified</th><th>Product Recall - Internally Identified</th></tr><tr><td>Procedure</td><td>Responsibility</td><td>Action</td></tr><tr><td>Receive notification</td><td>Sales Team</td><td>Incident identified via Incident management procedure</td></tr><tr><td>Identify product</td><td>Quality Manager</td><td>Distributed product: Production code provides details of all customers that received the identified product. </td></tr><tr><td>Conduct traceability </td><td>Traceability team</td><td>Immediately investigate and segregate the affected product(s).<br>Distributed Product: All customers that received affected products are contacted and informed to mark the product with “DO NOT USE - RECALLED” sticker and segregated.</td></tr><tr><td>Assess risk</td><td>Quality Manager</td><td>What constitutes an incident must first be established based on risk assessment by scientific evaluation of known/potential adverse health effects resulting from human exposure to food borne hazards or in non-food sense identification. The method is decided at the time of incident as there are different types of hazards and risks.</td></tr><tr><td>Communicate/Recover<br>Act based on risk</td><td>Managing Director/ Sales Manager</td><td>All remaining products in the batch received to be evaluated and decided on action based on the result of the risk assessment Distributed Products.<br>Communication with the customers is done by the Managing Director and or the Sales Manager.<br>Contact details of all interested parties and customer contact list are stored on file.<br>Return recalled product. Once at premises, it will be segregated to quarantine area.<br>All remaining raw materials in the batch received to be evaluated and decided on action based on the result of the risk assessment.</td></tr><tr><td>Corrective Action</td><td>Quality Manager</td><td>Review of recalls to conduct root cause analysis and implement appropriate improvements.</td></tr></table>"
    },
