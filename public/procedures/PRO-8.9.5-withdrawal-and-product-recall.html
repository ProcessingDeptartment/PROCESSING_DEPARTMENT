  "sections": {
    "objective": "To establish a protocol for the market withdrawal and/or recall of finished products, enabling Abagold to identify, locate and remove from all necessary points of the supply chain any product failing to meet required food safety standards.",
    "roles": "<ul><li>The Recall Committee directs all company communication regarding recalled product, ensures all recalled product is collected/returned, and responds to customer questions, concerns and complaints.</li><li>A list of key contacts is maintained and key members are appointed; affected customers are notified immediately of withdrawal situations.</li></ul>",
    "process": "<p><b>Classification of Withdrawal:</b></p><ul><li><b>Class 1:</b> a reasonable probability that use of, or exposure to, the product will cause serious adverse health consequences or death.</li><li><b>Class 2:</b> use of, or exposure to, the product may cause temporary or medically reversible adverse health consequences, or serious consequences are remote.</li><li><b>Class 3:</b> use of, or exposure to, the product is not likely to cause adverse health consequences.</li></ul><p>When communication indicates a contaminated product/raw material has been released for sale or used, full traceability is conducted. The recall/traceability committee is contacted immediately and a meeting is set up to initiate withdrawal or recall, determining responsibilities and timeline. If the product has left the company’s control, appointed personnel notify all interested parties and initiate a withdrawal; local authorities, clients, suppliers and the certification body are informed as necessary. Clients/suppliers are instructed to reconcile how much product was sold to consumers. Investigation details trace all materials back to the raw material supplier. Feedback on the withdrawal process and cause/preventive actions is reported to Senior Management and affected clients within a maximum of 72 hours. Affected product is collected by the company or the client is asked to destroy it; returned product is verification tested by an independent SANAS-accredited laboratory. Product under evaluation remains segregated in a dedicated quarantine area. Appointed personnel determine whether the product is safe, suitable for another use, reprocessable, or must be destroyed; contaminated product deemed unsafe is not reworked and is rejected and destroyed.</p><p>A simulation exercise (mock recall) is conducted to verify the system can effectively identify, locate and remove affected products, initiated and documented on the Withdrawal Record at least annually for each product, tracing raw materials, packaging and production records from supplier to client; all records should be retrievable within 4 hours. Effectiveness is verified as part of the Internal Audit programme. The cause, extent and result of withdrawals (including mock recalls) are reviewed at Management Review, including exact quantity manufactured, quantity in stock, quantity dispatched, quantity at clients, and recall percentage.</p><p><b>Communication Plan — Customer Identified Recall:</b> the Sales Team receives the complaint; the Quality Manager identifies the product via production codes and customer records; the Traceability Team investigates and segregates affected product and instructs affected customers to mark it \"DO NOT USE – RECALLED\" and segregate it; the Quality Manager assesses risk via scientific evaluation of known/potential adverse health effects; the Managing Director/Sales Manager communicate with customers and coordinate return and evaluation of remaining raw materials; the Quality Manager conducts root cause analysis and implements improvements.</p><p><b>Communication Plan — Internally Identified Recall:</b> follows the same steps, triggered via the Incident Management procedure rather than a customer complaint.</p><p>Contact details of the Recall Committee, relevant authorities (NSF, NRCS, Department of Health, Local Authority) and customers are maintained on file and used to coordinate the recall response.</p>",
