      "title": "Internal Audit Frequency Risk Assessment",
      "html": "<p>Methodology To determine the audit frequency, each area of the Food Safety Management System (FSMS) is evaluated against two criteria, as required by our procedure: the importance of the processes and the results of monitoring, measurement, changes, and previous audits.</p><p><b>Impact on Food Safety/Quality (Severity):</b></p><ul><li>1 = Low (Administrative, low risk to product safety)</li><li>2 = Medium (PRPs, moderate impact on safety/quality)</li><li>3 = High (CCPs, OPRPs, high risk to consumer safety or legal compliance)</li></ul><p><b>Stability &amp; Historical Performance (Likelihood of Failure):</b></p><ul><li>1 = Highly Stable (No recent changes, historically zero/minor audit findings)</li><li>2 = Moderately Stable (Occasional minor findings, routine operational updates)</li><li>3 = Unstable / New (New requirements, frequent changes, historical major non-conformances)</li></ul><p>Risk Score Calculation: Impact x Stability = Risk Score</p><ul><li>High Risk (Score 6 - 9): Audit Bi-Annually</li><li>Medium Risk (Score 3 - 4): Audit Annually</li><li>Low Risk (Score 1 - 2): Audit Annually</li></ul>"
    },
    {
      "title": "Risk Assessment Matrix",
      "html": "<table class=\"proc-table\"><tr><th>Audit Section (from PRO 9.2 Schedule)</th><th>Impact (1-3)</th><th>Stability/History (1-3)</th><th>Total Risk Score</th><th>Determined Audit Frequency</th><th>Justification</th></tr><tr><td>Context of the Organisation &amp; Leadership</td><td>2</td><td>1</td><td>2</td><td>Annually</td><td>High level administrative processes; stable management team; historically strong audit performance.</td></tr><tr><td>Core PRPs (Cleaning, Pest Control, Personnel Hygiene)</td><td>2</td><td>2</td><td>4</td><td>Annually</td><td>Vital for baseline hygiene; routine daily/weekly monitoring is already in place to catch deviations early. </td></tr></table><table class=\"proc-table\"><tr><th>Audit Section (from PRO 9.2 Schedule)</th><th>Impact (1-3)</th><th>Stability/History (1-3)</th><th>Total Risk Score</th><th>Determined Audit Frequency</th><th>Justification</th></tr><tr><td>Operational Control (Equipment, Storage, Rework, Traceability)</td><td>3</td><td>1</td><td>3</td><td>Annually</td><td>High impact on product safety, but processes are mature, highly stable, and strictly monitored through daily QC checks.</td></tr><tr><td>FSSC Additional Requirements (Allergens, Food Fraud, Food Defence)</td><td>3</td><td>1</td><td>3</td><td>Annually</td><td>Critical for FSSC compliance; systems are well-established and verified annually without major historical failures. </td></tr><tr><td>New FSSC Additional Requirements / Significant Process Changes</td><td>3</td><td>3</td><td>9</td><td>Bi-Annually</td><td>Newly implemented standards carry higher uncertainty and risk of non-conformity during initial rollout.</td></tr></table><p>Conclusion for Annual Frequency: Based on the risk assessment conducted by the Food Safety Team Leader, the core processes, PRPs, and established FSSC requirements of the facility exhibit a moderate to high impact on food safety but demonstrate a high level of historical stability and strong monitoring results. Because the overall system is mature and existing verification activities (such as daily QC checks and environmental monitoring) effectively manage day-to-day risks, a baseline internal audit frequency of annually is deemed sufficient and conforms to organizational requirements.</p><p>Conclusion for Bi-Annual Frequency: In accordance with procedure PRO 9.2, any new additional requirements (such as updates to the FSSC 22000 scheme or significant internal process changes) carry an inherently higher risk due to a lack of historical stability data. Therefore, these specific elements will be audited bi-annually by an internal trained internal auditor and annually by an outsourced trained internal auditor until stability and conformity are proven.</p>"
