  "sections": {
    "objective": "To describe the process used to ensure that nonconforming products are not released and do not enter the food chain, unless the food safety hazard(s) of concern has been reduced to acceptable levels, will be reduced before entering the food chain, or the product still meets acceptable hazard levels despite the nonconformity.",
    "roles": "<ul><li>The Production &amp; Export Manager or Production Planning &amp; Continuous Improvement Manager and the Quality Assurance Manager are responsible for assigning responsibility and authority for control and disposal of potentially unsafe product.</li><li>Production Management and the Quality team document the disposal of nonconforming material.</li><li>Top management appoints personnel with authority to initiate and carry out a withdrawal, usually the Quality Assurance Manager.</li><li>Responsibility for evaluation of release rests with the Top Management team and the Quality Assurance Manager.</li></ul>",
    "process": "<p>When a critical control limit at a CCP is exceeded or an OPRP action criterion is not met, all potentially affected product is identified and held as potentially unsafe under the organisation’s control until evaluated and dispositioned. Non-conforming products trigger the Corrective Action procedure — a Corrective Action Request and Corrective Action Log are completed. Affected batches are held under the organisation’s control pending evaluation; management assesses severity to decide whether the non-conformance is isolated or involves an entire batch/multiple batches. The product is identified via production code/job number from QC records, quarantined and segregated in a demarcated area. Only senior management may authorise disposal of unsafe products. Investigations are recorded on a Disposal Investigation Record. Products deemed unsafe are disposed of through authorised channels only, obtaining an Unfit For Human Consumption (UFHC) disposal certificate from local authorities. If products have already left the organisation’s control and are found unsafe, relevant interested parties are notified and a withdrawal/recall is initiated.</p><p><b>Types of Incidents</b> that may cause unsafe, illegal or non-conforming products include chemical, physical or microbiological contamination, contaminated ingredients, packaging defects, incorrect labelling or batch coding, sabotage/tampering, emergency situations (fire, flood, algal blooms, environmental contamination, natural disasters), and disruption to key services (water, energy, transport, refrigeration, retort, staff availability, communications, substandard raw materials, vehicle accidents).</p><p><b>Evaluation for Release:</b> each affected lot is evaluated. Products failing CCP critical limits are not released and are handled per Disposition of Non-conforming Products. Products failing OPRP action criteria are released only where evidence demonstrates the control measures were effective, achieved intended performance, or sampling/analysis/verification confirms compliance with acceptable levels. Results are retained as documented information.</p><p><b>Disposition of Non-Conforming Product:</b> if not acceptable for release, the designated person determines disposal — reworked/reprocessed to reduce the hazard to acceptable levels (subject to full re-inspection/testing), redirected for other use if food safety is not affected, or destroyed/disposed of as UFHC waste. The decision and method are recorded on the Disposal Investigation Record, with approving authority identified.</p><p><b>Withdrawals/Recall:</b> when communication indicates a contaminated product/raw material has been released or used, full traceability is conducted and Senior Management is contacted immediately to initiate withdrawal. If the product has left company control, appointed personnel notify all necessary interested parties and/or approved suppliers, and instruct clients/suppliers to reconcile stock sold. Investigation details trace all materials back to the raw material supplier. Feedback on the withdrawal process, cause and preventive actions is reported to Senior Management and affected clients within a maximum of 72 hours. Affected product is collected by the company or the client is asked to destroy it; returned product is verification tested by an independent SANAS-accredited laboratory. Product under evaluation remains segregated in a dedicated, clearly marked quarantine area. Appointed personnel determine whether the product is safe for intended use, suitable for another purpose, reprocessable, or must be destroyed — contaminated products deemed unsafe are not reworked and are rejected and destroyed.</p><p>Mock recalls are initiated and documented on the Withdrawal Record at least annually for all products, tracing raw materials, packaging and production records from supplier to client; all records should be retrievable within 4 hours of initiation. Effectiveness is verified as part of the Internal Audit programme, and the cause, extent and result of withdrawals (including mock recalls) are reviewed as part of Management Review.</p>",
    "review": "This procedure is reviewed periodically; the most recent review included the withdrawal notification contact list."
