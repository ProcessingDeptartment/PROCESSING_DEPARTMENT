  "sections": [
    {
      "title": "Purpose",
      "html": "<ul><li>This procedure describes the process used to ensure that nonconforming products are not released and does not enter the food chain.</li></ul>"
    },
    {
      "title": "Responsibilities",
      "html": "<ul><li>The company shall handle nonconforming products by taking action(s) to prevent the nonconforming product from entering the food chain unless it is possible to ensure that:</li><li>The food safety hazard(s) of concern has/have been reduced to the defined acceptable levels,</li><li>The food safety hazard(s) of concern will be reduced to identified acceptable levels prior to entering the food chain, or</li><li>The product still meets the defined acceptable level(s) of the food safety hazard(s) of concern despite the nonconformity.</li><li>The Production &amp; Export Manager or Production Planning &amp; Continuous Improvement Manager and Quality Assurance Manager are responsible for assigning responsibility and authority for control and disposal of any potentially unsafe product.</li><li>Production Management and Quality team are responsible for documenting the disposal of nonconforming material.</li><li>Top management appoints personnel with the authority to initiate a withdrawal and to carry out the withdrawal, usually assigned to the Quality Assurance Manager.</li><li>Responsibility for the evaluation of release will be that of Top Management team and the Quality Assurance Manager.</li></ul>"
    },
    {
      "title": "Instructions",
      "html": "<ul><li>When a critical control limit at CCPs is exceeded or an action criterion at OPRPs is not met, all potentially affected product is identified as potentially unsafe under the organization’s control until the products have been evaluated and the disposition has been determined.</li><li>Non-Conforming products will trigger the Corrective Action procedure to be implemented.</li><li>When non-conforming products are identified, the Corrective Action Request and Corrective Action Log must be completed.</li><li>All batches that may have been affected are held under the control of the organization until it has been evaluated.</li><li>Management will evaluate the severity of the incident to determine whether the non-conformance is isolated to a single item in the batch or involves an entire batch / more than one batch of product, to decide upon disposal.</li><li>The product under investigation is identified based on the production code or job number traced from the QC records.</li><li>The product is then quarantined and segregated in storage in a demarcated area.</li><li>Only senior management from the company will have the authority to authorize the disposal of unsafe products.</li><li>Investigation of products deemed as potentially unsafe will be recorded on a Disposal Investigation record to determine if the affected product should be released or disposed of.</li><li>Products deemed as unsafe for human consumption following an investigation, will be disposed of through authorized channels only, obtaining an Unfit For Human Consumption [UFHC] disposal certificate from the local authorities.</li><li>If products that have left the control of the organization are subsequently determined to be unsafe, the company shall notify relevant interested parties and initiate a product withdrawal/recall.</li><li>The controls and related responses from relevant interested parties and authorization for dealing with potentially unsafe products shall be retained as documented information.</li></ul>"
    },
    {
      "title": "Types of Incidents",
      "html": "<ul><li>The following types of incidents may result in the production of unsafe, illegal or non-conforming products and threats to products (but not limited to):</li><li>Chemical product contamination</li><li>Physical product contamination</li><li>Microbiological product contamination</li><li>Contaminated product ingredients</li><li>Packaging defects</li><li>Incorrect labeling</li><li>Incorrect batch coding</li><li>Sabotage / Tampering</li><li>Emergency situations, such as fire, flood, sudden algal blooms, contamination of the environment or any other natural disaster</li><li>Disruption to key services, such as water, energy, transport, refrigeration processes, retort process, staff availability, communications, supply of substandard raw materials, vehicle accidents.</li></ul>"
    },
    {
      "title": "Evaluation for Release",
      "html": "<ul><li>Following evaluation, if the product is deemed acceptable for release, the designated person will make the final decision whether to release the product or not.</li><li>Each lot of products affected by the nonconformity shall be evaluated.</li><li>Products affected by failure to remain within critical limits at CCPs shall not be released but shall be handled in accordance with Disposition of Non-conforming Products.</li><li>Products affected by failure to meet action criterion for OPRPs shall only be released as safe when any of the following conditions apply:</li><li>Evidence other than the monitoring system demonstrates that the control measures have been effective.</li><li>Evidence shows that the combined effect of the control measures for that particular product complies with the performance intended (i.e. identified acceptable levels);</li><li>The results of sampling, analysis and/or other verification activities demonstrate that the affected products comply with the identified acceptable levels for the food safety hazard(s) concerned.</li><li>Results of evaluation for release of products shall be retained as documented information.</li></ul>"
    },
    {
      "title": "Disposition of Non-Conforming Product",
      "html": "<ul><li>Following evaluation, if the product is not acceptable for release, the designated person will determine the method of disposal.</li><li>The product/material is:</li><li>Reworked/reprocessed through further treatment or processing within or outside the organization to reduce the food safety hazard to acceptable levels (Product must pass all subsequent inspection and testing); or</li><li>Redirected for other use if food safety in the food chain is not affected; or</li><li>Destroyed or disposed of as UFHC product (waste)</li><li>The decision to confirm disposal and method of disposal will be recorded on the Disposal Investigation Record.</li><li>Documented information on the disposition of nonconforming products, including the identification of person(s) with approving authority shall be retained.</li></ul>"
    },
    {
      "title": "Withdrawals/recall",
      "html": "<ul><li>When communication has been received indicating a contaminated product or raw material has been released for sale or used, a full traceability of the product or raw material shall be conducted.</li><li>Senior Management shall be contacted immediately to initiate product withdrawal.</li><li>If the identified product has left the control of the company, the appointed personnel will notify all necessary interested parties listed in the addendum and/or suppliers listed in the Approved Suppliers List and initiates a withdrawal.</li><li>The local authorities, clients and, if necessary, supplier(s) shall be contacted and informed of the contaminated product.</li><li>The clients and/or supplier(s) shall be instructed to determine how much of each product or ingredient has been sold to consumers to reconcile stock.</li><li>Details recorded as part of the investigation shall include all detail / proof as part of tracing all materials back to the raw material supplier.</li><li>Feedback regarding the withdrawal process and investigation regarding the cause and preventive actions shall be reported to Senior Management and affected clients as soon as possible within a maximum time frame of 72 hours.</li><li>The affected product shall either be collected by the company from the client or request the client destroyed the product. Verification testing shall be done on products returned to the company by an independent, SANAS accredited laboratory to determine the extent of contamination.</li><li>Product under evaluation that is still under the control of the company will be identified and segregated in a dedicated, clearly marked quarantine area to avoid unauthorized use or accidental release.</li><li>Disposal of product will be recorded on the Disposal Investigation record.</li><li>Appointed personnel will determine through the investigation if:</li><li>The product is safe for the intended use;</li><li>The product should be used for purposes other than originally intended;</li><li>The product could be reprocessed in a manner to ensure it becomes food safe;</li><li>The product should be destroyed.</li><li>Contaminated food products that are deemed unsafe for human consumption shall not be reworked and shall be rejected and destroyed.</li><li>Mock recalls shall be initiated and documented on the Withdrawal Record at least annually for all products, by testing the ability to trace all raw materials, packaging and production records from supplier to client.</li><li>All quality, production and raw material traceability records should be retrieved within 4 hours of initiation of the mock recall.</li><li>All records and correspondence must be attached to the documented mock recall.</li><li>The effectiveness of the mock recall and traceability system will be verified as part of the Internal Audit program.</li><li>The cause, extent and result of withdrawal, including mock recalls, will be discussed and reviewed as part of the Management Review process.</li></ul>"
    },
