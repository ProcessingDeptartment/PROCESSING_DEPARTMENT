      "title": "Management Representative Appointment Letter",
      "html": "<p><b>22 April 2025</b></p><p>Dear Nicolene Mylrea,</p><p>You are hereby appointed as a Management Representative for the management of the Food Safety Management System (FSMS) in place, FSSC 22000. Be assured of my commitment to the necessary resources to comply with the standard requirements.</p><p>This function covers specific duties in terms of the standard and ensures that our company is always compliant with the requirements and remains competitive. Your responsibilities ensure the following:</p><ul><li>To establish, implement and maintain the FSMS as per FSSC 22000 requirements.</li><li>To ensure that processes needed for the FSMS are established, implemented, and maintained.</li><li>To define food safety and quality parameters and ensure that they are consistently achieved through monitoring and continual improvement.</li><li>Understanding the current and future needs of the customers / clients.</li><li>To report to top management on the continuing suitability and effectiveness of the FSMS and the scope for improvement.</li><li>To promote awareness of customer requirements throughout the organization.</li><li>To plan, schedule and conduct Internal Audits for FSMS.</li><li>To select qualified Internal Auditors and Food Safety Team members.</li><li>To review the Audit Report and follow-up Corrective Action / Preventive Action Reports.</li><li>To initiate modifications of documents based on Corrective Action / Preventive Action and to control all the documents related to the FSMS.</li><li>To schedule Management Review meetings at the defined intervals and record minutes of Management Review meetings for subsequent reporting on the performance / improvements of the FSMS.</li><li>To liaison with the external agencies related to the FSMS Implementation and Certification.</li><li>The Management Representative convenes the Management Review meetings after preparation of the agenda and maintains the minutes of the meeting.</li></ul><p><b>Kind Regards,</b></p><p>Rowan Timmer:  _______________________________</p>"
