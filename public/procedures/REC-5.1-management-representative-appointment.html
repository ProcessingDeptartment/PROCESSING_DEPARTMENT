  "sections": {
    "objective": "This is the formal letter of appointment for the Management Representative for the management of the Food Safety Management System (FSMS) in place, FSSC 22000, confirming top management’s commitment to the necessary resources to comply with the standard’s requirements.",
    "roles": "<ul><li>Top Management (signed by the Chief Operating Officer) appoints the Management Representative and commits to providing the necessary resources.</li><li>The Management Representative (currently the Quality Assurance Manager, Nicolene Mylrea) holds the duties set out below.</li></ul>",
    "process": "<p>The Management Representative’s function covers specific duties under the standard to ensure the company remains compliant and competitive. Responsibilities include:</p><ul><li>Establishing, implementing and maintaining the FSMS as per FSSC 22000 requirements.</li><li>Ensuring that processes needed for the FSMS are established, implemented and maintained.</li><li>Defining food safety and quality parameters and ensuring they are consistently achieved through monitoring and continual improvement.</li><li>Understanding the current and future needs of customers/clients.</li><li>Reporting to top management on the continuing suitability and effectiveness of the FSMS and the scope for improvement.</li><li>Promoting awareness of customer requirements throughout the organisation.</li><li>Planning, scheduling and conducting Internal Audits for the FSMS.</li><li>Selecting qualified Internal Auditors and Food Safety Team members.</li><li>Reviewing the Audit Report and following up on Corrective Action / Preventive Action Reports.</li><li>Initiating modifications of documents based on Corrective/Preventive Action and controlling all documents related to the FSMS.</li><li>Scheduling Management Review meetings at defined intervals and recording minutes for subsequent reporting on FSMS performance/improvements.</li><li>Liaising with external agencies related to FSMS implementation and certification.</li></ul><p>The Management Representative convenes Management Review meetings after preparing the agenda and maintains the meeting minutes.</p>",
    "review": "This appointment is reviewed and re-issued whenever the Management Representative role changes."
