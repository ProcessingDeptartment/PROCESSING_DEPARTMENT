  "sections": [
    {
      "title": "Purpose",
      "html": "<ul><li>To ensure that the processes established by the organization are verified to ensure conformity on the requirements of the food safety system. The audit process enables proper evaluation of the system and requirements including changes and results of monitoring, measurements, and previous audit findings.</li></ul>"
    },
    {
      "title": "Responsibilities",
      "html": "<ul><li>The Food safety Team leader is responsible to ensure that audits are established based on risk associated with the activities and outcome of previous audit performances.</li><li>Trained internal auditor- conduct and document audits as set out in the audit schedule.</li><li>Discuss finings with personnel responsible for activity being audited. Conduct follow up of corrective action.</li><li>QC Supervisor/ Manager – follows up of completion of internal audits.</li><li>Remind auditors about the follow up to date.</li><li>Set up an annual schedule. Ensure that the internal auditing team is trained.</li><li>Manage the annual audit schedule. Reporting status of the audits conducted through meetings during food safety meetings.</li></ul>"
    },
    {
      "title": "Instructions",
      "html": "<ul><li>The organization conducts internal audits at least annually, new additional requirements will be audited quarterly by the trained internal auditor which is to be outsourced. Conforms to the planned arrangements to the food safety &amp; quality requirements established by the organization.</li><li>Conforms to the requirements of ISO 22000:2018; FSSC 22000 V 6.0 and is</li><li>effectively implemented and updated.</li><li>the audits are conducted or outsourced by/to an external independent auditor.</li><li>Review audit non-conformances for effective corrections during the internal audits.</li><li>The organization shall:</li><li>Plan, establish and maintain the audit program, including frequency, methods, responsibilities, planning requirements and reporting, which shall take into consideration the importance of the processes concerned, changes in the FSMS, and the results of monitoring, measurement, and previous audits</li><li>Define the audit criteria and scope for each audit.</li><li>Select competent auditors and conduct audits to ensure objectivity and the impartiality of the audit process.</li><li>Ensure that the results of the audits are reported to the Food Safety Team ad relevant management.</li><li>Retain documented information as evidence of the implementation of the audit program and the audit results.</li><li>Make the necessary correction and take the necessary corrective action within the agreed time frame.</li><li>Determine if the FSMS meets the intent of the Food Safety Policy and Objectives of the FSMS.</li><li>Corrective action to be documented immediately after internal audit has been conducted.</li></ul>"
    },
    {
      "title": "Evaluation of individual verification results",
      "html": "<ul><li>If verification does not demonstrate conformity with the planned arrangements, the organization shall take action to achieve the required conformity.</li><li>Such action shall include, but is not limited to, review of:</li><li>Existing procedures and communication channels.</li><li>Conclusions of the Hazard Analysis and the HACCP Plan.</li><li>PRPs; and</li><li>Effectiveness of human resource management and training activities.</li></ul>"
    },
    {
      "title": "Analysis of results of verification activities:",
      "html": "<ul><li>The food safety team shall analyze the results of verification activities, including the results of the internal audits and external audits.</li><li>The analysis shall be carried out in order:</li><li>To confirm that the overall performance of the system meets the planned arrangements, and the food safety and quality system requirements established by the organization.</li><li>To identify the need for updating or improving the Food safety and quality system.</li><li>To identify trends which indicate a higher incidence of potentially unsafe products.</li><li>To establish information for planning of the internal audit concerning the status and importance of areas to be audited; and</li><li>To provide evidence that any corrections and corrective actions that have been taken are effective.</li><li>The results of the analysis and the resulting activities shall be recorded and shall be reported, in an appropriate manner, to top management as input to the Management Review.</li><li>It shall also be used as an input for updating the food safety and quality system.</li></ul>"
    },
