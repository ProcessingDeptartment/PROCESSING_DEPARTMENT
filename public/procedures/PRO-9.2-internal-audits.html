    "objective": "To ensure that the processes established by the organisation are verified for conformity to the requirements of the food safety system. The audit process enables proper evaluation of the system and requirements, including changes and results of monitoring, measurement and previous audit findings.",
    "roles": "<ul><li>The Food Safety Team Leader ensures audits are established based on risk associated with activities and outcomes of previous audit performance.</li><li>Trained internal auditors conduct and document audits per the audit schedule, discuss findings with responsible personnel, and follow up on corrective actions.</li><li>The QC Supervisor/Manager follows up on completion of internal audits, reminds auditors of follow-up dates, sets the annual schedule, ensures the auditing team is trained, and reports audit status through food safety meetings.</li></ul>",
    "process": "<p>Internal audits are conducted at least annually; new additional requirements are audited quarterly by a trained internal auditor (outsourced), conforming to planned arrangements and to ISO 22000:2018 / FSSC 22000 V6.0 requirements, and confirming effective implementation and updating. Audits may be conducted or outsourced to an external independent auditor. Audit non-conformances are reviewed for effective corrections during internal audits.</p><p>The organisation plans, establishes and maintains the audit programme (frequency, methods, responsibilities, planning requirements and reporting), considering the importance of processes, FSMS changes, and results of monitoring/measurement/previous audits. Audit criteria and scope are defined for each audit; competent auditors are selected to ensure objectivity and impartiality; audit results are reported to the Food Safety Team and relevant management; documented information is retained as evidence of the audit programme and results; necessary corrections and corrective actions are taken within the agreed timeframe; and the FSMS is checked against the intent of the Food Safety Policy and Objectives. Corrective action is documented immediately after each internal audit.</p><p><b>Evaluation of Individual Verification Results:</b> if verification does not demonstrate conformity, the organisation reviews existing procedures and communication channels, the conclusions of the Hazard Analysis and HACCP Plan, PRPs, and the effectiveness of human resource management and training.</p><p><b>Analysis of Verification Results:</b> the Food Safety Team analyses results of internal and external audits to confirm overall system performance meets requirements, identify the need for updating/improving the system, identify trends indicating higher incidence of potentially unsafe products, plan the internal audit programme, and provide evidence that corrections/corrective actions are effective. Results are reported to top management as input to Management Review and used to update the food safety and quality system.</p><p><b>Internal Audit Schedule</b> covers: Context of the Organisation, Leadership, Planning, Support, Operation, Performance Evaluation, Improvement, construction and layout of buildings, layout of premises and workspace, storage of food/packaging/ingredients/non-food chemicals, utilities, waste disposal, equipment suitability/cleaning/maintenance, management of purchased materials, prevention of cross-contamination, cleaning and sanitation, pest control, personnel hygiene and employee facilities, rework, product recall procedures and requirements, warehousing, product information and consumer awareness, and food defence/biovigilance/bioterrorism, plus FSSC additional requirements: food fraud prevention, logo use, management of allergens, environmental monitoring, glass breakage procedure, blood spill procedure, first aid procedure, identification and traceability, incoming goods inspection and COA, fire drill, equipment management, food safety and quality culture, quality control, food defence and fraud mitigation, labelling and printed materials, and management of service and purchased materials.</p>",
