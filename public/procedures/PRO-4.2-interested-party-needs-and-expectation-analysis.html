    "objective": "To determine the relevant requirements of interested parties of the FSMS, and to establish what documented information Abagold generates to satisfy each interested party’s needs and expectations.",
    "roles": "<ul><li>Top Management is responsible for reviewing and approving the interested party analysis.</li><li>The Quality Assurance Manager maintains the analysis and links it to the FSMS documentation that addresses each need.</li></ul>",
    "process": "<p>Interested parties, their type (internal/external), their basic needs and expectations, and the form of information Abagold generates to satisfy each requirement are documented as follows:</p><ul><li><b>Customers:</b> short lead times (production schedule, order confirmations, forecasts); best quality (specifications, lab analysis, QC records, recipes); best price (customer agreements); innovation (NPD and product improvement); food safety (certification maintenance, safe products through the QMS); customer satisfaction (surveys and feedback); certification (internal and external audits).</li><li><b>Legislators:</b> compliance with national laws, regulations and international standards (legislation register, newsletter subscriptions, AGBIZ membership); compliance with compulsory specifications (NRCS inspections and releases).</li><li><b>Employees:</b> stability of staff levels, growth and development, fair wages, work ethic, safe work environment, succession training — addressed through training and development, job descriptions, KPI monitoring, PRP/hygiene training, OHS Act compliance and annual medicals.</li><li><b>Top Management / Stakeholders:</b> financial performance and top management involvement — addressed through financial results, signed Food Safety Policy, communication of the policy, provision of resources, and management review involvement.</li><li><b>Community:</b> job creation, legal compliance, tax payment, environmental impact — addressed through employment aligned to FSSC 22000 requirements, regular training, legal compliance records, and monitoring of air, water and noise pollution.</li><li><b>External Providers (suppliers of goods and services):</b> growth/improvement, ethical/fair pricing, supporting services and raw materials — addressed through clearly defined specifications, the approved supplier list, supplier risk assessment, supplier agreements, certification information, and Certificates of Analysis/Conformance.</li><li><b>Certification Bodies:</b> assessment of conformity to FSMS standards — addressed through maintaining a compliant Food Safety Management System.</li></ul>",
