    "objective": "To review the organisation’s FSMS at planned intervals, to ensure its continuing suitability, adequacy and effectiveness.",
    "roles": "<ul><li>Top management is responsible for ensuring this procedure is implemented and followed.</li><li>Management Reviews are held annually, chaired by the Food Safety Team Leader and attended by the top management team.</li></ul>",
    "process": "<p>At the Management Review meeting, the Quality and Food Safety System is reviewed to ensure ongoing suitability, adequacy and effectiveness; company policies and objectives are reviewed to assess whether they need to change.</p><p><b>Management Review Input</b> considers: status of actions from previous reviews; changes in external/internal issues relevant to the FSMS; performance and effectiveness trends (system updating activities, monitoring/measurement results, PRP and Hazard Control Plan verification analysis, nonconformities and corrective actions, internal/external audit results, NRCS/customer inspections, external provider performance); review of risks and opportunities and the effectiveness of actions taken; extent to which FSMS objectives have been met; adequacy of resources (training, competency and awareness programmes and their effectiveness); any emergency situation, incident or withdrawal/recall; relevant information from external/internal communication (requests and complaints); opportunities for continual improvement; the contingency plan for emergency situations; review of the Context of the Organisation and Needs/Expectations of Interested Parties; Food Safety and Quality Culture performance (employee feedback, survey results, culture objectives, improvement action effectiveness); food loss and waste performance (yield trends, waste reduction, objective achievement); product quality performance (quality objectives, complaints, out-of-specification trends, control effectiveness); Environmental Monitoring Programme results and trends; Food Fraud Vulnerability and Food Defence Threat Assessment outcomes; product design and development activities and changes; and significant or escalated risks affecting certification, export continuity, customer confidence, product release, legal compliance, business continuity or financial performance.</p><p><b>Management Review Output</b> includes decisions and actions on continual improvement opportunities, any needed updates/changes to the FSMS (including resources, training and revision of the policy and objectives), escalated strategic risk actions, and verification of the effectiveness of previous actions. The organisation retains documented evidence of the results of management reviews.</p>",
