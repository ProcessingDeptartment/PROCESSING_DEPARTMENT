  "sections": [
    {
      "title": "Purpose",
      "html": "<p>To review the organization’s FSMS, at planned intervals, to ensure its continuing suitability, adequacy and effectiveness.</p>"
    },
    {
      "title": "Responsibility",
      "html": "<p>The top management is responsible for ensuring that this procedure is implemented and followed.</p><p>Management Reviews are annually and are chaired by the Food Safety Team Leader. These are attended by the top management team. At this meeting, the Quality and Food Safety System is reviewed to ensure its ongoing suitability, adequacy, and effectiveness. Company policies and objectives must be reviewed to assess if they need to change.</p>"
    },
    {
      "title": "Management review input",
      "html": "<p>The management review shall consider:</p><ul><li>The status of actions from previous management reviews.</li><li>Changes in external and internal issues that are relevant to the FSMS, including changes in the organization and its context</li><li>Information on the performance and the effectiveness of the FSMS, including trends in:</li><li>Results of system updating activities.</li><li>Monitoring and measurement results.</li><li>Analysis of results of verification activities related to PRPs and the Hazard Control Plan.</li><li>Nonconformities and corrective actions.</li><li>Audit results (internal and external).</li><li>Inspections (NRCS, Customer).</li><li>The performance of external providers.</li><li>The review of risks and opportunities and of the effectiveness of actions taken to address them.</li><li>The extent to which objectives of the FSMS have been met.</li><li>The adequacy of resources: Training, competency and awareness programmes and their effectiveness.</li><li>Any emergency situation, incident or withdrawal/recall that occurred.</li><li>Relevant information obtained through external and internal communication, including requests and complaints from interested parties</li><li>Opportunities for continual improvement</li><li>Contingency plan for emergency situations.</li><li>Review of the Context of the Organisation and the Needs and Expectations of Interested Parties to ensure continued relevance and adequacy.</li><li>Food Safety and Quality Culture performance, including employee feedback, survey results, culture objectives and effectiveness of improvement actions.</li><li>Food loss and waste performance, including yield trends, waste reduction initiatives and achievement of related objectives.</li><li>Product quality performance, quality objectives, quality complaints, out-of-specification trends and effectiveness of quality controls.</li><li>Environmental Monitoring Programme results, trends, investigations and corrective actions.</li><li>Review of Food Fraud Vulnerability Assessment and Food Defence Threat Assessment outcomes and effectiveness of mitigation measures.</li><li>Product design and development activities, changes to products, formulations, specifications or customer requirements.</li><li>Significant or escalated risks that may impact certification, export continuity, customer confidence, product release, legal compliance, business continuity or financial performance.</li></ul>"
    },
    {
      "title": "Management review output",
      "html": "<p>The output of the management review shall include:</p><ul><li>Decisions and actions related to continual improvement opportunities</li><li>Any need for updates and changes to the FSMS, including resource and training requirements and revision of the food safety policy and objectives of the FSMS</li><li>Escalated strategic risk actions</li><li>Verification of effectiveness of previous actions</li></ul><p>The organisation shall retain documented evidence of the results of management reviews.</p>"
    },
    {
