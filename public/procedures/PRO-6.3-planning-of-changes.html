ProcedureDoc.mount({

  "procNo": "PRO 6.3",
  "name": "Planning of Changes",
  "area": "Planning",
  "startRev": 10,
  "baselineDate": "17/12/2024",
  "sections": [
    {
      "title": "Purpose",
      "html": "<ul><li>This procedure describes the commitment from top management of Abagold Ltd to plan for the periodic review and update of the Food Safety System. As well as to define the methods for managing changes to processes and other aspects of the management system in a controlled manner to maintain the integrity of the FSMS and the organization’s ability to continue to provide conforming and safe products and services during the change. This procedure applies to all the activities within the scope of the Abagold Food Safety Management System. These may be changes in FSMS due to Customer feedback, Customer complaint, Product failure, Employee feedback, Innovation, determined risk, determined opportunity, Internal audit results, Management review results, Identified nonconformity, new products, changes or updates to existing products, processes, and equipment. To ensure that all hazards due to introduction of new ingredients, process change, or review of products are identified, risk assessed and that suitable controls are implemented.</li></ul>"
    },
    {
      "title": "Responsibilities",
      "html": "<ul><li>Top Management and the Food Safety Team are responsible for the effective implementation of this procedure and</li><li>shall ensure that:</li><li>Planning review and improvement of the food safety management system to meet the requirements of FSSC 22000 as well as the company’s objectives that support food safety and quality; and</li><li>The integrity of the food safety and quality management system is maintained when changes to the system are planned and implemented.</li><li>Marketing Manager: Ensure that the product brief is completed, recipe development and approval. Signs off products specification and communicates with customers.</li><li>Processing Operations Manager reviews all change requests and authorizes them.</li><li>Quality and food safety Team, reviews all raw materials for hazards introduced to processing, validates all changes, and approves them.</li><li>Procurement selects raw material supplier according to quality and food safety criteria; the Quality Assurance Manager approves all suppliers through Supplier Approval Program.</li></ul>"
    },
    {
      "title": "Details of procedure",
      "html": "<ul><li>Properly planning a change by applying risk-based thinking can help to avoid negative consequences such as rework or cancellation or postponement of service; it can also result in positive consequences such as reduction of nonconforming outputs; or reduced incidents of human error.</li><li>a) Management system processes will undergo changes, typically when:</li><li>Improvement opportunities have been identified, typically to improve process effectiveness.</li><li>Nonconformities within a process are identified and require corrective action.</li><li>Conditions in the industry or company change, requiring a process to be updated.</li><li>New processes are added which impact on existing processes, requiring changes.</li><li>Outsourcing important processes.</li><li>Persons in key roles leaving the organization.</li><li>Customer requirements result in a need to change processes.</li><li>Changes to active orders or contracts.</li><li>Any other reason determined by management.</li><li>b) In such cases, the process must be changed in a controlled manner to ensure proper authorization and implementation of the changes.</li><li>c)  Formal changes to process outputs will be used when the change is significant. Minor changes may be made without formal control, however, the decision on what constitutes significant vs minor change must be agreed upon by those involved in the change. If a customer indicates a change is significant, this will trump any internal decision.</li><li>d)  At a minimum, process changes shall include the steps herein:</li><li>The request for a process change shall be documented, typically using the NCR process. The justification for the change shall be recorded.</li><li>Management shall evaluate the merits of the proposed change and determine the actions necessary to address and implement the intended changes.</li><li>e)  Before authorizing the implementation of changes, the following points shall be verified;</li><li>Purpose of the changes and their potential consequences</li><li>Continued integrity of the Food Safety management system</li><li>All necessary technical, safety, security and environmental reviews are completed;</li><li>Risks and consequences identified during the review processes are addressed to the utmost satisfaction;</li><li>Proposed changes comply with regulatory and legal requirements;</li><li>Necessary approvals are obtained from the regulatory and/or legal authority wherever required;</li><li>Availability of resources to effectively implement the changes</li><li>All affected personnel are informed of the changes and adequately trained where necessary;</li><li>Allocation or re-allocation of responsibilities and authorities</li><li>Documentation pertaining to changes and reviews are complete.</li><li>f)  The change shall be reviewed by appropriate management, including the person responsible for the process. Changes must be approved prior to implementation. Top Management is authorized to approve the implementation of proposed changes.</li><li>g)  Upon implementation of change, food safety Team shall verify the following.</li><li>Implemented changes are as intended;</li><li>Documentations are complete pertaining to changes;</li><li>Changes are communicated</li><li>Applicable regulatory and legal requirements are fulfilled;</li><li>h)  Record (Retained Documented Information)</li><li>7.1 NCR Report</li></ul><h3>Product brief</h3><ul><li>When review or changes are requested, the person requesting a change completes a Food Safety Update checklist (REC 5.6) for authorization by the Processing manager. The summary for changes requested shall at least include product description of the product, packaging to be used, intended use and country of export and a recipe, if applicable. The Food Safety Update checklist once authorised is reviewed by Food Safety Team for approval.</li><li>The project team, if required, must be selected and assigned responsibilities by project leader and/or through management meeting. A multidisciplinary team must be selected i.e processing (production and quality), dispatch, procurement, training, health and safety and define their responsibility at time of selection.</li></ul><h3>Concept Samples</h3><ul><li>New product will only be developed based on a specification approved by the Sales and Marketing manager. The product specification will reflect shelf life dependent on the product type. Once recipe is approved, an internal evaluation and sign off is completed by project team. The samples of approved recipe are sent to customer for approval of final specification.</li></ul><h3>Quality and Food Safety manual update</h3><ul><li>Records of factory trials conducted will be maintained as necessary.</li><li>Manufacturing processes, process parameters and the fulfilment of product requirements are described in procedures which addresses quality and food safety criteria.</li><li>the food safety team reviews the following prior approval:</li><li>all raw materials for hazards i.e. microbial, chemical, physical and allergens.</li><li>Conduct food fraud vulnerabilities assessment for product.</li><li>Conduct threat assessment for products.</li><li>Review change of responsibilities of Food Safety Team members.</li><li>Review and update legislation register if applicable, including sample label for compliance.</li><li>Food Safety review records of approval by Food Safety Team are available and granted before products are introduced to the factory environment. Where the change does not result in any modification to the existing food safety plan records are maintained.</li><li>Process validation conducted i.e. heat penetration test, cleaning methods etc.</li><li>Health and safety requirements.</li><li>Conduct traceability test and approve new records.</li></ul><h3>Product analysis</h3><ul><li>All analysis is outsourced and conducted in a SANAS approved laboratory.</li><li>Analysis include microbial testing for commercial sterility testing.</li><li>Nutritional analysis, product is evaluated on a standard nutritional requirement.</li><li>Additional analyses on products might be carried out depending on product type i.e. heavy metals, biotoxin testing etc.</li></ul>"
    },
    {
      "title": "Management Review",
      "html": "<ul><li>The top management of Abagold shall attend review meetings, scheduled for at least once per annum, to evaluate the continuing suitability, adequacy and effectiveness of the Food Safety System in satisfying the requirements of FSSC 22000 and the Food Safety and Quality Policy.</li><li>The food safety team leader schedules the meeting and notifies team members.</li><li>The food safety team leader is responsible for collecting summary reports and data from the responsible functions for input to the Management Review.</li><li>The management members participating in the Management Review meetings are responsible for collecting information and progress reports on action items assigned to them at previous Management Review meetings, information on planned changes that could affect the Food Safety System, quality planning needs and activities and recommendations for improvements to the Food Safety System.</li><li>This review shall include assessing opportunities for improvement and the need for change to the food safety and quality management system, including the food safety and quality policy. As well as risks identified.</li><li>The safety team leader prepares an agenda for each management review meeting that includes:</li></ul><p style=\"margin-left:54px\">Follow-up actions from previous management reviews,</p><p style=\"margin-left:54px\">Analysis of results of verification activities,</p><p style=\"margin-left:54px\">Changes to the Food Safety System that could affect food safety,</p><p style=\"margin-left:54px\">Emergency situations, accidents and withdrawals,</p><p style=\"margin-left:54px\">Reviewing results of system updating activities,</p><p style=\"margin-left:54px\">Review of communication activities and customer feedback,</p><p style=\"margin-left:54px\">External audits or inspections,</p><p style=\"margin-left:54px\">Internal audit results,</p><p style=\"margin-left:54px\">An evaluation of the continuing suitability of the Food Safety and Quality Policy and its objectives.</p><ul><li>The output from the management review shall include decisions and actions related to:</li><li>Assurance of food safety and quality,</li><li>Improvement of the effectiveness of the food safety and quality management system,</li><li>Resource needs, and</li><li>Revisions of the organisation's food safety and quality policy and its related objectives.</li><li>Management shall analyse the data, identify improvement opportunities, and assign action items, preventive actions and corrective actions as appropriate.</li><li>Management shall act on any identified resource needs, appropriate revisions to the food safety and quality policy and objectives, and any actions needed related to assuring food safety and quality.</li><li>Minutes are taken at each meeting, recording discussions, decisions and actions with due dates assigned.</li><li>The minutes shall be maintained as a record of Management Review (REC 5.8).</li></ul>"
    },
    {
      "title": "Food Safety System Review",
      "html": "<ul><li>To ensure the Food Safety System is continually updated, the food safety team shall evaluate the Food Safety System at planned intervals, at least annually before the Management Review meeting.</li><li>The evaluation and updating activities shall be based on:</li><li>Input from communication (external as well as internal).</li><li>Input from other information concerning the suitability, adequacy and effectiveness of the food safety and quality management system.</li><li>Output from the analysis of results of verification activities; and</li><li>Output from management review.</li><li>System updating activities shall be recorded and reported, in an appropriate manner, as input to the management review.</li><li>The following potential events can influence food safety and quality and shall automatically trigger a Food Safety System review, additional to the planned annual review:</li><li>products or new products;</li><li>raw materials, ingredients and services;</li><li>production systems and equipment;</li><li>production premises, location of equipment, surrounding environment;</li><li>cleaning and sanitation programs;</li><li>packaging, storage and distribution systems;</li><li>personnel qualification levels and/or allocation of responsibilities and authorisations;</li><li>statutory and regulatory requirements;</li><li>knowledge regarding food safety hazards and control measures;</li><li>customer, sector and other requirements that the organisation observes;</li><li>relevant enquiries from external interested parties;</li><li>complaints indicating food safety hazards associated with the product;</li><li>any other conditions that have an impact on food safety.</li><li>The oPRP and HACCP Plans shall be updated after such a review, as the introduction of an event that can influence food safety may lead to a reduction in or the addition of oPRP’s or CCP’s, or the inclusion of additional critical limits in order to improve the oPRP and / or HACCP plan.</li></ul>"
    },
    {
      "title": "HACCP Team meetings",
      "html": "<ul><li>The HACCP Team will meet monthly to discuss matters concerning food safety and quality that might have an impact on the Food Safety System.</li><li>Minutes of these meetings will be maintained and used as preparation for Management Review meetings.</li><li>The HACCP Team will be informed of changes that might have an impact on the food safety and quality of manufactured product through production and management meetings.</li><li>Where the HACCP team members are not part of production or management meetings, the HACCP team leader will inform the team members of any changes to consider the potential impact on the safety and quality of the product manufactured.</li><li>The HACCP team will discuss the changes and assess if any additional food safety hazards are introduced to determine if any additional control measures must be considered and introduced.</li><li>Management system processes will undergo changes, due to additional requirements.</li></ul><h3>Local regulations approval (National Regulatory Compulsory Specifications)</h3><p>A letter of changes or review, customer letter, validation reports, sample or final labels are submitted to the NRCS for approval.</p>"
    },
