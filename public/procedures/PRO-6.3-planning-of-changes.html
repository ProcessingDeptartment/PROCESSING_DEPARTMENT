  "sections": {
    "objective": "To describe top management’s commitment to plan for the periodic review and update of the Food Safety System, and to define the methods for managing changes to processes and other aspects of the management system in a controlled manner, maintaining FSMS integrity and the organisation’s ability to continue providing conforming and safe products and services during change. Applies to changes arising from customer feedback/complaints, product failure, employee feedback, innovation, determined risk/opportunity, internal audit results, management review results, identified nonconformity, or new/changed products, processes and equipment.",
    "roles": "<ul><li>Top Management and the Food Safety Team are responsible for effective implementation, ensuring planning/review/improvement meets FSSC 22000 requirements and company objectives, and that FSMS integrity is maintained when changes are planned and implemented.</li><li><b>Marketing Manager:</b> ensures the product brief is completed, recipe development/approval, signs off product specification and communicates with customers.</li><li><b>Processing Operations Manager:</b> reviews all change requests and authorises them.</li><li><b>Quality and Food Safety Team:</b> reviews raw materials for introduced hazards, validates and approves all changes.</li><li><b>Procurement:</b> selects raw material suppliers per quality and food safety criteria; the QA Manager approves suppliers through the Supplier Approval Programme.</li></ul>",
    "process": "<p>Management system processes typically change when: improvement opportunities are identified; nonconformities require corrective action; industry/company conditions change; new processes are added; important processes are outsourced; key personnel leave; customer requirements change; active orders/contracts change; or for any other reason determined by management. Changes must be made in a controlled manner with proper authorisation. Formal change control applies when a change is significant; minor changes may proceed without formal control, but if a customer indicates a change is significant this overrides any internal decision.</p><p>At a minimum, process changes include: documenting the request (typically via the NCR process) with justification; management evaluating the merits and determining necessary actions. Before authorising implementation, the following are verified: purpose and potential consequences of the change; continued integrity of the FSMS; completion of technical, safety, security and environmental reviews; that risks/consequences identified during review are addressed; regulatory/legal compliance; necessary approvals obtained; resource availability; personnel informed and trained; allocation of responsibilities/authorities; and complete documentation. The change is reviewed and approved by appropriate management (including the process owner) before implementation; Top Management is authorised to approve implementation. Upon implementation, the Food Safety Team verifies that changes are as intended, documentation is complete, changes are communicated, and regulatory/legal requirements are fulfilled.</p><p><b>Product Brief / NCR:</b> when a review or change is requested, the requester completes a Food Safety Update checklist (REC 5.6) for authorisation by the Processing Manager, summarising product description, packaging, intended use, country of export and recipe (if applicable). Once authorised, it is reviewed by the Food Safety Team for approval. A multidisciplinary project team (processing, dispatch, procurement, training, health and safety) is assigned where required.</p><p><b>Concept Samples:</b> new products are developed only against a specification approved by the Sales and Marketing Manager, reflecting shelf life by product type. Once the recipe is approved, an internal evaluation and sign-off is completed, and samples are sent to the customer for approval of the final specification.</p><p><b>Quality and Food Safety Manual Update:</b> factory trial records are maintained; manufacturing processes, parameters and requirements are described in procedures addressing quality and food safety criteria. Prior to approval, the Food Safety Team reviews all raw materials for hazards (microbial, chemical, physical, allergen), conducts food fraud vulnerability and threat assessments, reviews Food Safety Team responsibilities, updates the legislation register including sample label compliance, conducts process validation (e.g. heat penetration test, cleaning methods) and health and safety requirements, and conducts a traceability test. All analysis is outsourced to a SANAS-accredited laboratory, including commercial sterility, nutritional analysis, and additional analyses as needed (e.g. heavy metals, biotoxins).</p><p><b>Management Review:</b> held at least annually to evaluate continuing suitability, adequacy and effectiveness of the Food Safety System against FSSC 22000 and the Food Safety and Quality Policy, chaired by the Food Safety Team Leader. The agenda includes follow-up actions, verification results, changes affecting food safety, emergencies/withdrawals, system updating results, communication and customer feedback, external/internal audit results, and policy/objectives suitability. Outputs include decisions on assurance, effectiveness improvement, resource needs, and policy/objectives revisions. Minutes are maintained (REC 5.8).</p><p><b>Food Safety System Review:</b> the Food Safety Team evaluates the Food Safety System at planned intervals, at least annually before Management Review, based on internal/external communication, suitability/adequacy/effectiveness information, verification results and management review output. A review is automatically triggered by: new products; raw materials/ingredients/services changes; production systems/equipment changes; premises or equipment location changes; cleaning and sanitation programme changes; packaging/storage/distribution changes; personnel qualification or responsibility changes; statutory/regulatory changes; new hazard knowledge; customer/sector requirement changes; external enquiries; complaints indicating food safety hazards; or any other condition impacting food safety. The oPRP and HACCP Plans are updated after such a review as needed.</p><p><b>HACCP Team Meetings:</b> held monthly to discuss matters that might impact the Food Safety System; minutes are used in preparation for Management Review. Members are informed of relevant changes through production/management meetings and assess whether additional control measures are required.</p><p><b>Local Regulatory Approval:</b> a letter of changes/review, customer letter, validation reports, samples or final labels are submitted to the NRCS for approval where applicable.</p>",
    "review": "This procedure applies to all activities within the scope of the Abagold FSMS and is reviewed periodically as part of the document review cycle."
