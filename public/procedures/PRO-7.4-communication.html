    "objective": "To describe the process for maintaining internal and external communication concerning the FSQMS: what to communicate, when, with whom, how, and who communicates.",
    "roles": "<ul><li>Management establishes, implements and maintains effective arrangements for communicating with statutory/regulatory authorities, suppliers, customers and personnel on issues impacting food safety and quality.</li><li>The Procurement Manager and/or QA Manager is responsible for communication with suppliers and contractors.</li><li>Marketing and Sales Managers are responsible for product information, enquiries, contracts, order handling, amendments and customer feedback (including complaints).</li><li>The Production Manager and QA Manager are responsible for communicating with statutory and regulatory authorities (NRCS).</li></ul>",
    "process": "<p><b>External Communication:</b> primarily by email or telephone, and in person where needed. Abagold maintains arrangements for communicating with external providers/contractors; customers/consumers (product safety information, handling instructions, storage requirements, shelf life, identified food safety hazards, contract/order handling, and complaints); statutory and regulatory authorities; and other organisations affecting or affected by the FSQMS.</p><p>All customer complaints are directed through the relevant Marketing &amp; Sales Representative, who communicates complaint details to the QA Manager and Processing Manager (email preferred). This triggers the Control of Non-Conformity procedure; investigation should begin the same day, ideally within 12 hours, with the product identified via production code and investigated per the Handling of Potentially Unsafe Products Procedure (PRO 8.9.4). Feedback is relayed to the customer within 24 hours.</p><p>Significant changes are reported within 3 working days to the Certification Body (NSF), including changes to legal/commercial/organisational status and ownership, management, organisation name/address/site details, scope of operations, and management system/processes. Serious events requiring immediate reporting include legal proceedings related to food safety or legality, public food safety events (recalls, calamities), and extraordinary events such as war, strike, riot, pandemic, natural or man-made disasters.</p><p><b>Internal Communication:</b> training is the primary means of ensuring every staff member understands their task and responsibilities. Each year staff receive job-specific training plus Hygiene and Food Safety, GMP and Allergen Awareness training, with records maintained. Production management and Supervisors hold regular production meetings (recorded via the Factory Feedback Meeting), and a Handover Meeting record is used between shifts, with daily handover/feedback meetings also held. Food Safety Update Meetings are held bi-annually, and HACCP Team meetings bi-monthly, to discuss matters such as new products, raw materials, production systems/equipment changes, premises/environment changes, cleaning and sanitation programme changes, packaging/storage/distribution changes, competency/responsibility changes, statutory/regulatory changes, hazard knowledge, customer/sector requirements, external enquiries, and complaints indicating food safety hazards. At least annually the HACCP Team reviews the Food Safety System, including the Hazard Control Plan. Outcomes feed the Management Review.</p><p>The company is a member of AFASA, FAEC and MAIL, used as platforms to stay informed of regulatory and statutory changes. Changes to food safety and quality requirements from regulators and customers are incorporated into agreed specifications; affected procedures and recording forms are amended and distributed per the Document Control Procedure, and production staff are trained on the changes.</p>",
    "review": "This procedure is reviewed periodically; the most recent review updated external communication channels and aspects of internal communication."
