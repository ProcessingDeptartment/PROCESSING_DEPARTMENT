  "sections": [
    {
      "title": "Purpose",
      "html": "<ul><li>This procedure describes the process for maintaining internal and external communication concerning the Food Safety and Quality Management System, including:</li><li>On what we will communicate</li><li>When to communicate</li><li>With whom to communicate</li><li>How to communicate</li><li>Who communicates</li></ul>"
    },
    {
      "title": "Responsibilities",
      "html": "<ul><li>Management is responsible to establish, implement and maintain effective arrangements for communicating with statutory and regulatory authorities, suppliers, customers, and personnel on issues having an impact on food safety and quality.</li><li>Top Management shall ensure that the requirement for effective communication is understood by all persons whose activities have an impact on food safety.</li></ul>"
    },
    {
      "title": "Instructions",
      "html": "<h3>External Communication</h3><ul><li>The most effective way of communication with external parties is through email or telephone. In some instances the communication will take place in person.</li><li>To ensure that sufficient information on issues concerning food safety and quality is communicated externally and is available to interested parties of the food chain. Abagold Ltd will establish, implement and maintain effective arrangements for communicating with:</li><li>External providers and contractors;</li><li>Customers and/or consumers, in relation to:</li><li>Product information related to food safety to enable handling, instruction regarding intended use, specific storage requirements and shelf life, as appropriate;</li><li>Identified food safety hazards that need to be controlled by other organisations in the food chain and/or by consumers;</li><li>Handling of contracts, enquiries and orders, including amendments;</li><li>Customer and/or consumer feedback, including customer complaints.</li><li>Statutory and regulatory authorities; and</li><li>Any other organisations that have an impact on, or will be affected by, the effectiveness or updating of the Food Safety and Quality Management System.</li><li>Management will ensure that appropriate specifications exist for all products and suppliers.</li><li>All customer complaints will generally be directed through the Marketing &amp; Sales Representative that handles the account from where the complaint originated.</li><li>The Marketing &amp; Sales Manager communicates complaint details from customer to the QA manager &amp; Processing Manager, e-mail communication is preferred.</li><li>Customer complaints received will prompt the Control of Non-Conformity procedure to be followed to investigate the complaint.</li><li>Investigation to a customer complaint should be initiated on the same day a complaint is received, ideally within 12 hours.</li><li>The product related to the complaint will be identified based on the production code and investigated according to the Handling of Potentially Unsafe Products Procedure.</li><li>Feedback regarding the complaint investigation should be relayed to the customer by the Marketing &amp; Sales Manager within 24 hours after the complaint was received.</li><li>Management will discuss information gathered regarding issues having an impact on food safety on ad hoc basis and as part of the meeting programs scheduled for production meetings, Food Safety Team Meetings, FSMS Review and Management Review Meetings.</li><li>Significant changes shall be reported within 3 working days to NSF - Certification Body (CB), these include:</li><li>Legal, Commercial, organisation status and ownership</li><li>Organisational and management (e.g. managerial, decision making or technical staff)</li><li>Organisation Name, Contact address and site details</li><li>Scope of operations and product categories covered by the certified management system</li><li>Management system and /or processes</li><li>Any other changes that render the information on the certificate inaccurate</li><li>Serious events need to be reported immediately these include at a minimum:</li><li>legal proceedings, prosecutions and the outcomes of these related to food safety or legality,</li><li>public food safety events (such as e.g. public recalls, calamities, etc.)</li><li>extraordinary events which pose major threats to food safety or certification integrity such as war, strike, riot, political instability, geopolitical tension, terrorism, crime, pandemic, flood, earthquake, malicious computer hacking, other natural or man-made disasters.</li></ul><h3>Internal Communication</h3><ul><li>Training is considered as the most effective way of communication to ensure that every staff member is familiarized with his / her task and responsibility in the plant.</li><li>Every year each staff member will receive job specific training related to his / her activity, as well as training regarding Hygiene and Food Safety, GMPs and Allergen Awareness. Training records will be maintained for all training.</li><li>Production management and Supervisors will have regular production meetings to discuss and plan production cycles, need to arrange for NRCS inspections, product release and product dispatch based on client and shipping orders. The Factory Feedback Meetings are used to record this. The Handover Meeting record is used as a form of handover between the different shifts. Daily meetings have also been implemented to discuss handover feedback and focus on the previous and current plan.</li><li>The Food Safety Update Meetings are conducted on a bi-annual basis, and HACCP Team meetings will be conducted every second month.</li><li>products or new products.</li><li>raw materials, ingredients, and services.</li><li>production systems and equipment.</li><li>production premises, location of equipment, surrounding environment.</li><li>cleaning and sanitation programmes.</li><li>packaging, storage, and distribution systems.</li><li>competencies and/or allocation of responsibilities and authorisations.</li><li>statutory and regulatory requirements.</li><li>knowledge regarding food safety hazards and control measures.</li><li>customer, sector, and other requirements that the organisation observes.</li><li>relevant enquiries and communications from external interested parties.</li><li>complaints indicating food safety hazards associated with the end product.</li><li>any other conditions that have an impact on food safety.</li><li>The HACCP Team will meet Bi-monthly to discuss matters concerning food safety, that might have an impact on the Food Safety System. Minutes of these meetings will be maintained and used as preparation for FSMS Review and Management Review Meetings.</li><li>At least once a year, the HACCP Team will review the Food Safety System, including the Hazard Control Plan, to confirm its suitability and to make any adjustments needed.</li><li>The HACCP Team will also have additional review meetings should any of the triggers in 3.2.4 be reported to ensure the effectiveness of the Food Safety and Quality System is maintained.</li><li>Outcome of the FSMS Review will be used as input for the Management Review Meetings.</li><li>The HACCP Team will be informed of changes that might have an impact on the food safety of manufactured product through HACCP Team Meetings.</li></ul><h3>Responsibilities</h3><ul><li>The Procurement manager and or the Quality Assurance Manager is responsible for communication with suppliers and contractors. Communication will generally consist by means of telephone calls, faxes and e-mails.</li><li>The Marketing and Sales Managers are responsible for communicating information related to:</li><li>Product information- instructions for use, storage, shelf life</li><li>Enquiries</li><li>Contracts</li><li>Order handling</li><li>Amendments</li><li>Customer feedback, including complaints.</li><li>Information regarding the above is communicated to the food safety team members through production meetings, Harvest meetings or food safety meetings.</li><li>Communication of the above are communicated to customers via agreed specifications, personal meetings, or e-mail communications.</li><li>The Production Manager and Quality Assurance manager are responsible for communicating with statutory and regulatory authorities (NRCS) through telephonic discussions and e-mail communications.</li><li>The company is also members of AFASA (Abalone Farming Association) &amp; FAEC (Farmed Abalone Export council), which is recognised by the Department of Agriculture, as well as MAIL (Marine Aquaculture Industry Liaison). These forums are used as platforms to be informed of any changes to the regulatory and statuary standards.</li><li>Changes to food safety and quality requirements from regulatory authorities and customers will be incorporated into the agreed specifications.</li><li>Relevant procedures and recording forms affected by these changes will be amended accordingly and distributed as prescribed by the document control procedure.</li><li>Production staff will be trained on the changes by the relevant manager(s).</li></ul>"
    },
