    "objective": "To ensure the organisation plans, implements, controls, maintains and updates the processes needed to meet requirements for the realisation of safe products, and to implement the actions determined in Risks and Opportunities (PRO 6.1.1).",
    "roles": "<ul><li>The Food Safety Team Leader is responsible for reviewing Risks and Opportunities in the presence of top management.</li><li>Top Management is responsible for providing the resources needed to implement these actions.</li></ul>",
    "process": "<p>The organisation controls planned changes and reviews the consequences of unintended changes, taking action to mitigate adverse effects as necessary, and ensures outsourced processes are controlled, by:</p><ul><li>Establishing criteria for processes.</li><li>Implementing control of the processes in accordance with the criteria.</li><li>Keeping documented information to the extent necessary to demonstrate that processes have been carried out as planned.</li></ul><p><b>Control of Externally Provided Processes, Products and Services:</b> establishment and application criteria for evaluation, selection, monitoring of performance and re-evaluation of external providers are documented in the Supplier Control Procedure. The Communication Procedure ensures requirements are communicated to external providers; verification of effectiveness (that externally provided processes/products/services do not adversely affect the FSMS) is assessed via Internal Audit; documented information of these activities and resulting actions is maintained.</p>",
