  "sections": [
    {
      "title": "Purpose",
      "html": "<ul><li>To ensure that the organisation plans, implements, controls, maintains, and updates the process needed to meet requirements for the realisation of safe products, and to implement the actions determined in Risks and Opportunities (PRO 6.1)</li></ul>"
    },
    {
      "title": "Responsibilities",
      "html": "<ul><li>The Food Safety team leader is responsible to review Risks and Opportunity in the presence of top management.</li><li>Top Management is responsible for providing the needed resources to implement these actions.</li></ul>"
    },
    {
      "title": "Details of procedure",
      "html": "<p>The organization will do this by:</p><ul><li>The organization will control planned changes and review the consequences of unintended changes, taking action to mitigate any adverse effects, as necessary.</li><li>The organization will also ensure that outsourced processes are controlled.</li><li>Establishing criteria for processes;</li><li>Implementing control of the processes in accordance with the criteria;</li><li>Keeping documented information to the extent necessary to have the confidence to demonstrate that the processes have been carried out as planned.</li></ul><h3>Control of externally provided processes, products and services</h3><p>The establishment and application criteria for the evaluation, selection, monitoring of performance and re- evaluation of external providers of processes, products and/or services are documented in the Supplier Control Procedure.</p><ul><li>The communication procedure ensures adequate communication of requirements to the external provider(s);</li><li>To ensure that externally provided processes, products or services do not adversely affect the organization's ability to consistently meet the requirements of the FSMS verification of effectiveness is assessed via Internal Audit.</li><li>Documented information of these activities and any necessary actions because of the evaluations and re-evaluations is maintained.</li></ul>"
    },
    {
