<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.8.1 Dry Chiller Batch Control</title>
  <script src="../lib/palette-map.js"></script>
  <link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="mlRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/lookups.js?v=1"></script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/api-backend.js?v=1"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/spec-registry.js?v=2"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/monitoring-log.js?v=5"></script>
<script>
(function () {
  MonitoringLog.init({
    mount: '#mlRoot',
    recordKey: 'dry-chiller-batch-control',
    docCode: 'REC 7.8.1',
    title: 'Dry Chiller Batch Control',
    docRevisionStart: 4,
    // Job number search-select, sourced from Abalone Receiving (REC 7.1.2) -- pick from what's
    // actually been received instead of typing blind. Also autofills harvest farm.
    autofill: [
      { watch: 'jobNo', source: 'abalone-receiving', matchField: 'jobNo', fill: { harvestFarm: 'receivedFrom' } }
    ],
    entryFields: [
      Lookups.field({ key: 'harvestFarm', label: 'Harvest farm', list: 'farms' }),
      { key: 'processingStep', label: 'Processing step', type: 'select', options: ['After first wash', 'After cooking'] },
      { key: 'jobNo', label: 'Job no.', type: 'jobsearch', required: true },
      { key: 'date', label: 'Date', type: 'date', required: true },
      { key: 'time', label: 'Time', type: 'text' },
      { key: 'traysClearlyMarked', label: 'Trays clearly marked?', type: 'yesno' },
      { key: 'noOfTrays', label: 'No. of trays', type: 'number' },
      { key: 'productTemp', label: 'Product temp', type: 'number', unit: '°C' },
      { key: 'chillerTemp', label: 'Chiller temp', type: 'number', unit: '°C' },
      { key: 'totalDaysInChiller', label: 'Total days in chiller', type: 'number' },
      { key: 'supervisor', label: 'Supervisor', type: 'text', required: true },
      { key: 'factoryManager', label: 'Factory manager', type: 'text' }
    ],
    specFields: [],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
  });
})();
</script>
</body>
</html>
