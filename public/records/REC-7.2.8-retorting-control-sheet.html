<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.2.8 Retorting Control Sheet</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/api-backend.js?v=1"></script>
<script src="../lib/lookups.js?v=1"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/permission-rules.js?v=1"></script>
<script src="../lib/form-record.js?v=8"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'retorting-control-sheet',
    docCode: 'REC 7.2.8',
    title: 'Retorting Control Sheet',
    docRevisionStart: 1,
    // Job number search-select, sourced from Abalone Receiving (REC 7.1.2) -- pick from what's
    // actually been received instead of typing blind.
    autofill: [
      { watch: 'jobNumber', source: 'abalone-receiving', matchField: 'jobNo', fill: {} }
    ],
    listColumns: ['date', 'jobNumber', 'retortNo'],
    batchField: 'jobNumber',
    stage: 'retorting',
    sections: [
      { title: 'Batch info', fields: [
        { key: 'date', label: 'Date', type: 'date', required: true },
        { key: 'time', label: 'Time', type: 'text' },
        { key: 'productionCode', label: 'Production code', type: 'text' },
        { key: 'jobNumber', label: 'Job number', type: 'jobsearch' },
        { key: 'productRecipe', label: 'Product recipe', type: 'text' },
        { key: 'timeTrolleyIn', label: 'Time trolley in', type: 'text' }
      ]},
      { title: 'Retort information', newPage: true, fields: [
        { key: 'retortNo', label: 'Retort no.', type: 'text' },
        { key: 'pressureOnGauge', label: 'Pressure on gauge', type: 'number' },
        { key: 'tempOnGauge', label: 'Temp on gauge', type: 'number' },
        { key: 'pressureOnScreen', label: 'Pressure on screen', type: 'number' },
        { key: 'tempOnScreen', label: 'Temp on screen', type: 'number' },
        { key: 'startSterilization', label: 'Start sterilization', type: 'text' },
        { key: 'startCooling', label: 'Start cooling', type: 'text' },
        { key: 'timeTrolleyOut', label: 'Time trolley out', type: 'text' }
      ]},
      { title: 'Notes', fields: [
        { key: 'processDeviation', label: 'Process deviation', type: 'textarea', wide: true }
      ]}
    ]
  });
})();
</script>
</body>
</html>
