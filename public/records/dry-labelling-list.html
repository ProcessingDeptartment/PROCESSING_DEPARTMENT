<!DOCTYPE html>
<html lang="en" data-palette="dry">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.4.8 Dry Labelling List</title>
<style>
  :root {
    --ink: #3a4a40;
    --steel: #7a9b88;
    --steel-dk: #556966;
    --paper: #f8f9f8;
    --line: #b3c9bf;
    --line-soft: #d0dcd8;
    --ok: #7a9b88;
    --ok-bg: #e8f3ed;
    --warn: #b8791c;
    --warn-bg: #fbf0dc;
    --fail: #a3352d;
    --fail-bg: #fbe8e6;
    --accent: #7a9b88;
  }
  .fr-app { color: var(--ink); background: var(--paper); }
  .fr-top { background: var(--steel-dk); }
  .fr-panel-head h2 { color: var(--steel); }
  .fr-btn-primary { background: var(--accent); }
  .fr-app input:focus, .fr-app select:focus, .fr-app textarea:focus { outline-color: var(--steel); }
</style>
  <link rel="stylesheet" href="color-palettes.css">
  <link rel="stylesheet" href="../responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/data-store.js?v=2"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=2"></script>
<script src="../lib/form-record.js?v=2"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'dry-labelling-list',
    docCode: 'REC 7.4.8',
    title: 'Dry Labelling List',
    docRevisionStart: 2,
    listColumns: ['customer', 'flight', 'nettWeight'],
    sections: [
      { title: 'Shipment details', fields: [
        { key: 'customer', label: 'Customer', type: 'text', required: true },
        { key: 'flight', label: 'Flight', type: 'text' },
        { key: 'address', label: 'Address', type: 'text', wide: true },
        { key: 'airwaybillNr', label: 'Airwaybill nr.', type: 'text' },
        { key: 'etd', label: 'ETD', type: 'date' },
        { key: 'nettWeight', label: 'Nett weight', type: 'number' }
      ]},
      { title: 'Sign-off', fields: [
        { key: 'salesDept', label: 'Sales dept.', type: 'text' },
        { key: 'driverFromFreightCo', label: 'Driver from freight company', type: 'text' },
        { key: 'abagoldEmployee', label: 'Abagold employee', type: 'text', required: true }
      ]}
    ],
    roster: {
      title: 'Boxes',
      columns: [
        { key: 'boxNo', label: 'Box no.', type: 'number' },
        { key: 'gradeRange', label: 'Grade range', type: 'text' },
        { key: 'boxCode', label: 'Box code', type: 'text' },
        { key: 'agCode', label: 'NRCS AG code', type: 'text' },
        { key: 'weight', label: 'Weight (kg)', type: 'number' }
      ]
    }
  });
})();
</script>

</html>
