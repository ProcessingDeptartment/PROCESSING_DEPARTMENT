<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.6.0b Live Product Areas Cleaning Record</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/lookups.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/form-record.js?v=21"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'live-product-areas-cleaning-record',
    docCode: 'REC 7.6.0b',
    title: 'Live Product Areas Cleaning Record',
    docRevisionStart: 1,
    listColumns: ['date', 'shift'],
    sections: [
      { title: 'Shift details', fields: [
        { key: 'date', label: 'Date', type: 'date', required: true },
        { key: 'shift', label: 'Shift', type: 'select', options: ['Day', 'Night'] }
      ]},
      { title: 'Sign-off', fields: [
        { key: 'inspectedBy', label: 'Inspected by', type: 'text', required: true },
        { key: 'verifiedBy', label: 'Verified by', type: 'text' }
      ]}
    ],
    roster: {
      title: 'Checklist items (one row per area/equipment item checked)',
      columns: [
        Lookups.field({ key: 'area', label: 'Area', list: 'areas' }),
        { key: 'item', label: 'Item / equipment', type: 'text' },
        { key: 'status', label: 'C / NC', type: 'select', options: ['C', 'NC'] },
        { key: 'nonConformance', label: 'Non-conformance', type: 'select', options: ['C', 'NC'] },
        { key: 'correctionSignOff', label: 'Correction and sign off', type: 'text' }
      ]
    }
  });
})();
</script>
</body>
</html>
