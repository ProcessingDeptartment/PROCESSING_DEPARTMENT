<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.9.3.2 Grading Room Temp & Humidity Log</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="mlRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/api-backend.js?v=5"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/spec-registry.js?v=2"></script>
<script src="../lib/thresholds.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/monitoring-log.js?v=10"></script>
<script>
(function () {
  MonitoringLog.init({
    mount: '#mlRoot',
    recordKey: 'grading-room-temp-humidity-log',
    docCode: 'REC 7.9.3.2',
    title: 'Grading Room Temp & Humidity Log',
    docRevisionStart: 1,
    instructions: [
      { label: 'Check', text: 'Check temperature & relative humidity on the dial inside the grading room. Temperature should be 25–32°C; any deviation must be reported.' }
    ],
    entryFields: [
      { key: 'week', label: 'Week', type: 'text' },
      { key: 'shift', label: 'Shift', type: 'select', options: ['Day', 'Night'] },
      { key: 'date', label: 'Date', type: 'date', required: true },
      { key: 'room', label: 'Room', type: 'text', default: 'Grading Room' },
      { key: 'startShiftTemp', label: 'Start shift — temp', type: 'number', unit: '°C', specKey: 'roomTemp' },
      { key: 'startShiftHumidity', label: 'Start shift — humidity', type: 'number', unit: '% rH', specKey: 'roomHumidity' },
      { key: 'duringProdTemp', label: 'During production — temp', type: 'number', unit: '°C', specKey: 'roomTemp' },
      { key: 'duringProdHumidity', label: 'During production — humidity', type: 'number', unit: '% rH', specKey: 'roomHumidity' },
      { key: 'endShiftTemp', label: 'End shift — temp', type: 'number', unit: '°C', specKey: 'roomTemp' },
      { key: 'endShiftHumidity', label: 'End shift — humidity', type: 'number', unit: '% rH', specKey: 'roomHumidity' },
      { key: 'checkedBy', label: 'Checked by', type: 'text', required: true },
      { key: 'correctiveAction', label: 'Corrective action', type: 'textarea' }
    ],
    specFields: [
      { key: 'roomTemp', label: 'Room temperature', unit: '°C', ...Thresholds.get('grading-room-temp-humidity-log', 'roomTemp') },
      { key: 'roomHumidity', label: 'Relative humidity', unit: '% rH', ...Thresholds.get('grading-room-temp-humidity-log', 'roomHumidity') }
    ],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
  });
})();
</script>
</body>
</html>
