(function () {
  // Weekly deep clean. Family 'weekly' is SHARED with REC 7.6.2 (weekly summary) and
  // REC 7.6.2.2 (dispatch): all three open the same dated submission and each renders its
  // own slice. On paper the same week's retort, drains, chemical room and staff facilities
  // were written out on two or three forms; here they are one item, answered once.
  CleaningRegister.init({
    mount: '#crRoot',
    recordKey: 'deep-cleaning-record-weekly',
    docCode: 'REC 7.6.1.1',
    title: 'Deep Cleaning Record Weekly',
    docRevisionStart: 1,
    docRevisionDate: '2023-06-01',
    family: 'weekly',
    scope: 'weekly',
    performLabel: 'inspected',
    performAction: 'inspected',
    viewNote: 'REC 7.6.2 and REC 7.6.2.2 open the same weekly record — items answered here are already answered there.',
    instructions: [
      'Deep cleaning is performed according to the Master Cleaning Plan. This record covers the weekly items only; daily items are on REC 7.6.1.',
      'A correction is put in place immediately after failure of the visual inspection. Open a CAR (REC 8.1.1.a) for any area non-conforming more than once in a week.',
      'Mark C if clean, NC if not, N/A if not applicable. Every NC needs a finding and a correction before the record can be verified.'
    ]
  });
})();
</script>
