<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.6.1.1 Deep Cleaning Record Weekly</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/lookups.js?v=1"></script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/api-backend.js?v=1"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/form-record.js?v=9"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'deep-cleaning-record-weekly',
    docCode: 'REC 7.6.1.1',
    title: 'Deep Cleaning Record Weekly',
    docRevisionStart: 1,
    listColumns: ['date', 'shift'],
    instructions: [
      { label: 'Cleaning instruction', text: 'Perform cleaning per the master cleaning schedule. Raise a corrective action immediately on visual inspection failure at end of shift. Open a CAR for areas non-conforming more than once a week. Tick C if cleaning is done, NC if not.' }
    ],
    sections: [
      { title: 'Shift details', fields: [
        { key: 'date', label: 'Date', type: 'date', required: true },
        { key: 'shift', label: 'Shift', type: 'select', options: ['Day', 'Night'] }
      ]}
    ],
    roster: {
      title: 'Checklist items — covers Entrance, Dry Cooking, Dry Entrance, Dry Storage & Passage, Shucking, Scrubbing, Washing, Canning areas, etc.',
      columns: [
        Lookups.field({ key: 'area', label: 'Area', list: 'areas' }),
        { key: 'item', label: 'Item / equipment', type: 'text' },
        { key: 'status', label: 'C / NC', type: 'select', options: ['C', 'NC'] },
        { key: 'finding', label: 'Finding', type: 'text' },
        { key: 'correction', label: 'Correction', type: 'text' },
        { key: 'signOff', label: 'Sign off', type: 'text' }
      ]
    }
  });
})();
</script>
</body>
</html>
