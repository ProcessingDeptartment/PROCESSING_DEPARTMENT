<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.6.0a Production Areas Cleaning Record</title>
<script src="../lib/shell.js?v=1"></script>
</head>
<body>
<div id="crRoot"></div>

<script>
(function () {
  // EXECUTION record: the person who cleaned records that cleaning was DONE.
  // Shares family 'exec' with REC 7.6.0 b and c -- one submission per date/shift covering
  // all three zones, each document rendering only its own zone. The three doc numbers stay
  // separate controlled documents; the double entry between them does not.
  Shell.record({
    engine: 'cleaning-register',
    mount: '#crRoot',
    recordKey: 'production-areas-cleaning-record',
    docCode: 'REC 7.6.0a',
    title: 'Production Areas Cleaning Record',
    docRevisionStart: 1,
    docRevisionDate: '2026-06-24',
    family: 'exec',
    scope: 'exec',
    zones: ['production'],
    performLabel: 'cleaned',
    performAction: 'cleaned',
    viewNote: 'This page shows the production zone. REC 7.6.0b (live) and REC 7.6.0c (personnel) write into the same shift record.',
    instructions: [
      'Clean according to the Master Cleaning Plan. Food contact surfaces are cleaned at the start of shift, between different jobs and at the end of shift. Work surfaces are sanitised at the end of shift.',
      'Mark each area C when cleaning is complete, NC if it could not be done, N/A if not applicable. An NC must carry a finding and a correction before the supervisor can verify.',
      'Sign as "cleaned" when you finish. Your supervisor verifies — the same person cannot do both.'
    ]
  });
})();
</script>
</body>
</html>
