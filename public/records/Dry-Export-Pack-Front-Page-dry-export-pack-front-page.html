<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dry Export Pack Front Page</title>
  <script src="../lib/palette-map.js"></script>
  <link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=5"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/form-record.js?v=14"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'dry-export-pack-front-page',
    batchField: 'jobNumber',
    docCode: 'Dry Export Pack Front Page',
    title: 'Dry Export Pack Front Page',
    docRevisionStart: 1,
    listColumns: ['packingDate', 'jobNumber'],
    // Job number search-select, sourced from Abalone Receiving (REC 7.1.2) -- pick from what's
    // actually been received instead of typing blind.
    autofill: [
      { watch: 'jobNumber', source: 'abalone-receiving', matchField: 'jobNo', fill: {} }
    ],
    sections: [
      { title: 'Shipment details', fields: [
        { key: 'packingDate', label: 'Packing date', type: 'date', required: true },
        { key: 'jobNumber', label: 'Job number', type: 'jobsearch' },
        { key: 'noOfBoxesExported', label: 'No. of boxes exported', type: 'number' }
      ]},
      { title: 'Attachments checklist', fields: [
        { key: 'rec747Attached', label: 'REC 7.4.7 Labelling of Dry Boxes attached?', type: 'yesno' },
        { key: 'rec748Attached', label: 'REC 7.4.8 Dry Labelling List attached?', type: 'yesno' },
        { key: 'rec749Attached', label: 'REC 7.4.9 Dry Stock Transfers attached?', type: 'yesno' },
        { key: 'signedPackingListsAttached', label: 'Signed packing lists attached?', type: 'yesno' },
        { key: 'healthCertificatesAttached', label: 'Health certificates attached?', type: 'yesno' }
      ]},
      { title: 'Sign-off', fields: [
        { key: 'completedBySupervisor', label: 'Completed by (Supervisor)', type: 'text', required: true },
        { key: 'checkedByQC', label: 'Checked by (QC)', type: 'text' },
        { key: 'verificationBy', label: 'Verification by', type: 'text' }
      ]}
    ]
  });
})();
</script>
</body>
</html>
