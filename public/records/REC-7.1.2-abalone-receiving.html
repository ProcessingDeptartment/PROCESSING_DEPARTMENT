<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.1.2 Abalone Receiving</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/api-backend.js?v=1"></script>
<script src="../lib/lookups.js?v=1"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/permission-rules.js?v=1"></script>
<script src="../lib/form-record.js?v=9"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'abalone-receiving',
    batchField: 'jobNo',
    docCode: 'REC 7.1.2',
    title: 'Abalone Receiving',
    docRevisionStart: 1,
    listColumns: ['receivingDate', 'jobNo', 'toBeProcessedFor', 'intakeWeight'],
    sections: [
      { title: 'Receiving info', fields: [
        { key: 'receivingDate', label: 'Receiving date', type: 'date', required: true },
        Lookups.field({ key: 'receivedFrom', label: 'Received from', list: 'farms' }),
        { key: 'toBeProcessedFor', label: 'Processing for', type: 'select', options: ['Can', 'Dried', 'Live', 'Other'] },
        { key: 'jobNo', label: 'Job no.', type: 'jobnumber' },
        { key: 'intakeWeight', label: 'Intake weight (kg)', type: 'computed', sumRosterColumn: 'wholeWeight' }
      ]}
    ],
    roster: {
      title: 'Baskets received',
      totalsRow: ['wholeWeight', 'farmCount', 'mortalityCount'],
      columns: [
        { key: 'basketNr', label: 'Basket nr.', type: 'number' },
        Lookups.field({ key: 'sizeRange', label: 'Size range', list: 'sizeRanges' }),
        { key: 'wholeWeight', label: 'Whole weight (kg)', type: 'number' },
        { key: 'farmCount', label: 'Count', type: 'number' },
        { key: 'mortalityCount', label: 'Mortality count', type: 'number' }
      ]
    }
  });
})();
</script>
</body>
</html>
