<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.1.2 Abalone Receiving</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/lookups.js?v=1"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=4"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/permission-rules.js?v=1"></script>
<script src="../lib/form-record.js?v=20"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'abalone-receiving',
    batchField: 'jobNo',
    docCode: 'REC 7.1.2',
    title: 'Abalone Receiving',
    docRevisionStart: 1,
    listColumns: ['receivingDate', 'jobNo', 'toBeProcessedFor', 'intakeWeight'],
    sections: [
      { title: 'Receiving info', fields: [
        { key: 'receivingDate', label: 'Receiving date', type: 'date', required: true },
        { key: 'receivedFrom', label: 'Received from', type: 'select', options: ['Abagold', 'Third party', 'Other'] },
        { key: 'toBeProcessedFor', label: 'Processing for', type: 'select', options: ['Can', 'Dried', 'Live', 'Other'] },
        { key: 'jobNo', label: 'Job no.', type: 'jobnumber' },
        { key: 'intakeWeight', label: 'Intake weight (kg)', type: 'computed', sumRosterColumn: 'wholeWeight' }
      ]}
    ],
    roster: {
      title: 'Baskets received',
      totalsRow: ['wholeWeight', 'farmCount', 'mortalityCount'],
      columns: [
        Lookups.field({ key: 'sizeRange', label: 'Size range', list: 'sizeRanges' }),
        { key: 'basketNr', label: 'Basket nr.', type: 'number' },
        { key: 'wholeWeight', label: 'Whole weight (kg)', type: 'number' },
        { key: 'farmCount', label: 'Count', type: 'number' },
        { key: 'mortalityCount', label: 'Mortality count', type: 'number' }
      ]
    }
  });
})();
</script>

<!-- ============================================================================
     Page-specific enhancements for the BASKETS RECEIVED roster.
     form-record.js is the shared engine for 100+ forms, so this stays out of it:
     everything below hooks the DOM the engine renders, from outside.

     TWO-PART CAPTURE - one job = one record, many basket lines:
       * "+ Add basket"   commits the CURRENT BASKET panel as one line in the
                          list below, then clears it (ready for the next basket).
       * "+ Submit record" (the engine's own Submit, relabelled) files the whole
                          record - every basket line - once, at the end.

     Current basket panel:
       1. Barcode scanner  - one scan fills Size range (10g band -> facility
                             band), Basket nr. and Count, then focuses Whole
                             weight.
       2. Persistent size  - the chosen Size range stays put for every following
                             basket until "Change size" is pressed.
       3. Connected scale  - window.RecScale.submitWeight(kg) (or the hidden
                             #recScaleWeight input) fills Whole weight. It never
                             adds the basket or submits - the operator does that.

     The engine rebuilds #fr_modalSections.innerHTML on every clear/submit and
     rebuilds #fr_rosterRows on every add/remove row, so a MutationObserver
     re-applies all of this after each rebuild. Nothing here is persisted as a
     record field - the panel inputs live outside #fr_rosterRows and the engine
     only ever saves the roster columns declared in the config above.
============================================================================ -->
<script>
(function () {
  'use strict';

  var COLS = ['sizeRange', 'basketNr', 'wholeWeight', 'farmCount', 'mortalityCount'];
  // Size range carried from one basket to the next. Survives "+ Add basket" and
  // a record submit (a shift usually receives one grade for a while); cleared
  // only by "Change size".
  var stickySize = '';

  function $(id) { return document.getElementById(id); }

  /* ---- barcode -------------------------------------------------------- */

  // 10g band ("20-30g", or "450g+") -> facility band (0-50g ... 450g+),
  // banded on the LOWER bound: 0..49 -> 0-50g, 50..99 -> 50-100g, >=450 -> 450g+.
  function convertSize(lower) {
    if (lower >= 450) return '450g+';
    var start = Math.floor(lower / 50) * 50;
    return start + '-' + (start + 50) + 'g';
  }

  // Tolerant parser: the exact scanner payload/delimiter isn't finalised, so
  // this accepts labelled tokens (basket=.., count=.., size=..) OR, failing
  // that, a size band anywhere in the string plus the first two bare integers
  // as basket number then count. Adjust here once the real symbology is known.
  function parseBarcode(raw) {
    raw = String(raw || '').trim();
    if (!raw) return null;
    var out = { basketNr: '', farmCount: '', sizeRange: '' };

    var sizeM = raw.match(/(\d{1,3})\s*[-–]\s*(\d{1,3})\s*g/i) || raw.match(/(\d{3})\s*g\s*\+/);
    if (sizeM) out.sizeRange = convertSize(parseInt(sizeM[1], 10));

    var bM = raw.match(/(?:basket|bkt)\D*(\d+)/i);
    var cM = raw.match(/(?:count|cnt|qty)\D*(\d+)/i);
    if (bM) out.basketNr = bM[1];
    if (cM) out.farmCount = cM[1];

    if (!bM || !cM) {
      var rest = raw;
      if (sizeM) rest = rest.replace(sizeM[0], ' ');
      if (bM) rest = rest.replace(bM[0], ' ');
      if (cM) rest = rest.replace(cM[0], ' ');
      var nums = rest.match(/\d+/g) || [];
      if (!bM && nums.length) out.basketNr = nums.shift();
      if (!cM && nums.length) out.farmCount = nums.shift();
    }
    return out;
  }

  /* ---- current-basket panel ----------------------------------------- */

  function cbInput(key) { return $('cb_' + key); }
  function cbVal(key) { var i = cbInput(key); return i ? String(i.value || '').trim() : ''; }

  function cbSet(key, val) {
    var inp = cbInput(key);
    if (!inp) return;
    if (inp.tagName === 'SELECT' && !Array.prototype.some.call(inp.options, function (o) { return o.value === val; })) {
      var o = document.createElement('option');
      o.value = val; o.textContent = val;
      inp.appendChild(o);
    }
    inp.value = val;
  }

  function setMsg(text) { var m = $('cb_msg'); if (m) m.textContent = text || ''; }

  function applyBarcode(raw) {
    var data = parseBarcode(raw);
    if (!data) return;
    var size = data.sizeRange || stickySize || '';
    if (size) { stickySize = size; cbSet('sizeRange', size); }
    if (data.basketNr) cbSet('basketNr', data.basketNr);
    if (data.farmCount) cbSet('farmCount', data.farmCount);
    var w = cbInput('wholeWeight');
    if (w) { try { w.focus(); w.select(); } catch (e) {} }
    setMsg('Scanned basket ' + (data.basketNr || '?') + ', count ' + (data.farmCount || '?') +
      ', size ' + (size || '?') + ' - enter/confirm weight, then + Add basket.');
  }

  // Called by the connected scale, or fired from the hidden #recScaleWeight
  // input. Fills Whole weight only - never adds the basket, never submits.
  function applyScaleWeight(kg) {
    var n = parseFloat(kg);
    if (isNaN(n)) return;
    cbSet('wholeWeight', String(n));
    var w = cbInput('wholeWeight');
    if (w) { try { w.focus(); } catch (e) {} }
    setMsg('Weight ' + n + ' kg from scale - press + Add basket to record it.');
  }
  window.RecScale = { submitWeight: applyScaleWeight };

  function rosterHost() { return $('fr_rosterRows'); }
  function rosterRows() {
    var h = rosterHost();
    return h ? Array.prototype.slice.call(h.querySelectorAll('.fr-roster-row')) : [];
  }
  function rowVal(row, key) {
    var i = row.querySelector('[id$="_' + key + '"]');
    return i ? String(i.value || '').trim() : '';
  }
  function rowIsBlank(row) { return COLS.every(function (k) { return !rowVal(row, k); }); }
  function basketCount() { return rosterRows().filter(function (r) { return !rowIsBlank(r); }).length; }

  function addBasket() {
    if (!cbVal('sizeRange')) { setMsg('Pick a size range before adding the basket.'); return; }
    if (!cbVal('wholeWeight')) { setMsg('Enter the whole weight before adding the basket.'); return; }
    var host = rosterHost();
    if (!host || typeof host._importRows !== 'function') { setMsg('Basket list not ready - try again.'); return; }

    var line = {};
    COLS.forEach(function (k) { line[k] = cbVal(k); });
    stickySize = line.sizeRange;             // keep the size for the next basket
    host._importRows([line]);                // append; the engine drops the blank starter row

    ['basketNr', 'wholeWeight', 'farmCount', 'mortalityCount'].forEach(function (k) { cbSet(k, ''); });
    cbSet('sizeRange', stickySize);
    renderPanel();
    var bc = $('recBarcode');
    if (bc) { try { bc.focus(); } catch (e) {} }
    setMsg('Basket added (' + basketCount() + ' on this record). Scan or enter the next one.');
  }

  function renderPanel() {
    var lbl = $('cb_stickyLabel');
    if (lbl) lbl.textContent = stickySize || 'not set';
    var chg = $('recChangeSize');
    if (chg) chg.disabled = !stickySize;
    var n = $('cb_count');
    if (n) n.textContent = basketCount() + (basketCount() === 1 ? ' basket' : ' baskets') + ' on this record';
  }

  function sizeOptionsHtml() {
    var list = (window.Lookups && window.Lookups.get('sizeRanges')) || [];
    return '<option value="">—</option>' + list.map(function (v) {
      return '<option value="' + v + '">' + v + '</option>';
    }).join('');
  }

  function buildPanel() {
    var box = document.createElement('div');
    box.id = 'recBasketPanel';
    box.className = 'no-print';
    box.style.cssText = 'margin:6px 0 14px;padding:12px;border:1px solid var(--palette-border,#e2e4e3);' +
      'border-radius:6px;background:var(--palette-head-bg,#fbfbfa);';
    box.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px;">' +
        '<strong style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--palette-label,#54606b);">Current basket</strong>' +
        '<span id="cb_count" class="fr-muted" style="font-size:11px;"></span>' +
      '</div>' +
      '<label class="fr-field" style="margin-bottom:8px;">Scan basket barcode' +
        '<input type="text" id="recBarcode" autocomplete="off" placeholder="Scan or type barcode, then Enter">' +
      '</label>' +
      '<div class="fr-grid fr-grid-3" style="margin-bottom:8px;">' +
        '<label class="fr-field">Size range' +
          '<select id="cb_sizeRange">' + sizeOptionsHtml() + '</select>' +
        '</label>' +
        '<label class="fr-field">Basket nr.' +
          '<input type="number" step="1" id="cb_basketNr">' +
        '</label>' +
        '<label class="fr-field">Whole weight (kg)' +
          '<input type="number" step="0.01" id="cb_wholeWeight">' +
        '</label>' +
        '<label class="fr-field">Count' +
          '<input type="number" step="1" id="cb_farmCount">' +
        '</label>' +
        '<label class="fr-field">Mortality count' +
          '<input type="number" step="1" id="cb_mortalityCount">' +
        '</label>' +
      '</div>' +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">' +
        '<button type="button" class="fr-btn fr-btn-primary fr-btn-sm" id="cb_addBtn">+ Add basket</button>' +
        '<span class="fr-muted" style="font-size:11px;">Size for next basket:</span>' +
        '<strong id="cb_stickyLabel" style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;">not set</strong>' +
        '<button type="button" class="fr-btn fr-btn-flat fr-btn-sm" id="recChangeSize">Change size</button>' +
      '</div>' +
      '<div id="cb_msg" class="fr-muted" style="font-size:11px;margin-top:6px;"></div>' +
      '<input type="hidden" id="recScaleWeight">';
    return box;
  }

  function wirePanel(box) {
    var bc = box.querySelector('#recBarcode');
    bc.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); applyBarcode(bc.value); bc.value = ''; }
    });
    bc.addEventListener('change', function () {
      if (bc.value.trim()) { applyBarcode(bc.value); bc.value = ''; }
    });

    var sizeSel = box.querySelector('#cb_sizeRange');
    sizeSel.addEventListener('change', function () {
      if (sizeSel.value) stickySize = sizeSel.value;
      renderPanel();
    });

    box.querySelector('#cb_addBtn').addEventListener('click', addBasket);

    box.querySelector('#recChangeSize').addEventListener('click', function () {
      stickySize = '';
      cbSet('sizeRange', '');
      renderPanel();
      try { sizeSel.focus(); } catch (e) {}
    });

    var scale = box.querySelector('#recScaleWeight');
    scale.addEventListener('change', function () {
      if (scale.value !== '') { applyScaleWeight(scale.value); scale.value = ''; }
    });
  }

  function enhance() {
    var host = rosterHost();
    if (!host) return;

    var box = $('recBasketPanel');
    if (!box || !box.isConnected) {
      box = buildPanel();
      host.parentNode.insertBefore(box, host);
      wirePanel(box);
      // The panel is now the way baskets are added; the engine's own per-row
      // "+ Add row" would bypass the sticky-size / barcode flow, so hide it.
      var addRow = $('fr_addRosterRowBtn');
      if (addRow) addRow.style.display = 'none';
      var submit = $('fr_submitBtn');
      if (submit) submit.textContent = '+ Submit record';
    }
    if (stickySize && !cbVal('sizeRange')) cbSet('sizeRange', stickySize);

    // The roster below is the list of baskets ADDED so far. The engine always
    // keeps one blank starter row - hide it (and any other fully-blank row) so
    // the list reads as "what's on the record", not an editable grid. Filled
    // rows stay visible and editable for corrections.
    var rows = rosterRows();
    var anyFilled = rows.some(function (r) { return !rowIsBlank(r); });
    rows.forEach(function (r) { r.style.display = (anyFilled && rowIsBlank(r)) ? 'none' : ''; });
    var note = $('recNoBaskets');
    if (!anyFilled) {
      if (!note) {
        note = document.createElement('div');
        note.id = 'recNoBaskets';
        note.className = 'fr-muted no-print';
        note.style.cssText = 'font-size:11px;margin:2px 0 8px;';
        note.textContent = 'No baskets added yet - use the Current basket panel above.';
        host.parentNode.insertBefore(note, host);
      }
      note.style.display = '';
    } else if (note) {
      note.style.display = 'none';
    }
    renderPanel();
  }

  (function boot() {
    var host = $('fr_modalSections');
    if (!host) { setTimeout(boot, 200); return; }
    var pending = false;
    new MutationObserver(function () {
      if (pending) return;
      pending = true;
      setTimeout(function () { pending = false; enhance(); }, 0);
    }).observe(host, { childList: true, subtree: true });
    enhance();
  })();
})();
</script>
</body>
</html>
