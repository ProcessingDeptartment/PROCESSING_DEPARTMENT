<script>(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'abalone-receiving',
    batchField: 'jobNo',
    docCode: 'REC 7.1.2',
    title: 'Abalone Receiving',
    docRevisionStart: 1,
    listColumns: ['receivingDate', 'jobNo', 'toBeProcessedFor', 'intakeWeight'],
    sections: [
      { title: 'Job info', collapsible: true, summaryField: ['jobNo', 'receivedFrom', 'receivingDate'], fields: [
        { key: 'jobNo', label: 'Job no.', type: 'jobnumber' },
        { key: 'receivingDate', label: 'Receiving date', type: 'date', required: true },
        Lookups.field({ key: 'receivedFrom', label: 'Received from', list: 'farms' }),

        { key: 'toBeProcessedFor', label: 'Processing for', type: 'select', options: ['Can', 'Dried', 'Live', 'Other'], matchJobRoute: 'jobNo' },
        { key: 'intakeWeight', label: 'Whole weight (kg)', type: 'computed', sumRosterColumn: 'wholeWeight' },
        { key: 'lotBarcode', label: 'Lot barcode', type: 'text' }
      ]}
    ],
    roster: {
      title: 'Baskets received',
      totalsRow: ['wholeWeight', 'farmCount', 'mortalityCount'],
      columns: [
        Lookups.field({ key: 'sizeRange', label: 'Size range', list: 'sizeRanges' }),
        { key: 'basketNr', label: 'Basket nr.', type: 'number' },
        { key: 'wholeWeight', label: 'Whole weight (kg)', type: 'number' },

<script src="../lib/barcode-scan.js?v=2"></script>
<script src="../lib/entry-flow.js?v=8"></script>
<script>EntryFlow.receiving({ required: ['jobNo', 'receivingDate', 'receivedFrom', 'toBeProcessedFor'].concat(window.BarcodeScan && BarcodeScan.allowed() ? ['lotBarcode'] : []) });</script>
<script>BarcodeScan.attach('fr_f_lotBarcode', {
  label: 'Scan lot', title: 'Scan the new lot barcode', readonly: true,
  // a main barcode belongs to one job: refuse one that is already linked at intake
  check: function (code) {
    return window.FacilityApi.fetch('/api/traceability/history/' + encodeURIComponent(code)).then(function (r) {
      if (r.status === 404) return null;
      return r.json().then(function (h) {
        var l = (h.jobLinks || []).filter(function (x) { return x.stage === 'intake'; })[0];
        return l ? 'Barcode ' + code + ' is already used for job ' + (l.jobNo || l.submissionId) + '. Use a new barcode.' : null;
      });
    });
  },
  okText: function (v) { return 'Lot barcode ' + v + ' will be recorded for this job when you submit.'; }
});</script>
<script>
/* REC-7.1.2 admin-only: job number barcode scanning (Feature A) */
(function () {
  'use strict';
  if (!window.Auth || !window.Auth.getCurrentRole || window.Auth.getCurrentRole() !== 'ADMINISTRATOR') return;
  var cameraOk = 'BarcodeDetector' in window;

  function parseJobNo(s) {
    s = String(s || '').trim().toUpperCase();
    var list = (window.Lookups && window.Lookups.get && window.Lookups.get('jobPrefixes')) || [];
    list = list.slice().sort(function (a, b) { return b.length - a.length; });
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if (s.indexOf(p) === 0 && /^\d*$/.test(s.slice(p.length))) return { prefix: p, digits: s.slice(p.length) };
    }
    var m = s.match(/^(\d?[A-Z]{2,3})(\d+)$/);
    return m ? { prefix: m[1], digits: m[2] } : { prefix: '', digits: s };
  }

  function fillJobNo(raw) {
    var v = String(raw || '').trim();
    var group = document.querySelector('.fr-jobnumber');
    if (!group) return;
    var prefixSel = group.querySelector('.fr-jn-prefix');
    var digitsInp = group.querySelector('.fr-jn-digits');
    if (!prefixSel || !digitsInp) return;
    var parsed = parseJobNo(v);
    var found = Array.from(prefixSel.options).some(function (o) { return o.value === parsed.prefix; });
    if (found) {
      prefixSel.value = parsed.prefix;
      digitsInp.value = parsed.digits;
    } else {
      digitsInp.value = v;
    }
    prefixSel.dispatchEvent(new Event('change', { bubbles: true }));
    digitsInp.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function triggerConfirm() {
    var btn = document.getElementById('ef_confirm');
    if (btn && !btn.disabled) btn.click();
  }

  function attachJobScan() {
    var group = document.querySelector('.fr-jobnumber[data-jobnumber-for="fr_f_jobNo"]');
    if (!group || group.dataset.jobScanAttached) return;
    group.dataset.jobScanAttached = '1';
    var label = group.closest('label.fr-field');
    if (!label) return;
    var grid = label.parentNode;

    var wrap = document.createElement('div');
    wrap.className = 'no-print';
    wrap.style.cssText = 'grid-column:1/-1;';

    var hint = document.createElement('div');
    hint.className = 'fr-scan-hint';
    hint.textContent = 'Scan the job barcode from the job sheet, or type the job number below.';
    wrap.appendChild(hint);

    if (cameraOk && window.BarcodeScan) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'fr-btn-scan';
      btn.textContent = '📷 Scan job barcode';
      btn.addEventListener('click', function () {
        window.BarcodeScan.open(function (v) {
          fillJobNo(v);
          setTimeout(triggerConfirm, 50);
        }, { title: 'Scan job barcode' });
      });
      wrap.appendChild(btn);
    }

    grid.insertBefore(wrap, label);

    var digits = group.querySelector('.fr-jn-digits');
    if (digits) {
      digits.addEventListener('focus', function () { try { digits.select(); } catch (e) { } });
      digits.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); triggerConfirm(); }
      });
    }
  }

  var obs = new MutationObserver(function () { attachJobScan(); });
  (function boot() {
    var host = document.getElementById('fr_modalSections');
    if (host) { obs.observe(host, { childList: true, subtree: true }); attachJobScan(); }
    else setTimeout(boot, 200);
  })();
})();
</script>
