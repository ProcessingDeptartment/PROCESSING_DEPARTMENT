<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.1.2 Abalone Receiving</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
<style>
  :root{
    --ink:#1b2330; --steel:#2f4356; --steel-dk:#1d2b38; --paper:#f4f5f3;
    --line:#c9cdd1; --line-soft:#e2e4e3; --ok:#2f7a52; --ok-bg:#e8f3ec;
    --warn:#b8791c; --warn-bg:#fbf0dc; --fail:#a3352d; --fail-bg:#fbe8e6;
    --accent:#c9832b; --mono: 'IBM Plex Mono','SF Mono',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  #ar-root{ font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:13px; line-height:1.4; }
  #ar-root *{ box-sizing:border-box; }
  #ar-root h1,#ar-root h2,#ar-root h3{ margin:0; font-weight:700; }
  #ar-root input, #ar-root select, #ar-root textarea{
    font-family:var(--mono); font-size:12.5px; border:1px solid var(--line); border-radius:3px;
    padding:4px 6px; background:#fff; color:var(--ink); width:100%;
  }
  #ar-root input:focus, #ar-root select:focus, #ar-root textarea:focus{ outline:2px solid var(--steel); outline-offset:-1px; }
  #ar-root button{ font-family:var(--sans); cursor:pointer; border:none; border-radius:3px; font-weight:600; }
  .dc-top{ background:var(--steel-dk); color:#f4f1e8; padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .dc-topline{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .dc-topline input{ width:120px; padding:3px 5px; font-size:11px; }
  .btn{ padding:5px 11px; font-size:11.5px; }
  .btn-primary{ background:var(--accent); color:#241a0a; }
  .btn-primary:hover{ background:#dd9536; }
  .btn-ghost{ background:transparent; color:#f4f1e8; border:1px solid #55636e !important; }
  .btn-ghost:hover{ background:#33444f; }
  .btn-flat{ background:var(--line-soft); color:var(--ink); }
  .btn-flat:hover{ background:#d5d8d6; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .dc-body{ padding:12px 14px 40px; max-width:900px; margin:0 auto; }
  .panel{ background:#fff; border:1px solid var(--line-soft); border-radius:5px; margin-bottom:10px; }
  .panel-head{ padding:7px 11px; border-bottom:1px solid var(--line-soft); background:#fbfbfa; border-radius:5px 5px 0 0; }
  .panel-head h2{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--steel); margin:0; }
  .panel-body{ padding:11px; }

  .job-number-row{ display:grid; grid-template-columns:74px 1fr; gap:6px; }
  .job-number-row select, .job-number-row input{ font-size:11.5px; padding:3px 5px; }
  .field-hint{ font-size:9.5px; font-weight:500; color:#8a939b; font-family:var(--mono); }
  .field-hint.bad{ color:var(--fail); }

  .grid{ display:grid; gap:8px; }
  .grid-6{ grid-template-columns:repeat(6,1fr); }
  .grid-5{ grid-template-columns:repeat(5,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  label.field{ display:flex; flex-direction:column; gap:2px; font-size:10.5px; color:#54606b; font-weight:600; }
  label.field input, label.field select{ font-size:11.5px; padding:3px 5px; }

  .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .status-line{ font-size:10px; color:#8a939b; font-family:var(--mono); margin-right:auto; }
  .record-status{ font-size:10px; color:#54606b; font-weight:600; padding:4px 8px; background:#e2e4e3; border-radius:3px; }
  .muted{ color:#8a939b; }
  .toast{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--steel-dk); color:#fff; padding:8px 16px; border-radius:20px; font-size:11px; z-index:999; opacity:0; pointer-events:none; transition:opacity .25s; }
  .toast.show{ opacity:1; }

  @media (max-width:900px){
    .grid-6{grid-template-columns:repeat(3,1fr);}
    .grid-4{grid-template-columns:repeat(2,1fr);}
  }
</style>
  <link rel="stylesheet" href="../responsive.css?v=1">
</head>
<body>
<div id="ar-root">
  <div class="dc-top">
    <div class="doc-line"><span class="doc-code">REC 7.1.2</span><h1>Abalone Receiving</h1><span class="doc-rev">Rev 4 &middot; Rev date not set</span></div>
    <div class="dc-topline no-print"><button class="btn btn-flat" id="saveDraftBtn">Save</button>
      <button class="btn btn-primary" id="submitBtn">Submit</button>
    </div>
  </div>

  <div class="dc-body">

    <div class="panel">
      <div class="panel-head"><h2>Receiving Info</h2></div>
      <div class="panel-body">
        <div class="grid grid-5" style="margin-bottom:8px;">
          <label class="field">Receiving date<input id="h_receivingDate" type="date"></label>
          <label class="field">Harvest farm<select id="h_receivedFrom"></select></label>
          <label class="field">Processing for<select id="h_toBeProcessedFor"><option value="">—</option><option value="Can">Can</option><option value="Dried">Dried</option><option value="Live">Live</option><option value="Other">Other</option></select></label>
          <label class="field">Size range<select id="h_sizeRange"></select></label>
          <label class="field">Job no.<div class="job-number-row"><select id="h_jobPrefix"></select><input id="h_jobDigits" placeholder="Digits" inputmode="numeric"></div><span class="field-hint" id="jobNoHint"></span></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Basket & Counts</h2></div>
      <div class="panel-body">
        <div class="grid grid-4">
          <label class="field">Basket nr.<input id="h_basketNr" type="number"></label>
          <label class="field">Whole weight<input id="h_wholeWeight" type="number" step="0.01"></label>
          <label class="field">Farm count<input id="h_farmCount" type="number"></label>
          <label class="field">Factory count<input id="h_factoryCount" type="number"></label>
        </div>
        <div class="grid grid-6" style="margin-top:8px;">
          <label class="field">Mortality count<input id="h_mortalityCount" type="number"></label>
        </div>
        <div class="actions no-print" style="margin-top:8px;">
          <span class="status-line" id="entryEditNotice"></span>
          <button class="btn btn-flat" id="cancelEntryBtn" style="display:none;">Cancel edit</button>
          <button class="btn btn-primary" id="confirmEntryBtn">Confirm & add entry</button>
        </div>

        <table class="entry-table" id="basketTable" style="width:100%; border-collapse:collapse; margin-top:12px; font-size:11.5px;">
          <thead>
            <tr style="text-align:left; border-bottom:1px solid var(--line-soft); color:#54606b;">
              <th style="padding:5px 6px;">Basket nr.</th>
              <th style="padding:5px 6px;">Whole weight</th>
              <th style="padding:5px 6px;">Farm count</th>
              <th style="padding:5px 6px;">Factory count</th>
              <th style="padding:5px 6px;">Mortality count</th>
              <th style="padding:5px 6px;">Edited by</th>
              <th class="no-print" style="padding:5px 6px;"></th>
            </tr>
          </thead>
          <tbody id="basketTableBody"></tbody>
        </table>
        <div class="muted" id="basketTableEmpty" style="padding:8px 2px; font-size:11px;">No basket entries added yet.</div>
      </div>
    </div>

    <div class="modal-overlay no-print" id="editNameModal" style="display:none; position:fixed; inset:0; background:rgba(20,26,32,.5); z-index:1000; align-items:center; justify-content:center;">
      <div class="modal-box" style="background:#fff; border-radius:6px; padding:16px; width:280px; box-shadow:0 8px 30px rgba(0,0,0,.25);">
        <h3 style="font-size:12.5px; margin-bottom:10px;">Confirm your name to edit this line</h3>
        <label class="field">Your name<input id="editNameInput" type="text" placeholder="Full name"></label>
        <div class="actions" style="margin-top:12px;">
          <button class="btn btn-flat" id="editNameCancelBtn">Cancel</button>
          <button class="btn btn-primary" id="editNameOkBtn">Continue</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Sign-off</h2></div>
      <div class="panel-body">
        <div class="grid grid-2">
          <label class="field">Checked & completed by<input id="f_checkedBy"></label>
          <label class="field">Date<input id="f_checkedByDate" type="date"></label>
        </div>
      </div>
    </div>

    <div class="actions no-print">
      <span class="record-status" id="recordStatus"></span>
      <span class="status-line" id="statusLine"></span>
      <button class="btn btn-flat" id="exportBtn">Export JSON</button>
      <button class="btn btn-flat" id="generatePdfBtn">Print PDF</button>
    </div>
  </div>

  <div class="toast no-print" id="toast"></div>
</div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/lookups.js?v=1"></script>
<script>
/* Controlled-copy title block, repeated on every printed page.
 * docCode/recordKey are also what tools/build-master-index-data.py keys this page
 * to in the Master Index. Without them the build falls back to the file name, which
 * silently re-keys the record and orphans its stored revision history.
 * The paper revision is deliberately not stated here -- mountPrintHeader takes it
 * from the record's index row, so the issued index stays the single source. */
window.RecordDoc = { docCode: 'REC 7.1.2', recordKey: 'abalone-receiving' };
document.addEventListener('DOMContentLoaded', function () {
  if (!window.DocHeader) return;
  window.DocHeader.mountPrintHeader({ recordKey: window.RecordDoc.recordKey })
    .catch(function (e) { console.error('title block failed to mount', e); });
});
</script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script>
(async function(){
  const $ = id => document.getElementById(id);

  function newRecord(){
    return {
      id: null, revision: 1, status:'draft',
      receivingDate:'', receivedFrom:'', toBeProcessedFor:'', sizeRange:'', jobNo:'',
      basketEntries: [],
      checkedBy:'', checkedByDate:'',
      createdAt: null, updatedAt: null
    };
  }

  let state = newRecord();
  let editingEntryId = null; // set while an existing entry is being edited
  let pendingEditEntryId = null; // set while the name-confirm modal is open
function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  }
  function safeKey(s){ return String(s).trim().replace(/[\s\/\\'"]+/g,'_'); }

  async function storeGet(key, shared){
    try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function storeSet(key, value, shared){
    try{ await window.storage.set(key, value, shared); return true; }
    catch(e){ return false; }
  }

  const ENTRY_FIELDS = ['basketNr','wholeWeight','farmCount','factoryCount','mortalityCount'];

  function emptyEntryInputs(){
    ENTRY_FIELDS.forEach(f=>{ $('h_'+f).value = ''; });
  }

  function renderForm(){
    $('h_receivingDate').value = state.receivingDate;
    window.Lookups.setValue('h_receivedFrom', 'farms', state.receivedFrom);
    $('h_toBeProcessedFor').value = state.toBeProcessedFor;
    window.Lookups.setValue('h_sizeRange', 'sizeRanges', state.sizeRange);
    renderJobNo();
    $('f_checkedBy').value = state.checkedBy;
    $('f_checkedByDate').value = state.checkedByDate;
  }

  // jobNo is stored as one string (e.g. "3CP000123") but entered as
  // prefix + digits so the product code can't be mistyped.
  function splitJobNo(value){
    const m = String(value || '').trim().toUpperCase().match(/^(3CP|3DP|CPR|DPR)(\d*)$/);
    return m ? { prefix: m[1], digits: m[2] } : { prefix: '', digits: '' };
  }

  function renderJobNo(){
    const parts = splitJobNo(state.jobNo);
    $('h_jobPrefix').value = parts.prefix;
    $('h_jobDigits').value = parts.digits;
    updateJobNoHint();
  }

  function updateJobNoHint(){
    const hint = $('jobNoHint');
    if(!state.jobNo){ hint.textContent = 'e.g. 3CP000001'; hint.classList.remove('bad'); return; }
    const ok = window.Lookups.batch.isValid(state.jobNo);
    hint.textContent = ok ? state.jobNo : '4–8 digits required';
    hint.classList.toggle('bad', !ok);
  }

  function syncJobNo(){
    const prefix = $('h_jobPrefix').value;
    const digits = $('h_jobDigits').value.replace(/\D/g, '').slice(0, 8);
    $('h_jobDigits').value = digits;
    state.jobNo = (prefix && digits) ? prefix + digits : '';
    updateJobNoHint();
  }

  function bindInputs(){
    ['h_jobPrefix','h_jobDigits'].forEach(id=>{
      $(id).addEventListener('input', syncJobNo);
      $(id).addEventListener('change', syncJobNo);
    });
    const inputs = [
      ['receivingDate', 'h_receivingDate'],
      ['receivedFrom', 'h_receivedFrom'],
      ['toBeProcessedFor', 'h_toBeProcessedFor'],
      ['sizeRange', 'h_sizeRange'],
      ['checkedBy', 'f_checkedBy'],
      ['checkedByDate', 'f_checkedByDate']
    ];
    inputs.forEach(([stateKey, id])=>{
      const el = $(id);
      if(!el) return;
      const sync = ()=>{ state[stateKey] = el.value; };
      el.addEventListener('input', sync);
      el.addEventListener('change', sync);
    });
  }

  function renderEntryTable(){
    const body = $('basketTableBody');
    const empty = $('basketTableEmpty');
    body.innerHTML = '';
    if(!state.basketEntries.length){
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    state.basketEntries.forEach(entry=>{
      const tr = document.createElement('tr');
      tr.style.borderBottom = '1px solid var(--line-soft)';
      if(entry.id === editingEntryId) tr.style.background = '#fbf0dc';
      tr.innerHTML = `
        <td style="padding:5px 6px;">${entry.basketNr || ''}</td>
        <td style="padding:5px 6px;">${entry.wholeWeight || ''}</td>
        <td style="padding:5px 6px;">${entry.farmCount || ''}</td>
        <td style="padding:5px 6px;">${entry.factoryCount || ''}</td>
        <td style="padding:5px 6px;">${entry.mortalityCount || ''}</td>
        <td style="padding:5px 6px;">${entry.editedBy ? entry.editedBy + ' · ' + new Date(entry.editedAt).toLocaleString() : ''}</td>
        <td class="no-print" style="padding:5px 6px;"><button class="btn btn-flat editEntryBtn" data-id="${entry.id}" style="padding:3px 8px; font-size:10.5px;">Edit</button></td>
      `;
      body.appendChild(tr);
    });
    body.querySelectorAll('.editEntryBtn').forEach(btn=>{
      btn.addEventListener('click', ()=>openEditNameModal(btn.getAttribute('data-id')));
    });
  }

  function updateRecordStatus(){
    const submitted = state.status === 'submitted';
    $('recordStatus').textContent = `${submitted ? '✓ Submitted' : 'Draft'} · ${state.basketEntries.length} basket${state.basketEntries.length===1?'':'s'} · ${state.id ? 'ID: ' + state.id.slice(-8) : 'Unsaved'}`;
  }

  function renderAll(){
    renderForm();
    renderEntryTable();
    updateRecordStatus();
    $('statusLine').textContent = state.updatedAt ? `Last saved ${new Date(state.updatedAt).toLocaleString()}` : 'Not yet saved';
  }

  function validateJobNo(){
    if (!state.jobNo || !window.Lookups || !window.Lookups.batch || !window.Lookups.batch.isValid) return true;
    const valid = window.Lookups.batch.isValid(state.jobNo);
    if (valid) return true;
    toast(window.Lookups.batch.formatError());
    return false;
  }

  async function saveRecord(finalize){
    if (!validateJobNo()) return;

    const now = Date.now();
    if(!state.id){
      const basketId = state.basketEntries.length ? state.basketEntries[0].basketNr : 'NOBASKET';
      state.id = `abalone_receiving_${safeKey(basketId)}_${now}`;
      state.createdAt = now;
    }
    state.updatedAt = now;
    state.status = finalize ? 'submitted' : 'draft';

    const ok = await storeSet('record:'+state.id, JSON.stringify(state), true);
    if(!ok){ toast('Save failed.'); return; }
    toast(finalize ? 'Submitted for verification.' : 'Draft saved.');
    renderAll();
  }

  function generatePdf(){
    const basketStr = state.basketEntries.length ? state.basketEntries.map(e=>e.basketNr).join('-') : 'record';
    document.title = `REC_7.1.2_ABALONE_RECEIVING_${safeKey(basketStr)}_${state.receivingDate||''}`;
    window.print();
  }

  function readEntryInputs(){
    const entry = {};
    ENTRY_FIELDS.forEach(f=>{ entry[f] = $('h_'+f).value; });
    return entry;
  }

  function setEditNotice(){
    const notice = $('entryEditNotice');
    const cancelBtn = $('cancelEntryBtn');
    const confirmBtn = $('confirmEntryBtn');
    if(editingEntryId){
      notice.textContent = `Editing basket entry — updating will overwrite this line.`;
      cancelBtn.style.display = '';
      confirmBtn.textContent = 'Confirm edit';
    } else {
      notice.textContent = '';
      cancelBtn.style.display = 'none';
      confirmBtn.textContent = 'Confirm & add entry';
    }
  }

  function confirmEntry(){
    const values = readEntryInputs();
    if(!values.basketNr){ toast('Enter a basket number first.'); return; }

    if(editingEntryId){
      const idx = state.basketEntries.findIndex(e=>e.id === editingEntryId);
      if(idx === -1){ toast('Entry no longer exists.'); }
      else{
        const editedBy = state.basketEntries[idx]._pendingEditor;
        state.basketEntries[idx] = { ...state.basketEntries[idx], ...values, editedBy, editedAt: Date.now() };
        delete state.basketEntries[idx]._pendingEditor;
        toast('Basket entry updated.');
      }
      editingEntryId = null;
    } else {
      state.basketEntries.push({ id: 'entry_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), ...values });
      toast('Basket entry added.');
    }

    emptyEntryInputs();
    setEditNotice();
    renderEntryTable();
    updateRecordStatus();
  }

  function cancelEntryEdit(){
    editingEntryId = null;
    emptyEntryInputs();
    setEditNotice();
    renderEntryTable();
  }

  function openEditNameModal(entryId){
    pendingEditEntryId = entryId;
    $('editNameInput').value = '';
    $('editNameModal').style.display = 'flex';
    setTimeout(()=>$('editNameInput').focus(), 0);
  }

  function closeEditNameModal(){
    pendingEditEntryId = null;
    $('editNameModal').style.display = 'none';
  }

  function confirmEditName(){
    const name = $('editNameInput').value.trim();
    if(!name){ toast('Enter your name to continue.'); return; }
    const entry = state.basketEntries.find(e=>e.id === pendingEditEntryId);
    if(!entry){ closeEditNameModal(); return; }
    entry._pendingEditor = name;
    editingEntryId = entry.id;
    ENTRY_FIELDS.forEach(f=>{ $('h_'+f).value = entry[f] || ''; });
    setEditNotice();
    renderEntryTable();
    closeEditNameModal();
  }

  function wire(){
    window.Lookups.upgrade('h_receivedFrom', 'farms');
    window.Lookups.fill('h_sizeRange', 'sizeRanges', { selected: state.sizeRange });
    window.Lookups.fill('h_jobPrefix', 'jobPrefixes', { selected: splitJobNo(state.jobNo).prefix });
    bindInputs();
    $('saveDraftBtn').addEventListener('click', ()=>saveRecord(false));
    $('submitBtn').addEventListener('click', ()=>saveRecord(true));
    $('confirmEntryBtn').addEventListener('click', confirmEntry);
    $('cancelEntryBtn').addEventListener('click', cancelEntryEdit);
    $('editNameOkBtn').addEventListener('click', confirmEditName);
    $('editNameCancelBtn').addEventListener('click', closeEditNameModal);
    $('editNameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') confirmEditName(); });
    $('exportBtn').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const basketStr = state.basketEntries.length ? state.basketEntries.map(e=>e.basketNr).join('-') : 'abalone_receiving_draft';
      a.download = `abalone_receiving_${safeKey(basketStr)}.json`;
      a.click();
    });
    $('generatePdfBtn').addEventListener('click', generatePdf);
  }

  wire();
  renderAll();
})();
</script>
</body>
</html>
