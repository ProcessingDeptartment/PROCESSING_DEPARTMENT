<script>(function () {

    mount: '#frRoot',
    recordKey: 'abalone-receiving',

    docCode: 'REC 7.1.2',
    title: 'Abalone Receiving',
    docRevisionStart: 1,

      { title: 'Job info', collapsible: true, summaryField: ['jobNo', 'receivedFrom', 'receivingDate'], fields: [
