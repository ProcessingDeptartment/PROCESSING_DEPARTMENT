<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.1.2 Abalone Receiving</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
<style>
  :root{
    --ink:var(--palette-ink); --steel:var(--palette-heading); --steel-dk:var(--palette-dark); --paper:var(--palette-paper);
    --line:#c9cdd1; --line-soft:var(--palette-border); --ok:var(--palette-ok); --ok-bg:var(--palette-ok-bg);
    --warn:#b8791c; --warn-bg:#fbf0dc; --fail:var(--palette-fail); --fail-bg:var(--palette-fail-bg);
    --accent:var(--palette-primary); --mono: 'IBM Plex Mono','SF Mono',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  #ar-root{ font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:var(--form-fs-root); line-height:1.4; }
  #ar-root *{ box-sizing:border-box; }
  #ar-root h1,#ar-root h2,#ar-root h3{ margin:0; font-weight:700; }
  #ar-root input, #ar-root select, #ar-root textarea{
    font-family:var(--mono); font-size:var(--form-fs-input); border:1px solid var(--line); border-radius:3px;
    padding:4px 6px; background:#fff; color:var(--ink); width:100%;
  }
  #ar-root input:focus, #ar-root select:focus, #ar-root textarea:focus{ outline:2px solid var(--steel); outline-offset:-1px; }
  #ar-root button{ font-family:var(--sans); cursor:pointer; border:none; border-radius:3px; font-weight:600; }
  .dc-top{ background:var(--steel-dk); color:var(--palette-dark-text); padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .dc-topline{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .dc-topline input{ width:120px; padding:3px 5px; font-size:var(--form-fs-small); }
  .btn{ padding:5px 11px; font-size:var(--form-fs-button); }
  .btn-primary{ background:var(--accent); color:var(--palette-primary-text); }
  .btn-primary:hover{ background:var(--palette-primary-hover); }
  .btn-ghost{ background:transparent; color:var(--palette-dark-text); border:1px solid #55636e !important; }
  .btn-ghost:hover{ background:#33444f; }
  .btn-flat{ background:var(--line-soft); color:var(--ink); }
  .btn-flat:hover{ background:#d5d8d6; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .dc-body{ padding:12px 14px 40px; max-width:900px; margin:0 auto; }
  .panel{ background:#fff; border:1px solid var(--line-soft); border-radius:5px; margin-bottom:10px; }
  .panel-head{ padding:7px 11px; border-bottom:1px solid var(--line-soft); background:var(--palette-head-bg); border-radius:5px 5px 0 0; }
  .panel-head h2{ font-size:var(--form-fs-panel-head); text-transform:uppercase; letter-spacing:.05em; color:var(--steel); margin:0; }
  .panel-body{ padding:11px; }

  .job-number-row{ display:grid; grid-template-columns:74px 1fr; gap:6px; }
  .job-number-row select, .job-number-row input{ font-size:var(--form-fs-button); padding:3px 5px; }
  .field-hint{ font-size:var(--form-fs-hint); font-weight:500; color:#8a939b; font-family:var(--mono); }
  .field-hint.bad{ color:var(--fail); }

  .grid{ display:grid; gap:8px; }
  .grid-6{ grid-template-columns:repeat(6,1fr); }
  .grid-5{ grid-template-columns:repeat(5,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  label.field{ display:flex; flex-direction:column; gap:2px; font-size:var(--form-fs-label); color:var(--palette-label); font-weight:600; }
  label.field input, label.field select{ font-size:var(--form-fs-button); padding:3px 5px; }

  .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .status-line{ font-size:10px; color:#8a939b; font-family:var(--mono); margin-right:auto; }
  .record-status{ font-size:10px; color:var(--palette-label); font-weight:600; padding:4px 8px; background:var(--palette-border); border-radius:3px; }
  .muted{ color:#8a939b; }
  .toast{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--steel-dk); color:#fff; padding:8px 16px; border-radius:20px; font-size:var(--form-fs-small); z-index:999; opacity:0; pointer-events:none; transition:opacity .25s; }
  .toast.show{ opacity:1; }

  @media (max-width:900px){
    .grid-6{grid-template-columns:repeat(3,1fr);}
    .grid-4{grid-template-columns:repeat(2,1fr);}
  }

  /* ---- PDF / print ----------------------------------------------------------
   * The printed record is ordered differently to the screen: Receiving Info and
   * Sign-off belong together on page 1, and Basket & Counts starts on page 2
   * because it runs to ~200 rows. .dc-body becomes a flex column purely so the
   * panels can be reordered without moving them in the DOM (the on-screen order
   * is the data-capture order and must stay as it is). */
  .print-only{ display:none; }
  @media print{
    .print-only{ display:grid; }
    #basketTableEmpty{ display:none !important; }

    .dc-body{ display:flex; flex-direction:column; max-width:none; padding:0; }
    #panelReceiving{ order:1; }
    #panelSignoff{ order:2; }
    #panelBaskets{ order:3; break-before:page; page-break-before:always; }

    /* One font size for the whole printed record, matching the basket table
     * while making the PDF text more readable. */
    #ar-root{ font-size:14px; }
    .panel{ border:1px solid #000; margin-bottom:6px; break-inside:avoid; }
    #panelReceiving, #panelSignoff{ border:0; }
    .panel-head{ background:#fff; padding:4px 7px; }
    .panel-head h2{ font-size:14px; }

    /* Fields print as a label over a ruled line -- the same thin-border
     * language as the basket table rows and the sign-off .sig-line -- rather
     * than boxed, radius-cornered inputs, which was the odd one out.
     * .field is matched bare here (not label.field) so the print-only
     * verification row, which uses divs, picks up the same styling. */
    #ar-root .field{ display:flex; flex-direction:column; font-size:14px; gap:1px;
                     color:var(--palette-label); font-weight:600; }
    #ar-root .panel-body{ padding:7px; }
    #ar-root .grid{ gap:5px; }
    #ar-root input, #ar-root select{
      font-size:14px; padding:1px 0; border:none; border-bottom:1px solid #999;
      border-radius:0; -webkit-appearance:none; appearance:none; background:transparent;
      text-overflow:clip; min-width:0;
    }

    /* Job no. must never clip: the prefix column shrinks to its content and the
     * digits take the rest, instead of the fixed 74px screen column. */
    .job-number-row{ grid-template-columns:auto 1fr; gap:3px; }
    .job-number-row select, .job-number-row input{ font-size:14px; padding:1px 0; }
    #jobNoHint{ display:none; }

    /* Signature ruled lines for the print-only verification row. */
    .sig-line{ border-bottom:1px solid #000; height:14px; }

    /* One compact row per basket, header repeated on each page, no split rows.
     * !important because the table carries an inline font-size, which would
     * otherwise beat this rule and keep the screen size in the PDF. */
    #basketTable{ font-size:14px !important; table-layout:fixed; width:100%; }
    #basketTable thead{ display:table-header-group; }
    #basketTable tr{ break-inside:avoid; page-break-inside:avoid; }
    #basketTable th, #basketTable td{
      padding:1.5px 3px !important; border-bottom:1px solid #999;
      white-space:nowrap; overflow:hidden; text-overflow:clip;
    }
    #basketTable td{ font-size:12px !important; }
    #basketTable th{ border-bottom:1px solid #000; }
  }
</style>
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="ar-root">
  <div class="dc-top">
    <div class="doc-line"><span class="doc-code">REC 7.1.2</span><h1>Abalone Receiving</h1><span class="doc-rev">Rev 4 &middot; Rev date not set</span></div>
    <div class="dc-topline no-print"><button class="btn btn-flat" id="saveDraftBtn">Save</button>
      <button class="btn btn-primary" id="submitBtn">Submit</button>
    </div>
  </div>

  <div class="dc-body">

    <div class="panel" id="panelReceiving">
      <div class="panel-head"><h2>Receiving Info</h2></div>
      <div class="panel-body">
        <div class="grid grid-3" style="margin-bottom:8px;">
          <label class="field">Receiving date<input id="h_receivingDate" type="date"></label>
          <label class="field">Processing for<select id="h_toBeProcessedFor"><option value="">—</option><option value="Can">Can</option><option value="Dried">Dried</option><option value="Live">Live</option><option value="Other">Other</option></select></label>
          <label class="field">Job no.<div class="job-number-row"><select id="h_jobPrefix"></select><input id="h_jobDigits" placeholder="Digits" inputmode="numeric"></div><span class="field-hint" id="jobNoHint"></span></label>
        </div>
        <select id="h_receivedFrom" style="display:none;"></select>
      </div>
    </div>

    <div class="panel" id="panelBaskets" style="border:none; background:transparent;">
      <div class="panel-body">
        <!-- Capture widget only: the confirmed table below is the record, so this whole
             block is no-print -- otherwise the PDF carries a row of blank input boxes. -->
        <div id="basketCapture" class="no-print">
        <div class="grid grid-2">
          <label class="field">Basket nr.<input id="h_basketNr" type="number"></label>
          <label class="field">Whole weight<input id="h_wholeWeight" type="number" step="0.01"></label>
        </div>
        <!-- Size range shows in the confirmed table only (populated by import); no manual
             capture field for it here, but the element stays for Lookups/edit wiring. -->
        <select id="h_sizeRange" style="display:none;"></select>
        <div class="grid grid-3" style="margin-top:8px;">
          <label class="field">Farm count<input id="h_farmCount" type="number"></label>
          <label class="field">Factory count<input id="h_factoryCount" type="number"></label>
          <label class="field">Mortality count<input id="h_mortalityCount" type="number"></label>
        </div>
        </div>
        <div class="actions no-print" style="margin-top:8px;">
          <span class="status-line" id="entryEditNotice"></span>
          <button class="btn btn-flat" id="cancelEntryBtn" style="display:none;">Cancel edit</button>
          <button class="btn btn-primary" id="confirmEntryBtn">Confirm & add entry</button>
        </div>

        <table class="entry-table" id="basketTable" style="width:100%; border-collapse:collapse; margin-top:12px; font-size:11.5px;">
          <thead>
            <tr style="text-align:left; border-bottom:1px solid var(--line-soft); color:#54606b;">
              <th style="padding:5px 6px;">Farm</th>
              <th style="padding:5px 6px;">Basket nr.</th>
              <th style="padding:5px 6px;">Size range</th>
              <th style="padding:5px 6px;">Whole weight (Kg)</th>
              <th style="padding:5px 6px;">Farm count</th>
              <th style="padding:5px 6px;">Factory count</th>
              <th style="padding:5px 6px;">Mortality count</th>
              <th style="padding:5px 6px;">Edited by</th>
              <th class="no-print" style="padding:5px 6px;"></th>
            </tr>
          </thead>
          <tbody id="basketTableBody"></tbody>
        </table>
        <div class="muted" id="basketTableEmpty" style="padding:8px 2px; font-size:11px;">No basket entries added yet.</div>
      </div>
    </div>

    <div class="modal-overlay no-print" id="editNameModal" style="display:none; position:fixed; inset:0; background:rgba(20,26,32,.5); z-index:1000; align-items:center; justify-content:center;">
      <div class="modal-box" style="background:#fff; border-radius:6px; padding:16px; width:280px; box-shadow:0 8px 30px rgba(0,0,0,.25);">
        <h3 style="font-size:12.5px; margin-bottom:10px;">Confirm your name to edit this line</h3>
        <label class="field">Your name<input id="editNameInput" type="text" placeholder="Full name"></label>
        <div class="actions" style="margin-top:12px;">
          <button class="btn btn-flat" id="editNameCancelBtn">Cancel</button>
          <button class="btn btn-primary" id="editNameOkBtn">Continue</button>
        </div>
      </div>
    </div>

    <div class="panel" id="panelSignoff">
      <div class="panel-head"><h2>Sign-off</h2></div>
      <div class="panel-body">
        <div id="signoffCompletedBy"></div>
        <!-- Verification is done against the printed copy, so this row is deliberately
             print-only: it must never be a capturable field on screen. -->
        <div class="grid grid-3 print-only" style="margin-top:8px;">
          <div class="field">Verified by<div class="sig-line"></div></div>
          <div class="field">Title<div class="sig-line"></div></div>
          <div class="field">Date<div class="sig-line"></div></div>
        </div>
      </div>
    </div>

    <div class="actions no-print">
      <span class="record-status" id="recordStatus"></span>
      <span class="status-line" id="statusLine"></span>
      <button class="btn btn-flat" id="importBtn">Import CSV</button>
      <input type="file" id="importFile" accept=".csv,text/csv" style="display:none;">
      <button class="btn btn-flat" id="exportBtn">Export JSON</button>
      <button class="btn btn-flat" id="generatePdfBtn">Print PDF</button>
    </div>

    <div class="panel no-print" id="panelVerification"></div>
  </div>

  <div class="toast no-print" id="toast"></div>
</div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/lookups.js?v=1"></script>
<script>
/* Controlled-copy title block, repeated on every printed page.
 * docCode/recordKey are also what tools/build-master-index-data.py keys this page
 * to in the Master Index. Without them the build falls back to the file name, which
 * silently re-keys the record and orphans its stored revision history.
 * The paper revision is deliberately not stated here -- mountPrintHeader takes it
 * from the record's index row, so the issued index stays the single source. */
window.RecordDoc = { docCode: 'REC 7.1.2', recordKey: 'abalone-receiving' };
document.addEventListener('DOMContentLoaded', function () {
  if (!window.DocHeader) return;
  window.DocHeader.mountPrintHeader({ recordKey: window.RecordDoc.recordKey })
    .catch(function (e) { console.error('title block failed to mount', e); });
});
</script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script>
(async function(){
  const $ = id => document.getElementById(id);

  function newRecord(){
    return {
      id: null, revision: 1, status:'draft',
      // sizeRange is per basket, not per record -- one receiving can hold mixed sizes.
      receivingDate:'', receivedFrom:'', toBeProcessedFor:'', jobNo:'',
      basketEntries: [],
      checkedBy:'', checkedByTitle:'', checkedByDate:'', checkedBySignature:'',
      verification: null,
      createdAt: null, updatedAt: null
    };
  }

  let state = newRecord();
  let editingEntryId = null; // set while an existing entry is being edited
  let pendingEditEntryId = null; // set while the name-confirm modal is open
function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  }
  function safeKey(s){ return String(s).trim().replace(/[\s\/\\'"]+/g,'_'); }

  async function storeGet(key, shared){
    try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function storeSet(key, value, shared){
    try{ await window.storage.set(key, value, shared); return true; }
    catch(e){ return false; }
  }

  const ENTRY_FIELDS = ['basketNr','sizeRange','wholeWeight','farmCount','factoryCount','mortalityCount'];

  /* Size range is a lookup-backed <select>, so clearing it means re-selecting the
   * blank option rather than blanking a free-text value. */
  function emptyEntryInputs(){
    ENTRY_FIELDS.forEach(f=>{ $('h_'+f).value = ''; });
    window.Lookups.setValue('h_sizeRange', 'sizeRanges', '');
  }

  function renderForm(){
    $('h_receivingDate').value = state.receivingDate;
    window.Lookups.setValue('h_receivedFrom', 'farms', state.receivedFrom);
    $('h_toBeProcessedFor').value = state.toBeProcessedFor;
    renderJobNo();
    $('f_checkedBy').value = state.checkedBy;
    $('f_checkedByTitle').value = state.checkedByTitle;
    $('f_checkedByDate').value = state.checkedByDate;
    $('f_checkedBySignature').value = state.checkedBySignature;
  }

  // jobNo is stored as one string (e.g. "3CP000123") but entered as
  // prefix + digits so the product code can't be mistyped.
  function splitJobNo(value){
    const m = String(value || '').trim().toUpperCase().match(/^(3CP|3DP|CPR|DPR)(\d*)$/);
    return m ? { prefix: m[1], digits: m[2] } : { prefix: '', digits: '' };
  }

  function renderJobNo(){
    const parts = splitJobNo(state.jobNo);
    $('h_jobPrefix').value = parts.prefix;
    $('h_jobDigits').value = parts.digits;
    updateJobNoHint();
  }

  function updateJobNoHint(){
    const hint = $('jobNoHint');
    if(!state.jobNo){ hint.textContent = 'e.g. 3CP000001'; hint.classList.remove('bad'); return; }
    const ok = window.Lookups.batch.isValid(state.jobNo);
    hint.textContent = ok ? state.jobNo : '4–8 digits required';
    hint.classList.toggle('bad', !ok);
  }

  function syncJobNo(){
    const prefix = $('h_jobPrefix').value;
    const digits = $('h_jobDigits').value.replace(/\D/g, '').slice(0, 8);
    $('h_jobDigits').value = digits;
    state.jobNo = (prefix && digits) ? prefix + digits : '';
    updateJobNoHint();
  }

  function bindInputs(){
    ['h_jobPrefix','h_jobDigits'].forEach(id=>{
      $(id).addEventListener('input', syncJobNo);
      $(id).addEventListener('change', syncJobNo);
    });
    const inputs = [
      ['receivingDate', 'h_receivingDate'],
      ['receivedFrom', 'h_receivedFrom'],
      ['toBeProcessedFor', 'h_toBeProcessedFor'],
      ['checkedBy', 'f_checkedBy'],
      ['checkedByTitle', 'f_checkedByTitle'],
      ['checkedByDate', 'f_checkedByDate'],
      ['checkedBySignature', 'f_checkedBySignature']
    ];
    inputs.forEach(([stateKey, id])=>{
      const el = $(id);
      if(!el) return;
      const sync = ()=>{ state[stateKey] = el.value; };
      el.addEventListener('input', sync);
      el.addEventListener('change', sync);
    });
  }

  function formatNumeric(value, digits = 0){
    const n = Number(value);
    if (Number.isNaN(n)) return String(value || '');
    const fixed = n.toFixed(digits);
    const [intPart, fracPart] = fixed.split('.');
    const formattedInt = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return digits > 0 && fracPart ? `${formattedInt}.${fracPart}` : formattedInt;
  }

  function formatWeight(value){
    const formatted = formatNumeric(value);
    return formatted ? `${formatted} g` : '';
  }

  function formatWeightKg(value){
    const g = parseFloat(value);
    if(Number.isNaN(g)) return '';
    return formatNumeric(g / 1000, 2) + ' Kg';
  }

  function renderEntryTable(){
    const body = $('basketTableBody');
    const empty = $('basketTableEmpty');
    body.innerHTML = '';
    if(!state.basketEntries.length){
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    state.basketEntries.forEach(entry=>{
      const tr = document.createElement('tr');
      tr.style.borderBottom = '1px solid var(--line-soft)';
      if(entry.id === editingEntryId) tr.style.background = '#fbf0dc';
      tr.innerHTML = `
        <td style="padding:5px 6px;">${entry.receivedFrom || ''}</td>
        <td style="padding:5px 6px;">${entry.basketNr || ''}</td>
        <td style="padding:5px 6px;">${entry.sizeRange || ''}</td>
        <td style="padding:5px 6px;">${formatWeightKg(entry.wholeWeight)}</td>
        <td style="padding:5px 6px;">${formatNumeric(entry.farmCount)}</td>
        <td style="padding:5px 6px;">${formatNumeric(entry.factoryCount)}</td>
        <td style="padding:5px 6px;">${formatNumeric(entry.mortalityCount)}</td>
        <td style="padding:5px 6px;">${entry.editedBy ? entry.editedBy + ' · ' + new Date(entry.editedAt).toLocaleString() : ''}</td>
        <td class="no-print" style="padding:5px 6px;"><button class="btn btn-flat editEntryBtn" data-id="${entry.id}" style="padding:3px 8px; font-size:10.5px;">Edit</button></td>
      `;
      body.appendChild(tr);
    });

    /* Final totals close the table off. Rendered as the last body row rather than a
     * <tfoot>, because a tfoot is repeated at the foot of every printed page and a
     * running total on each page would read as if it were the final one. */
    const sum = key => state.basketEntries
      .reduce((t, e) => t + (parseFloat(e[key]) || 0), 0);
    const totals = document.createElement('tr');
    totals.id = 'basketTotalsRow';
    totals.style.cssText = 'border-top:2px solid var(--steel); font-weight:700;';
    totals.innerHTML = `
      <td style="padding:5px 6px;"></td>
      <td style="padding:5px 6px;">Final</td>
      <td style="padding:5px 6px;"></td>
      <td style="padding:5px 6px;">${formatWeightKg(sum('wholeWeight'))}</td>
      <td style="padding:5px 6px;">${formatNumeric(sum('farmCount'))}</td>
      <td style="padding:5px 6px;">${formatNumeric(sum('factoryCount'))}</td>
      <td style="padding:5px 6px;">${formatNumeric(sum('mortalityCount'))}</td>
      <td style="padding:5px 6px;"></td>
      <td class="no-print" style="padding:5px 6px;"></td>
    `;
    body.appendChild(totals);

    body.querySelectorAll('.editEntryBtn').forEach(btn=>{
      btn.addEventListener('click', ()=>openEditNameModal(btn.getAttribute('data-id')));
    });
  }

  function updateRecordStatus(){
    const submitted = state.status === 'submitted';
    $('recordStatus').textContent = `${submitted ? '✓ Submitted' : 'Draft'} · ${state.basketEntries.length} basket${state.basketEntries.length===1?'':'s'} · ${state.id ? 'ID: ' + state.id.slice(-8) : 'Unsaved'}`;
  }

  function renderAll(){
    renderForm();
    renderEntryTable();
    updateRecordStatus();
    $('statusLine').textContent = state.updatedAt ? `Last saved ${new Date(state.updatedAt).toLocaleString()}` : 'Not yet saved';
  }

  function validateJobNo(){
    if (!state.jobNo || !window.Lookups || !window.Lookups.batch || !window.Lookups.batch.isValid) return true;
    const valid = window.Lookups.batch.isValid(state.jobNo);
    if (valid) return true;
    toast(window.Lookups.batch.formatError());
    return false;
  }

  async function saveRecord(finalize){
    if (!validateJobNo()) return;

    const now = Date.now();
    if(!state.id){
      const basketId = state.basketEntries.length ? state.basketEntries[0].basketNr : 'NOBASKET';
      state.id = `abalone_receiving_${safeKey(basketId)}_${now}`;
      state.createdAt = now;
    }
    state.updatedAt = now;
    state.status = finalize ? 'submitted' : 'draft';

    const ok = await storeSet('record:'+state.id, JSON.stringify(state), true);
    if(!ok){ toast('Save failed.'); return; }
    toast(finalize ? 'Submitted for verification.' : 'Draft saved.');
    renderAll();
    if(verificationBlock) verificationBlock.refresh();
  }

  function formatDateToDDMMYY(value){
    if (!value) return '';
    const m = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return `${m[3]}${m[2]}${m[1].slice(-2)}`;
    const date = new Date(value);
    if (!Number.isNaN(date.valueOf())){
      return `${String(date.getDate()).padStart(2,'0')}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getFullYear()).slice(-2)}`;
    }
    return value.replace(/[^\d]/g, '').slice(0,6);
  }

  function withPrintTitle(name, fn){
    const previousTitle = document.title;
    document.title = name;
    try { fn(); }
    finally { document.title = previousTitle; }
  }

  function generatePdf(){
    const datePrefix = formatDateToDDMMYY(state.receivingDate);
    withPrintTitle(`${datePrefix ? datePrefix + '_' : ''}REC7.1.2_ABALONE_RECIEVING`, () => window.print());
  }

  function readEntryInputs(){
    const entry = {};
    ENTRY_FIELDS.forEach(f=>{ entry[f] = $('h_'+f).value; });
    return entry;
  }

  function setEditNotice(){
    const notice = $('entryEditNotice');
    const cancelBtn = $('cancelEntryBtn');
    const confirmBtn = $('confirmEntryBtn');
    if(editingEntryId){
      notice.textContent = `Editing basket entry — updating will overwrite this line.`;
      cancelBtn.style.display = '';
      confirmBtn.textContent = 'Confirm edit';
    } else {
      notice.textContent = '';
      cancelBtn.style.display = 'none';
      confirmBtn.textContent = 'Confirm & add entry';
    }
  }

  function confirmEntry(){
    const values = readEntryInputs();
    if(!values.basketNr){ toast('Enter a basket number first.'); return; }

    if(editingEntryId){
      const idx = state.basketEntries.findIndex(e=>e.id === editingEntryId);
      if(idx === -1){ toast('Entry no longer exists.'); }
      else{
        const editedBy = state.basketEntries[idx]._pendingEditor;
        state.basketEntries[idx] = { ...state.basketEntries[idx], ...values, editedBy, editedAt: Date.now() };
        delete state.basketEntries[idx]._pendingEditor;
        toast('Basket entry updated.');
      }
      editingEntryId = null;
    } else {
      state.basketEntries.push({
        id: 'entry_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
        receivedFrom: state.receivedFrom,
        ...values
      });
      toast('Basket entry added.');
    }

    emptyEntryInputs();
    setEditNotice();
    renderEntryTable();
    updateRecordStatus();
  }

  function cancelEntryEdit(){
    editingEntryId = null;
    emptyEntryInputs();
    setEditNotice();
    renderEntryTable();
  }

  function openEditNameModal(entryId){
    pendingEditEntryId = entryId;
    $('editNameInput').value = '';
    $('editNameModal').style.display = 'flex';
    setTimeout(()=>$('editNameInput').focus(), 0);
  }

  function closeEditNameModal(){
    pendingEditEntryId = null;
    $('editNameModal').style.display = 'none';
  }

  function confirmEditName(){
    const name = $('editNameInput').value.trim();
    if(!name){ toast('Enter your name to continue.'); return; }
    const entry = state.basketEntries.find(e=>e.id === pendingEditEntryId);
    if(!entry){ closeEditNameModal(); return; }
    entry._pendingEditor = name;
    editingEntryId = entry.id;
    ENTRY_FIELDS.forEach(f=>{ $('h_'+f).value = entry[f] || ''; });
    setEditNotice();
    renderEntryTable();
    closeEditNameModal();
  }

  /* ---------------------------------------------------------------- import
   * Reads the CSV produced by export_receiving.py, which flattens a day's
   * HAMIO baskets into one row each. The four Receiving Info fields repeat on
   * every row of a record, so rows are grouped back into records on those.
   * Job no. is intentionally absent from the file and stays for manual entry.
   */
  const IMPORT_HEADERS = ['receivingDate','harvestFarm','processingFor','sizeRange',
                          'basketNr','wholeWeight','farmCount','factoryCount','mortalityCount'];

  // Minimal RFC-4180 parse: handles quoted fields and embedded commas/newlines.
  function parseCsv(text){
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for(let i = 0; i < text.length; i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c !== '\r'){ field += c; }
    }
    if(field !== '' || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(v => String(v).trim() !== ''));
  }

  // Can and Dried are processed on separate lines and must never land on the same
  // receiving record. Live/Other/blank carry no such restriction.
  function processingStream(value){
    const v = String(value || '').trim().toLowerCase();
    if(v === 'can') return 'can';
    if(v === 'dried' || v === 'dry') return 'dry';
    return null;
  }

  function groupImportRows(text){
    const rows = parseCsv(text);
    if(!rows.length) throw new Error('The file is empty.');

    // strip a UTF-8 BOM so the first header name still matches
    const header = rows[0].map(h => String(h).replace(/^﻿/, '').trim());
    const col = {};
    header.forEach((h, i) => { col[h] = i; });
    const missing = IMPORT_HEADERS.filter(h => !(h in col));
    if(missing.length) throw new Error('Missing column(s): ' + missing.join(', '));

    // Groups keyed on farm + processing-for (not date, not size range) so one
    // import can carry several farms and/or several processing streams onto
    // the same basket list -- the only combination it must reject is Can + Dried.
    const groups = new Map();
    rows.slice(1).forEach(r => {
      const get = name => String(r[col[name]] ?? '').trim();
      const key = [get('harvestFarm'), get('processingFor')].join('|');
      if(!groups.has(key)){
        groups.set(key, {
          receivingDate: get('receivingDate'),
          receivedFrom: get('harvestFarm'),
          toBeProcessedFor: get('processingFor'),
          entries: []
        });
      }
      groups.get(key).entries.push({
        basketNr: get('basketNr'),
        sizeRange: get('sizeRange'),
        wholeWeight: get('wholeWeight'),
        farmCount: get('farmCount'),
        factoryCount: get('factoryCount'),
        mortalityCount: get('mortalityCount')
      });
    });

    const groupList = [...groups.values()];
    const streams = new Set(groupList.map(g => processingStream(g.toBeProcessedFor)).filter(Boolean));
    if(streams.has('can') && streams.has('dry')){
      throw new Error('This file mixes Can and Dried processing — import them separately.');
    }
    return groupList;
  }

  function applyImport(groups){
    const stampedEntries = groups.flatMap((g, gi) => g.entries.map((e, n) => ({
      id: 'entry_' + Date.now() + '_' + gi + '_' + n + '_' + Math.random().toString(36).slice(2,7),
      receivedFrom: g.receivedFrom, toBeProcessedFor: g.toBeProcessedFor,
      ...e
    })));
    state.receivingDate = groups[0].receivingDate;
    // The header farm / processing-for fields only hold one value each, so they
    // stay populated only when every imported group agrees on it.
    state.receivedFrom = groups.every(g => g.receivedFrom === groups[0].receivedFrom) ? groups[0].receivedFrom : '';
    state.toBeProcessedFor = groups.every(g => g.toBeProcessedFor === groups[0].toBeProcessedFor) ? groups[0].toBeProcessedFor : '';
    state.basketEntries = stampedEntries;
    editingEntryId = null;
    emptyEntryInputs();
    setEditNotice();
    renderAll();
    const unknownFarm = groups.some(g => g.receivedFrom && !window.Lookups.isValid('farms', g.receivedFrom));
    const unknownSize = state.basketEntries.some(e =>
      e.sizeRange && !window.Lookups.isValid('sizeRanges', e.sizeRange));
    if(unknownFarm || unknownSize){
      toast('Imported — check the farm(s) and the basket size ranges.');
    } else {
      toast(`Imported ${state.basketEntries.length} basket entries. Enter the job no.`);
    }
  }

  function handleImportFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      let groups;
      try { groups = groupImportRows(String(reader.result)); }
      catch(err){ toast('Could not read file: ' + err.message); return; }
      if(!groups.length){ toast('No rows found in the file.'); return; }
      // Importing replaces what is on the form, so an in-progress record is
      // never silently overwritten.
      if(state.basketEntries.length &&
         !confirm(`This will replace the ${state.basketEntries.length} basket entries currently on the form. Continue?`)){
        return;
      }
      applyImport(groups);
    };
    reader.onerror = () => toast('Could not read that file.');
    reader.readAsText(file);
  }

  function mountSignoff(){
    $('signoffCompletedBy').innerHTML = window.SignOffBlock.completedByHtml({
      byId: 'f_checkedBy', titleId: 'f_checkedByTitle', dateId: 'f_checkedByDate', signatureId: 'f_checkedBySignature', byLabel: 'Completed by'
    });
  }

  let verificationBlock = null;
  function mountVerification(){
    verificationBlock = window.SignOffBlock.mountVerification({
      recordKey: 'abalone-receiving',
      mount: '#panelVerification',
      getPending(){
        return (state.status === 'submitted' && !state.verification)
          ? [{ id: state.id, label: state.receivingDate ? `Receiving ${state.receivingDate}` : 'This record' }]
          : [];
      },
      async onLogged(record){
        state.verification = record;
        await storeSet('record:'+state.id, JSON.stringify(state), true);
      }
    });
  }

  function wire(){
    window.Lookups.upgrade('h_receivedFrom', 'farms');
    // Size range now belongs to the basket being captured, so it starts blank.
    window.Lookups.fill('h_sizeRange', 'sizeRanges', { selected: '' });
    window.Lookups.fill('h_jobPrefix', 'jobPrefixes', { selected: splitJobNo(state.jobNo).prefix });
    bindInputs();
    $('saveDraftBtn').addEventListener('click', ()=>saveRecord(false));
    $('submitBtn').addEventListener('click', ()=>saveRecord(true));
    $('confirmEntryBtn').addEventListener('click', confirmEntry);
    $('cancelEntryBtn').addEventListener('click', cancelEntryEdit);
    $('editNameOkBtn').addEventListener('click', confirmEditName);
    $('editNameCancelBtn').addEventListener('click', closeEditNameModal);
    $('editNameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') confirmEditName(); });
    $('importBtn').addEventListener('click', ()=>$('importFile').click());
    $('importFile').addEventListener('change', e=>{
      const file = e.target.files && e.target.files[0];
      if(file) handleImportFile(file);
      e.target.value = ''; // let the same file be picked again after a fix
    });
    $('exportBtn').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const basketStr = state.basketEntries.length ? state.basketEntries.map(e=>e.basketNr).join('-') : 'abalone_receiving_draft';
      a.download = `abalone_receiving_${safeKey(basketStr)}.json`;
      a.click();
    });
    $('generatePdfBtn').addEventListener('click', generatePdf);
  }

  mountSignoff();
  wire();
  renderAll();
  mountVerification();
})();
</script>
</body>
</html>
