<script src="../lib/cleaning-register.js?v=1"></script>
<script>
(function () {
  // QC daily visual inspection. The paper form wrote out ~175 lines, of which ~110 were
  // the same 12 generic checks repeated per area. Those 12 now live once in the item
  // master and expand only for an area marked NC -- so a clean shift is ~15 taps, and a
  // shift with a problem still captures the exact failing check, its finding and its
  // correction. The standard-check list version is stamped onto every saved record.
  CleaningRegister.init({
    mount: '#crRoot',
    recordKey: 'daily-cleaning-inspection',
    docCode: 'REC 7.6.1',
    title: 'Daily Cleaning Inspection',
    docRevisionStart: 4,
    docRevisionDate: '2026-06-17',
    family: 'daily',
    scope: 'daily',
    performLabel: 'inspected',
    performAction: 'inspected',
    viewNote: 'Areas marked C need no further entry. Marking an area NC expands the 12 standard checks so the failing one can be named.',
    instructions: [
      'Cleaning is performed according to the Master Cleaning Plan. Food contact surfaces are cleaned at the start of shift, between different jobs and at the end of shift. Work surfaces are sanitised at the end of shift.',
      'A correction is put in place immediately after failure of the visual inspection at end of shift. Open a CAR (REC 8.1.1.a) for any area non-conforming more than once in a week and record the CAR reference against the item.',
      'Mark C if the area or item is clean, NC if not, N/A if not applicable. Every NC needs a finding and a correction before the record can be verified.'
    ]
  });
})();
</script>
