<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'daily-cleaning-inspection',
    docCode: 'REC 7.6.1',
    title: 'Daily Cleaning Inspection',
    docRevisionStart: 4,
    listColumns: ['date', 'shift'],
    instructions: [
      { label: 'Cleaning instruction', text: 'Perform cleaning per the master cleaning schedule. Food contact surfaces cleaned at start of shift, between jobs and at end of shift. Sanitise work surfaces at end of shift. Raise a corrective action immediately on visual inspection failure at end of shift. Open a CAR for areas non-conforming more than once a week. Tick C if cleaning is done, NC if not.' }
    ],
    sections: [
      { title: 'Shift details', fields: [
        { key: 'date', label: 'Date', type: 'date', required: true },
        { key: 'shift', label: 'Shift', type: 'select', options: ['Day', 'Night'] }
      ]}
    ],
    roster: {
      title: 'Checklist items — covers Entrance to Shucking, Shucking, Sorting, Live Holding, Live Packing/Packaging, Dry Grading/Raw Material store, Canteen/Change rooms/Toilets/Chemical room, etc.',
      columns: [
        { key: 'area', label: 'Area', type: 'text' },
        { key: 'item', label: 'Item / equipment', type: 'text' },
        { key: 'status', label: 'C / NC', type: 'select', options: ['C', 'NC'] },
        { key: 'nonConformance', label: 'Non-conformance', type: 'text' },
        { key: 'correctionSignOff', label: 'Correction and sign off', type: 'text' }
      ]
    }
  });
})();
