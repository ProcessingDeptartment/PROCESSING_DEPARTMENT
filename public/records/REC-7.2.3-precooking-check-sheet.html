<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.2.3 Precooking Check Sheet</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=1"></script>
<script src="../lib/lookups.js?v=1"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/permission-rules.js?v=1"></script>
<script src="../lib/form-record.js?v=10"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'precooking-check-sheet',
    docCode: 'REC 7.2.3',
    title: 'Precooking Check Sheet',
    docRevisionStart: 1,
    // Job number search-select, sourced from Abalone Receiving (REC 7.1.2) -- pick from what's
    // actually been received instead of typing blind.
    autofill: [
      { watch: 'jobNumber', source: 'abalone-receiving', matchField: 'jobNo', fill: {} }
    ],
    listColumns: ['intakeDate', 'jobNumber', 'sizeRange'],
    batchField: 'jobNumber',
    stage: 'precooking',
    sections: [
      { title: 'Batch info', fields: [
        { key: 'intakeDate', label: 'Intake date', type: 'date', required: true },
        Lookups.field({ key: 'harvestFarm', label: 'Harvest farm', list: 'farms' }),
        { key: 'trackingNo', label: 'Tracking no.', type: 'text' },
        { key: 'precookingDate', label: 'Precooking date', type: 'date' },
        { key: 'jobNumber', label: 'Job number', type: 'jobsearch' },
        Lookups.field({ key: 'sizeRange', label: 'Size range', list: 'sizeRanges' })
      ]},
      { title: 'Precooking process', newPage: true, fields: [
        { key: 'litresWaterPerCook', label: 'Litres water per cook', type: 'number' },
        { key: 'sugarKgUsed', label: 'Sugar used (kg)', type: 'number' },
        { key: 'sugarBatchCode', label: 'Sugar batch code', type: 'text' },
        { key: 'precookingStartTime', label: 'Precooking start time', type: 'text' },
        { key: 'temperature', label: 'Temperature', type: 'number' }
      ]},
      { title: 'Water & abalone checks', fields: [
        { key: 'waterInPotChanged', label: 'Water in pot changed?', type: 'yesno' },
        { key: 'rinseWaterChanged', label: 'Rinse water changed?', type: 'yesno' },
        { key: 'cleanWeight', label: 'Clean weight', type: 'number' },
        { key: 'precookWeight', label: 'Precook weight', type: 'number' }
      ]},
      { title: 'Totals', fields: [
        { key: 'totalWholeWeight', label: 'Total whole weight', type: 'number' },
        { key: 'totalCleanWeight', label: 'Total clean weight', type: 'number' },
        { key: 'totalPrecookWeight', label: 'Total precook weight', type: 'number' },
        { key: 'percentCleanWeight', label: '% clean weight', type: 'number' },
        { key: 'percentPrecookWeight', label: '% precook weight', type: 'number' }
      ]}
    ]
  });
})();
</script>
</body>
</html>
