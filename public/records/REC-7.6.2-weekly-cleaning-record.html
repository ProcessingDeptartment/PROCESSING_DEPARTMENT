<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.6.2 Weekly Cleaning Record</title>
<script src="../lib/shell.js?v=1"></script>
</head>
<body>
<div id="crRoot"></div>

<script>
(function () {
  // Weekly plant-wide summary. Every one of its 27 paper lines was a coarser restatement
  // of an item already on REC 7.6.1.1, so this is the SAME weekly submission (family
  // 'weekly') rendered through the 'summary' slice. Fill it here or there — not both.
  // No shift split: the paper form was a single weekly check, not day/night.
  Shell.record({
    engine: 'cleaning-register',
    mount: '#crRoot',
    recordKey: 'weekly-cleaning-record',
    docCode: 'REC 7.6.2',
    title: 'Weekly Cleaning Record',
    docRevisionStart: 4,
    docRevisionDate: '2022-09-22',
    family: 'weekly',
    scope: 'summary',
    shift: false,
    performLabel: 'checked',
    performAction: 'checked',
    viewNote: 'Same weekly record as REC 7.6.1.1 and REC 7.6.2.2 — items answered on either page show as answered here.',
    instructions: [
      'Weekly plant-wide cleaning check, including the tanks, ozone system, roof and building exterior.',
      'Mark C if clean, NC if not, N/A if not applicable. Every NC needs a finding and a correction before a supervisor can verify.'
    ]
  });
})();
</script>
</body>
</html>
