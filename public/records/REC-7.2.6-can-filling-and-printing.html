<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.2.6 Can Filling and Printing</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=1"></script>
<script src="../lib/lookups.js?v=1"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/permission-rules.js?v=1"></script>
<script src="../lib/form-record.js?v=9"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'can-filling-and-printing',
    batchField: 'jobNo',
    docCode: 'REC 7.2.6',
    title: 'Can Filling and Printing',
    docRevisionStart: 1,
    // Job number search-select, sourced from Abalone Receiving (REC 7.1.2) -- pick from what's
    // actually been received instead of typing blind.
    autofill: [
      { watch: 'jobNo', source: 'abalone-receiving', matchField: 'jobNo', fill: {} }
    ],
    listColumns: ['date', 'jobNo', 'printedAgCode'],
    sections: [
      { title: 'Filling info', fields: [
        { key: 'date', label: 'Date', type: 'date', required: true },
        { key: 'startTime', label: 'Start time', type: 'text' },
        { key: 'jobNo', label: 'Job no.', type: 'jobsearch' },
        { key: 'waterOrSauceFillingBatch', label: 'Water/sauce filling batch', type: 'text' },
        { key: 'productTemp', label: 'Product temp', type: 'number' },
        { key: 'nettWeightSpec', label: 'Nett weight spec', type: 'number' },
        { key: 'actualNettWeight', label: 'Actual nett weight', type: 'number' }
      ]},
      { title: 'Printing info', newPage: true, fields: [
        { key: 'printedAgCode', label: 'Printed AG code', type: 'text' },
        { key: 'printedBestBeforeDate', label: 'Printed best before date', type: 'date' },
        { key: 'verifiedBeforePrinting', label: 'Verified before printing?', type: 'yesno' },
        { key: 'verifiedAfterPrinting', label: 'Verified after printing?', type: 'yesno' }
      ]},
      { title: 'Notes', fields: [
        { key: 'processDeviations', label: 'Process deviations', type: 'textarea', wide: true }
      ]}
    ]
  });
})();
</script>
</body>
</html>
