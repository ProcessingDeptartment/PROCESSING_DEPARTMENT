<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.6.6 Pest Inspection Record</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="record-theme.css">
  <link rel="stylesheet" href="../responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/form-record.js?v=3"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'pest-inspection-record',
    docCode: 'REC 7.6.6',
    title: 'Pest Inspection Record',
    docRevisionStart: 7,
    listColumns: ['date', 'inspectedBy'],
    instructions: [
      { label: 'Instruction', text: 'Weekly inspections are done to determine the presence of pests and signs of activity. If any presence/activity is noted, complete the Pest Sightings Log and inform the pest control company. Bird droppings or pests present inside the facility must be recorded on a CAR.' }
    ],
    sections: [
      { title: 'Inspection details', fields: [
        { key: 'date', label: 'Date', type: 'date', required: true }
      ]},
      { title: 'Facility-wide questions', fields: [
        { key: 'birdDroppingsSeen', label: 'Any bird droppings seen inside the facility?', type: 'yesno' },
        { key: 'birdDroppingsCorrectiveAction', label: 'If yes, corrective action', type: 'textarea' },
        { key: 'baitStationsObstructed', label: 'Were any of the bait stations obstructed?', type: 'yesno' },
        { key: 'baitStationsCorrectiveAction', label: 'If yes, corrective action', type: 'textarea' }
      ]},
      { title: 'Sign-off', fields: [
        { key: 'inspectedBy', label: 'Inspected by', type: 'text', required: true },
        { key: 'verifiedBy', label: 'Verified by', type: 'text' }
      ]}
    ],
    roster: {
      title: 'Areas checked — Raw materials, Live box prep/entrance/packing/holding, Sorting, Shucking, Entrance, Outside building, Bait stations, Canteen, Toilets/Change rooms, Dry cooking/hanging/stringing, Canning, Office, NRCS room, etc. Key: blank = inspected no activity, A = activity noted.',
      columns: [
        { key: 'areaChecked', label: 'Area checked', type: 'text' },
        { key: 'ratsMice', label: 'Rats / mice', type: 'text' },
        { key: 'flies', label: 'Flies', type: 'text' },
        { key: 'cockroaches', label: 'Cockroaches', type: 'text' },
        { key: 'birds', label: 'Birds', type: 'text' },
        { key: 'ants', label: 'Ants', type: 'text' },
        { key: 'moths', label: 'Moths', type: 'text' },
        { key: 'other', label: 'Other', type: 'text' },
        { key: 'commentsCorrectiveAction', label: 'Comments / corrective action', type: 'text' }
      ]
    }
  });
})();
</script>
</body>
</html>
