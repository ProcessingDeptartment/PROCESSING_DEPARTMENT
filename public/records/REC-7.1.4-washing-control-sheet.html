<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.1.4 Washing Control Sheet</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/api-backend.js?v=1"></script>
<script src="../lib/lookups.js?v=1"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/permission-rules.js?v=1"></script>
<script src="../lib/form-record.js?v=6"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'washing-control-sheet',
    docCode: 'REC 7.1.4',
    title: 'Washing Control Sheet',
    docRevisionStart: 1,
    listColumns: ['date', 'jobNo', 'sizeRange'],
    sections: [
      { title: 'Batch info', fields: [
        { key: 'date', label: 'Date', type: 'date', required: true },
        { key: 'timeStarted', label: 'Time started', type: 'text' },
        { key: 'jobNo', label: 'Job no.', type: 'text' },
        { key: 'washNumber', label: 'Wash number', type: 'select', options: ['First', 'Second'] },
        Lookups.field({ key: 'sizeRange', label: 'Size range', list: 'sizeRanges' })
      ]},
      { title: 'Washing details', newPage: true, fields: [
        { key: 'machineNo', label: 'Machine no.', type: 'text' },
        { key: 'binsTraysPerWash', label: 'Bins/trays per wash', type: 'text' },
        { key: 'totalWashingTime', label: 'Total washing time', type: 'text' },
        { key: 'abaloneCleanAfterWash', label: 'Abalone clean after wash?', type: 'yesno' }
      ]},
      { title: 'Sign-off', fields: [
        { key: 'qcOnline', label: 'QC online', type: 'text' },
        { key: 'processDeviation', label: 'Process deviation', type: 'textarea', wide: true }
      ]}
    ]
  });
})();
</script>
</body>
</html>
