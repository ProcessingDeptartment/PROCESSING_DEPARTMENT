<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.4.0 Dry Cooking</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=3"></script>
<script src="../lib/lookups.js?v=1"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/permission-rules.js?v=1"></script>
<script src="../lib/form-record.js?v=12"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'dry-cooking',
    batchField: 'jobNumber',
    docCode: 'REC 7.4.0',
    title: 'Dry Cooking',
    docRevisionStart: 1,
    // Job number search-select, sourced from Abalone Receiving (REC 7.1.2) -- pick from what's
    // actually been received instead of typing blind.
    autofill: [
      { watch: 'jobNumber', source: 'abalone-receiving', matchField: 'jobNo', fill: {} }
    ],
    listColumns: ['intakeDate', 'jobNumber', 'potNumber'],
    sections: [
      { title: 'Batch & cooking info', fields: [
        { key: 'harvestFarm', label: 'Harvest farm', type: 'text' },
        { key: 'intakeDate', label: 'Intake date', type: 'date', required: true },
        { key: 'jobNumber', label: 'Job number', type: 'jobsearch' },
        { key: 'cookingDate', label: 'Cooking date', type: 'date' },
        { key: 'potNumber', label: 'Pot number', type: 'text' },
        { key: 'abaloneKg', label: 'Abalone (kg)', type: 'number' }
      ]},
      { title: 'Blanching', newPage: true, fields: [
        { key: 'blanchSeaWater', label: 'Blanch sea water', type: 'number' },
        { key: 'blanchPh', label: 'Blanch pH', type: 'number' },
        { key: 'blanchSaltKg', label: 'Blanch salt (kg)', type: 'number' },
        { key: 'blanchTemp', label: 'Blanch temp', type: 'number' },
        { key: 'cookingTime', label: 'Cooking time', type: 'text' },
        { key: 'blanchBatchNumber', label: 'Blanch batch number', type: 'text' }
      ]},
      { title: 'Cooking', fields: [
        { key: 'startTime', label: 'Start time', type: 'text' },
        { key: 'startingTemp', label: 'Starting temp', type: 'number' },
        { key: 'temp20MinAfter', label: 'Temp 20 min after', type: 'number' },
        { key: 'endOfCookingTemp', label: 'End of cooking temp', type: 'number' },
        { key: 'timeOut', label: 'Time out', type: 'text' },
        { key: 'totalCookingTime', label: 'Total cooking time', type: 'text' },
        { key: 'cookSeaWater', label: 'Cook sea water', type: 'number' },
        { key: 'cookPh', label: 'Cook pH', type: 'number' },
        { key: 'saltKg', label: 'Salt (kg)', type: 'number' },
        { key: 'saltBatchNumber', label: 'Salt batch number', type: 'text' }
      ]},
      { title: 'Additives (optional)', fields: [
        { key: 'sugarKg', label: 'Sugar (kg)', type: 'number' },
        { key: 'sugarBatchNumber', label: 'Sugar batch number', type: 'text' },
        { key: 'vinegarKg', label: 'Vinegar (kg)', type: 'number' },
        { key: 'vinegarBatchNumber', label: 'Vinegar batch number', type: 'text' }
      ]},
      { title: 'Sign-off', fields: [
        { key: 'cooker', label: 'Cooker', type: 'text' },
        { key: 'comments', label: 'Comments', type: 'textarea', wide: true }
      ]}
    ]
  });
})();
</script>
</body>
</html>
