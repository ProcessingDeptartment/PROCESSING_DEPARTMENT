<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 1. Gonad Inspection Report</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="mlRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/lookups.js?v=4"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/auth.js?v=2"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/spec-registry.js?v=2"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=6"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/monitoring-log.js?v=25"></script>
<script>(function () {
  MonitoringLog.init({
    mount: '#mlRoot',
    recordKey: 'gonad-inspection-report',
    batchField: 'jobNo',
    docCode: 'REC 1',
    title: 'Gonad Inspection Report',
    docRevisionStart: 1,
    instructions: [
      { label: 'Stage 0', text: 'Immature, sex indeterminate, digestive gland visible as grey/brown mass.' },
      { label: 'Stage 1', text: 'Sex determinable, gonad small, colouration, tip pointed.' },
      { label: 'Stage 2', text: 'Gonad large, tip rounded but not swollen.' },
      { label: 'Stage 3', text: 'Gonad very large, tip rounded and swollen, bulging at shell edge.' }
    ],

    jobInfoGroup: 'Job info',
    autofill: [
      { watch: 'jobNo', source: 'abalone-receiving', matchField: 'jobNo',
        fill: { processingFor: 'toBeProcessedFor', jiReceivingDate: 'receivingDate', jiReceivedFrom: 'receivedFrom', jiIntakeWeight: 'intakeWeight' },
        restrict: { sizeRange: 'sizeRange' } }
    ],
    entryFields: [
      { group: 'Job info', key: 'jobNo', label: 'Job no.', type: 'jobsearch' },
      { group: 'Job info', key: 'jiReceivingDate', label: 'Receiving date', type: 'date', readOnly: true },
      { group: 'Job info', key: 'jiReceivedFrom', label: 'Received from (farm)', type: 'text', readOnly: true },
      { group: 'Job info', key: 'jiIntakeWeight', label: 'Intake weight (kg)', type: 'text', readOnly: true },
      { group: 'Job info', key: 'processingFor', label: 'Processing for', type: 'select', options: ['Can', 'Dried', 'Live', 'Other'], matchJobRoute: 'jobNo' },
      { key: 'date', label: 'Date', type: 'date', required: true },
      { key: 'stage', label: 'Stage', type: 'select', options: ['0', '1', '2', '3'] },
      Lookups.field({ key: 'sizeRange', label: 'Size range', list: 'sizeRanges' }),
      { key: 'sex', label: 'Sex', type: 'select', options: ['Male', 'Female'] },
      { key: 'damagesAfterGutting', label: 'Damages after gutting', type: 'text' },
      { key: 'basketReceivingComments', label: 'Basket receiving — comments', type: 'textarea' },
      { key: 'checkedBy', label: 'QC online — checked by', type: 'text', required: true }
    ],
    specFields: [],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
  });
})();
</script>
<script src="../lib/record-shell.js?v=6"></script>
</body>
</html>
