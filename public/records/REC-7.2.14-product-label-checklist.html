<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.2.6 Product Label Checklist</title>
<script src="../lib/shell.js?v=1"></script>
<style>
  :root{
    --ink:var(--palette-ink); --steel:var(--palette-primary); --steel-dk:var(--palette-dark); --paper:var(--palette-paper);
    --line:var(--palette-border); --line-soft:var(--palette-head-bg); --ok:var(--palette-ok); --ok-bg:var(--palette-ok-bg);
    --warn:#b8791c; --warn-bg:#fbf0dc; --fail:var(--palette-fail); --fail-bg:var(--palette-fail-bg);
    --accent:var(--palette-primary); --mono: 'IBM Plex Mono','SF Mono',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  #plc-root{ font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:13px; line-height:1.4; }
  #plc-root *{ box-sizing:border-box; }
  #plc-root h1,#plc-root h2,#plc-root h3{ margin:0; font-weight:700; }
  #plc-root input, #plc-root select, #plc-root textarea{
    font-family:var(--mono); font-size:12.5px; border:1px solid var(--line); border-radius:3px;
    padding:4px 6px; background:#fff; color:var(--ink); width:100%;
  }
  #plc-root input:focus, #plc-root select:focus, #plc-root textarea:focus{ outline:2px solid var(--steel); outline-offset:-1px; }
  #plc-root button{ font-family:var(--sans); cursor:pointer; border:none; border-radius:3px; font-weight:600; }
  .dc-top{ background:var(--steel-dk); color:#f4f1e8; padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .btn{ padding:5px 11px; font-size:11.5px; }
  .btn-primary{ background:var(--accent); color:#241a0a; }
  .btn-primary:hover{ background:#dd9536; }
  .btn-ghost{ background:transparent; color:#f4f1e8; border:1px solid #55636e !important; }
  .btn-ghost:hover{ background:#33444f; }
  .btn-flat{ background:var(--line-soft); color:var(--ink); }
  .btn-flat:hover{ background:#d5d8d6; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .dc-body{ padding:12px 14px 40px; max-width:900px; margin:0 auto; }
  .panel{ background:#fff; border:1px solid var(--line-soft); border-radius:5px; margin-bottom:10px; }
  .panel-head{ padding:7px 11px; border-bottom:1px solid var(--line-soft); background:#fbfbfa; border-radius:5px 5px 0 0; }
  .panel-head h2{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--steel); margin:0; }
  .panel-body{ padding:11px; }

  .grid{ display:grid; gap:8px; }
  .grid-6{ grid-template-columns:repeat(6,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  label.field{ display:flex; flex-direction:column; gap:2px; font-size:10.5px; color:#54606b; font-weight:600; }
  label.field input, label.field select{ font-size:11.5px; padding:3px 5px; }

  .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .status-line{ font-size:10px; color:#8a939b; font-family:var(--mono); margin-right:auto; }
  .record-status{ font-size:10px; color:#54606b; font-weight:600; padding:4px 8px; background:#e2e4e3; border-radius:3px; }
  .muted{ color:#8a939b; }
  .toast{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--steel-dk); color:#fff; padding:8px 16px; border-radius:20px; font-size:11px; z-index:999; opacity:0; pointer-events:none; transition:opacity .25s; }
  .toast.show{ opacity:1; }

  @media (max-width:900px){
    .grid-6{grid-template-columns:repeat(3,1fr);}
    .grid-4{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div id="plc-root">
  <div class="dc-top">
    <div class="doc-line"><span class="doc-code">REC 7.2.14</span><h1>Product Label Checklist</h1><span class="doc-rev">Rev 4 &middot; Rev date not set</span></div>
  </div>

  <div class="dc-body">
    <div style="background:#fbf0dc;border:1px solid #e6d5b8;border-radius:5px;padding:10px 11px;margin-bottom:12px;font-size:11px;line-height:1.5;">
      <strong>Instructions:</strong> All labels must be checked and verified against an approved label artwork on receipt.
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Receipt Info</h2></div>
      <div class="panel-body">
        <div class="grid grid-4">
          <label class="field">Date<input id="h_date" type="date"></label>
          <label class="field">Supplier<input id="h_supplier" placeholder="Supplier"></label>
          <label class="field">Label description<input id="h_labelDescription" placeholder="Description"></label>
          <label class="field">Label version<input id="h_labelVersion" placeholder="Version"></label>
        </div>
        <div class="grid grid-2" style="margin-top:8px;">
          <label class="field">Quantity ordered<input id="h_quantityOrdered" type="number"></label>
          <label class="field">Quantity received<input id="h_quantityReceived" type="number"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Label Verification</h2></div>
      <div class="panel-body">
        <div class="grid grid-2">
          <label class="field">General condition at receiving?<select id="h_generalConditionAtReceiving"><option value="">—</option><option value="Yes">Yes</option><option value="No">No</option></select></label>
          <label class="field">Label dimensions correct?<select id="h_labelDimensionsCorrect"><option value="">—</option><option value="Yes">Yes</option><option value="No">No</option></select></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Compliance</h2></div>
      <div class="panel-body">
        <div class="grid grid-2" style="margin-bottom:8px;">
          <label class="field">Artwork correct?<select id="h_artworkCorrect"><option value="">—</option><option value="Yes">Yes</option><option value="No">No</option></select></label>
          <label class="field">Ingredient statement correct?<select id="h_ingredientStatementCorrect"><option value="">—</option><option value="Yes">Yes</option><option value="No">No</option></select></label>
        </div>
        <div class="grid grid-2">
          <label class="field">Allergen declaration complies?<select id="h_allergenDeclarationComplies"><option value="">—</option><option value="Yes">Yes</option><option value="No">No</option></select></label>
          <label class="field">Label complies and approved?<select id="h_labelCompliesApproved"><option value="">—</option><option value="Yes">Yes</option><option value="No">No</option></select></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Comments & Sign-off</h2></div>
      <div class="panel-body">
        <div class="grid grid-6" style="margin-bottom:8px;">
          <label class="field">Comments<textarea id="h_comments" rows="3"></textarea></label>
        </div>
        <div class="grid grid-2">
          <label class="field">Received by<input id="f_receivedBy"></label>
        </div>
      </div>
    </div>

    <div class="actions no-print">
      <span class="record-status" id="recordStatus"></span>
      <span class="status-line" id="statusLine"></span>
      <button class="btn btn-flat" id="exportBtn">Export JSON</button>
      <button class="btn btn-flat" id="generatePdfBtn">Print PDF</button>
      <button class="btn btn-flat" id="saveDraftBtn">Save</button>
      <button class="btn btn-primary" id="submitBtn">Submit</button>
    </div>
  </div>

  <div class="toast no-print" id="toast"></div>
</div>

<script>
Shell.record({ recordKey: 'product-label-checklist' }).then(function () {
(async function(){
  const $ = id => document.getElementById(id);

  if (window.LoginUI && window.Auth && !window.Auth.isAuthenticated()) {
    await window.LoginUI.ensureAuthenticated();
  }

  function newRecord(){
    return {
      id: null, revision: 1, status:'draft',
      date:'', supplier:'', labelDescription:'', quantityOrdered:'', quantityReceived:'',
      generalConditionAtReceiving:'', labelDimensionsCorrect:'', labelVersion:'', artworkCorrect:'',
      ingredientStatementCorrect:'', allergenDeclarationComplies:'', labelCompliesApproved:'',
      comments:'', receivedBy:'',
      createdAt: null, updatedAt: null
    };
  }

  let state = newRecord();

  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  }
  function safeKey(s){ return String(s).trim().replace(/[\s\/\\'"]+/g,'_'); }

  async function storeGet(key, shared){
    try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function storeSet(key, value, shared){
    try{ await window.storage.set(key, value, shared); return true; }
    catch(e){ return false; }
  }

  function renderForm(){
    $('h_date').value = state.date;
    $('h_supplier').value = state.supplier;
    $('h_labelDescription').value = state.labelDescription;
    $('h_quantityOrdered').value = state.quantityOrdered;
    $('h_quantityReceived').value = state.quantityReceived;
    $('h_generalConditionAtReceiving').value = state.generalConditionAtReceiving;
    $('h_labelDimensionsCorrect').value = state.labelDimensionsCorrect;
    $('h_labelVersion').value = state.labelVersion;
    $('h_artworkCorrect').value = state.artworkCorrect;
    $('h_ingredientStatementCorrect').value = state.ingredientStatementCorrect;
    $('h_allergenDeclarationComplies').value = state.allergenDeclarationComplies;
    $('h_labelCompliesApproved').value = state.labelCompliesApproved;
    $('h_comments').value = state.comments;
    $('f_receivedBy').value = state.receivedBy;
  }

  function bindInputs(){
    const fields = ['date','supplier','labelDescription','quantityOrdered','quantityReceived','generalConditionAtReceiving','labelDimensionsCorrect','labelVersion','artworkCorrect','ingredientStatementCorrect','allergenDeclarationComplies','labelCompliesApproved','comments','receivedBy'];
    fields.forEach(f=>{
      const id = f.startsWith('receivedBy') ? 'f_'+f : 'h_'+f;
      const el = $(id);
      if(el) el.addEventListener('input', ()=>{ state[f] = el.value; });
    });
  }

  function updateRecordStatus(){
    const supStr = state.supplier ? state.supplier : 'No supplier';
    const submitted = state.status === 'submitted';
    $('recordStatus').textContent = `${submitted ? '✓ Submitted' : 'Draft'} · ${supStr} · ${state.id ? 'ID: ' + state.id.slice(-8) : 'Unsaved'}`;
  }

  function renderAll(){
    renderForm();
    updateRecordStatus();
    $('statusLine').textContent = state.updatedAt ? `Last saved ${new Date(state.updatedAt).toLocaleString()}` : 'Not yet saved';
  }

  async function saveRecord(finalize){
    const now = Date.now();
    if(!state.id){
      state.id = `product_label_checklist_${now}`;
      state.createdAt = now;
    }
    state.updatedAt = now;
    state.status = finalize ? 'submitted' : 'draft';

    const ok = await storeSet('record:'+state.id, JSON.stringify(state), true);
    if(!ok){ toast('Save failed.'); return; }
    toast(finalize ? 'Submitted for verification.' : 'Draft saved.');
    renderAll();
  }

  function generatePdf(){
    document.title = `REC_7.2.6_PRODUCT_LABEL_CHECKLIST_${state.date||''}`;
    window.print();
  }

  function wire(){
    bindInputs();
    $('saveDraftBtn').addEventListener('click', ()=>saveRecord(false));
    $('submitBtn').addEventListener('click', ()=>saveRecord(true));
    $('exportBtn').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `product_label_checklist_${state.date||'draft'}.json`;
      a.click();
    });
    $('generatePdfBtn').addEventListener('click', generatePdf);
  }

  wire();
  renderAll();
})();
});
</script>
</body>
</html>
