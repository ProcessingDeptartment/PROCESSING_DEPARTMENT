<!DOCTYPE html>
<html lang="en">
<head>

     second origin otherwise costs ~200ms on top of the first data read. -->

<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.4.5 Boxing &amp; Labelling</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">

</head>
<body>
<div id="mlRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/lookups.js?v=1"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/api-backend.js?v=5"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/spec-registry.js?v=2"></script>

<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/monitoring-log.js?v=10"></script>
<script>
(function () {
  MonitoringLog.init({
    mount: '#mlRoot',
    recordKey: 'boxing-and-labelling',
    docCode: 'REC 7.4.5',
    title: 'Boxing & Labelling',
    docRevisionStart: 4,
    instructions: [
      { label: 'Note', text: 'The bin code is used as the "box code" on the label.' }
    ],
    entryFields: [
      { key: 'packingDate', label: 'Packing date', type: 'date', required: true },
      { key: 'tareWeight', label: 'Tare weight', type: 'number', unit: 'kg' },
      { key: 'binCode', label: 'Bin code', type: 'text', required: true },
      Lookups.field({ key: 'sizeRange', label: 'Size range', list: 'sizeRanges' }),
      { key: 'colourUniform', label: 'Colour uniform?', type: 'yesno' },
      { key: 'correctSizeGrade', label: 'Correct size grade?', type: 'yesno' },
      { key: 'frillsPresent', label: 'Frills present?', type: 'yesno' },
      { key: 'bagAndBoxSealed', label: 'Bag and box sealed?', type: 'yesno' },
      { key: 'nettWeight', label: 'Nett weight', type: 'number', unit: 'kg' },
      { key: 'qualityController', label: 'Quality controller', type: 'text', required: true },
      { key: 'supervisor', label: 'Supervisor', type: 'text' }
    ],
    specFields: [],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
  });
})();
</script>
</body>
</html>
