<!DOCTYPE html>
<html lang="en" data-palette="dry">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dry Export Pack Front Page</title>
<style>
  :root {
    --ink: #3a4a40;
    --steel: #7a9b88;
    --steel-dk: #556966;
    --paper: #f8f9f8;
    --line: #b3c9bf;
    --line-soft: #d0dcd8;
    --ok: #7a9b88;
    --ok-bg: #e8f3ed;
    --warn: #b8791c;
    --warn-bg: #fbf0dc;
    --fail: #a3352d;
    --fail-bg: #fbe8e6;
    --accent: #7a9b88;
  }
  .fr-app { color: var(--ink); background: var(--paper); }
  .fr-top { background: var(--steel-dk); }
  .fr-panel-head h2 { color: var(--steel); }
  .fr-btn-primary { background: var(--accent); }
  .fr-app input:focus, .fr-app select:focus, .fr-app textarea:focus { outline-color: var(--steel); }
</style>
  <link rel="stylesheet" href="color-palettes.css">
  <link rel="stylesheet" href="../responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/data-store.js?v=2"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=2"></script>
<script src="../lib/form-record.js?v=2"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'dry-export-pack-front-page',
    docCode: 'Dry Export Pack Front Page',
    title: 'Dry Export Pack Front Page',
    docRevisionStart: 1,
    listColumns: ['packingDate', 'jobNumber'],
    sections: [
      { title: 'Shipment details', fields: [
        { key: 'packingDate', label: 'Packing date', type: 'date', required: true },
        { key: 'jobNumber', label: 'Job number', type: 'text' },
        { key: 'noOfBoxesExported', label: 'No. of boxes exported', type: 'number' }
      ]},
      { title: 'Attachments checklist', fields: [
        { key: 'rec747Attached', label: 'REC 7.4.7 Labelling of Dry Boxes attached?', type: 'yesno' },
        { key: 'rec748Attached', label: 'REC 7.4.8 Dry Labelling List attached?', type: 'yesno' },
        { key: 'rec749Attached', label: 'REC 7.4.9 Dry Stock Transfers attached?', type: 'yesno' },
        { key: 'signedPackingListsAttached', label: 'Signed packing lists attached?', type: 'yesno' },
        { key: 'healthCertificatesAttached', label: 'Health certificates attached?', type: 'yesno' }
      ]},
      { title: 'Sign-off', fields: [
        { key: 'completedBySupervisor', label: 'Completed by (Supervisor)', type: 'text', required: true },
        { key: 'checkedByQC', label: 'Checked by (QC)', type: 'text' },
        { key: 'verificationBy', label: 'Verification by', type: 'text' }
      ]}
    ]
  });
})();
</script>
</body>
</html>
