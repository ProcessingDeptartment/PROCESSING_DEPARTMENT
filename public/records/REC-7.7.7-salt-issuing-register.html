<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.7.7 Salt Issuing Register</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="mlRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/api-backend.js?v=1"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/spec-registry.js?v=2"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/monitoring-log.js?v=7"></script>
<script>
(function () {
  MonitoringLog.init({
    mount: '#mlRoot',
    recordKey: 'salt-issuing-register',
    // Makes this salt batch searchable on its own (batch-trace.html), separate from whichever job
    // it later gets used on (that cross-link is indexed from the job-side record instead).
    batchField: 'batchNumber',
    stage: 'salt issued',
    docCode: 'REC 7.7.7',
    title: 'Salt Issuing Register',
    docRevisionStart: 1,
    entryFields: [
      { key: 'date', label: 'Date', type: 'date', required: true },
      { key: 'quantityIssued', label: 'Quantity issued', type: 'text' },
      { key: 'batchNumber', label: 'Batch number of salt', type: 'text' },
      { key: 'issuedTo', label: 'Issued to', type: 'text', required: true },
      { key: 'issuedBy', label: 'Issued by', type: 'text' }
    ],
    specFields: [],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
  });
})();
</script>
</body>
</html>
