<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.3.1 Broth Cooking</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
<style>
  :root{
    --ink:var(--palette-ink); --steel:var(--palette-primary); --steel-dk:var(--palette-dark); --paper:var(--palette-paper);
    --line:var(--palette-border); --line-soft:var(--palette-head-bg); --ok:var(--palette-ok); --ok-bg:var(--palette-ok-bg);
    --warn:#b8791c; --warn-bg:#fbf0dc; --fail:var(--palette-fail); --fail-bg:var(--palette-fail-bg);
    --accent:var(--palette-primary); --mono: 'IBM Plex Mono','SF Mono',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  #bc-root{ font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:13px; line-height:1.4; }
  #bc-root *{ box-sizing:border-box; }
  #bc-root h1,#bc-root h2,#bc-root h3{ margin:0; font-weight:700; }
  #bc-root input, #bc-root select, #bc-root textarea{
    font-family:var(--mono); font-size:12.5px; border:1px solid var(--line); border-radius:3px;
    padding:4px 6px; background:#fff; color:var(--ink); width:100%;
  }
  #bc-root input:focus, #bc-root select:focus, #bc-root textarea:focus{ outline:2px solid var(--steel); outline-offset:-1px; }
  #bc-root button{ font-family:var(--sans); cursor:pointer; border:none; border-radius:3px; font-weight:600; }
  .dc-top{ background:var(--steel-dk); color:#f4f1e8; padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .btn{ padding:5px 11px; font-size:11.5px; }
  .btn-primary{ background:var(--accent); color:#241a0a; }
  .btn-primary:hover{ background:#dd9536; }
  .btn-ghost{ background:transparent; color:#f4f1e8; border:1px solid #55636e !important; }
  .btn-ghost:hover{ background:#33444f; }
  .btn-flat{ background:var(--line-soft); color:var(--ink); }
  .btn-flat:hover{ background:#d5d8d6; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .dc-body{ padding:12px 14px 40px; max-width:900px; margin:0 auto; }
  .panel{ background:#fff; border:1px solid var(--line-soft); border-radius:5px; margin-bottom:10px; }
  .panel-head{ padding:7px 11px; border-bottom:1px solid var(--line-soft); background:#fbfbfa; border-radius:5px 5px 0 0; }
  .panel-head h2{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--steel); margin:0; }
  .panel-body{ padding:11px; }

  .grid{ display:grid; gap:8px; }
  .grid-6{ grid-template-columns:repeat(6,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  label.field{ display:flex; flex-direction:column; gap:2px; font-size:10.5px; color:#54606b; font-weight:600; }
  label.field input, label.field select{ font-size:11.5px; padding:3px 5px; }

  .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .status-line{ font-size:10px; color:#8a939b; font-family:var(--mono); margin-right:auto; }
  .record-status{ font-size:10px; color:#54606b; font-weight:600; padding:4px 8px; background:#e2e4e3; border-radius:3px; }
  .muted{ color:#8a939b; }
  .toast{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--steel-dk); color:#fff; padding:8px 16px; border-radius:20px; font-size:11px; z-index:999; opacity:0; pointer-events:none; transition:opacity .25s; }
  .toast.show{ opacity:1; }

  @media (max-width:900px){
    .grid-6{grid-template-columns:repeat(3,1fr);}
    .grid-4{grid-template-columns:repeat(2,1fr);}
  }
</style>
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="bc-root">
  <div class="dc-top">
    <div class="doc-line"><span class="doc-code">REC 7.3.1</span><h1>Broth Cooking</h1><span class="doc-rev">Rev 5 &middot; Rev date not set</span></div>
  </div>

  <div class="dc-body">
    <div class="panel">
      <div class="panel-head"><h2>Cooking Batch</h2></div>
      <div class="panel-body">
        <div class="grid grid-4">
          <label class="field">Date<input id="h_date" type="date"></label>
          <label class="field">Pot no.<input id="h_potNo" placeholder="Pot number"></label>
          <label class="field">Water (L)<input id="h_waterLitres" type="number" step="0.1"></label>
          <label class="field">Abalone shells â€” intake date<input id="h_abaloneShellsIntakeDate" type="date"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Ingredients</h2></div>
      <div class="panel-body">
        <div class="grid grid-4">
          <label class="field">Dried kelp weight (kg)<input id="h_driedKelpWeight" type="number" step="0.01"></label>
          <label class="field">Scallop juice weight (kg)<input id="h_scallopJuiceWeight" type="number" step="0.01"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Final Product</h2></div>
      <div class="panel-body">
        <div class="grid grid-4">
          <label class="field">Final broth (L)<input id="h_finalBrothLitres" type="number" step="0.1"></label>
          <label class="field">pH<input id="h_ph" type="number" step="0.1"></label>
          <label class="field">Salt<input id="h_salt" type="number" step="0.1"></label>
          <label class="field">Brix<input id="h_brix" type="number" step="0.1"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Sign-off</h2></div>
      <div class="panel-body">
        <div class="grid grid-6" style="margin-bottom:8px;">
          <label class="field">Comments<textarea id="h_comments" rows="3"></textarea></label>
        </div>
        <div class="grid grid-2">
          <label class="field">Cooked by<input id="f_cookedBy"></label>
          <label class="field">Checked and completed by<input id="f_checkedAndCompletedBy"></label>
        </div>
      </div>
    </div>

    <div class="actions no-print">
      <span class="record-status" id="recordStatus"></span>
      <span class="status-line" id="statusLine"></span>
      <button class="btn btn-flat" id="exportBtn">Export JSON</button>
      <button class="btn btn-flat" id="generatePdfBtn">Print PDF</button>
      <button class="btn btn-flat" id="saveDraftBtn">Save</button>
      <button class="btn btn-primary" id="submitBtn">Submit</button>
    </div>
  </div>

  <div class="toast no-print" id="toast"></div>
</div>

<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script>
(async function(){
  const $ = id => document.getElementById(id);

  if (window.LoginUI && window.Auth && !window.Auth.isAuthenticated()) {
    await window.LoginUI.ensureAuthenticated();
  }

  function newRecord(){
    return {
      id: null, revision: 1, status:'draft',
      date:'', potNo:'', waterLitres:'', abaloneShellsIntakeDate:'', driedKelpWeight:'',
      scallopJuiceWeight:'', finalBrothLitres:'', ph:'', salt:'', brix:'', comments:'',
      cookedBy:'', checkedAndCompletedBy:'',
      createdAt: null, updatedAt: null
    };
  }

  let state = newRecord();

  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  }
  function safeKey(s){ return String(s).trim().replace(/[\s\/\\'"]+/g,'_'); }

  async function storeGet(key, shared){
    try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function storeSet(key, value, shared){
    try{ await window.storage.set(key, value, shared); return true; }
    catch(e){ return false; }
  }

  function renderForm(){
    $('h_date').value = state.date;
    $('h_potNo').value = state.potNo;
    $('h_waterLitres').value = state.waterLitres;
    $('h_abaloneShellsIntakeDate').value = state.abaloneShellsIntakeDate;
    $('h_driedKelpWeight').value = state.driedKelpWeight;
    $('h_scallopJuiceWeight').value = state.scallopJuiceWeight;
    $('h_finalBrothLitres').value = state.finalBrothLitres;
    $('h_ph').value = state.ph;
    $('h_salt').value = state.salt;
    $('h_brix').value = state.brix;
    $('h_comments').value = state.comments;
    $('f_cookedBy').value = state.cookedBy;
    $('f_checkedAndCompletedBy').value = state.checkedAndCompletedBy;
  }

  function bindInputs(){
    const fields = ['date','potNo','waterLitres','abaloneShellsIntakeDate','driedKelpWeight','scallopJuiceWeight','finalBrothLitres','ph','salt','brix','comments','cookedBy','checkedAndCompletedBy'];
    fields.forEach(f=>{
      const id = (f.startsWith('cookedBy') || f.startsWith('checkedAndCompletedBy')) ? 'f_'+f : 'h_'+f;
      const el = $(id);
      if(el) el.addEventListener('input', ()=>{ state[f] = el.value; });
    });
  }

  function updateRecordStatus(){
    const potStr = state.potNo ? `Pot ${state.potNo}` : 'No pot';
    const submitted = state.status === 'submitted';
    $('recordStatus').textContent = `${submitted ? 'âœ“ Submitted' : 'Draft'} Â· ${potStr} Â· ${state.id ? 'ID: ' + state.id.slice(-8) : 'Unsaved'}`;
  }

  function renderAll(){
    renderForm();
    updateRecordStatus();
    $('statusLine').textContent = state.updatedAt ? `Last saved ${new Date(state.updatedAt).toLocaleString()}` : 'Not yet saved';
  }

  async function saveRecord(finalize){
    const now = Date.now();
    if(!state.id){
      const potId = state.potNo ? state.potNo : 'NOPOT';
      state.id = `broth_cooking_${safeKey(potId)}_${now}`;
      state.createdAt = now;
    }
    state.updatedAt = now;
    state.status = finalize ? 'submitted' : 'draft';

    const ok = await storeSet('record:'+state.id, JSON.stringify(state), true);
    if(!ok){ toast('Save failed.'); return; }
    toast(finalize ? 'Submitted for verification.' : 'Draft saved.');
    renderAll();
  }

  function generatePdf(){
    const potStr = state.potNo ? state.potNo : 'record';
    document.title = `REC_7.3.1_BROTH_COOKING_${safeKey(potStr)}_${state.date||''}`;
    window.print();
  }

  function wire(){
    bindInputs();
    $('saveDraftBtn').addEventListener('click', ()=>saveRecord(false));
    $('submitBtn').addEventListener('click', ()=>saveRecord(true));
    $('exportBtn').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const potStr = state.potNo ? state.potNo : 'broth_cooking_draft';
      a.download = `broth_cooking_${safeKey(potStr)}.json`;
      a.click();
    });
    $('generatePdfBtn').addEventListener('click', generatePdf);
  }

  wire();
  renderAll();
})();
</script>
</body>
</html>
