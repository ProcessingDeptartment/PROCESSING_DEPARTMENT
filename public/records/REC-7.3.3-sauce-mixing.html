<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.3.3 Sauce Mixing</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/api-backend.js?v=5"></script>
<script src="../lib/lookups.js?v=1"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/permission-rules.js?v=1"></script>
<script src="../lib/form-record.js?v=14"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'sauce-mixing',
    docCode: 'REC 7.3.3',
    title: 'Sauce Mixing',
    docRevisionStart: 1,
    listColumns: ['date', 'potNo', 'brothBatchDate'],
    sections: [
      { title: 'Broth info', fields: [
        { key: 'date', label: 'Date', type: 'date', required: true },
        { key: 'brothBatchDate', label: 'Broth batch date', type: 'date' },
        { key: 'potNo', label: 'Pot no.', type: 'text' },
        { key: 'litres', label: 'Litres', type: 'number' },
        { key: 'phBroth', label: 'pH (broth)', type: 'number' },
        { key: 'brixBroth', label: 'Brix (broth)', type: 'number' },
        { key: 'saltBroth', label: 'Salt (broth)', type: 'number' }
      ]},
      { title: 'Liquids added', newPage: true, fields: [
        { key: 'chickenLiquidWeight', label: 'Chicken liquid weight', type: 'number' },
        { key: 'chickenLiquidBatchCode', label: 'Chicken liquid batch code', type: 'text' },
        { key: 'smokeyFlavourWeight', label: 'Smokey flavour weight', type: 'number' },
        { key: 'smokeyFlavourBatchCode', label: 'Smokey flavour batch code', type: 'text' }
      ]},
      { title: 'Batch codes', fields: [
        { key: 'cvgMixBatchCode', label: 'CVG mix batch code', type: 'text' },
        { key: 'xg1BatchCode', label: 'XG1 batch code', type: 'text' },
        { key: 'xg2BatchCode', label: 'XG2 batch code', type: 'text' },
        { key: 'xg3BatchCode', label: 'XG3 batch code', type: 'text' },
        { key: 'mdMixBatchCode', label: 'MD mix batch code', type: 'text' },
        { key: 'tsMixBatchCode', label: 'TS mix batch code', type: 'text' },
        { key: 'soMixBatchCode', label: 'SO mix batch code', type: 'text' }
      ]}
    ]
  });
})();
</script>
</body>
</html>
