<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.3.3 Sauce Mixing</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
<style>
  :root{
    --ink:var(--palette-ink); --steel:var(--palette-heading); --steel-dk:var(--palette-dark); --paper:var(--palette-paper);
    --line:#b9956e; --line-soft:var(--palette-border); --ok:var(--palette-ok); --ok-bg:var(--palette-ok-bg);
    --warn:#c9a158; --warn-bg:#faf5eb; --fail:var(--palette-fail); --fail-bg:var(--palette-fail-bg);
    --accent:var(--palette-primary); --mono: 'IBM Plex Mono','SF Mono',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  #sm-root{ font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:var(--form-fs-root); line-height:1.4; }
  #sm-root *{ box-sizing:border-box; }
  #sm-root h1,#sm-root h2,#sm-root h3{ margin:0; font-weight:700; }
  #sm-root input, #sm-root select, #sm-root textarea{
    font-family:var(--mono); font-size:var(--form-fs-input); border:1px solid var(--line); border-radius:3px;
    padding:4px 6px; background:#fff; color:var(--ink); width:100%;
  }
  #sm-root input:focus, #sm-root select:focus, #sm-root textarea:focus{ outline:2px solid var(--steel); outline-offset:-1px; }
  #sm-root button{ font-family:var(--sans); cursor:pointer; border:none; border-radius:3px; font-weight:600; }
  .dc-top{ background:var(--steel-dk); color:var(--palette-dark-text); padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .dc-topline{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .dc-topline input{ width:120px; padding:3px 5px; font-size:var(--form-fs-small); }
  .btn{ padding:5px 11px; font-size:var(--form-fs-button); }
  .btn-primary{ background:var(--accent); color:var(--palette-primary-text); }
  .btn-primary:hover{ background:var(--palette-primary-hover); }
  .btn-ghost{ background:transparent; color:var(--palette-dark-text); border:1px solid #55636e !important; }
  .btn-ghost:hover{ background:#33444f; }
  .btn-flat{ background:var(--line-soft); color:var(--ink); }
  .btn-flat:hover{ background:#d5d8d6; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .dc-body{ padding:12px 14px 40px; max-width:900px; margin:0 auto; }
  .panel{ background:#fff; border:1px solid var(--line-soft); border-radius:5px; margin-bottom:10px; }
  .panel-head{ padding:7px 11px; border-bottom:1px solid var(--line-soft); background:var(--palette-head-bg); border-radius:5px 5px 0 0; }
  .panel-head h2{ font-size:var(--form-fs-panel-head); text-transform:uppercase; letter-spacing:.05em; color:var(--steel); margin:0; }
  .panel-body{ padding:11px; }

  .grid{ display:grid; gap:8px; }
  .grid-6{ grid-template-columns:repeat(6,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  label.field{ display:flex; flex-direction:column; gap:2px; font-size:var(--form-fs-label); color:var(--palette-label); font-weight:600; }
  label.field input, label.field select{ font-size:var(--form-fs-button); padding:3px 5px; }

  .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .status-line{ font-size:10px; color:#8a939b; font-family:var(--mono); margin-right:auto; }
  .record-status{ font-size:10px; color:var(--palette-label); font-weight:600; padding:4px 8px; background:var(--palette-border); border-radius:3px; }
  .muted{ color:#8a939b; }
  .toast{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--steel-dk); color:#fff; padding:8px 16px; border-radius:20px; font-size:var(--form-fs-small); z-index:999; opacity:0; pointer-events:none; transition:opacity .25s; }
  .toast.show{ opacity:1; }

  @media (max-width:900px){
    .grid-6{grid-template-columns:repeat(3,1fr);}
    .grid-4{grid-template-columns:repeat(2,1fr);}
  }

  /* Page 1 of the printed record carries only the Broth Info and the
     Sign-off -- Liquids Added and Batch Codes move to page 2. */
  @media print{
    .dc-body{ display:flex; flex-direction:column; max-width:none; padding:0; }
    #panelBrothInfo{ order:1; }
    #panelSignoff{ order:2; }
    #panelLiquidsAdded{ order:3; break-before:page; page-break-before:always; }
    #panelBatchCodes{ order:4; }
  }
</style>
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="sm-root">
  <div class="dc-top">
    <div class="doc-line"><span class="doc-code">REC 7.3.3</span><h1>Sauce Mixing</h1><span class="doc-rev">Rev 3 &middot; Rev date not set</span></div>
    <div class="dc-topline no-print"><button class="btn btn-flat" id="saveDraftBtn">Save</button>
      <button class="btn btn-primary" id="submitBtn">Submit</button>
    </div>
  </div>

  <div class="dc-body">
    <div class="panel" id="panelBrothInfo">
      <div class="panel-head"><h2>Broth Info</h2></div>
      <div class="panel-body">
        <div class="grid grid-4">
          <label class="field">Date<input id="h_date" type="date"></label>
          <label class="field">Broth batch date<input id="h_brothBatchDate" type="date"></label>
          <label class="field">Pot no.<input id="h_potNo" placeholder="Pot number"></label>
          <label class="field">Litres (L)<input id="h_litres" type="number" step="0.1"></label>
        </div>
        <div class="grid grid-4" style="margin-top:8px;">
          <label class="field">pH broth<input id="h_phBroth" type="number" step="0.1"></label>
          <label class="field">Brix broth<input id="h_brixBroth" type="number" step="0.1"></label>
          <label class="field">Salt broth<input id="h_saltBroth" type="number" step="0.1"></label>
        </div>
      </div>
    </div>

    <div class="panel" id="panelLiquidsAdded">
      <div class="panel-head"><h2>Liquids Added</h2></div>
      <div class="panel-body">
        <div class="grid grid-2">
          <label class="field">Chicken liquid — weight (kg)<input id="h_chickenLiquidWeight" type="number" step="0.01"></label>
          <label class="field">Chicken liquid — batch code<input id="h_chickenLiquidBatchCode" placeholder="Code"></label>
        </div>
        <div class="grid grid-2" style="margin-top:8px;">
          <label class="field">Smokey flavour — weight (kg)<input id="h_smokeyFlavourWeight" type="number" step="0.01"></label>
          <label class="field">Smokey flavour — batch code<input id="h_smokeyFlavourBatchCode" placeholder="Code"></label>
        </div>
      </div>
    </div>

    <div class="panel" id="panelBatchCodes">
      <div class="panel-head"><h2>Batch Codes</h2></div>
      <div class="panel-body">
        <div class="grid grid-3" style="margin-bottom:8px;">
          <label class="field">CVG mix — batch code<input id="h_cvgMixBatchCode" placeholder="Code"></label>
          <label class="field">XG-1 — batch code<input id="h_xg1BatchCode" placeholder="Code"></label>
          <label class="field">XG-2 — batch code<input id="h_xg2BatchCode" placeholder="Code"></label>
        </div>
        <div class="grid grid-3">
          <label class="field">XG-3 — batch code<input id="h_xg3BatchCode" placeholder="Code"></label>
          <label class="field">MD mix — batch code<input id="h_mdMixBatchCode" placeholder="Code"></label>
          <label class="field">TS mix — batch code<input id="h_tsMixBatchCode" placeholder="Code"></label>
        </div>
        <div class="grid grid-1" style="margin-top:8px;">
          <label class="field">SO mix — batch code<input id="h_soMixBatchCode" placeholder="Code"></label>
        </div>
      </div>
    </div>

    <div class="panel" id="panelSignoff">
      <div class="panel-head"><h2>Sign-off</h2></div>
      <div class="panel-body">
        <div id="signoffCompletedBy"></div>
      </div>
    </div>

    <div class="actions no-print">
      <span class="record-status" id="recordStatus"></span>
      <span class="status-line" id="statusLine"></span>
      <button class="btn btn-flat" id="exportBtn">Export JSON</button>
      <button class="btn btn-flat" id="generatePdfBtn">Print PDF</button>
    </div>

    <div class="panel no-print" id="panelVerification"></div>
  </div>

  <div class="toast no-print" id="toast"></div>
</div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script>
/* Controlled-copy title block, repeated on every printed page.
 * docCode/recordKey are also what tools/build-master-index-data.py keys this page
 * to in the Master Index. Without them the build falls back to the file name, which
 * silently re-keys the record and orphans its stored revision history.
 * The paper revision is deliberately not stated here -- mountPrintHeader takes it
 * from the record's index row, so the issued index stays the single source. */
window.RecordDoc = { docCode: 'REC 7.3.3', recordKey: 'sauce-mixing' };
document.addEventListener('DOMContentLoaded', function () {
  if (!window.DocHeader) return;
  window.DocHeader.mountPrintHeader({ recordKey: window.RecordDoc.recordKey })
    .then(function () {
      var badge = document.querySelector('.doc-rev');
      if (badge) badge.textContent = window.DocHeader.badgeText(window.RecordDoc.recordKey);
    })
    .catch(function (e) { console.error('title block failed to mount', e); });
});
</script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script>
(async function(){
  const $ = id => document.getElementById(id);

  function newRecord(){
    return {
      id: null, revision: 1, status:'draft',
      date:'', brothBatchDate:'', potNo:'', phBroth:'', brixBroth:'', saltBroth:'', litres:'',
      chickenLiquidWeight:'', chickenLiquidBatchCode:'', smokeyFlavourWeight:'', smokeyFlavourBatchCode:'',
      cvgMixBatchCode:'', xg1BatchCode:'', xg2BatchCode:'', xg3BatchCode:'', mdMixBatchCode:'',
      tsMixBatchCode:'', soMixBatchCode:'', mixedBy:'', mixedByTitle:'', mixedByDate:'', mixedBySignature:'',
      verification: null,
      createdAt: null, updatedAt: null
    };
  }

  let state = newRecord();
function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  }
  function safeKey(s){ return String(s).trim().replace(/[\s\/\\'"]+/g,'_'); }

  async function storeGet(key, shared){
    try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function storeSet(key, value, shared){
    try{ await window.storage.set(key, value, shared); return true; }
    catch(e){ return false; }
  }

  function renderForm(){
    $('h_date').value = state.date;
    $('h_brothBatchDate').value = state.brothBatchDate;
    $('h_potNo').value = state.potNo;
    $('h_phBroth').value = state.phBroth;
    $('h_brixBroth').value = state.brixBroth;
    $('h_saltBroth').value = state.saltBroth;
    $('h_litres').value = state.litres;
    $('h_chickenLiquidWeight').value = state.chickenLiquidWeight;
    $('h_chickenLiquidBatchCode').value = state.chickenLiquidBatchCode;
    $('h_smokeyFlavourWeight').value = state.smokeyFlavourWeight;
    $('h_smokeyFlavourBatchCode').value = state.smokeyFlavourBatchCode;
    $('h_cvgMixBatchCode').value = state.cvgMixBatchCode;
    $('h_xg1BatchCode').value = state.xg1BatchCode;
    $('h_xg2BatchCode').value = state.xg2BatchCode;
    $('h_xg3BatchCode').value = state.xg3BatchCode;
    $('h_mdMixBatchCode').value = state.mdMixBatchCode;
    $('h_tsMixBatchCode').value = state.tsMixBatchCode;
    $('h_soMixBatchCode').value = state.soMixBatchCode;
    $('f_mixedBy').value = state.mixedBy;
    $('f_mixedByTitle').value = state.mixedByTitle;
    $('f_mixedByDate').value = state.mixedByDate;
    $('f_mixedBySignature').value = state.mixedBySignature;
  }

  function bindInputs(){
    const fields = ['date','brothBatchDate','potNo','phBroth','brixBroth','saltBroth','litres','chickenLiquidWeight','chickenLiquidBatchCode','smokeyFlavourWeight','smokeyFlavourBatchCode','cvgMixBatchCode','xg1BatchCode','xg2BatchCode','xg3BatchCode','mdMixBatchCode','tsMixBatchCode','soMixBatchCode','mixedBy','mixedByTitle','mixedByDate','mixedBySignature'];
    fields.forEach(f=>{
      const id = f.startsWith('mixedBy') ? 'f_'+f : 'h_'+f;
      const el = $(id);
      if(el) el.addEventListener('input', ()=>{ state[f] = el.value; });
    });
  }

  function updateRecordStatus(){
    const potStr = state.potNo ? `Pot ${state.potNo}` : 'No pot';
    const submitted = state.status === 'submitted';
    $('recordStatus').textContent = `${submitted ? '✓ Submitted' : 'Draft'} · ${potStr} · ${state.id ? 'ID: ' + state.id.slice(-8) : 'Unsaved'}`;
  }

  function renderAll(){
    renderForm();
    updateRecordStatus();
    $('statusLine').textContent = state.updatedAt ? `Last saved ${new Date(state.updatedAt).toLocaleString()}` : 'Not yet saved';
  }

  async function saveRecord(finalize){
    const now = Date.now();
    if(!state.id){
      const potId = state.potNo ? state.potNo : 'NOPOT';
      state.id = `sauce_mixing_${safeKey(potId)}_${now}`;
      state.createdAt = now;
    }
    state.updatedAt = now;
    state.status = finalize ? 'submitted' : 'draft';

    const ok = await storeSet('record:'+state.id, JSON.stringify(state), true);
    if(!ok){ toast('Save failed.'); return; }
    toast(finalize ? 'Submitted for verification.' : 'Draft saved.');
    renderAll();
    if(verificationBlock) verificationBlock.refresh();
  }

  function generatePdf(){
    const potStr = state.potNo ? state.potNo : 'record';
    document.title = `REC_7.3.3_SAUCE_MIXING_${safeKey(potStr)}_${state.date||''}`;
    window.print();
  }

  function mountSignoff(){
    $('signoffCompletedBy').innerHTML = window.SignOffBlock.completedByHtml({
      byId: 'f_mixedBy', titleId: 'f_mixedByTitle', dateId: 'f_mixedByDate', signatureId: 'f_mixedBySignature', byLabel: 'Mixed by'
    });
  }

  let verificationBlock = null;
  function mountVerification(){
    verificationBlock = window.SignOffBlock.mountVerification({
      recordKey: window.RecordDoc.recordKey,
      mount: '#panelVerification',
      getPending(){
        return (state.status === 'submitted' && !state.verification)
          ? [{ id: state.id, label: state.potNo ? `Pot ${state.potNo}` : 'This record' }]
          : [];
      },
      async onLogged(record){
        state.verification = record;
        await storeSet('record:'+state.id, JSON.stringify(state), true);
      }
    });
  }

function wire(){
bindInputs();
    $('saveDraftBtn').addEventListener('click', ()=>saveRecord(false));
    $('submitBtn').addEventListener('click', ()=>saveRecord(true));
    $('exportBtn').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const potStr = state.potNo ? state.potNo : 'sauce_mixing_draft';
      a.download = `sauce_mixing_${safeKey(potStr)}.json`;
      a.click();
    });
    $('generatePdfBtn').addEventListener('click', generatePdf);
  }

  mountSignoff();
  wire();
  renderAll();
  mountVerification();
})();
</script>
</body>
</html>
