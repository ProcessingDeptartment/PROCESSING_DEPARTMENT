<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.8.10 Maintenance Job Card</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/form-record.js?v=21"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'maintenance-job-card',
    docCode: 'REC 7.8.10',
    title: 'Maintenance Job Card',
    docRevisionStart: 1,
    listColumns: ['jobCardNumber', 'issueDate', 'completedBy'],
    sections: [
      { title: 'Job details', fields: [
        { key: 'jobCardNumber', label: 'Maintenance job card number', type: 'text', required: true },
        { key: 'maintenanceDetail', label: 'Maintenance detail', type: 'select', options: ['Preventive Maintenance', 'Equipment / Utensil Breakdown', 'Facility & Premises Repairs', 'Other'] },
        { key: 'completedBy', label: 'Completed by', type: 'text', required: true },
        { key: 'issueDate', label: 'Issue date', type: 'date', required: true },
        { key: 'descriptionRequired', label: 'Description of maintenance required', type: 'textarea', wide: true },
        { key: 'actualMaintenancePerformed', label: 'Actual maintenance performed', type: 'textarea', wide: true },
        { key: 'timeStarted', label: 'Time started', type: 'text' },
        { key: 'timeFinished', label: 'Time finished', type: 'text' },
        { key: 'technicianSignature', label: 'Technician signature', type: 'text' },
        { key: 'comments', label: 'Comments related to maintenance activity', type: 'textarea', wide: true }
      ]},
      { title: 'Verification', fields: [
        { key: 'suitablyCarriedOut', label: 'Was the maintenance suitably carried out and completed?', type: 'yesno' },
        { key: 'nutsBoltsAccountedFor', label: 'Are all nuts, bolts, tools and loose parts accounted for and in place?', type: 'yesno' },
        { key: 'areaCleanedAfter', label: 'Was the area/equipment suitably cleaned after maintenance?', type: 'yesno' },
        { key: 'managementVerification', label: 'Management verification', type: 'text' },
        { key: 'verificationDate', label: 'Date', type: 'date' }
      ]}
    ]
  });
})();
</script>
</body>
</html>
