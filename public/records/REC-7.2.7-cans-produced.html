<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.2.7 Cans Produced</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="record-theme.css">
<style>
  :root{
    --ink:#1b2330; --steel:#2f4356; --steel-dk:#1d2b38; --paper:#f4f5f3;
    --line:#c9cdd1; --line-soft:#e2e4e3; --ok:#2f7a52; --ok-bg:#e8f3ec;
    --warn:#b8791c; --warn-bg:#fbf0dc; --fail:#a3352d; --fail-bg:#fbe8e6;
    --accent:#c9832b; --mono: 'IBM Plex Mono','SF Mono',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  #cp-root{ font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:13px; line-height:1.4; }
  #cp-root *{ box-sizing:border-box; }
  #cp-root h1,#cp-root h2,#cp-root h3{ margin:0; font-weight:700; }
  #cp-root input, #cp-root select, #cp-root textarea{
    font-family:var(--mono); font-size:12.5px; border:1px solid var(--line); border-radius:3px;
    padding:4px 6px; background:#fff; color:var(--ink); width:100%;
  }
  #cp-root input:focus, #cp-root select:focus, #cp-root textarea:focus{ outline:2px solid var(--steel); outline-offset:-1px; }
  #cp-root button{ font-family:var(--sans); cursor:pointer; border:none; border-radius:3px; font-weight:600; }
  .cp-top{ background:var(--steel-dk); color:#f4f1e8; padding:12px 16px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .cp-topline{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .cp-topline label.role-label{ font-size:9.5px; color:#b9c3cc; display:flex; flex-direction:column; gap:2px; }
  .cp-topline input{ width:120px; padding:3px 5px; font-size:11px; }
  .btn{ padding:5px 11px; font-size:11.5px; }
  .btn-primary{ background:var(--accent); color:#241a0a; }
  .btn-primary:hover{ background:#dd9536; }
  .btn-ghost{ background:transparent; color:#f4f1e8; border:1px solid #55636e !important; }
  .btn-ghost:hover{ background:#33444f; }
  .btn-flat{ background:var(--line-soft); color:var(--ink); }
  .btn-flat:hover{ background:#d5d8d6; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .cp-body{ padding:12px 14px 40px; max-width:900px; margin:0 auto; }
  .panel{ background:#fff; border:1px solid var(--line-soft); border-radius:5px; margin-bottom:10px; }
  .panel-head{ padding:7px 11px; border-bottom:1px solid var(--line-soft); background:#fbfbfa; border-radius:5px 5px 0 0; }
  .panel-head h2{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--steel); margin:0; }
  .panel-body{ padding:11px; }

  .grid{ display:grid; gap:8px; }
  .grid-6{ grid-template-columns:repeat(6,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  label.field{ display:flex; flex-direction:column; gap:2px; font-size:10.5px; color:#54606b; font-weight:600; }
  label.field input, label.field select{ font-size:11.5px; padding:3px 5px; }

  .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .status-line{ font-size:10px; color:#8a939b; font-family:var(--mono); margin-right:auto; }
  .record-status{ font-size:10px; color:#54606b; font-weight:600; padding:4px 8px; background:#e2e4e3; border-radius:3px; }
  .muted{ color:#8a939b; }
  .toast{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--steel-dk); color:#fff; padding:8px 16px; border-radius:20px; font-size:11px; z-index:999; opacity:0; pointer-events:none; transition:opacity .25s; }
  .toast.show{ opacity:1; }

  @media (max-width:900px){
    .grid-6{grid-template-columns:repeat(3,1fr);}
    .grid-4{grid-template-columns:repeat(2,1fr);}
  }
</style>
  <link rel="stylesheet" href="../responsive.css?v=1">
</head>
<body>
<div id="cp-root">
  <div class="cp-top">
    <div class="doc-line"><span class="doc-code">REC 7.2.7</span><h1>Cans Produced</h1><span class="doc-rev">Rev 6 &middot; Rev date not set</span></div>
    <div class="cp-topline no-print">
      <label class="role-label">Your name
        <input id="actingNameInput" placeholder="Name">
      </label>
      <button class="btn btn-flat" id="saveDraftBtn">Save</button>
      <button class="btn btn-primary" id="submitBtn">Submit</button>
    </div>
  </div>

  <div class="cp-body">

    <div class="panel">
      <div class="panel-head"><h2>Batch Info</h2></div>
      <div class="panel-body">
        <div class="grid grid-6" style="margin-bottom:8px;">
          <label class="field">Intake date<input id="h_intakeDate" type="date"></label>
          <label class="field">Job number<input id="h_jobNumber" placeholder="Job"></label>
          <label class="field">Tracking no.<input id="h_trackingNo" placeholder="Track"></label>
          <label class="field">Production code<input id="h_productionCode" placeholder="Code"></label>
          <label class="field">Time trolley in<input id="h_timeTrolleyIn" placeholder="HH:MM"></label>
          <label class="field">Retort code<input id="h_retortCode" placeholder="Code"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Cooking & Processing</h2></div>
      <div class="panel-body">
        <div class="grid grid-4" style="margin-bottom:8px;">
          <label class="field">Retort no.<input id="h_retortNo" placeholder="No."></label>
          <label class="field">Cooking method/recipe<input id="h_cookingMethodRecipe" placeholder="Method"></label>
          <label class="field">Can pieces<input id="h_canPieces" type="number" step="1"></label>
          <label class="field">Drain weight (g)<input id="h_drainWeight" type="number" step="0.1"></label>
        </div>
        <div class="grid grid-4">
          <label class="field">Brine / Braised<select id="h_brineOrBraised"><option value="">—</option><option value="Brine">Brine</option><option value="Braised">Braised</option></select></label>
          <label class="field">Sauce batch<input id="h_sauceBatch" placeholder="Batch"></label>
          <label class="field">Number of cans<input id="h_numberOfCans" type="number" step="1"></label>
          <label class="field">Damaged cans<input id="h_damagedCans" type="number" step="1"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Damage Report</h2></div>
      <div class="panel-body">
        <div class="grid grid-2">
          <label class="field">Reason for damage<input id="h_reasonForDamage" placeholder="Reason"></label>
          <label class="field">Total damaged cans<input id="h_totalDamagedCans" type="number" step="1"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Sign-off</h2></div>
      <div class="panel-body">
        <div class="grid grid-2">
          <label class="field">Supervisor<input id="f_supervisor"></label>
          <label class="field">Date<input id="f_supervisorDate" type="date"></label>
        </div>
      </div>
    </div>

    <div class="actions no-print">
      <span class="record-status" id="recordStatus"></span>
      <span class="status-line" id="statusLine"></span>
      <button class="btn btn-flat" id="exportBtn">Export JSON</button>
      <button class="btn btn-flat" id="generatePdfBtn">Print PDF</button>
    </div>
  </div>

  <div class="toast no-print" id="toast"></div>
</div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script>
/* Controlled-copy title block, repeated on every printed page.
 * docCode/recordKey are also what tools/build-master-index-data.py keys this page
 * to in the Master Index. Without them the build falls back to the file name, which
 * silently re-keys the record and orphans its stored revision history.
 * The paper revision is deliberately not stated here -- mountPrintHeader takes it
 * from the record's index row, so the issued index stays the single source. */
window.RecordDoc = { docCode: 'REC 7.2.7', recordKey: 'cans-produced' };
document.addEventListener('DOMContentLoaded', function () {
  if (!window.DocHeader) return;
  window.DocHeader.mountPrintHeader({ recordKey: window.RecordDoc.recordKey })
    .catch(function (e) { console.error('title block failed to mount', e); });
});
</script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/traceability.js?v=2"></script>
<script>
(async function(){
  const $ = id => document.getElementById(id);

  function newRecord(){
    return {
      id: null, revision: 1, status:'draft',
      intakeDate:'', jobNumber:'', trackingNo:'', productionCode:'', timeTrolleyIn:'', retortCode:'',
      retortNo:'', cookingMethodRecipe:'', canPieces:'', drainWeight:'',
      brineOrBraised:'', sauceBatch:'', numberOfCans:'', damagedCans:'',
      reasonForDamage:'', totalDamagedCans:'',
      supervisor:'', supervisorDate:'',
      createdAt: null, updatedAt: null
    };
  }

  let state = newRecord();
  const ACTING_NAME_KEY = 'acting_as_name_cans_produced';
  let actingName = window.localStorage.getItem(ACTING_NAME_KEY) || '';

  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  }
  function safeKey(s){ return String(s).trim().replace(/[\s\/\\'"]+/g,'_'); }

  async function storeGet(key, shared){
    try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function storeSet(key, value, shared){
    try{ await window.storage.set(key, value, shared); return true; }
    catch(e){ return false; }
  }

  function renderForm(){
    $('h_intakeDate').value = state.intakeDate;
    $('h_jobNumber').value = state.jobNumber;
    $('h_trackingNo').value = state.trackingNo;
    $('h_productionCode').value = state.productionCode;
    $('h_timeTrolleyIn').value = state.timeTrolleyIn;
    $('h_retortCode').value = state.retortCode;
    $('h_retortNo').value = state.retortNo;
    $('h_cookingMethodRecipe').value = state.cookingMethodRecipe;
    $('h_canPieces').value = state.canPieces;
    $('h_drainWeight').value = state.drainWeight;
    $('h_brineOrBraised').value = state.brineOrBraised;
    $('h_sauceBatch').value = state.sauceBatch;
    $('h_numberOfCans').value = state.numberOfCans;
    $('h_damagedCans').value = state.damagedCans;
    $('h_reasonForDamage').value = state.reasonForDamage;
    $('h_totalDamagedCans').value = state.totalDamagedCans;
    $('f_supervisor').value = state.supervisor;
    $('f_supervisorDate').value = state.supervisorDate;
  }

  function bindInputs(){
    const fields = ['intakeDate','jobNumber','trackingNo','productionCode','timeTrolleyIn','retortCode',
      'retortNo','cookingMethodRecipe','canPieces','drainWeight',
      'brineOrBraised','sauceBatch','numberOfCans','damagedCans',
      'reasonForDamage','totalDamagedCans','supervisor','supervisorDate'];
    fields.forEach(f=>{
      const id = f.startsWith('supervisor') ? 'f_'+f : 'h_'+f;
      const el = $(id);
      if(el) el.addEventListener('input', ()=>{ state[f] = el.value; });
    });
  }

  function updateRecordStatus(){
    const jobStr = state.jobNumber ? `${state.jobNumber}` : 'No job';
    const submitted = state.status === 'submitted';
    $('recordStatus').textContent = `${submitted ? '✓ Submitted' : 'Draft'} · ${jobStr} · ${state.id ? 'ID: ' + state.id.slice(-8) : 'Unsaved'}`;
  }

  function renderAll(){
    renderForm();
    updateRecordStatus();
    $('statusLine').textContent = state.updatedAt ? `Last saved ${new Date(state.updatedAt).toLocaleString()}` : 'Not yet saved';
  }

  async function saveRecord(finalize){
    const now = Date.now();
    if(!state.id){
      const jobId = state.jobNumber ? state.jobNumber : 'NOJOB';
      state.id = `cans_produced_${safeKey(jobId)}_${now}`;
      state.createdAt = now;
    }
    state.updatedAt = now;
    state.status = finalize ? 'submitted' : 'draft';

    const ok = await storeSet('record:'+state.id, JSON.stringify(state), true);
    if(!ok){ toast('Save failed.'); return; }

    if (window.Traceability) {
      window.Traceability.indexSubmission({recordKey:'cans-produced', batchField:'jobNumber', stage:'canning'}, {values:state});
    }

    toast(finalize ? 'Submitted for verification.' : 'Draft saved.');
    renderAll();
  }

  function generatePdf(){
    const jobStr = state.jobNumber ? state.jobNumber : 'record';
    document.title = `REC_7.2.7_CANS_PRODUCED_${safeKey(jobStr)}_${state.intakeDate||''}`;
    window.print();
  }

  function wireActingName(){
    const inp = $('actingNameInput');
    inp.value = actingName;
    inp.addEventListener('input', ()=>{ actingName = inp.value; window.localStorage.setItem(ACTING_NAME_KEY, actingName); });
  }

  function wire(){
    wireActingName();
    bindInputs();
    $('saveDraftBtn').addEventListener('click', ()=>saveRecord(false));
    $('submitBtn').addEventListener('click', ()=>saveRecord(true));
    $('exportBtn').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const jobStr = state.jobNumber ? state.jobNumber : 'cans_produced_draft';
      a.download = `cans_produced_${safeKey(jobStr)}.json`;
      a.click();
    });
    $('generatePdfBtn').addEventListener('click', generatePdf);
  }

  wire();
  renderAll();
})();
</script>
</body>
</html>
