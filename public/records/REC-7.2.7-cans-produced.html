<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.2.7 Cans Produced</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/lookups.js?v=2"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=5"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/permission-rules.js?v=1"></script>
<script src="../lib/form-record.js?v=21"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'cans-produced',
    docCode: 'REC 7.2.7',
    title: 'Cans Produced',
    docRevisionStart: 1,
    // Job number search-select, sourced from Abalone Receiving (REC 7.1.2) -- pick from what's
    // actually been received instead of typing blind.
    // Picking one also fills in what that job already carries (intakeDate),
    // only where this form's own field is still empty.
    autofill: [
      { watch: 'jobNumber', source: 'abalone-receiving', matchField: 'jobNo',
        fill: { intakeDate: 'receivingDate' } }
    ],
    listColumns: ['intakeDate', 'jobNumber', 'numberOfCans'],
    batchField: 'jobNumber',
    stage: 'canning',
    sections: [
      { title: 'Batch info', fields: [
        { key: 'jobNumber', label: 'Job number', type: 'jobsearch' },
        { key: 'intakeDate', label: 'Intake date', type: 'date', required: true },
        { key: 'trackingNo', label: 'Tracking no.', type: 'text' },
        { key: 'productionCode', label: 'Production code', type: 'text' },
        { key: 'timeTrolleyIn', label: 'Time trolley in', type: 'text' },
        { key: 'retortCode', label: 'Retort code', type: 'text' }
      ]},
      { title: 'Cooking & processing', newPage: true, fields: [
        { key: 'retortNo', label: 'Retort no.', type: 'text' },
        { key: 'cookingMethodRecipe', label: 'Cooking method/recipe', type: 'text' },
        { key: 'canPieces', label: 'Can pieces', type: 'number' },
        { key: 'drainWeight', label: 'Drain weight (g)', type: 'number' },
        { key: 'brineOrBraised', label: 'Brine / Braised', type: 'select', options: ['Brine', 'Braised'] },
        { key: 'sauceBatch', label: 'Sauce batch', type: 'text' },
        { key: 'numberOfCans', label: 'Number of cans', type: 'number' },
        { key: 'damagedCans', label: 'Damaged cans', type: 'number' }
      ]},
      { title: 'Damage report', fields: [
        { key: 'reasonForDamage', label: 'Reason for damage', type: 'text' },
        { key: 'totalDamagedCans', label: 'Total damaged cans', type: 'number' }
      ]}
    ]
  });
})();
</script>
</body>
</html>
