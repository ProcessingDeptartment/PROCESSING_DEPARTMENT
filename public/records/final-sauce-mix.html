<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.3.4 Final Sauce Mix</title>
<script src="palette-map.js"></script>
<link rel="stylesheet" href="record-theme.css">
<style>
  :root{
    --ink:#4a3428; --steel:#8b7355; --steel-dk:#5a4a38; --paper:#f8f6f3;
    --line:#b9956e; --line-soft:#dcc9b8; --ok:#7b9b7f; --ok-bg:#e8f0e9;
    --warn:#c9a158; --warn-bg:#faf5eb; --fail:#9d6f5f; --fail-bg:#faf5f3;
    --accent:#8b7355; --mono: 'IBM Plex Mono','SF Mono',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  #fsm-root{ font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:13px; line-height:1.4; }
  #fsm-root *{ box-sizing:border-box; }
  #fsm-root h1,#fsm-root h2,#fsm-root h3{ margin:0; font-weight:700; }
  #fsm-root input, #fsm-root select, #fsm-root textarea{
    font-family:var(--mono); font-size:12.5px; border:1px solid var(--line); border-radius:3px;
    padding:4px 6px; background:#fff; color:var(--ink); width:100%;
  }
  #fsm-root input:focus, #fsm-root select:focus, #fsm-root textarea:focus{ outline:2px solid var(--steel); outline-offset:-1px; }
  #fsm-root button{ font-family:var(--sans); cursor:pointer; border:none; border-radius:3px; font-weight:600; }
  .dc-top{ background:var(--steel-dk); color:#f4f1e8; padding:12px 16px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .dc-topline{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .dc-topline label.role-label{ font-size:9.5px; color:#b9c3cc; display:flex; flex-direction:column; gap:2px; }
  .dc-topline input{ width:120px; padding:3px 5px; font-size:11px; }
  .btn{ padding:5px 11px; font-size:11.5px; }
  .btn-primary{ background:var(--accent); color:#241a0a; }
  .btn-primary:hover{ background:#dd9536; }
  .btn-ghost{ background:transparent; color:#f4f1e8; border:1px solid #55636e !important; }
  .btn-ghost:hover{ background:#33444f; }
  .btn-flat{ background:var(--line-soft); color:var(--ink); }
  .btn-flat:hover{ background:#d5d8d6; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .dc-body{ padding:12px 14px 40px; max-width:900px; margin:0 auto; }
  .panel{ background:#fff; border:1px solid var(--line-soft); border-radius:5px; margin-bottom:10px; }
  .panel-head{ padding:7px 11px; border-bottom:1px solid var(--line-soft); background:#fbfbfa; border-radius:5px 5px 0 0; }
  .panel-head h2{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--steel); margin:0; }
  .panel-body{ padding:11px; }

  .grid{ display:grid; gap:8px; }
  .grid-6{ grid-template-columns:repeat(6,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  label.field{ display:flex; flex-direction:column; gap:2px; font-size:10.5px; color:#54606b; font-weight:600; }
  label.field input, label.field select{ font-size:11.5px; padding:3px 5px; }

  .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .status-line{ font-size:10px; color:#8a939b; font-family:var(--mono); margin-right:auto; }
  .record-status{ font-size:10px; color:#54606b; font-weight:600; padding:4px 8px; background:#e2e4e3; border-radius:3px; }
  .muted{ color:#8a939b; }
  .toast{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--steel-dk); color:#fff; padding:8px 16px; border-radius:20px; font-size:11px; z-index:999; opacity:0; pointer-events:none; transition:opacity .25s; }
  .toast.show{ opacity:1; }

  @media (max-width:900px){
    .grid-6{grid-template-columns:repeat(3,1fr);}
    .grid-4{grid-template-columns:repeat(2,1fr);}
  }
</style>
  <link rel="stylesheet" href="../responsive.css?v=1">
</head>
<body>
<div id="fsm-root">
  <div class="dc-top">
    <div class="doc-line"><span class="doc-code">REC 7.3.4</span><h1>Final Sauce Mix</h1><span class="doc-rev">Rev 3 &middot; Rev date not set</span></div>
    <div class="dc-topline no-print">
      <label class="role-label">Your name
        <input id="actingNameInput" placeholder="Name">
      </label>
      <button class="btn btn-flat" id="saveDraftBtn">Save</button>
      <button class="btn btn-primary" id="submitBtn">Submit</button>
    </div>
  </div>

  <div class="dc-body">
    <div class="panel">
      <div class="panel-head"><h2>Batch Info</h2></div>
      <div class="panel-body">
        <div class="grid grid-2">
          <label class="field">Date<input id="h_date" type="date"></label>
          <label class="field">Pot no.<input id="h_potNo" placeholder="Pot number"></label>
        </div>
        <div class="grid grid-2" style="margin-top:8px;">
          <label class="field">Batch code: sauce<input id="h_batchCodeSauce" placeholder="Code"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Measurements</h2></div>
      <div class="panel-body">
        <div class="grid grid-4">
          <label class="field">pH<input id="h_ph" type="number" step="0.1"></label>
          <label class="field">Salt<input id="h_salt" type="number" step="0.1"></label>
          <label class="field">Brix<input id="h_brix" type="number" step="0.1"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Adjustments</h2></div>
      <div class="panel-body">
        <div class="grid grid-3">
          <label class="field">Salt adjustment<input id="h_saltAdjustment" placeholder="Adjustment"></label>
          <label class="field">Brown sugar adjustment<input id="h_brownSugarAdjustment" placeholder="Adjustment"></label>
          <label class="field">Malt adjustment<input id="h_maltAdjustment" placeholder="Adjustment"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Sign-off</h2></div>
      <div class="panel-body">
        <div class="grid grid-6" style="margin-bottom:8px;">
          <label class="field">Comments<textarea id="h_comments" rows="3"></textarea></label>
        </div>
        <div class="grid grid-2">
          <label class="field">Mixed by<input id="f_mixedBy"></label>
        </div>
      </div>
    </div>

    <div class="actions no-print">
      <span class="record-status" id="recordStatus"></span>
      <span class="status-line" id="statusLine"></span>
      <button class="btn btn-flat" id="exportBtn">Export JSON</button>
      <button class="btn btn-flat" id="generatePdfBtn">Print PDF</button>
    </div>
  </div>

  <div class="toast no-print" id="toast"></div>
</div>

<script src="../lib/data-store.js?v=2"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script>
(async function(){
  const $ = id => document.getElementById(id);

  if (window.LoginUI && window.Auth && !window.Auth.isAuthenticated()) {
    await window.LoginUI.ensureAuthenticated();
  }

  function newRecord(){
    return {
      id: null, revision: 1, status:'draft',
      date:'', potNo:'', batchCodeSauce:'', ph:'', salt:'', brix:'', saltAdjustment:'',
      brownSugarAdjustment:'', maltAdjustment:'', comments:'', mixedBy:'',
      createdAt: null, updatedAt: null
    };
  }

  let state = newRecord();
  const ACTING_NAME_KEY = 'acting_as_name_final_sauce_mix';
  let actingName = window.localStorage.getItem(ACTING_NAME_KEY) || '';

  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  }
  function safeKey(s){ return String(s).trim().replace(/[\s\/\\'"]+/g,'_'); }

  async function storeGet(key, shared){
    try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function storeSet(key, value, shared){
    try{ await window.storage.set(key, value, shared); return true; }
    catch(e){ return false; }
  }

  function renderForm(){
    $('h_date').value = state.date;
    $('h_potNo').value = state.potNo;
    $('h_batchCodeSauce').value = state.batchCodeSauce;
    $('h_ph').value = state.ph;
    $('h_salt').value = state.salt;
    $('h_brix').value = state.brix;
    $('h_saltAdjustment').value = state.saltAdjustment;
    $('h_brownSugarAdjustment').value = state.brownSugarAdjustment;
    $('h_maltAdjustment').value = state.maltAdjustment;
    $('h_comments').value = state.comments;
    $('f_mixedBy').value = state.mixedBy;
  }

  function bindInputs(){
    const fields = ['date','potNo','batchCodeSauce','ph','salt','brix','saltAdjustment','brownSugarAdjustment','maltAdjustment','comments','mixedBy'];
    fields.forEach(f=>{
      const id = f.startsWith('mixedBy') ? 'f_'+f : 'h_'+f;
      const el = $(id);
      if(el) el.addEventListener('input', ()=>{ state[f] = el.value; });
    });
  }

  function updateRecordStatus(){
    const potStr = state.potNo ? `Pot ${state.potNo}` : 'No pot';
    const submitted = state.status === 'submitted';
    $('recordStatus').textContent = `${submitted ? '✓ Submitted' : 'Draft'} · ${potStr} · ${state.id ? 'ID: ' + state.id.slice(-8) : 'Unsaved'}`;
  }

  function renderAll(){
    renderForm();
    updateRecordStatus();
    $('statusLine').textContent = state.updatedAt ? `Last saved ${new Date(state.updatedAt).toLocaleString()}` : 'Not yet saved';
  }

  async function saveRecord(finalize){
    const now = Date.now();
    if(!state.id){
      const potId = state.potNo ? state.potNo : 'NOPOT';
      state.id = `final_sauce_mix_${safeKey(potId)}_${now}`;
      state.createdAt = now;
    }
    state.updatedAt = now;
    state.status = finalize ? 'submitted' : 'draft';

    const ok = await storeSet('record:'+state.id, JSON.stringify(state), true);
    if(!ok){ toast('Save failed.'); return; }
    toast(finalize ? 'Submitted for verification.' : 'Draft saved.');
    renderAll();
  }

  function generatePdf(){
    const potStr = state.potNo ? state.potNo : 'record';
    document.title = `REC_7.3.4_FINAL_SAUCE_MIX_${safeKey(potStr)}_${state.date||''}`;
    window.print();
  }

  function wireActingName(){
    const inp = $('actingNameInput');
    inp.value = actingName;
    inp.addEventListener('input', ()=>{ actingName = inp.value; window.localStorage.setItem(ACTING_NAME_KEY, actingName); });
  }

  function wire(){
    wireActingName();
    bindInputs();
    $('saveDraftBtn').addEventListener('click', ()=>saveRecord(false));
    $('submitBtn').addEventListener('click', ()=>saveRecord(true));
    $('exportBtn').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const potStr = state.potNo ? state.potNo : 'final_sauce_mix_draft';
      a.download = `final_sauce_mix_${safeKey(potStr)}.json`;
      a.click();
    });
    $('generatePdfBtn').addEventListener('click', generatePdf);
  }

  wire();
  renderAll();
})();
</script>
</body>
</html>
