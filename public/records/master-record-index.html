<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Record Index</title>
<style>
  body{ font-family:'Segoe UI',system-ui,sans-serif; color:#1b2330; background:#f4f5f3; font-size:13px; line-height:1.4; margin:0; }
  .mri-top{ background:#1d2b38; color:#f4f1e8; padding:14px 18px; }
  .mri-top h1{ margin:0; font-size:17px; }
  .mri-top p{ margin:4px 0 0; color:#b9c3cc; font-size:12px; }
  .mri-body{ padding:16px 18px 60px; max-width:1100px; margin:0 auto; }
  .mri-section{ margin-bottom:22px; }
  .mri-section h2{ font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:#2f4356; margin:0 0 8px; }
  table.mri-table{ width:100%; border-collapse:collapse; background:#fff; border:1px solid #e2e4e3; border-radius:6px; overflow:hidden; }
  table.mri-table th,table.mri-table td{ border-bottom:1px solid #e2e4e3; padding:7px 10px; text-align:left; font-size:12px; }
  table.mri-table th{ background:#fbfbfa; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; color:#5c6771; font-weight:700; }
  table.mri-table td.rev{ font-family:'IBM Plex Mono',monospace; font-weight:700; color:#2f4356; white-space:nowrap; }
  table.mri-table a{ color:#1d4ed8; font-weight:600; text-decoration:none; }
  table.mri-table a:hover{ text-decoration:underline; }
  .back-link{ display:inline-block; margin-top:10px; color:#1d4ed8; text-decoration:none; font-size:0.9rem; }
  .back-link:hover{ text-decoration:underline; }
</style>
</head>
<body>
<div class="mri-top">
  <h1>Master Record Index</h1>
  <p>Every digitised record and its current document-control revision, read live from each record's own revision history — not a hand-maintained list.</p>
</div>
<div class="mri-body">
  <div id="sections"></div>
  <a class="back-link" href="../other.html">&larr; Back to Other Documents</a>
</div>

<script src="../lib/data-store.js?v=1"></script>
<script src="../lib/document-revision.js?v=1"></script>
<script>
(function () {
  // Every entry here is one digitised record. `recordKey` and `docRevisionStart` must
  // match the values the record's own page passes to DocumentRevision, so the "current
  // revision" column always reflects that record's real history — nothing here is
  // hand-typed per revision.
  const SECTIONS = [
    {
      title: 'Can/Point Inspection',
      records: [
        { docCode: 'REC 7.2.12', title: 'Double Seam Inspection Report', recordKey: 'double-seam-inspection-report', docRevisionStart: 11, href: 'double-seam-inspection-report.html' }
      ]
    },
    {
      title: 'Monitoring Logs (7.8.9 / 7.9.x / 7.10.x)',
      records: [
        { docCode: 'REC 7.9.1', title: 'Chiller Temperature Monitoring', recordKey: 'chiller-temperature-monitoring', docRevisionStart: 9, href: 'chiller-temperature-monitoring.html' },
        { docCode: 'REC 7.9.2', title: 'Daily Incubator Temperature Check', recordKey: 'incubator-temperature-check', docRevisionStart: 6, href: 'incubator-temperature-check.html' },
        { docCode: 'REC 7.9.3.1', title: 'Dry Room Temp & Humidity Log', recordKey: 'dry-room-temp-humidity-log', docRevisionStart: 6, href: 'dry-room-temp-humidity-log.html' },
        { docCode: 'REC 7.9.3.2', title: 'Grading Room Temp & Humidity Log', recordKey: 'grading-room-temp-humidity-log', docRevisionStart: 1, href: 'grading-room-temp-humidity-log.html' },
        { docCode: 'REC 7.10.2', title: 'pH Verification', recordKey: 'ph-verification', docRevisionStart: 8, href: 'ph-verification.html' },
        { docCode: 'REC 7.10.3', title: 'Thermometer Verification', recordKey: 'thermometer-verification', docRevisionStart: 5, href: 'thermometer-verification.html' },
        { docCode: 'REC 7.10.4', title: 'Thermometer Correction Factors', recordKey: 'thermometer-correction-factors', docRevisionStart: 1, href: 'thermometer-correction-factors.html' },
        { docCode: 'REC 7.8.9', title: 'Water Monitoring', recordKey: 'water-monitoring', docRevisionStart: 1, href: 'water-monitoring.html' }
      ]
    },
    {
      title: 'Live Intake & Handling (7.1.x)',
      records: [
        { docCode: 'REC 7.1.2', title: 'Abalone Receiving', recordKey: 'abalone-receiving', docRevisionStart: 1, href: 'abalone-receiving.html' },
        { docCode: 'REC 7.1.0', title: 'Daily Weight Sampling', recordKey: 'daily-weight-sampling', docRevisionStart: 1, href: 'daily-weight-sampling.html' },
        { docCode: 'REC 1', title: 'Gonad Inspection Report', recordKey: 'gonad-inspection-report', docRevisionStart: 1, href: 'gonad-inspection-report.html' },
        { docCode: 'REC 7.1.00', title: 'Fixed Reader Checks', recordKey: 'fixed-reader-checks', docRevisionStart: 1, href: 'fixed-reader-checks.html' },
        { docCode: 'REC 7.1.1', title: 'Basket Removal, Shucking & Gutting', recordKey: 'basket-removal-shucking-gutting', docRevisionStart: 1, href: 'basket-removal-shucking-gutting.html' },
        { docCode: 'REC 7.1.3.1', title: 'Bleeding and Salting', recordKey: 'bleeding-and-salting', docRevisionStart: 6, href: 'bleeding-and-salting.html' },
        { docCode: 'REC 7.1.3', title: 'Salting and Tumbling', recordKey: 'salting-and-tumbling', docRevisionStart: 9, href: 'salting-and-tumbling.html' },
        { docCode: 'REC 7.1.5', title: 'Salting (OOSW)', recordKey: 'salting-oosw', docRevisionStart: 1, href: 'salting-oosw.html' },
        { docCode: 'REC 7.1.4', title: 'Washing Control Sheet', recordKey: 'washing-control-sheet', docRevisionStart: 9, href: 'washing-control-sheet.html' },
        { docCode: 'REC 7.1.6', title: 'Scrubbing Check - Supervisor', recordKey: 'scrubbing-check-supervisor', docRevisionStart: 5, href: 'scrubbing-check-supervisor.html' },
        { docCode: 'REC 7.1', title: 'Incubator Cans Log', recordKey: 'incubator-cans-log', docRevisionStart: 1, href: 'incubator-cans-log.html' },
        { docCode: 'REC 01', title: 'Cans Released Form (Awaiting NRCS Releases)', recordKey: 'cans-released-form', docRevisionStart: 1, href: 'cans-released-form.html' }
      ]
    }
  ];

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  async function render() {
    const container = document.getElementById('sections');
    let html = '';
    for (const section of SECTIONS) {
      html += `<div class="mri-section"><h2>${esc(section.title)}</h2>
        <table class="mri-table"><thead><tr><th>Doc code</th><th>Title</th><th>Current revision</th></tr></thead><tbody>`;
      for (const r of section.records) {
        const rev = await DocumentRevision.getCurrent(r.recordKey, r.docRevisionStart);
        html += `<tr><td>${esc(r.docCode)}</td><td><a href="${esc(r.href)}" target="_blank">${esc(r.title)}</a></td><td class="rev">Rev ${rev}</td></tr>`;
      }
      html += `</tbody></table></div>`;
    }
    container.innerHTML = html;
  }
  render();
})();
</script>
</body>
</html>
