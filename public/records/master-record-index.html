  table.records-table th,table.records-table td{ border-bottom:1px solid #e2e4e3; padding:10px 12px; text-align:left; font-size:12px; }
  table.records-table th{ background:#fbfbfa; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:#5c6771; font-weight:700; padding:10px 12px; }
  table.records-table td.doc-code{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:#2f4356; white-space:nowrap; }

  table.records-table td.title a:hover{ text-decoration:underline; }
  table.records-table td.revision{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:#2f4356; }
  table.records-table tbody tr:hover{ background:#f9fafb; }
  table.records-table tbody tr.hidden{ display:none; }
  .no-results{ text-align:center; color:#6b7280; padding:40px 20px; }
  .back-link{ display:inline-block; margin-top:16px; color:#1d4ed8; text-decoration:none; font-size:0.9rem; }
  .back-link:hover{ text-decoration:underline; }
  .search-hint{ font-size:11px; color:#9ca3af; margin-top:8px; }
  .info-bar{ background:#eff6ff; border-left:4px solid #3b82f6; padding:12px 16px; border-radius:4px; margin-bottom:16px; font-size:12px; color:#1e40af; }

  /* The three-column index is narrow enough to stay a table on a phone; only
     the doc-code column needs to stop forcing the page wide. */
  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:6px; }
  @media (max-width:768px){
    .header{ padding:12px 14px; }
    .header h1{ font-size:16px; }
    .container{ padding:14px; }
    .search-box{ padding:12px; margin-bottom:14px; }

    table.records-table th,table.records-table td{ padding:8px; font-size:12px; }
    table.records-table td.doc-code{ white-space:normal; }
  }
  @media (max-width:480px){
    .container{ padding:10px; }

</style>

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  const searchInput = document.getElementById('searchInput');
  const tableBody = document.getElementById('tableBody');
  const totalCount = document.getElementById('totalCount');
  const resultCount = document.getElementById('resultCount');
  const noResults = document.getElementById('noResults');

  totalCount.textContent = RECORDS.length;

  function render() {
    let html = '';
    for (const r of RECORDS) {
      html += `<tr><td class="doc-code">${esc(r.docCode)}</td><td class="title"><a href="${esc(r.href)}" target="_blank">${esc(r.title)}</a></td><td class="revision">Rev ${r.docRevisionStart}</td></tr>`;
    }
    tableBody.innerHTML = html;
    filterRecords();
  }

  function filterRecords() {
    const query = searchInput.value.toLowerCase();
    const rows = tableBody.querySelectorAll('tr');
    let shown = 0;
    rows.forEach(row => {
      const docCode = row.cells[0].textContent.toLowerCase();
      const title = row.cells[1].textContent.toLowerCase();
      if (docCode.includes(query) || title.includes(query)) {
        row.classList.remove('hidden');
        shown++;
      } else {
        row.classList.add('hidden');
      }
    });
    resultCount.textContent = shown;
    noResults.style.display = shown === 0 ? 'block' : 'none';
  }

  searchInput.addEventListener('input', filterRecords);

  // Ensure authentication before showing records
  (async function() {
    if (window.LoginUI && window.Auth && !window.Auth.isAuthenticated()) {
      await window.LoginUI.ensureAuthenticated();
    }
    render();
  })();
})();
