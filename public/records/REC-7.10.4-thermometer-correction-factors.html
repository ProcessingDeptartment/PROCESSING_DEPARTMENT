<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.10.4 Thermometer Correction Factors</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="mlRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/spec-registry.js?v=2"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/monitoring-log.js?v=3"></script>
<script>
(function () {
  function num(v) { const n = parseFloat(v); return (v === '' || v == null || isNaN(n)) ? null : n; }

  MonitoringLog.init({
    mount: '#mlRoot',
    recordKey: 'thermometer-correction-factors',
    docCode: 'REC 7.10.4',
    title: 'Thermometer Correction Factors',
    docRevisionStart: 2,
    instructions: [
      { label: 'Verify thermometer accuracy', text: 'Verification must be done using a standard reference thermometer or master thermometer calibrated by a SANAS accredited authority.' },
      { label: 'How to establish correction factors', text: 'Place the probes in one container filled with water and allow the thermometer to read for 2 minutes, then record the findings.' },
      { label: 'Tolerance', text: 'Readings should not exceed a difference of 0.5°C. If exceeded, report the thermometer and add the correction factor.' },
      { label: 'Frequency', text: 'Weekly.' }
    ],
    entryFields: [
      { key: 'month', label: 'Month', type: 'month' },
      { key: 'date', label: 'Date', type: 'date', required: true },
      { key: 'referenceThermoSerial', label: 'Reference thermometer serial/internal number', type: 'text' },
      { key: 'referenceReading', label: 'Reference thermometer reading', type: 'number', unit: '°C' },
      { key: 'testThermoSerial', label: 'Test thermometer serial/internal number', type: 'text' },
      { key: 'testReading', label: 'Test thermometer reading', type: 'number', unit: '°C' },
      {
        key: 'difference', label: 'Difference / correction factor', type: 'computed', unit: '°C', specKey: 'diffTolerance',
        compute: (v) => {
          const r = num(v.referenceReading), t = num(v.testReading);
          return (r === null || t === null) ? '' : Math.round((t - r) * 100) / 100;
        }
      },
      { key: 'correctionUsed', label: 'Correction factor to be used?', type: 'yesno' },
      { key: 'checkedBy', label: 'Checked by', type: 'text', required: true }
    ],
    specFields: [
      { key: 'diffTolerance', label: 'Reference vs test difference', unit: '°C', min: -0.5, max: 0.5 }
    ],
    deviationLabel: 'Within tolerance',
    deviationPolarity: 'accurate'
  });
})();
</script>
</body>
</html>
