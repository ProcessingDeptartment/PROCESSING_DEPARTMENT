<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.2.8 Stock Transfers</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
<style>
  :root{
    --ink:var(--palette-ink); --steel:var(--palette-heading); --steel-dk:var(--palette-dark); --paper:var(--palette-paper);
    --line:#c9cdd1; --line-soft:var(--palette-border); --ok:var(--palette-ok); --ok-bg:var(--palette-ok-bg);
    --warn:#b8791c; --warn-bg:#fbf0dc; --fail:var(--palette-fail); --fail-bg:var(--palette-fail-bg);
    --accent:var(--palette-primary); --mono: 'IBM Plex Mono','SF Mono',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  #st-root{ font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:var(--form-fs-root); line-height:1.4; }
  #st-root *{ box-sizing:border-box; }
  #st-root h1,#st-root h2,#st-root h3{ margin:0; font-weight:700; }
  #st-root input, #st-root select, #st-root textarea{
    font-family:var(--mono); font-size:var(--form-fs-input); border:1px solid var(--line); border-radius:3px;
    padding:4px 6px; background:#fff; color:var(--ink); width:100%;
  }
  #st-root input:focus, #st-root select:focus, #st-root textarea:focus{ outline:2px solid var(--steel); outline-offset:-1px; }
  #st-root button{ font-family:var(--sans); cursor:pointer; border:none; border-radius:3px; font-weight:600; }
  .dc-top{ background:var(--steel-dk); color:var(--palette-dark-text); padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .dc-topline{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .dc-topline input{ width:120px; padding:3px 5px; font-size:var(--form-fs-small); }
  .btn{ padding:5px 11px; font-size:var(--form-fs-button); }
  .btn-primary{ background:var(--accent); color:var(--palette-primary-text); }
  .btn-primary:hover{ background:var(--palette-primary-hover); }
  .btn-ghost{ background:transparent; color:var(--palette-dark-text); border:1px solid #55636e !important; }
  .btn-ghost:hover{ background:#33444f; }
  .btn-flat{ background:var(--line-soft); color:var(--ink); }
  .btn-flat:hover{ background:#d5d8d6; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .dc-body{ padding:12px 14px 40px; max-width:900px; margin:0 auto; }
  .panel{ background:#fff; border:1px solid var(--line-soft); border-radius:5px; margin-bottom:10px; }
  .panel-head{ padding:7px 11px; border-bottom:1px solid var(--line-soft); background:var(--palette-head-bg); border-radius:5px 5px 0 0; }
  .panel-head h2{ font-size:var(--form-fs-panel-head); text-transform:uppercase; letter-spacing:.05em; color:var(--steel); margin:0; }
  .panel-body{ padding:11px; }

  .grid{ display:grid; gap:8px; }
  .grid-6{ grid-template-columns:repeat(6,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  label.field{ display:flex; flex-direction:column; gap:2px; font-size:var(--form-fs-label); color:var(--palette-label); font-weight:600; }
  label.field input, label.field select{ font-size:var(--form-fs-button); padding:3px 5px; }

  .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .status-line{ font-size:10px; color:#8a939b; font-family:var(--mono); margin-right:auto; }
  .record-status{ font-size:10px; color:var(--palette-label); font-weight:600; padding:4px 8px; background:var(--palette-border); border-radius:3px; }
  .muted{ color:#8a939b; }
  .toast{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--steel-dk); color:#fff; padding:8px 16px; border-radius:20px; font-size:var(--form-fs-small); z-index:999; opacity:0; pointer-events:none; transition:opacity .25s; }
  .toast.show{ opacity:1; }

  @media (max-width:900px){
    .grid-6{grid-template-columns:repeat(3,1fr);}
    .grid-4{grid-template-columns:repeat(2,1fr);}
  }
</style>
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="st-root">
  <div class="dc-top">
    <div class="doc-line"><span class="doc-code">REC 7.2.16</span><h1>Stock Transfers</h1><span class="doc-rev">Rev 1 &middot; Rev date not set</span></div>
    <div class="dc-topline no-print"><button class="btn btn-flat" id="saveDraftBtn">Save</button>
      <button class="btn btn-primary" id="submitBtn">Submit</button>
    </div>
  </div>

  <div class="dc-body">
    <div class="panel">
      <div class="panel-head"><h2>Transfer Info</h2></div>
      <div class="panel-body">
        <div class="grid grid-4">
          <label class="field">Date<input id="h_date" type="date"></label>
          <label class="field">AG<input id="h_agCode" placeholder="AG Code"></label>
          <label class="field">Job no.<input id="h_jobNo" placeholder="Job number"></label>
          <label class="field">Quality sign off<input id="h_qualitySignOff" placeholder="Name"></label>
        </div>
        <div class="grid grid-4" style="margin-top:8px;">
          <label class="field">Number of boxes<input id="h_numberOfBoxes" type="number"></label>
          <label class="field">Pieces<input id="h_pieces" type="number"></label>
          <label class="field">Drained weight (g)<input id="h_drainedWeight" type="number"></label>
          <label class="field">Sauce type<input id="h_sauceType" placeholder="Type"></label>
        </div>
        <div class="grid grid-2" style="margin-top:8px;">
          <label class="field">Order designation<input id="h_orderDesignation" placeholder="Designation"></label>
          <label class="field">Number of cans<input id="h_numberOfCans" type="number"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Quality Control</h2></div>
      <div class="panel-body">
        <div class="grid grid-1">
          <label class="field">QC verification<input id="h_qcVerification" placeholder="QC Name"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Verification Sign-offs</h2></div>
      <div class="panel-body">
        <div class="grid grid-2">
          <label class="field">FG02 verification<input id="h_fg02Verification" placeholder="Name"></label>
          <label class="field">FG01 verification<input id="h_fg01Verification" placeholder="Name"></label>
        </div>
      </div>
    </div>

    <div class="actions no-print">
      <span class="record-status" id="recordStatus"></span>
      <span class="status-line" id="statusLine"></span>
      <button class="btn btn-flat" id="exportBtn">Export JSON</button>
      <button class="btn btn-flat" id="generatePdfBtn">Print PDF</button>
    </div>

    <div class="panel no-print">
      <div class="panel-head"><h2>Verification</h2></div>
      <div class="panel-body">
        <div class="muted" style="margin-bottom:6px; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;">Entries to verify</div>
        <div id="verifySelect" style="margin-bottom:10px;"></div>
        <div class="grid grid-3" style="margin-bottom:8px;">
          <label class="field">Verified by<input id="v_verifiedBy"></label>
          <label class="field">Signature (type name to sign)<input id="v_verifiedSig"></label>
          <label class="field">Date<input id="v_verifiedDate" type="date"></label>
        </div>
        <div class="actions no-print" style="justify-content:flex-start; margin-top:0;">
          <button class="btn btn-primary" id="logVerificationBtn">Log verification</button>
        </div>
        <div class="muted" style="margin:10px 0 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;">Verification history</div>
        <div id="verificationHistory"></div>
      </div>
    </div>
  </div>

  <div class="toast no-print" id="toast"></div>
</div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script>
/* Controlled-copy title block, repeated on every printed page.
 * docCode/recordKey are also what tools/build-master-index-data.py keys this page
 * to in the Master Index. Without them the build falls back to the file name, which
 * silently re-keys the record and orphans its stored revision history.
 * The paper revision is deliberately not stated here -- mountPrintHeader takes it
 * from the record's index row, so the issued index stays the single source. */
window.RecordDoc = { docCode: 'REC 7.2.16', recordKey: 'stock-transfers' };
document.addEventListener('DOMContentLoaded', function () {
  if (!window.DocHeader) return;
  window.DocHeader.mountPrintHeader({ recordKey: window.RecordDoc.recordKey })
    .catch(function (e) { console.error('title block failed to mount', e); });
});
</script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script>
(async function(){
  const $ = id => document.getElementById(id);

  function newRecord(){
    return {
      id: null, revision: 1, status:'draft',
      date:'', agCode:'', jobNo:'', qualitySignOff:'', numberOfBoxes:'', pieces:'',
      drainedWeight:'', sauceType:'', orderDesignation:'', numberOfCans:'', qcVerification:'',
      fg02Verification:'', fg01Verification:'',
      createdAt: null, updatedAt: null
    };
  }

  let state = newRecord();
function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  }
  function safeKey(s){ return String(s).trim().replace(/[\s\/\\'"]+/g,'_'); }

  async function storeGet(key, shared){
    try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function storeSet(key, value, shared){
    try{ await window.storage.set(key, value, shared); return true; }
    catch(e){ return false; }
  }

  function renderForm(){
    $('h_date').value = state.date;
    $('h_agCode').value = state.agCode;
    $('h_jobNo').value = state.jobNo;
    $('h_qualitySignOff').value = state.qualitySignOff;
    $('h_numberOfBoxes').value = state.numberOfBoxes;
    $('h_pieces').value = state.pieces;
    $('h_drainedWeight').value = state.drainedWeight;
    $('h_sauceType').value = state.sauceType;
    $('h_orderDesignation').value = state.orderDesignation;
    $('h_numberOfCans').value = state.numberOfCans;
    $('h_qcVerification').value = state.qcVerification;
    $('h_fg02Verification').value = state.fg02Verification;
    $('h_fg01Verification').value = state.fg01Verification;
  }

  function bindInputs(){
    const fields = ['date','agCode','jobNo','qualitySignOff','numberOfBoxes','pieces','drainedWeight','sauceType','orderDesignation','numberOfCans','qcVerification','fg02Verification','fg01Verification'];
    fields.forEach(f=>{
      const id = 'h_'+f;
      const el = $(id);
      if(el) el.addEventListener('input', ()=>{ state[f] = el.value; });
    });
  }

  function updateRecordStatus(){
    const jobStr = state.jobNo ? `Job ${state.jobNo}` : 'No job';
    const submitted = state.status === 'submitted';
    $('recordStatus').textContent = `${submitted ? '✓ Submitted' : 'Draft'} · ${jobStr} · ${state.id ? 'ID: ' + state.id.slice(-8) : 'Unsaved'}`;
  }

  function renderAll(){
    renderForm();
    updateRecordStatus();
    $('statusLine').textContent = state.updatedAt ? `Last saved ${new Date(state.updatedAt).toLocaleString()}` : 'Not yet saved';
  }

  async function saveRecord(finalize){
    const now = Date.now();
    if(!state.id){
      const jobId = state.jobNo ? state.jobNo : 'NOJOB';
      state.id = `stock_transfers_${safeKey(jobId)}_${now}`;
      state.createdAt = now;
    }
    state.updatedAt = now;
    state.status = finalize ? 'submitted' : 'draft';

    const ok = await storeSet('record:'+state.id, JSON.stringify(state), true);
    if(!ok){ toast('Save failed.'); return; }
    toast(finalize ? 'Submitted for verification.' : 'Draft saved.');
    renderAll();
  }

  function generatePdf(){
    const jobStr = state.jobNo ? state.jobNo : 'record';
    document.title = `REC_7.2.8_STOCK_TRANSFERS_${safeKey(jobStr)}_${state.date||''}`;
    window.print();
  }


  function _vEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function pendingVerification(){
    return (state.status === 'submitted' && !state.verification) ? [state] : [];
  }

  function renderVerifySelect(){
    const target = $('verifySelect');
    if(!target) return;
    const pending = pendingVerification();
    if(!pending.length){
      target.innerHTML = '<div class="muted" style="font-size:11px;">No submitted entries are waiting to be verified.</div>';
      return;
    }
    target.innerHTML = pending.map(function(s){
      return '<div style="font-size:11px;padding:4px 0;">' + _vEsc(s.id || '(unsaved)') +
        (s.updatedAt ? ' &middot; saved ' + new Date(s.updatedAt).toLocaleString() : '') + '</div>';
    }).join('');
  }

  async function renderVerificationHistory(){
    const raw = await storeGet('verification_log:' + window.RecordDoc.recordKey, true);
    let hist = [];
    try{ hist = raw ? JSON.parse(raw) : []; }catch(e){ hist = []; }
    renderVerifySelect();
    const target = $('verificationHistory');
    if(!target) return;
    if(!hist.length){ target.innerHTML = '<div class="muted" style="font-size:11px;">No verification logged yet.</div>'; return; }
    target.innerHTML = hist.slice().reverse().map(function(v){
      return '<div style="font-size:11px;padding:4px 0;border-top:1px solid var(--line-soft);">' +
        _vEsc(v.verifiedDate || '(no date)') + ' &middot; ' + _vEsc(v.verifiedBy) +
        ' <span class="muted">(signed: ' + _vEsc(v.verifiedSig) + ')</span></div>';
    }).join('');
  }

  async function logVerification(){
    const verifiedBy = $('v_verifiedBy').value.trim();
    const verifiedSig = $('v_verifiedSig').value.trim();
    const verifiedDate = $('v_verifiedDate').value;
    if(!verifiedBy || !verifiedSig || !verifiedDate){ toast('Verified by, signature and date are all required.'); return; }
    const record = { verifiedBy: verifiedBy, verifiedSig: verifiedSig, verifiedDate: verifiedDate, loggedAt: Date.now() };
    const pending = pendingVerification();
    if(pending.length){
      state.verification = record;
      await storeSet('record:'+state.id, JSON.stringify(state), true);
    }
    const raw = await storeGet('verification_log:' + window.RecordDoc.recordKey, true);
    let hist = [];
    try{ hist = raw ? JSON.parse(raw) : []; }catch(e){ hist = []; }
    hist.push(Object.assign({ entryId: pending.length ? state.id : null }, record));
    await storeSet('verification_log:' + window.RecordDoc.recordKey, JSON.stringify(hist), true);
    toast('Verification logged.');
    $('v_verifiedBy').value=''; $('v_verifiedSig').value=''; $('v_verifiedDate').value='';
    renderAll();
    renderVerificationHistory();
  }

function wire(){
$('logVerificationBtn').addEventListener('click', logVerification);
bindInputs();
    $('saveDraftBtn').addEventListener('click', ()=>saveRecord(false));
    $('submitBtn').addEventListener('click', ()=>saveRecord(true));
    $('exportBtn').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const jobStr = state.jobNo ? state.jobNo : 'stock_transfers_draft';
      a.download = `stock_transfers_${safeKey(jobStr)}.json`;
      a.click();
    });
    $('generatePdfBtn').addEventListener('click', generatePdf);
  }

  wire();
  renderAll();
  renderVerificationHistory();
})();
</script>
</body>
</html>
