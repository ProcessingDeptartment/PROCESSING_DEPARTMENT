<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.2.8 Stock Transfers</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
<style>
  :root{
    --ink:var(--palette-ink); --steel:var(--palette-primary); --steel-dk:var(--palette-dark); --paper:var(--palette-paper);
    --line:var(--palette-border); --line-soft:var(--palette-head-bg); --ok:var(--palette-ok); --ok-bg:var(--palette-ok-bg);
    --warn:#b8791c; --warn-bg:#fbf0dc; --fail:var(--palette-fail); --fail-bg:var(--palette-fail-bg);
    --accent:var(--palette-primary); --mono: 'IBM Plex Mono','SF Mono',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  #st-root{ font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:13px; line-height:1.4; }
  #st-root *{ box-sizing:border-box; }
  #st-root h1,#st-root h2,#st-root h3{ margin:0; font-weight:700; }
  #st-root input, #st-root select, #st-root textarea{
    font-family:var(--mono); font-size:12.5px; border:1px solid var(--line); border-radius:3px;
    padding:4px 6px; background:#fff; color:var(--ink); width:100%;
  }
  #st-root input:focus, #st-root select:focus, #st-root textarea:focus{ outline:2px solid var(--steel); outline-offset:-1px; }
  #st-root button{ font-family:var(--sans); cursor:pointer; border:none; border-radius:3px; font-weight:600; }
  .dc-top{ background:var(--steel-dk); color:#f4f1e8; padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .btn{ padding:5px 11px; font-size:11.5px; }
  .btn-primary{ background:var(--accent); color:#241a0a; }
  .btn-primary:hover{ background:#dd9536; }
  .btn-ghost{ background:transparent; color:#f4f1e8; border:1px solid #55636e !important; }
  .btn-ghost:hover{ background:#33444f; }
  .btn-flat{ background:var(--line-soft); color:var(--ink); }
  .btn-flat:hover{ background:#d5d8d6; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .dc-body{ padding:12px 14px 40px; max-width:900px; margin:0 auto; }
  .panel{ background:#fff; border:1px solid var(--line-soft); border-radius:5px; margin-bottom:10px; }
  .panel-head{ padding:7px 11px; border-bottom:1px solid var(--line-soft); background:#fbfbfa; border-radius:5px 5px 0 0; }
  .panel-head h2{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--steel); margin:0; }
  .panel-body{ padding:11px; }

  .grid{ display:grid; gap:8px; }
  .grid-6{ grid-template-columns:repeat(6,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  label.field{ display:flex; flex-direction:column; gap:2px; font-size:10.5px; color:#54606b; font-weight:600; }
  label.field input, label.field select{ font-size:11.5px; padding:3px 5px; }

  .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .status-line{ font-size:10px; color:#8a939b; font-family:var(--mono); margin-right:auto; }
  .record-status{ font-size:10px; color:#54606b; font-weight:600; padding:4px 8px; background:#e2e4e3; border-radius:3px; }
  .muted{ color:#8a939b; }
  .toast{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--steel-dk); color:#fff; padding:8px 16px; border-radius:20px; font-size:11px; z-index:999; opacity:0; pointer-events:none; transition:opacity .25s; }
  .toast.show{ opacity:1; }

  @media (max-width:900px){
    .grid-6{grid-template-columns:repeat(3,1fr);}
    .grid-4{grid-template-columns:repeat(2,1fr);}
  }
</style>
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="st-root">
  <div class="dc-top">
    <div class="doc-line"><span class="doc-code">REC 7.2.16</span><h1>Stock Transfers</h1><span class="doc-rev">Rev 1 &middot; Rev date not set</span></div>
  </div>

  <div class="dc-body">
    <div class="panel">
      <div class="panel-head"><h2>Transfer Info</h2></div>
      <div class="panel-body">
        <div class="grid grid-4">
          <label class="field">Date<input id="h_date" type="date"></label>
          <label class="field">AG<input id="h_agCode" placeholder="AG Code"></label>
          <label class="field">Job no.<input id="h_jobNo" placeholder="Job number"></label>
          <label class="field">Quality sign off<input id="h_qualitySignOff" placeholder="Name"></label>
        </div>
        <div class="grid grid-4" style="margin-top:8px;">
          <label class="field">Number of boxes<input id="h_numberOfBoxes" type="number"></label>
          <label class="field">Pieces<input id="h_pieces" type="number"></label>
          <label class="field">Drained weight (g)<input id="h_drainedWeight" type="number"></label>
          <label class="field">Sauce type<input id="h_sauceType" placeholder="Type"></label>
        </div>
        <div class="grid grid-2" style="margin-top:8px;">
          <label class="field">Order designation<input id="h_orderDesignation" placeholder="Designation"></label>
          <label class="field">Number of cans<input id="h_numberOfCans" type="number"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Quality Control</h2></div>
      <div class="panel-body">
        <div class="grid grid-1">
          <label class="field">QC verification<input id="h_qcVerification" placeholder="QC Name"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Verification Sign-offs</h2></div>
      <div class="panel-body">
        <div class="grid grid-2">
          <label class="field">FG02 verification<input id="h_fg02Verification" placeholder="Name"></label>
          <label class="field">FG01 verification<input id="h_fg01Verification" placeholder="Name"></label>
        </div>
      </div>
    </div>

    <div class="actions no-print">
      <span class="record-status" id="recordStatus"></span>
      <span class="status-line" id="statusLine"></span>
      <button class="btn btn-flat" id="exportBtn">Export JSON</button>
      <button class="btn btn-flat" id="generatePdfBtn">Print PDF</button>
      <button class="btn btn-flat" id="saveDraftBtn">Save</button>
      <button class="btn btn-primary" id="submitBtn">Submit</button>
    </div>
  </div>

  <div class="toast no-print" id="toast"></div>
</div>

<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script>
(async function(){
  const $ = id => document.getElementById(id);

  if (window.LoginUI && window.Auth && !window.Auth.isAuthenticated()) {
    await window.LoginUI.ensureAuthenticated();
  }

  function newRecord(){
    return {
      id: null, revision: 1, status:'draft',
      date:'', agCode:'', jobNo:'', qualitySignOff:'', numberOfBoxes:'', pieces:'',
      drainedWeight:'', sauceType:'', orderDesignation:'', numberOfCans:'', qcVerification:'',
      fg02Verification:'', fg01Verification:'',
      createdAt: null, updatedAt: null
    };
  }

  let state = newRecord();

  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  }
  function safeKey(s){ return String(s).trim().replace(/[\s\/\\'"]+/g,'_'); }

  async function storeGet(key, shared){
    try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function storeSet(key, value, shared){
    try{ await window.storage.set(key, value, shared); return true; }
    catch(e){ return false; }
  }

  function renderForm(){
    $('h_date').value = state.date;
    $('h_agCode').value = state.agCode;
    $('h_jobNo').value = state.jobNo;
    $('h_qualitySignOff').value = state.qualitySignOff;
    $('h_numberOfBoxes').value = state.numberOfBoxes;
    $('h_pieces').value = state.pieces;
    $('h_drainedWeight').value = state.drainedWeight;
    $('h_sauceType').value = state.sauceType;
    $('h_orderDesignation').value = state.orderDesignation;
    $('h_numberOfCans').value = state.numberOfCans;
    $('h_qcVerification').value = state.qcVerification;
    $('h_fg02Verification').value = state.fg02Verification;
    $('h_fg01Verification').value = state.fg01Verification;
  }

  function bindInputs(){
    const fields = ['date','agCode','jobNo','qualitySignOff','numberOfBoxes','pieces','drainedWeight','sauceType','orderDesignation','numberOfCans','qcVerification','fg02Verification','fg01Verification'];
    fields.forEach(f=>{
      const id = 'h_'+f;
      const el = $(id);
      if(el) el.addEventListener('input', ()=>{ state[f] = el.value; });
    });
  }

  function updateRecordStatus(){
    const jobStr = state.jobNo ? `Job ${state.jobNo}` : 'No job';
    const submitted = state.status === 'submitted';
    $('recordStatus').textContent = `${submitted ? 'âœ“ Submitted' : 'Draft'} Â· ${jobStr} Â· ${state.id ? 'ID: ' + state.id.slice(-8) : 'Unsaved'}`;
  }

  function renderAll(){
    renderForm();
    updateRecordStatus();
    $('statusLine').textContent = state.updatedAt ? `Last saved ${new Date(state.updatedAt).toLocaleString()}` : 'Not yet saved';
  }

  async function saveRecord(finalize){
    const now = Date.now();
    if(!state.id){
      const jobId = state.jobNo ? state.jobNo : 'NOJOB';
      state.id = `stock_transfers_${safeKey(jobId)}_${now}`;
      state.createdAt = now;
    }
    state.updatedAt = now;
    state.status = finalize ? 'submitted' : 'draft';

    const ok = await storeSet('record:'+state.id, JSON.stringify(state), true);
    if(!ok){ toast('Save failed.'); return; }
    toast(finalize ? 'Submitted for verification.' : 'Draft saved.');
    renderAll();
  }

  function generatePdf(){
    const jobStr = state.jobNo ? state.jobNo : 'record';
    document.title = `REC_7.2.8_STOCK_TRANSFERS_${safeKey(jobStr)}_${state.date||''}`;
    window.print();
  }

  function wire(){
    bindInputs();
    $('saveDraftBtn').addEventListener('click', ()=>saveRecord(false));
    $('submitBtn').addEventListener('click', ()=>saveRecord(true));
    $('exportBtn').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const jobStr = state.jobNo ? state.jobNo : 'stock_transfers_draft';
      a.download = `stock_transfers_${safeKey(jobStr)}.json`;
      a.click();
    });
    $('generatePdfBtn').addEventListener('click', generatePdf);
  }

  wire();
  renderAll();
})();
</script>
</body>
</html>
