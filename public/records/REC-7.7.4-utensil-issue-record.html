<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.7.4 Utensil Issue Record</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/form-record.js?v=19"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'utensil-issue-record',
    docCode: 'REC 7.7.4',
    title: 'Utensil Issue Record',
    docRevisionStart: 6,
    listColumns: ['date', 'shift', 'checkedBy'],
    instructions: [
      { label: 'Work instruction', text: 'Knives remove gut & beak; scrapers remove flesh from shell (shucking); scrubbing brushes scrub abalone; needles for stringing dry, scissors for destringing dry. Record quantity issued. Condition: ✓ = good condition, X = faulty/damaged. Faulty/damaged utensils returned to supervisor and discarded, with type & number recorded. Utensils go into Dynacide solution when not in use.' }
    ],
    sections: [
      { title: 'Shift details', fields: [
        { key: 'date', label: 'Date', type: 'date', required: true },
        { key: 'shift', label: 'Shift', type: 'select', options: ['Day', 'Night'] }
      ]},
      { title: 'Sign-off', fields: [
        { key: 'correctiveActionComment', label: 'Corrective action / comment', type: 'textarea' },
        { key: 'checkedBy', label: 'Checked by', type: 'text', required: true },
        { key: 'verifiedBy', label: 'Verified by', type: 'text' }
      ]}
    ],
    roster: {
      title: 'Utensils issued — Scrapers, Scrub brushes, Needles, Scissors, Holding cups, String roll',
      columns: [
        { key: 'utensilType', label: 'Utensil type', type: 'text' },
        { key: 'qtyIssued', label: 'Qty issued', type: 'number' },
        { key: 'conditionBefore', label: 'Condition before (✓/X)', type: 'select', options: ['✓', 'X'] },
        { key: 'qtyReturned', label: 'Qty returned', type: 'number' },
        { key: 'conditionAfter', label: 'Condition after (✓/X)', type: 'select', options: ['✓', 'X'] },
        { key: 'unsatisfactoryDetail', label: 'Utensil type & number if unsatisfactory', type: 'text' }
      ]
    }
  });
})();
</script>
</body>
</html>
