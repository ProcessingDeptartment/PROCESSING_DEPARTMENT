<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.1.5 Salting (OOSW)</title>
<style>
  :root{
    --ink:#1b2330; --steel:#2f4356; --steel-dk:#1d2b38; --paper:#f4f5f3;
    --line:#c9cdd1; --line-soft:#e2e4e3; --ok:#2f7a52; --ok-bg:#e8f3ec;
    --warn:#b8791c; --warn-bg:#fbf0dc; --fail:#a3352d; --fail-bg:#fbe8e6;
    --accent:#c9832b; --mono: 'IBM Plex Mono','SF Mono',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  #so-root{ font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:13px; line-height:1.4; }
  #so-root *{ box-sizing:border-box; }
  #so-root h1,#so-root h2,#so-root h3{ margin:0; font-weight:700; }
  #so-root input, #so-root select, #so-root textarea{
    font-family:var(--mono); font-size:12.5px; border:1px solid var(--line); border-radius:3px;
    padding:4px 6px; background:#fff; color:var(--ink); width:100%;
  }
  #so-root input:focus, #so-root select:focus, #so-root textarea:focus{ outline:2px solid var(--steel); outline-offset:-1px; }
  #so-root button{ font-family:var(--sans); cursor:pointer; border:none; border-radius:3px; font-weight:600; }
  .so-top{ background:var(--steel-dk); color:#f4f1e8; padding:12px 16px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .so-top .doc-code{ font-family:var(--mono); font-size:10px; color:#b9c3cc; letter-spacing:.03em; }
  .so-top h1{ font-size:15px; letter-spacing:.01em; margin:0; }
  .so-topline{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .so-topline label.role-label{ font-size:9.5px; color:#b9c3cc; display:flex; flex-direction:column; gap:2px; }
  .so-topline input{ width:120px; padding:3px 5px; font-size:11px; }
  .btn{ padding:5px 11px; font-size:11.5px; }
  .btn-primary{ background:var(--accent); color:#241a0a; }
  .btn-primary:hover{ background:#dd9536; }
  .btn-ghost{ background:transparent; color:#f4f1e8; border:1px solid #55636e !important; }
  .btn-ghost:hover{ background:#33444f; }
  .btn-flat{ background:var(--line-soft); color:var(--ink); }
  .btn-flat:hover{ background:#d5d8d6; }
  .btn-sm{ padding:3px 8px; font-size:10px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .so-body{ padding:12px 14px 40px; max-width:900px; margin:0 auto; }
  .panel{ background:#fff; border:1px solid var(--line-soft); border-radius:5px; margin-bottom:10px; }
  .panel-head{ padding:7px 11px; border-bottom:1px solid var(--line-soft); background:#fbfbfa; border-radius:5px 5px 0 0; }
  .panel-head h2{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--steel); margin:0; }
  .panel-body{ padding:11px; }

  .grid{ display:grid; gap:8px; }
  .grid-6{ grid-template-columns:repeat(6,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  label.field{ display:flex; flex-direction:column; gap:2px; font-size:10.5px; color:#54606b; font-weight:600; }
  label.field input, label.field select{ font-size:11.5px; padding:3px 5px; }

  .job-number-row{ display:grid; grid-template-columns:100px 1fr; gap:8px; }
  .job-number-row select, .job-number-row input{ font-size:11.5px; padding:3px 5px; }

  .weight-input-section{ background:#fbfbfa; padding:20px; border-radius:4px; margin-bottom:10px; }
  .weight-input-row{ display:flex; gap:12px; align-items:center; }
  .weight-input-row input{ flex:0 0 200px; font-size:18px; padding:12px 12px; }
  .weight-input-row button{ flex:0 0 auto; padding:10px 24px; font-size:14px; font-weight:700; }

  table.weights{ width:100%; border-collapse:collapse; margin-top:8px; font-size:9.5px; }
  table.weights th, table.weights td{ border:1px solid var(--line-soft); padding:2px 4px; text-align:center; }
  table.weights th{ background:#fbfbfa; font-weight:700; color:#5c6771; text-transform:uppercase; letter-spacing:.02em; font-size:9px; }
  table.weights input{ width:100%; text-align:center; padding:1px; font-size:9px; }
  table.weights .clear-btn{ padding:1px 3px; font-size:8px; width:auto; background:#f0e0e0; color:#8a343d; }
  table.weights .clear-btn:hover{ background:#e0d0d0; }

  .summary-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:8px; background:#fbfbfa; border-radius:3px; margin-bottom:8px; }
  .summary-item{ font-size:11px; }
  .summary-item .label{ color:#54606b; font-weight:600; margin-bottom:2px; }
  .summary-item .value{ font-family:var(--mono); font-size:13px; font-weight:700; color:var(--ink); }

  .signoff-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .signoff-item{ display:flex; flex-direction:column; gap:8px; }
  .signoff-item label{ display:flex; flex-direction:column; gap:2px; }

  .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .status-line{ font-size:10px; color:#8a939b; font-family:var(--mono); margin-right:auto; }
  .record-status{ font-size:10px; color:#54606b; font-weight:600; padding:4px 8px; background:#e2e4e3; border-radius:3px; }
  .muted{ color:#8a939b; }
  .toast{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--steel-dk); color:#fff; padding:8px 16px; border-radius:20px; font-size:11px; z-index:999; opacity:0; pointer-events:none; transition:opacity .25s; }
  .toast.show{ opacity:1; }

  @media (max-width:900px){ .grid-6{grid-template-columns:repeat(3,1fr);} .grid-4{grid-template-columns:repeat(2,1fr);} .signoff-grid{grid-template-columns:1fr;} .job-number-row{grid-template-columns:80px 1fr;} }
  @media print{
    @page{ size:A4 portrait; margin:6mm; }
    body{ background:#fff; padding:0; margin:0; }
    .no-print{ display:none !important; }
    #so-root{ font-size:9px; background:#fff; }
    .so-top{ padding:4px 8px; }
    .so-top h1{ font-size:12px; }
    .so-body{ padding:6px 8px 0; }
    .panel{ margin-bottom:6px; break-inside:avoid; }
    .panel-head{ padding:4px 8px; }
    .panel-head h2{ font-size:10px; }
    .panel-body{ padding:6px; }
    label.field{ font-size:9px; gap:1px; }
    .weight-input-section{ display:none; }
    table.weights{ font-size:8px; margin-top:6px; }
    table.weights th, table.weights td{ padding:2px 3px; }
    table.weights input{ font-size:9px; padding:1px; }
    table.weights .clear-btn{ display:none; }
    .summary-row{ padding:4px; margin-bottom:4px; }
    .summary-item{ font-size:9px; }
    .summary-item .value{ font-size:11px; }
    .signoff-grid{ gap:6px; }
    .signoff-item{ gap:4px; }
    .signoff-item label{ font-size:9px; }
    .actions{ display:none; }
    .record-status{ display:none; }
  }
</style>
</head>
<body>
<div id="so-root">
  <div class="so-top">
    <div>
      <div class="doc-code">REC 7.1.5</div>
      <h1>Salting (OOSW)</h1>
    </div>
    <div class="so-topline no-print">
      <label class="role-label">Your name
        <input id="actingNameInput" placeholder="Name">
      </label>
      <button class="btn btn-ghost" id="newRecordBtn">New</button>
      <button class="btn btn-flat" id="saveDraftBtn">Save</button>
      <button class="btn btn-primary" id="submitBtn">Submit</button>
    </div>
  </div>

  <div class="so-body">

    <div class="panel">
      <div class="panel-head"><h2>Batch Info</h2></div>
      <div class="panel-body">
        <div class="grid grid-6" style="margin-bottom:8px;">
          <label class="field">Intake date<input id="h_intakeDate" type="date"></label>
          <label class="field">Harvest farm<input id="h_harvestFarm" placeholder="Farm"></label>
          <label class="field">Tracking no.<input id="h_trackingNo" placeholder="Track"></label>
          <label class="field">Processing for<select id="h_processingFor"><option value="">—</option><option value="Can">Can</option><option value="Dried">Dried</option><option value="Other">Other</option></select></label>
          <label class="field">Size range<select id="h_sizeRange"><option value="">—</option></select></label>
          <label class="field" style="grid-column:span 1;">Whole weight (kg)<input id="h_wholeWeight" type="number" step="0.01" placeholder="0.00" style="margin-top:auto;"></label>
        </div>
        <div class="grid grid-2">
          <label class="field">Job number<div class="job-number-row"><select id="h_jobPrefix"><option value="">—</option><option value="CPR">CPR</option><option value="DPR">DPR</option><option value="3CP">3CP</option><option value="3DP">3DP</option></select><input id="h_jobNumber" placeholder="Number" type="text"></div></label>
        </div>
      </div>
    </div>

    <div class="panel no-print">
      <div class="panel-head"><h2>Add Weight</h2></div>
      <div class="panel-body">
        <div class="weight-input-section">
          <div class="weight-input-row">
            <input id="newWeightInput" type="number" step="0.01" placeholder="Enter weight (kg)">
            <button class="btn btn-flat" id="addWeightBtn">+ Add weight</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Weight Measurements (kg)</h2></div>
      <div class="panel-body">
        <table class="weights" id="weightsTable">
          <thead><tr><th>Wt 1</th><th>Wt 2</th><th>Wt 3</th><th>Wt 4</th><th>Wt 5</th><th>Wt 6</th></tr></thead>
          <tbody id="weightsBody"><tr><td colspan="6" style="text-align:center; color:#8a939b; padding:6px;">No weights added yet</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Results</h2></div>
      <div class="panel-body">
        <div class="summary-row">
          <div class="summary-item">
            <div class="label">Total OOSW (kg)</div>
            <div class="value" id="totalOosw">0.00</div>
          </div>
          <div class="summary-item">
            <div class="label">OOSW %</div>
            <div class="value" id="ooswPercent">0.0</div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel no-print">
      <div class="panel-head"><h2>Comments</h2></div>
      <div class="panel-body">
        <textarea id="commentsBox" rows="2" placeholder="Notes, deviations…" style="font-size:11px;"></textarea>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Sign-off</h2></div>
      <div class="panel-body">
        <div class="signoff-grid">
          <div class="signoff-item">
            <label class="field">Operator<input id="f_operator"></label>
            <label class="field">Date<input id="f_operatorDate" type="date"></label>
          </div>
          <div class="signoff-item">
            <label class="field">Supervisor<input id="f_supervisor"></label>
            <label class="field">Date<input id="f_supervisorDate" type="date"></label>
          </div>
          <div class="signoff-item no-print">
            <label class="field">Verified by (QA)<input id="f_verifiedBy"></label>
            <label class="field">Date<input id="f_verifiedDate" type="date"></label>
          </div>
        </div>
      </div>
    </div>

    <div class="actions no-print">
      <span class="record-status" id="recordStatus"></span>
      <span class="status-line" id="statusLine"></span>
      <button class="btn btn-flat" id="exportBtn">Export JSON</button>
      <button class="btn btn-flat" id="generatePdfBtn">Print PDF</button>
    </div>
  </div>

  <div class="toast no-print" id="toast"></div>
</div>

<script src="../lib/size-ranges.js"></script>
<script src="../lib/data-store.js?v=1"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);

  function newRecord(){
    return {
      id: null, revision: 1, status:'draft',
      header:{ intakeDate:'', harvestFarm:'', trackingNo:'', processingFor:'', sizeRange:'', wholeWeight:'', jobPrefix:'', jobNumber:'' },
      weights: [],
      comments:'',
      operator:'', operatorDate:'',
      supervisor:'', supervisorDate:'',
      verifiedBy:'', verifiedDate:'',
      createdAt: null, updatedAt: null
    };
  }

  let state = newRecord();
  const ACTING_NAME_KEY = 'acting_as_name_oosw';
  let actingName = window.localStorage.getItem(ACTING_NAME_KEY) || '';

  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  }
  function safeKey(s){ return String(s).trim().replace(/[\s\/\\'"]+/g,'_'); }
  function num(v){ const n = parseFloat(v); return (v===''||v==null||isNaN(n)) ? null : n; }

  async function storeGet(key, shared){
    try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function storeSet(key, value, shared){
    try{ await window.storage.set(key, value, shared); return true; }
    catch(e){ return false; }
  }

  function updateResults(){
    const wholeWt = num(state.header.wholeWeight);
    const totalOosw = state.weights.reduce((sum, w) => sum + (num(w) || 0), 0);
    const ooswPct = wholeWt && wholeWt > 0 ? ((totalOosw / wholeWt) * 100) : 0;

    $('totalOosw').textContent = totalOosw.toFixed(2);
    $('ooswPercent').textContent = ooswPct.toFixed(1);
  }

  function renderWeightsTable(){
    const tbody = $('weightsBody');
    if(!state.weights.length){
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#8a939b; padding:6px;">No weights added yet</td></tr>';
      updateResults();
      return;
    }
    let html = '';
    for(let i = 0; i < state.weights.length; i += 6){
      const rowWeights = state.weights.slice(i, i + 6);
      html += '<tr>';
      for(let j = 0; j < 6; j++){
        const w = rowWeights[j];
        const idx = i + j;
        html += `<td style="position:relative;"><input type="number" step="0.01" data-idx="${idx}" value="${w || ''}" style="width:100%; padding-right:20px;"><button class="clear-btn" data-clear="${idx}" title="Clear this cell" style="position:absolute; right:2px; top:2px;">✕</button></td>`;
      }
      html += '</tr>';
    }
    tbody.innerHTML = html;
    tbody.querySelectorAll('input[data-idx]').forEach(inp=>{
      inp.addEventListener('input', (e)=>{
        const idx = parseInt(e.target.dataset.idx);
        state.weights[idx] = e.target.value;
        updateResults();
      });
    });
    tbody.querySelectorAll('.clear-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.dataset.clear);
        state.weights[idx] = '';
        renderWeightsTable();
      });
    });
    updateResults();
  }

  function renderHeader(){
    $('h_intakeDate').value = state.header.intakeDate;
    $('h_harvestFarm').value = state.header.harvestFarm;
    $('h_trackingNo').value = state.header.trackingNo;
    $('h_processingFor').value = state.header.processingFor;
    $('h_sizeRange').value = state.header.sizeRange;
    $('h_wholeWeight').value = state.header.wholeWeight;
    $('h_jobPrefix').value = state.header.jobPrefix;
    $('h_jobNumber').value = state.header.jobNumber;
    $('commentsBox').value = state.comments;
    $('f_operator').value = state.operator;
    $('f_operatorDate').value = state.operatorDate;
    $('f_supervisor').value = state.supervisor;
    $('f_supervisorDate').value = state.supervisorDate;
    $('f_verifiedBy').value = state.verifiedBy;
    $('f_verifiedDate').value = state.verifiedDate;
  }

  function bindInputs(){
    const headerMap = {
      h_intakeDate:'intakeDate', h_harvestFarm:'harvestFarm', h_trackingNo:'trackingNo',
      h_processingFor:'processingFor', h_sizeRange:'sizeRange', h_wholeWeight:'wholeWeight',
      h_jobPrefix:'jobPrefix', h_jobNumber:'jobNumber'
    };
    Object.entries(headerMap).forEach(([id,key])=>{
      $(id).addEventListener('input', ()=>{ state.header[key] = $(id).value; updateResults(); });
    });
    $('commentsBox').addEventListener('input', ()=>{ state.comments = $('commentsBox').value; });
    ['operator','operatorDate','supervisor','supervisorDate','verifiedBy','verifiedDate'].forEach(key=>{
      const id = 'f_' + key;
      $(id).addEventListener('input', ()=>{ state[key] = $(id).value; });
    });
  }

  function updateRecordStatus(){
    const jobStr = (state.header.jobPrefix && state.header.jobNumber) ? `${state.header.jobPrefix}-${state.header.jobNumber}` : 'No job';
    const submitted = state.status === 'submitted';
    $('recordStatus').textContent = `${submitted ? '✓ Submitted' : 'Draft'} · ${jobStr} · ${state.id ? 'ID: ' + state.id.slice(-8) : 'Unsaved'}`;
  }

  function renderAll(){
    renderHeader();
    renderWeightsTable();
    updateRecordStatus();
    $('statusLine').textContent = state.updatedAt ? `Last saved ${new Date(state.updatedAt).toLocaleString()}` : 'Not yet saved';
  }

  async function saveRecord(finalize){
    const now = Date.now();
    if(!state.id){
      const jobId = (state.header.jobPrefix && state.header.jobNumber) ? `${state.header.jobPrefix}-${state.header.jobNumber}` : 'NOJOB';
      state.id = `oosw_${safeKey(jobId)}_${now}`;
      state.createdAt = now;
    }
    state.updatedAt = now;
    state.status = finalize ? 'submitted' : 'draft';

    const ok = await storeSet('record:'+state.id, JSON.stringify(state), true);
    if(!ok){ toast('Save failed.'); return; }
    toast(finalize ? 'Submitted for verification.' : 'Draft saved.');
    renderAll();
  }

  function generatePdf(){
    const jobStr = (state.header.jobPrefix && state.header.jobNumber) ? `${state.header.jobPrefix}-${state.header.jobNumber}` : 'record';
    document.title = `REC_7.1.5_OOSW_${safeKey(jobStr)}_${state.header.intakeDate||''}`;
    window.print();
  }

  function wireActingName(){
    const inp = $('actingNameInput');
    inp.value = actingName;
    inp.addEventListener('input', ()=>{ actingName = inp.value; window.localStorage.setItem(ACTING_NAME_KEY, actingName); });
  }

  function populateSizeRanges(){
    const sel = $('h_sizeRange');
    if(window.SizeRanges && window.SizeRanges.ranges){
      window.SizeRanges.ranges.forEach(range=>{
        const opt = document.createElement('option');
        opt.value = range;
        opt.textContent = range;
        sel.appendChild(opt);
      });
    }
  }

  function wire(){
    wireActingName();
    bindInputs();
    populateSizeRanges();
    $('saveDraftBtn').addEventListener('click', ()=>saveRecord(false));
    $('submitBtn').addEventListener('click', ()=>saveRecord(true));
    $('newRecordBtn').addEventListener('click', ()=>{
      if(confirm('Start new record? Unsaved changes will be lost.')){
        state = newRecord();
        renderAll();
      }
    });
    $('addWeightBtn').addEventListener('click', ()=>{
      const val = $('newWeightInput').value.trim();
      if(!val){ toast('Enter a weight.'); return; }
      state.weights.push(val);
      $('newWeightInput').value = '';
      $('newWeightInput').focus();
      renderWeightsTable();
    });
    $('newWeightInput').addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){ $('addWeightBtn').click(); }
    });
    $('exportBtn').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const jobStr = (state.header.jobPrefix && state.header.jobNumber) ? `${state.header.jobPrefix}-${state.header.jobNumber}` : 'oosw_draft';
      a.download = `oosw_${safeKey(jobStr)}.json`;
      a.click();
    });
    $('generatePdfBtn').addEventListener('click', generatePdf);
  }

  (async function init(){
    wire();
    renderAll();
  })();
})();
</script>
</body>
</html>
