<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batch Traceability</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
<style>
  :root { --steel: var(--palette-primary); --steel2: #263a4c; --orange: #e07a2c; --line: var(--palette-border); --ink: var(--palette-ink); --muted: #5b6b78; }
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; color: var(--ink); background: #f4f6f8; }
  header { background: var(--steel); color: #fff; padding: 18px 22px; }
  header h1 { margin: 0; font-size: 20px; }
  header .sub { color: #b9c6d1; font-size: 13px; margin-top: 3px; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 22px; }
  .search { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .search label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .search input { font-size: 15px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px; min-width: 240px; }
  .search button { background: var(--orange); color: #fff; border: 0; border-radius: 7px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  .search button:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .status { margin: 18px 2px; color: var(--muted); }
  .status.err { color: #b3261e; }
  .count { font-size: 13px; color: var(--muted); margin: 20px 2px 8px; }
  ol.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  ol.timeline::before { content: ""; position: absolute; left: 14px; top: 4px; bottom: 4px; width: 2px; background: var(--line); }
  li.tp { position: relative; padding: 0 0 14px 42px; }
  li.tp::before { content: ""; position: absolute; left: 8px; top: 16px; width: 14px; height: 14px; border-radius: 50%; background: var(--orange); border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; }
  .card .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .card .title { font-weight: 700; }
  .card .date { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .card .stage { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #fff; background: var(--steel2); border-radius: 20px; padding: 2px 9px; margin-top: 6px; }
  .card .summary { color: #34434f; font-size: 14px; margin-top: 7px; }
  .card a.open { display: inline-block; margin-top: 9px; font-size: 13px; color: var(--orange); text-decoration: none; }
  .card a.open:hover { text-decoration: underline; }
  a.back { color: #b9c6d1; font-size: 13px; text-decoration: none; }

  @media (max-width: 768px) {
    header { padding: 14px 16px; }
    header h1 { font-size: 18px; }
    .wrap { padding: 16px; }
    /* The search row is input + button side by side on desktop; on a phone the
       240px input alone is wider than the viewport, so both go full width. */
    .search { padding: 14px; gap: 8px; }
    .search > div { flex: 1 1 100%; }
    .search input { min-width: 0; width: 100%; font-size: 16px; }
    .search button { flex: 1 1 100%; padding: 12px 18px; }
    li.tp { padding-left: 34px; }
    .card .date { white-space: normal; }
  }
  @media (max-width: 480px) {
    header { padding: 12px 14px; }
    header h1 { font-size: 17px; }
    .wrap { padding: 12px; }
    ol.timeline::before { left: 10px; }
    li.tp { padding-left: 28px; }
    li.tp::before { left: 4px; }
    .card { padding: 10px 12px; }
    .card .summary { font-size: 13px; }
  }
</style>
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<header>
  <a class="back" href="../index.html">← Back to Processing Department</a>
  <h1>Batch Traceability</h1>
  <div class="sub">Enter a product batch / lot number to see every record that touched it, front to back.</div>
</header>

<div class="wrap">
  <div class="search">
    <div>
      <label for="batchInput">Batch / lot number</label>
      <input id="batchInput" list="batchList" placeholder="e.g. 20240517-A" autocomplete="off">
      <datalist id="batchList"></datalist>
    </div>
    <button id="traceBtn">Trace</button>
  </div>
  <div class="hint" id="hint"></div>

  <div class="status" id="status"></div>
  <div class="count" id="count" hidden></div>
  <ol class="timeline" id="timeline"></ol>
</div>

<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/traceability.js?v=4"></script>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function setStatus(msg, isErr) {
    const s = $('status'); s.textContent = msg || ''; s.classList.toggle('err', !!isErr);
  }

  async function loadKnownBatches() {
    try {
      let list = await window.Traceability.knownBatches();
      if (!list.length) { await sleep(2000); list = await window.Traceability.knownBatches(); }
      $('batchList').innerHTML = list.map(b => `<option value="${esc(b)}">`).join('');
      $('hint').textContent = list.length
        ? `${list.length} batch number${list.length === 1 ? '' : 's'} indexed so far.`
        : 'No batches indexed yet — save a record that declares a batch field to populate this.';
    } catch (e) {
      $('hint').textContent = '';
    }
  }

  function render(rows, batchNo) {
    const tl = $('timeline');
    $('count').hidden = false;
    $('count').textContent = `${rows.length} touchpoint${rows.length === 1 ? '' : 's'} for batch “${batchNo}”`;
    tl.innerHTML = rows.map(r => `
      <li class="tp">
        <div class="card">
          <div class="top">
            <span class="title">${esc(r.record_title || r.record_key)}</span>
            <span class="date">${esc(r.occurred_on || '—')}</span>
          </div>
          ${r.stage ? `<span class="stage">${esc(r.stage)}</span>` : ''}
          ${r.summary ? `<div class="summary">${esc(r.summary)}</div>` : ''}
          ${r.linked_batch ? `<div class="summary">Linked to: <a href="?batch=${encodeURIComponent(r.linked_batch)}">${esc(r.linked_batch)}</a></div>` : ''}
          ${r.href ? `<a class="open" href="${esc(r.href)}">Open record →</a>` : ''}
        </div>
      </li>`).join('');
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function doTrace() {
    const batchNo = $('batchInput').value.trim();
    $('timeline').innerHTML = '';
    $('count').hidden = true;
    if (!batchNo) { setStatus('Enter a batch number to trace.'); return; }
    setStatus('Tracing…');
    $('traceBtn').disabled = true;
    try {
      let rows = await window.Traceability.trace(batchNo);
      // An empty result on the very first call this page makes doesn't necessarily mean nothing
      // is indexed -- window.storage may not have finished switching off localStorage yet (the
      // API health-check race), especially on a deep link that traces immediately on load. Retry
      // once before reporting "not found".
      if (!rows.length) { await sleep(2000); rows = await window.Traceability.trace(batchNo); }
      if (!rows.length) { setStatus(`No records reference batch “${batchNo}” yet.`); return; }
      setStatus('');
      render(rows, batchNo);
    } catch (e) {
      setStatus(e && e.message ? e.message : 'Trace failed.', true);
    } finally {
      $('traceBtn').disabled = false;
    }
  }

  $('traceBtn').addEventListener('click', doTrace);
  $('batchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doTrace(); });

  // Deep-link support: batch-trace.html?batch=XXXX traces immediately.
  const q = new URLSearchParams(location.search).get('batch');
  if (q) { $('batchInput').value = q; doTrace(); }
  loadKnownBatches();
</script>
</body>
</html>
