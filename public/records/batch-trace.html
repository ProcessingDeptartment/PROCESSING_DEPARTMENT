<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batch Traceability</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#A9763A">
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: var(--rt-font);
    margin: 0;
    color: var(--rt-navy-primary);
    background: var(--rt-bg);
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--rt-navy-primary);
    color: var(--rt-white);
    padding: 16px 22px 18px;
  }
  header .back { color: #9fb0bd; font-size: 13px; text-decoration: none; }
  header .back:hover { color: var(--rt-white); }
  header h1 { margin: 8px 0 3px; font-size: 20px; font-weight: 700; }
  header .sub { color: #aebac4; font-size: 13px; max-width: 60ch; }

  .wrap { max-width: 940px; margin: 0 auto; padding: 22px; }

  .search {
    background: var(--rt-white);
    border: 1px solid var(--rt-border);
    border-radius: var(--rt-radius);
    box-shadow: var(--rt-shadow);
    padding: 16px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .search .field { flex: 1 1 260px; }
  .search label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--rt-slate);
    margin-bottom: 5px;
  }
  .search input {
    width: 100%;
    font-size: 15px;
    font-family: var(--rt-font);
    padding: 10px 12px;
    border: 1px solid var(--rt-border);
    border-radius: var(--rt-radius-sm);
    min-height: var(--rt-tap);
  }
  .search input:focus { outline: 2px solid var(--rt-gold); outline-offset: 1px; border-color: var(--rt-gold); }
  .search button {
    background: var(--rt-gold);
    color: var(--rt-white);
    border: 0;
    border-radius: var(--rt-radius-btn);
    padding: 0 22px;
    min-height: var(--rt-tap);
    font-size: 15px;
    font-weight: 700;
    font-family: var(--rt-font);
    cursor: pointer;
  }
  .search button:hover:not(:disabled) { background: var(--rt-gold-hover); }
  .search button:disabled { opacity: .5; cursor: default; }

  .hint { font-size: 12px; color: var(--rt-slate); margin: 10px 2px 0; }
  .status { margin: 18px 2px; color: var(--rt-slate); font-size: 14px; }
  .status.err { color: var(--rt-fail); }
  .status.loading::after {
    content: ""; display: inline-block; width: 12px; height: 12px; margin-left: 8px;
    border: 2px solid var(--rt-border); border-top-color: var(--rt-gold); border-radius: 50%;
    vertical-align: -2px; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result-head {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin: 22px 2px 12px;
  }
  .result-head h2 { margin: 0; font-size: 16px; }
  .result-head .batch-tag {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    background: var(--rt-navy-primary); color: var(--rt-white);
    border-radius: 6px; padding: 2px 8px; font-size: 13px; font-weight: 600;
  }
  .result-head .count { color: var(--rt-slate); font-size: 13px; }

  .genealogy { display: flex; gap: 12px; flex-wrap: wrap; margin: 0 2px 22px; }
  .genealogy .box {
    flex: 1 1 240px;
    background: var(--rt-white);
    border: 1px solid var(--rt-border);
    border-radius: var(--rt-radius);
    box-shadow: var(--rt-shadow);
    padding: 13px 15px;
  }
  .genealogy .box.up   { border-left: 4px solid var(--rt-blue); }
  .genealogy .box.down { border-left: 4px solid var(--rt-purple); }
  .genealogy .box h3 {
    margin: 0 0 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .05em; color: var(--rt-slate);
  }
  .genealogy .box a {
    display: inline-block; margin: 3px 6px 0 0; padding: 4px 9px;
    font-size: 13px; font-family: ui-monospace, Menlo, Consolas, monospace;
    color: var(--rt-navy-primary); background: var(--rt-bg);
    border: 1px solid var(--rt-border); border-radius: 6px; text-decoration: none;
  }
  .genealogy .box a:hover { border-color: var(--rt-gold); color: var(--rt-gold); }
  .genealogy .box .none { color: var(--rt-slate); font-size: 13px; }

  ol.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  ol.timeline::before {
    content: ""; position: absolute; left: 15px; top: 6px; bottom: 6px;
    width: 2px; background: var(--rt-border);
  }
  ol.timeline:has(.empty)::before { display: none; }
  ol.timeline .empty { margin-left: 0; }
  li.tp { position: relative; padding: 0 0 14px 44px; }
  li.tp::before {
    content: ""; position: absolute; left: 9px; top: 17px; width: 14px; height: 14px;
    border-radius: 50%; background: var(--rt-gold); border: 3px solid var(--rt-bg);
    box-shadow: 0 0 0 1px var(--rt-border);
  }
  li.tp.rel-input::before  { background: var(--rt-blue); }
  li.tp.rel-output::before { background: var(--rt-purple); }

  .card {
    background: var(--rt-white);
    border: 1px solid var(--rt-border);
    border-radius: var(--rt-radius-sm);
    box-shadow: var(--rt-shadow);
    padding: 12px 14px;
  }
  .card .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .card .title { font-weight: 700; font-size: 14px; }
  .card .date { color: var(--rt-slate); font-size: 13px; white-space: nowrap; }
  .card .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .card .tag {
    display: inline-block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
    font-weight: 700; border-radius: 20px; padding: 2px 9px;
  }
  .card .tag.stage { color: var(--rt-white); background: var(--rt-navy-secondary); }
  .card .tag.rel-input  { color: var(--rt-blue);   background: #e6edfb; }
  .card .tag.rel-output { color: var(--rt-purple); background: #efe7fd; }
  .card .tag.status-verified  { color: var(--rt-green); background: #e3f3e8; }
  .card .tag.status-submitted { color: var(--rt-amber); background: #fdf0dc; }
  .card .tag.status-draft     { color: var(--rt-slate); background: var(--rt-border); }
  .card .doc-code {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; font-size: 12px;
    color: var(--rt-slate); margin-right: 7px;
  }
  .card .summary { color: #34434f; font-size: 13.5px; margin-top: 8px; }
  .card .summary a { color: var(--rt-gold); text-decoration: none; }
  .card a.open {
    display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 600;
    color: var(--rt-gold); text-decoration: none;
  }
  .card a.open:hover { text-decoration: underline; }

  .empty {
    background: var(--rt-white); border: 1px dashed var(--rt-border);
    border-radius: var(--rt-radius); padding: 26px; text-align: center;
    color: var(--rt-slate); font-size: 14px;
  }

  .btn-flat {
    background: var(--rt-white); color: var(--rt-navy-primary); border: 1px solid var(--rt-border);
    border-radius: var(--rt-radius-sm); padding: 0 16px; min-height: 36px; font-size: 13px;
    font-weight: 600; font-family: var(--rt-font); cursor: pointer;
  }
  .btn-flat:hover { border-color: var(--rt-gold); color: var(--rt-gold); }
  .result-head .spacer { flex: 1; }

  @media (max-width: 768px) {
    header { padding: 14px 16px; }
    header h1 { font-size: 18px; }
    .wrap { padding: 16px; }
    .search { padding: 14px; }
    .search .field, .search button { flex: 1 1 100%; }
    .search input { font-size: 16px; }
    li.tp { padding-left: 36px; }
    .card .date { white-space: normal; }
  }
  @media (max-width: 480px) {
    .wrap { padding: 12px; }
    ol.timeline::before { left: 11px; }
    li.tp { padding-left: 30px; }
    li.tp::before { left: 5px; }
  }

  /* Print / PDF: swap the interactive page for a plain paper-style trace sheet. */
  @media print {
    @page { size: A4; margin: 14mm; }
    body { background: #fff; }
    header .back, .search, .hint, .no-print { display: none !important; }
    header { background: #fff; color: #000; padding: 0 0 10px; border-bottom: 2px solid #000; }
    header .sub, .result-head .count { color: #333; }
    .wrap { max-width: none; padding: 0; margin-top: 14px; }
    .genealogy .box, .card, .empty { box-shadow: none; border-color: #999; }
    .card { break-inside: avoid; }
    ol.timeline::before { background: #999; }
  }
</style>
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<header>
  <a class="back" href="../index.html">&larr; Back to Processing Department</a>
  <h1>Batch Traceability</h1>
  <div class="sub">Enter a product batch, job or lot number to see every record that touched it &mdash; and the batches it was made from or went into.</div>
</header>

<div class="wrap">
  <div class="search">
    <div class="field">
      <label for="batchInput">Batch / job / lot number</label>
      <input id="batchInput" list="batchList" placeholder="e.g. 3CP2451 or 20240517-A" autocomplete="off">
      <datalist id="batchList"></datalist>
    </div>
    <button id="traceBtn">Trace</button>
  </div>
  <div class="hint" id="hint"></div>

  <div class="status" id="status"></div>

  <div id="results" hidden>
    <div class="result-head">
      <h2>Genealogy</h2>
      <span class="batch-tag" id="batchTag"></span>
      <span class="spacer"></span>
      <button type="button" class="btn-flat no-print" id="printBtn">View / print PDF</button>
    </div>
    <div id="binPanel" hidden>
      <h3 style="margin:14px 0 6px;">In this bin</h3>
      <table class="bin-table" style="width:100%;border-collapse:collapse;font-size:14px;">
        <thead><tr style="text-align:left;border-bottom:1px solid #ccc;"><th>Job no.</th><th>Graded on</th><th>Record</th><th>Boxes</th><th>kg</th><th></th></tr></thead>
        <tbody id="binRows"></tbody>
      </table>
    </div>
    <div class="genealogy" id="genealogy">
      <div class="box up"><h3>Made from &mdash; one up</h3><div id="inputs"></div></div>
      <div class="box down"><h3>Went into &mdash; one down</h3><div id="outputs"></div></div>
    </div>

    <div class="result-head">
      <h2>Record trail</h2>
      <span class="count" id="count"></span>
    </div>
    <ol class="timeline" id="timeline"></ol>
  </div>
</div>

<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/api-backend.js?v=18"></script>
<script src="../lib/auth.js?v=2"></script>
<script src="../lib/login-ui.js?v=3"></script>
<script src="../lib/traceability.js?v=10"></script>
<script src="../lib/master-index-data.js?v=4"></script>
<script>  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const REL_LABEL = { input: 'made from', output: 'went into' };
  const STATUS_LABEL = { verified: 'Verified · complete', submitted: 'Awaiting verification', draft: 'Draft' };

  // record_key -> doc code (e.g. "REC 7.1.4"), same lookup form-record.js uses for job-trace picks.
  const docCodeByKey = {};
  ((window.MasterIndexData && window.MasterIndexData.rows) || []).forEach(r => {
    if (r.recordKey) docCodeByKey[r.recordKey] = String(r.docNo || '').trim();
  });

  function setStatus(msg, kind) {
    const s = $('status');
    s.textContent = msg || '';
    s.classList.toggle('err', kind === 'err');
    s.classList.toggle('loading', kind === 'loading');
  }

  async function loadKnownBatches() {
    try {
      let list = await window.Traceability.knownBatches();
      if (!list.length) { await sleep(2000); list = await window.Traceability.knownBatches(); }
      $('batchList').innerHTML = list.map(b => `<option value="${esc(b)}">`).join('');
      $('hint').textContent = list.length
        ? `${list.length} batch number${list.length === 1 ? '' : 's'} indexed so far.`
        : 'No batches indexed yet — save a record that declares a batch field to populate this.';
    } catch (e) {
      $('hint').textContent = '';
    }
  }

  function renderGenealogy(graph) {
    const cell = list => list && list.length
      ? list.map(b => `<a href="?batch=${encodeURIComponent(b)}">${esc(b)}</a>`).join('')
      : '<span class="none">— none recorded —</span>';
    $('inputs').innerHTML = cell(graph.inputs);
    $('outputs').innerHTML = cell(graph.outputs);
  }

  function render(rows, batchNo) {
    $('count').textContent = `${rows.length} touchpoint${rows.length === 1 ? '' : 's'}`;
    $('timeline').innerHTML = rows.map(r => {
      const rel = r.rel === 'input' || r.rel === 'output' ? r.rel : '';
      const relTag = rel ? `<span class="tag rel-${rel}">${REL_LABEL[rel]}</span>` : '';
      const stageTag = r.stage ? `<span class="tag stage">${esc(r.stage)}</span>` : '';
      const statusLabel = STATUS_LABEL[r.status];
      const statusTag = statusLabel ? `<span class="tag status-${r.status}">${esc(statusLabel)}</span>` : '';
      const tags = (relTag || stageTag || statusTag) ? `<div class="tags">${stageTag}${statusTag}${relTag}</div>` : '';
      const docCode = docCodeByKey[r.record_key];
      return `
      <li class="tp${rel ? ' rel-' + rel : ''}"${r.record_key === 'dry-monitoring' && r.submission_id ? ` data-photo-sid="${esc(r.submission_id)}"` : ''}>
        <div class="card">
          <div class="top">
            <span class="title">${docCode ? `<span class="doc-code">${esc(docCode)}</span>` : ''}${esc(r.record_title || r.record_key)}</span>
            <span class="date"><span class="photo-count"></span>${esc(r.occurred_on || '—')}</span>
          </div>
          ${tags}
          ${r.summary ? `<div class="summary">${esc(r.summary)}</div>` : ''}
          ${(r.pots || []).map(p => {
            const b = p.batches || {}, ak = p.additionsKg || {};
            if (p.process === 'Blanching') {
              // new Blanching slide: time, temperature, salt batch (old blanching cards keep their kg / old fields)
              const bits = [p.blanchTime, p.blanchTempC != null ? p.blanchTempC + ' °C' : '', p.abaloneKg != null ? p.abaloneKg + ' kg' : '', b.blanch ? 'salt batch ' + b.blanch : ''].filter(Boolean);
              return `<div class="summary">Blanching${bits.length ? ' &mdash; ' + esc(bits.join(' — ')) : ''}</div>`;
            }
            const adds = [['Salt', 'salt'], ['Sugar', 'sugar'], ['Vinegar', 'vinegar']]
              .filter(x => b[x[1]] || ak[x[1]] != null).map(x => x[0] + (ak[x[1]] != null ? ' ' + ak[x[1]] + ' kg' : '') + (b[x[1]] ? ' batch ' + b[x[1]] : ''));
            return `<div class="summary">Pot ${esc(p.potNo || p.rowNo)} &mdash; ${esc(p.process || '')}${p.cookingDate ? ' &mdash; ' + esc(p.cookingDate) : ''}${p.abaloneKg != null ? ' &mdash; ' + esc(p.abaloneKg) + ' kg' : ''}${adds.length ? ' (' + esc(adds.join(', ')) + ')' : ''}</div>`;
          }).join('')}
          ${r.linked_batch && r.linked_batch !== batchNo
            ? `<div class="summary">Linked batch: <a href="?batch=${encodeURIComponent(r.linked_batch)}">${esc(r.linked_batch)}</a></div>` : ''}
          ${r.href ? `<a class="open no-print" href="${esc(r.href)}">Open this record &rarr;</a>` : ''}
        </div>
      </li>`;
    }).join('');
    addPhotoCounts();
  }

  // REC 7.4.2 entries with photos on problem answers get a 📷 count (src/dry-monitoring-images.js)
  async function addPhotoCounts() {
    const cards = document.querySelectorAll('[data-photo-sid]');
    if (!cards.length) return;
    try {
      const res = await window.FacilityApi.fetch('/api/dry-monitoring/images/counts', { cache: 'no-store' });
      if (!res.ok) return;
      const counts = await res.json();
      cards.forEach((li) => {
        const n = counts[li.dataset.photoSid] || 0;
        if (n) li.querySelector('.photo-count').textContent = '📷 ' + n + ' photo' + (n === 1 ? '' : 's') + ' · ';
      });
    } catch (e) {}
  }

  // A bin code (collection bin = box code, e.g. 8g-10g-3): which jobs were graded into it and when.
  async function renderBin(code) {
    const panel = $('binPanel');
    let rows = [];
    try { rows = window.Traceability.jobsForBin ? await window.Traceability.jobsForBin(code) : []; } catch (e) { rows = []; }
    rows = rows.filter(r => r.link_field === 'binCode' || r.row);
    panel.hidden = !rows.length;
    if (!rows.length) return;
    const d = s => { s = String(s || ''); return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : s; };
    let total = 0, boxes = 0;
    $('binRows').innerHTML = rows.map(r => {
      const row = r.row || {};
      // A box code (one full box off a grading bin) carries its own box_weight.
      const nb = r.box_weight != null ? 1 : String(row.fullBoxWeight || '').split(/[+,;\s]+/).filter(Boolean).length;
      const g = parseFloat(r.box_weight != null ? r.box_weight : row.gradedWeight);
      if (!isNaN(g)) total += g;
      boxes += nb;
      return `<tr style="border-bottom:1px solid #eee;"><td><a href="?batch=${encodeURIComponent(r.job_no || '')}">${esc(r.job_no || '')}</a></td>
        <td>${esc(d(r.occurred_on || (r.values || {}).gradingDate))}</td><td>${esc(r.record_title || r.record_key || '')}${r.status === 'draft' ? ' (draft)' : ''}</td>
        <td>${nb || ''}</td><td>${isNaN(g) ? '' : g.toFixed(2)}</td>
        <td>${r.href ? `<a class="no-print" href="${esc(r.href)}">Open &rarr;</a>` : ''}</td></tr>`;
    }).join('') + `<tr style="font-weight:700;"><td colspan="3">Total</td><td>${boxes || ''}</td><td>${total.toFixed(2)}</td><td></td></tr>`;
  }

  async function doTrace() {
    const batchNo = $('batchInput').value.trim();
    if (!batchNo) { setStatus('Enter a batch number to trace.'); $('results').hidden = true; return; }
    setStatus('Tracing…', 'loading');
    $('results').hidden = true;
    $('traceBtn').disabled = true;
    try {
      await renderBin(batchNo);
      let graph = await window.Traceability.traceGraph(batchNo);
      if (!graph.records.length) { await sleep(2000); graph = await window.Traceability.traceGraph(batchNo); }
      if (!graph.records.length) {
        setStatus('');
        $('results').hidden = false;
        $('batchTag').textContent = batchNo;
        renderGenealogy({ inputs: [], outputs: [] });
        $('count').textContent = '0 touchpoints';
        $('timeline').innerHTML = `<li class="empty">No records reference batch “${esc(batchNo)}” yet.</li>`;
        return;
      }
      setStatus('');
      $('batchTag').textContent = batchNo;
      renderGenealogy(graph);
      render(graph.records, batchNo);
      $('results').hidden = false;
    } catch (e) {
      setStatus(e && e.message ? e.message : 'Trace failed.', 'err');
    } finally {
      $('traceBtn').disabled = false;
    }
  }

  $('printBtn').addEventListener('click', () => {
    const batchNo = $('batchInput').value.trim();
    const prevTitle = document.title;
    document.title = 'Batch Trace_' + (batchNo || 'record') + '_' + new Date().toISOString().slice(0, 10);
    window.print();
    document.title = prevTitle;
  });

  $('traceBtn').addEventListener('click', doTrace);
  $('batchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doTrace(); });
  $('batchInput').addEventListener('change', () => { if ($('batchInput').value.trim()) doTrace(); });

  window.addEventListener('popstate', syncFromUrl);
  function syncFromUrl() {
    const q = new URLSearchParams(location.search).get('batch');
    if (q && q !== $('batchInput').value.trim()) { $('batchInput').value = q; doTrace(); }
  }

  const q0 = new URLSearchParams(location.search).get('batch');
  if (q0) { $('batchInput').value = q0; doTrace(); }
  loadKnownBatches();
</script>
</body>
