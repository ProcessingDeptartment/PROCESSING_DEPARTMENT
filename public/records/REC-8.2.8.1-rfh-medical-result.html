<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 8.2.8.1 RFH Medical Result</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/form-record.js?v=20"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'rfh-medical-result',
    docCode: 'REC 8.2.8.1',
    title: 'RFH Medical Result',
    docRevisionStart: 1,
    listColumns: ['nameOfFoodHandler', 'dateOfMedicalAssessment', 'fitUnfit'],
    instructions: [
      { label: 'Screening covers', text: 'Chronic medication acknowledgement, urine test, blood pressure & pulse, glucose blood test (if glucosuria/diabetic), Snellen eye test (both eyes), physical inspection of scalp/ears/nose/mouth/teeth/hands/nails.' }
    ],
    sections: [
      { title: 'Assessment details', fields: [
        { key: 'clinicSite', label: 'Clinic site', type: 'text' },
        { key: 'dateOfMedicalAssessment', label: 'Date of medical assessment', type: 'date', required: true },
        { key: 'nameOfFoodHandler', label: 'Name and surname of food handler', type: 'text', required: true },
        { key: 'dobIdNumber', label: 'DOB / ID number', type: 'text' },
        { key: 'chronicMedicationUnderControl', label: 'Chronic medication under control?', type: 'yesno' }
      ]},
      { title: 'Outcome', fields: [
        { key: 'fitUnfit', label: 'Fit / Unfit to work in the processing facility', type: 'select', options: ['Fit', 'Unfit'] },
        { key: 'comments', label: 'Comments', type: 'textarea', wide: true },
        { key: 'medicalExaminer', label: 'Name of medical examiner', type: 'text' },
        { key: 'practiceNo', label: 'Practice no.', type: 'text' },
        { key: 'examinerDate', label: 'Date', type: 'date' },
        { key: 'verifiedBy', label: 'Verified by', type: 'text' },
        { key: 'verifiedDate', label: 'Date', type: 'date' }
      ]}
    ]
  });
})();
</script>
</body>
</html>
