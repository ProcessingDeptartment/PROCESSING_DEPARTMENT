<!DOCTYPE html>
<html lang="en" data-palette="dry">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.4.2 Dry Monitoring</title>
<style>
  :root {
    --ink: #3a4a40;
    --steel: #7a9b88;
    --steel-dk: #556966;
    --paper: #f8f9f8;
    --line: #b3c9bf;
    --line-soft: #d0dcd8;
    --ok: #7a9b88;
    --ok-bg: #e8f3ed;
    --warn: #b8791c;
    --warn-bg: #fbf0dc;
    --fail: #a3352d;
    --fail-bg: #fbe8e6;
    --accent: #7a9b88;
  }
  .ml-app { color: var(--ink); background: var(--paper); }
  .ml-top { background: var(--steel-dk); }
  .ml-panel-head h2 { color: var(--steel); }
  .ml-btn-primary { background: var(--accent); }
  .ml-badge-ok { background: var(--ok-bg); color: var(--ok); }
  .ml-badge-fail { background: var(--fail-bg); color: var(--fail); }
</style>
  <link rel="stylesheet" href="color-palettes.css">
  <link rel="stylesheet" href="../responsive.css?v=1">
</head>
<body>
<div id="mlRoot"></div>

<script src="../lib/data-store.js?v=2"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/spec-registry.js?v=2"></script>
<script src="../lib/document-revision.js?v=2"></script>
<script src="../lib/monitoring-log.js?v=2"></script>
<script>
(function () {
  MonitoringLog.init({
    mount: '#mlRoot',
    recordKey: 'dry-monitoring',
    docCode: 'REC 7.4.2',
    title: 'Dry Monitoring',
    docRevisionStart: 3,
    entryFields: [
      { key: 'date', label: 'Date', type: 'date', required: true },
      { key: 'jobNumber', label: 'Job number', type: 'text' },
      { key: 'intakeWeight', label: 'Intake weight', type: 'number', unit: 'kg' },
      { key: 'intakeDate', label: 'Intake date', type: 'date' },
      { key: 'cookingDate', label: 'Cooking date', type: 'date' },
      { key: 'dryRoomArea', label: 'Dry room area', type: 'text' },
      { key: 'noOfTrolleys', label: 'No. of trolleys', type: 'number' },
      { key: 'trolleysClearlyMarked', label: 'Trolleys clearly marked', type: 'yesno' },
      { key: 'estimatedDryDate', label: 'Estimated dry date', type: 'date' },
      { key: 'mouldVisible', label: 'Mould visible', type: 'yesno' },
      { key: 'whiteSaltOnSurface', label: 'White salt on surface', type: 'yesno' },
      { key: 'caseHardening', label: 'Case hardening', type: 'yesno' },
      { key: 'surfaceShine', label: 'Surface shine', type: 'yesno' },
      { key: 'footDamage', label: 'Foot damage', type: 'yesno' },
      { key: 'correctiveActions', label: 'Corrective actions', type: 'textarea' },
      { key: 'comments', label: 'Comments', type: 'textarea' },
      { key: 'qcCheck', label: 'QC check', type: 'text', required: true },
      { key: 'supervisor', label: 'Supervisor', type: 'text' }
    ],
    specFields: [],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
  });
})();
</script>
</body>
</html>
