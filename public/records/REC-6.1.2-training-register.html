<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/api-backend.js?v=2"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/form-record.js?v=10"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'training-register',
    docCode: 'REC 6.1.2',
    title: 'Training Register',
    docRevisionStart: 2,
    listColumns: ['trainingCourse', 'date', 'trainer'],
    sections: [
      { title: 'Training details', fields: [
        { key: 'trainingCourse', label: 'Training course', type: 'text', required: true },
        { key: 'date', label: 'Date', type: 'date', required: true },
        { key: 'documentNumbers', label: 'Document numbers referred to', type: 'text' },
        { key: 'duration', label: 'Duration', type: 'text' },
        { key: 'trainer', label: 'Trainer / facilitator', type: 'text', required: true }
      ]}
    ],
    roster: {
      title: 'Attendees',
      columns: [
        { key: 'nameSurname', label: 'Name & surname', type: 'text' },
        { key: 'signature', label: 'Signature', type: 'text' },
        { key: 'employeeNumber', label: 'Employee number', type: 'text' },
        { key: 'competencyConfirmed', label: 'Competency confirmed after evaluation?', type: 'yesno' },
        { key: 'carNo', label: 'CAR no. (if competency could not be demonstrated)', type: 'text' }
      ]
    }
  });
})();
</script>
