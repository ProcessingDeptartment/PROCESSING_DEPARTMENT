<!DOCTYPE html>

<head>

<script src="../lib/shell.js?v=1"></script>

<body>
<div id="mlRoot"></div>

<script>
(function () {

    docRevisionStart: 2,

      { key: 'date', label: 'Date', type: 'date', required: true },
      { key: 'time', label: 'Time', type: 'text' },
      { key: 'trackingOrJobNo', label: 'Tracking no. or Job no.', type: 'text' },

      { key: 'noOfCratesInspected', label: 'No. of crates inspected', type: 'number' },
      { key: 'damagedAbalone', label: 'Damaged abalone?', type: 'yesno' },
      { key: 'allScrubbedClean', label: 'All abalone scrubbed clean?', type: 'yesno' },
      { key: 'acceptableDamageTrimmed', label: 'Acceptable damaged abalone trimmed?', type: 'yesno' },
      { key: 'processDeviation', label: 'Process deviation', type: 'textarea' },
      { key: 'checkedBy', label: 'QC online — checked by', type: 'text', required: true }
