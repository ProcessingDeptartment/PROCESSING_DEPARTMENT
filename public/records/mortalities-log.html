<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mortalities Log</title>
</head>
<body>
<div id="mlRoot"></div>

<script src="../lib/data-store.js?v=2"></script>
<script src="../lib/spec-registry.js?v=2"></script>
<script src="../lib/document-revision.js?v=1"></script>
<script src="../lib/monitoring-log.js?v=1"></script>
<script>
(function () {
  MonitoringLog.init({
    mount: '#mlRoot',
    recordKey: 'mortalities-log',
    docCode: 'Mortalities Log',
    title: 'Mortalities Log',
    docRevisionStart: 1,
    entryFields: [
      { key: 'date', label: 'Date', type: 'date', required: true },
      { key: 'mortalitiesKg', label: 'Mortalities', type: 'number', unit: 'kg' },
      { key: 'totalPack', label: 'Total pack', type: 'number', unit: 'kg' },
      { key: 'percent', label: 'Mortalities', type: 'number', unit: '%' }
    ],
    specFields: [],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
  });
})();
</script>
</body>
</html>
