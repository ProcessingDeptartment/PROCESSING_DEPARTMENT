<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.3.2 Ingredient Weighing</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="record-theme.css">
<style>
  :root{
    --ink:#1b2330; --steel:#2f4356; --steel-dk:#1d2b38; --paper:#f4f5f3;
    --line:#c9cdd1; --line-soft:#e2e4e3; --ok:#2f7a52; --ok-bg:#e8f3ec;
    --warn:#b8791c; --warn-bg:#fbf0dc; --fail:#a3352d; --fail-bg:#fbe8e6;
    --accent:#c9832b; --mono: 'IBM Plex Mono','SF Mono',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  #iw-root{ font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:13px; line-height:1.4; }
  #iw-root *{ box-sizing:border-box; }
  #iw-root h1,#iw-root h2,#iw-root h3{ margin:0; font-weight:700; }
  #iw-root input, #iw-root select, #iw-root textarea{
    font-family:var(--mono); font-size:12.5px; border:1px solid var(--line); border-radius:3px;
    padding:4px 6px; background:#fff; color:var(--ink); width:100%;
  }
  #iw-root input:focus, #iw-root select:focus, #iw-root textarea:focus{ outline:2px solid var(--steel); outline-offset:-1px; }
  #iw-root button{ font-family:var(--sans); cursor:pointer; border:none; border-radius:3px; font-weight:600; }
  .dc-top{ background:var(--steel-dk); color:#f4f1e8; padding:12px 16px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .dc-topline{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .dc-topline input{ width:120px; padding:3px 5px; font-size:11px; }
  .btn{ padding:5px 11px; font-size:11.5px; }
  .btn-primary{ background:var(--accent); color:#241a0a; }
  .btn-primary:hover{ background:#dd9536; }
  .btn-ghost{ background:transparent; color:#f4f1e8; border:1px solid #55636e !important; }
  .btn-ghost:hover{ background:#33444f; }
  .btn-flat{ background:var(--line-soft); color:var(--ink); }
  .btn-flat:hover{ background:#d5d8d6; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .dc-body{ padding:12px 14px 40px; max-width:900px; margin:0 auto; }
  .panel{ background:#fff; border:1px solid var(--line-soft); border-radius:5px; margin-bottom:10px; }
  .panel-head{ padding:7px 11px; border-bottom:1px solid var(--line-soft); background:#fbfbfa; border-radius:5px 5px 0 0; }
  .panel-head h2{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--steel); margin:0; }
  .panel-body{ padding:11px; }

  .grid{ display:grid; gap:8px; }
  .grid-6{ grid-template-columns:repeat(6,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  label.field{ display:flex; flex-direction:column; gap:2px; font-size:10.5px; color:#54606b; font-weight:600; }
  label.field input, label.field select{ font-size:11.5px; padding:3px 5px; }

  .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .status-line{ font-size:10px; color:#8a939b; font-family:var(--mono); margin-right:auto; }
  .record-status{ font-size:10px; color:#54606b; font-weight:600; padding:4px 8px; background:#e2e4e3; border-radius:3px; }
  .muted{ color:#8a939b; }
  .toast{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--steel-dk); color:#fff; padding:8px 16px; border-radius:20px; font-size:11px; z-index:999; opacity:0; pointer-events:none; transition:opacity .25s; }
  .toast.show{ opacity:1; }

  @media (max-width:900px){
    .grid-6{grid-template-columns:repeat(3,1fr);}
    .grid-4{grid-template-columns:repeat(2,1fr);}
  }
</style>
  <link rel="stylesheet" href="../responsive.css?v=1">
</head>
<body>
<div id="iw-root">
  <div class="dc-top">
    <div class="doc-line"><span class="doc-code">REC 7.3.2</span><h1>Ingredient Weighing</h1><span class="doc-rev">Rev 2 &middot; Rev date not set</span></div>
    <div class="dc-topline no-print"><button class="btn btn-flat" id="saveDraftBtn">Save</button>
      <button class="btn btn-primary" id="submitBtn">Submit</button>
    </div>
  </div>

  <div class="dc-body">
    <div class="panel">
      <div class="panel-head"><h2>Ingredients</h2></div>
      <div class="panel-body">
        <div class="grid grid-4" style="margin-bottom:8px;">
          <label class="field">Date<input id="h_date" type="date"></label>
        </div>
        <div class="grid grid-4" style="margin-bottom:8px;">
          <label class="field">Chicken flavour — weight (g)<input id="h_chickenFlavourWeight" type="number"></label>
          <label class="field">Chicken flavour — batch code<input id="h_chickenFlavourBatchCode" placeholder="Code"></label>
          <label class="field">Vegetable base — weight (g)<input id="h_vegetableBaseWeight" type="number"></label>
          <label class="field">Vegetable base — batch code<input id="h_vegetableBaseBatchCode" placeholder="Code"></label>
        </div>
        <div class="grid grid-4" style="margin-bottom:8px;">
          <label class="field">Gelatine — weight (g)<input id="h_gelatineWeight" type="number"></label>
          <label class="field">Gelatine — batch code<input id="h_gelatineBatchCode" placeholder="Code"></label>
          <label class="field">Xanthan gum — weight (g)<input id="h_xanthanGumWeight" type="number"></label>
          <label class="field">Xanthan gum — batch code<input id="h_xanthanGumBatchCode" placeholder="Code"></label>
        </div>
        <div class="grid grid-4" style="margin-bottom:8px;">
          <label class="field">Malt sugar — weight (g)<input id="h_maltSugarWeight" type="number"></label>
          <label class="field">Malt sugar — batch code<input id="h_maltSugarBatchCode" placeholder="Code"></label>
          <label class="field">Tapioca starch — weight (g)<input id="h_tapiocaStarchWeight" type="number"></label>
          <label class="field">Tapioca starch — batch code<input id="h_tapiocaStarchBatchCode" placeholder="Code"></label>
        </div>
        <div class="grid grid-4">
          <label class="field">Brown sugar — weight (g)<input id="h_brownSugarWeight" type="number"></label>
          <label class="field">Brown sugar — batch code<input id="h_brownSugarBatchCode" placeholder="Code"></label>
          <label class="field">Sherlone sauce — weight (g)<input id="h_sherloneSauceWeight" type="number"></label>
          <label class="field">Sherlone sauce — batch code<input id="h_sherloneSauceBatchCode" placeholder="Code"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Comments & Sign-off</h2></div>
      <div class="panel-body">
        <div class="grid grid-6" style="margin-bottom:8px;">
          <label class="field">Comments<textarea id="h_comments" rows="3"></textarea></label>
        </div>
        <div class="grid grid-2">
          <label class="field">Weighed by<input id="f_weighedBy"></label>
        </div>
      </div>
    </div>

    <div class="actions no-print">
      <span class="record-status" id="recordStatus"></span>
      <span class="status-line" id="statusLine"></span>
      <button class="btn btn-flat" id="exportBtn">Export JSON</button>
      <button class="btn btn-flat" id="generatePdfBtn">Print PDF</button>
    </div>
  </div>

  <div class="toast no-print" id="toast"></div>
</div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script>
/* Controlled-copy title block, repeated on every printed page.
 * docCode/recordKey are also what tools/build-master-index-data.py keys this page
 * to in the Master Index. Without them the build falls back to the file name, which
 * silently re-keys the record and orphans its stored revision history.
 * The paper revision is deliberately not stated here -- mountPrintHeader takes it
 * from the record's index row, so the issued index stays the single source. */
window.RecordDoc = { docCode: 'REC 7.3.2', recordKey: 'ingredient-weighing' };
document.addEventListener('DOMContentLoaded', function () {
  if (!window.DocHeader) return;
  window.DocHeader.mountPrintHeader({ recordKey: window.RecordDoc.recordKey })
    .catch(function (e) { console.error('title block failed to mount', e); });
});
</script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script>
(async function(){
  const $ = id => document.getElementById(id);

  function newRecord(){
    return {
      id: null, revision: 1, status:'draft',
      date:'', chickenFlavourWeight:'', chickenFlavourBatchCode:'', vegetableBaseWeight:'',
      vegetableBaseBatchCode:'', gelatineWeight:'', gelatineBatchCode:'', xanthanGumWeight:'',
      xanthanGumBatchCode:'', maltSugarWeight:'', maltSugarBatchCode:'', tapiocaStarchWeight:'',
      tapiocaStarchBatchCode:'', brownSugarWeight:'', brownSugarBatchCode:'', sherloneSauceWeight:'',
      sherloneSauceBatchCode:'', comments:'', weighedBy:'',
      createdAt: null, updatedAt: null
    };
  }

  let state = newRecord();
function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  }
  function safeKey(s){ return String(s).trim().replace(/[\s\/\\'"]+/g,'_'); }

  async function storeGet(key, shared){
    try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function storeSet(key, value, shared){
    try{ await window.storage.set(key, value, shared); return true; }
    catch(e){ return false; }
  }

  function renderForm(){
    $('h_date').value = state.date;
    $('h_chickenFlavourWeight').value = state.chickenFlavourWeight;
    $('h_chickenFlavourBatchCode').value = state.chickenFlavourBatchCode;
    $('h_vegetableBaseWeight').value = state.vegetableBaseWeight;
    $('h_vegetableBaseBatchCode').value = state.vegetableBaseBatchCode;
    $('h_gelatineWeight').value = state.gelatineWeight;
    $('h_gelatineBatchCode').value = state.gelatineBatchCode;
    $('h_xanthanGumWeight').value = state.xanthanGumWeight;
    $('h_xanthanGumBatchCode').value = state.xanthanGumBatchCode;
    $('h_maltSugarWeight').value = state.maltSugarWeight;
    $('h_maltSugarBatchCode').value = state.maltSugarBatchCode;
    $('h_tapiocaStarchWeight').value = state.tapiocaStarchWeight;
    $('h_tapiocaStarchBatchCode').value = state.tapiocaStarchBatchCode;
    $('h_brownSugarWeight').value = state.brownSugarWeight;
    $('h_brownSugarBatchCode').value = state.brownSugarBatchCode;
    $('h_sherloneSauceWeight').value = state.sherloneSauceWeight;
    $('h_sherloneSauceBatchCode').value = state.sherloneSauceBatchCode;
    $('h_comments').value = state.comments;
    $('f_weighedBy').value = state.weighedBy;
  }

  function bindInputs(){
    const fields = ['date','chickenFlavourWeight','chickenFlavourBatchCode','vegetableBaseWeight','vegetableBaseBatchCode','gelatineWeight','gelatineBatchCode','xanthanGumWeight','xanthanGumBatchCode','maltSugarWeight','maltSugarBatchCode','tapiocaStarchWeight','tapiocaStarchBatchCode','brownSugarWeight','brownSugarBatchCode','sherloneSauceWeight','sherloneSauceBatchCode','comments','weighedBy'];
    fields.forEach(f=>{
      const id = f.startsWith('weighedBy') ? 'f_'+f : 'h_'+f;
      const el = $(id);
      if(el) el.addEventListener('input', ()=>{ state[f] = el.value; });
    });
  }

  function updateRecordStatus(){
    const dateStr = state.date ? state.date : 'No date';
    const submitted = state.status === 'submitted';
    $('recordStatus').textContent = `${submitted ? '✓ Submitted' : 'Draft'} · ${dateStr} · ${state.id ? 'ID: ' + state.id.slice(-8) : 'Unsaved'}`;
  }

  function renderAll(){
    renderForm();
    updateRecordStatus();
    $('statusLine').textContent = state.updatedAt ? `Last saved ${new Date(state.updatedAt).toLocaleString()}` : 'Not yet saved';
  }

  async function saveRecord(finalize){
    const now = Date.now();
    if(!state.id){
      state.id = `ingredient_weighing_${now}`;
      state.createdAt = now;
    }
    state.updatedAt = now;
    state.status = finalize ? 'submitted' : 'draft';

    const ok = await storeSet('record:'+state.id, JSON.stringify(state), true);
    if(!ok){ toast('Save failed.'); return; }
    toast(finalize ? 'Submitted for verification.' : 'Draft saved.');
    renderAll();
  }

  function generatePdf(){
    document.title = `REC_7.3.2_INGREDIENT_WEIGHING_${state.date||''}`;
    window.print();
  }

function wire(){
bindInputs();
    $('saveDraftBtn').addEventListener('click', ()=>saveRecord(false));
    $('submitBtn').addEventListener('click', ()=>saveRecord(true));
    $('exportBtn').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ingredient_weighing_${state.date||'draft'}.json`;
      a.click();
    });
    $('generatePdfBtn').addEventListener('click', generatePdf);
  }

  wire();
  renderAll();
})();
</script>
</body>
</html>
