<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.1.0 Daily Weight Sampling</title>
<script src="../lib/shell.js?v=1"></script>
</head>
<body>
<div id="mlRoot"></div>

<script>
(function () {
  Shell.record({
    engine: 'monitoring-log',
    uses: ['lookups'],
    /* Built rather than declared: the entry fields below call Lookups.field(), and
     * lookups.js is loaded by the shell -- it is not there yet when this file parses. */
    config: function () { return {
    mount: '#mlRoot',
    recordKey: 'daily-weight-sampling',
    docCode: 'REC 7.1.0',
    title: 'Daily Weight Sampling',
    docRevisionStart: 1,
    instructions: [
      { label: 'Purpose', text: 'Sample basket weights daily by size range and farm.' }
    ],
    entryFields: [
      { key: 'date', label: 'Date', type: 'date', required: true },
      { key: 'basketNumber', label: 'Basket number', type: 'number' },
      { key: 'sizeRange', label: 'Size range', type: 'text' },
      window.Lookups.field({ key: 'farm', label: 'Farm', list: 'farms' }),
      { key: 'weight', label: 'Weight', type: 'number', unit: 'kg' },
      { key: 'comments', label: 'Comments', type: 'textarea' }
    ],
    specFields: [],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
    }; }
  });
})();
</script>
</body>
</html>
