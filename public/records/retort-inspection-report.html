<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.2.9 Retort Inspection Report</title>
</head>
<body>
<div id="mlRoot"></div>

<script src="../lib/data-store.js?v=1"></script>
<script src="../lib/spec-registry.js?v=2"></script>
<script src="../lib/document-revision.js?v=1"></script>
<script src="../lib/monitoring-log.js?v=1"></script>
<script>
(function () {
  MonitoringLog.init({
    mount: '#mlRoot',
    recordKey: 'retort-inspection-report',
    docCode: 'REC 7.2.9',
    title: 'Retort Inspection Report',
    docRevisionStart: 7,
    instructions: [
      { label: 'Frequency', text: 'For every retort run/cycle, this record must be completed. Check retort temperature & pressure for each cycle. Raise a corrective action for any deviation.' }
    ],
    entryFields: [
      { key: 'intakeDate', label: 'Intake date', type: 'date', required: true },
      { key: 'harvestFarm', label: 'Harvest farm', type: 'text' },
      { key: 'jobNo', label: 'Job no.', type: 'text' },
      { key: 'trackingCode', label: 'Tracking code', type: 'text' },
      { key: 'retortCode', label: 'Retort code', type: 'text' },
      { key: 'timeTrolleyIn', label: 'Time trolley in', type: 'text' },
      { key: 'product', label: 'Product', type: 'text' },
      { key: 'canningCode', label: 'Canning code', type: 'text' },
      { key: 'canSize', label: 'Can size', type: 'text' },
      { key: 'retortDoorRubberSprayed', label: 'Retort door rubber sprayed?', type: 'yesno' },
      { key: 'preHeatCycleDone', label: 'Pre-heat cycle done?', type: 'yesno' },
      { key: 'airFilterOk', label: 'Air filter in working condition?', type: 'yesno' },
      { key: 'stackingPatternCorrect', label: 'Correct stacking pattern followed?', type: 'yesno' },
      { key: 'recipeUsed', label: 'Recipe used', type: 'text' },
      { key: 'autoclaveTapeOnTrolley', label: 'Autoclave tape on the trolley', type: 'yesno' },
      { key: 'correctTempOnRecipe', label: 'Correct temperature on recipe?', type: 'yesno' },
      { key: 'correctPressureOnRecipe', label: 'Correct pressure on recipe?', type: 'yesno' },
      { key: 'processDeviationAlarms', label: 'Process deviation? (Alarms)', type: 'textarea' },
      { key: 'supervisor', label: 'Supervisor', type: 'text', required: true }
    ],
    specFields: [],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
  });
})();
</script>
</body>
</html>
