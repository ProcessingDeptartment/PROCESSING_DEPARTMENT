<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.8.9 Water Monitoring</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="mlRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/spec-registry.js?v=2"></script>
<script src="../lib/thresholds.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/monitoring-log.js?v=11"></script>
<script>
(function () {
  MonitoringLog.init({
    mount: '#mlRoot',
    recordKey: 'water-monitoring',
    docCode: 'REC 7.8.9',
    title: 'Water Monitoring',
    docRevisionStart: 3,
    instructions: [
      { label: 'Note', text: 'Targets for fresh water pH and sea water pH/salt are not specified on the paper form — set them under Thresholds once confirmed. Readings are recorded either way.' }
    ],
    entryFields: [
      { key: 'month', label: 'Month', type: 'month' },
      { key: 'date', label: 'Date', type: 'date', required: true },
      { key: 'freshWaterPh', label: 'Fresh water pH', type: 'number', specKey: 'freshPh' },
      { key: 'seaWaterSalt', label: 'Sea water salt', type: 'number', unit: '%', specKey: 'seaSalt' },
      { key: 'seaWaterPh', label: 'Sea water pH', type: 'number', specKey: 'seaPh' },
      { key: 'checkedBy', label: 'Checked by', type: 'text', required: true },
      { key: 'comments', label: 'Comments for any deviation', type: 'textarea' }
    ],
    specFields: [
      { key: 'freshPh', label: 'Fresh water pH', ...Thresholds.get('water-monitoring', 'freshPh') },
      { key: 'seaSalt', label: 'Sea water salt', unit: '%', ...Thresholds.get('water-monitoring', 'seaSalt') },
      { key: 'seaPh', label: 'Sea water pH', ...Thresholds.get('water-monitoring', 'seaPh') }
    ],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
  });
})();
</script>
</body>
</html>
