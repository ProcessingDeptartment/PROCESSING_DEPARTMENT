<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'traceability-mock-recall-dried-abalone',
    docCode: 'REC 8.1.7',
    title: 'Traceability & Mock Recall Checklist for Dried Abalone',
    docRevisionStart: 3,
    batchField: 'jobNo',
    stage: 'recall-dried',
    listColumns: ['date', 'agCode', 'jobNo'],
    instructions: [
      { label: 'How to fill this in', text: 'Choose the job number first — each roster row then picks from the records actually filed against that job, linking the exact submission rather than just the record type. With no job number chosen the picker falls back to the full Master Index list.' },
      { label: 'Records not traced by job number', text: 'Cleaning (REC 7.6.1, 7.6.2), Staff Hygiene (REC 7.6.7), Glass & Plastic (REC 7.7.2) and Utensil Issue (REC 7.7.4) are daily, weekly or per-shift records covering many jobs at once, so they are deliberately NOT filed against a job number and will not appear in the picker. Retrieve them by DATE RANGE for the production dates of this job and record them as Master Index picks.' }
    ],
    // Job number search-select, sourced from Abalone Receiving (REC 7.1.2) -- pick from what's
    // actually been received instead of typing blind.
    autofill: [
      { watch: 'jobNo', source: 'abalone-receiving', matchField: 'jobNo', fill: {} }
    ],
    sections: [
      { title: 'Batch details', fields: [
        { key: 'date', label: 'Date', type: 'date', required: true },
        { key: 'agCode', label: 'AG code', type: 'text' },
        { key: 'jobNo', label: 'Job no.', type: 'jobsearch' }
      ]}
    ],
    roster: {
      title: 'Records — covers Dry Cooking (7.4.0), Drying Process (7.4.1), Dry Monitoring (7.4.2), Grading Production Log (7.4.3.1/7.4.3.2), Grading & Boxing Traceability (7.4.4), Boxing & Labelling (7.4.5), Dry Stock Control (7.4.6), Labelling of Dry Boxes (7.4.7), Dry Labelling List (7.4.8), Dry Stock Transfers (7.4.9), Dried Abalone Transfer (7.4.10), incoming/COA and cleaning/hygiene records',
      columns: [
        { key: 'submissionRef', label: 'Record for this job', type: 'recordpick', source: 'jobtrace', jobField: 'jobNo', fillCode: 'recordCode', fillName: 'recordName' },
        { key: 'recordCode', label: 'REC code', type: 'text' },
        { key: 'recordName', label: 'Record name', type: 'text' },
        { key: 'summary', label: 'Summary', type: 'textarea' },
        { key: 'included', label: 'Included', type: 'select', options: ['Yes', 'No', 'N/A'] }
      ]
    }
  });
})();
