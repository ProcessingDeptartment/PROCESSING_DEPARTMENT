<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.2.9 Retort Inspection Report</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=5"></script>
<script src="../lib/lookups.js?v=1"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/permission-rules.js?v=1"></script>
<script src="../lib/form-record.js?v=14"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'retort-inspection-report',
    batchField: 'jobNo',
    docCode: 'REC 7.2.9',
    title: 'Retort Inspection Report',
    docRevisionStart: 1,
    listColumns: ['intakeDate', 'jobNo', 'retortCode'],
    // Search-select only (no date autofill) -- by this point in the process "intake date" means
    // intake into retort, not the original Abalone Receiving date, so it can't be inferred here.
    autofill: [
      { watch: 'jobNo', source: 'abalone-receiving', matchField: 'jobNo', fill: {} }
    ],
    sections: [
      { title: 'Batch info', fields: [
        { key: 'intakeDate', label: 'Intake date', type: 'date', required: true },
        { key: 'harvestFarm', label: 'Harvest farm', type: 'text' },
        { key: 'jobNo', label: 'Job no.', type: 'jobsearch' },
        { key: 'trackingCode', label: 'Tracking code', type: 'text' },
        { key: 'retortCode', label: 'Retort code', type: 'text' },
        { key: 'timeTrolleyIn', label: 'Time trolley in', type: 'text' },
        { key: 'product', label: 'Product', type: 'text' },
        { key: 'canningCode', label: 'Canning code', type: 'text' },
        { key: 'canSize', label: 'Can size', type: 'text' }
      ]},
      { title: 'Pre-retort checks', newPage: true, fields: [
        { key: 'retortDoorRubberSprayed', label: 'Retort door rubber sprayed?', type: 'yesno' },
        { key: 'preHeatCycleDone', label: 'Pre-heat cycle done?', type: 'yesno' },
        { key: 'airFilterOk', label: 'Air filter OK?', type: 'yesno' },
        { key: 'stackingPatternCorrect', label: 'Stacking pattern correct?', type: 'yesno' }
      ]},
      { title: 'Recipe & process', fields: [
        { key: 'recipeUsed', label: 'Recipe used', type: 'text' },
        { key: 'autoclaveTapeOnTrolley', label: 'Autoclave tape on trolley?', type: 'yesno' },
        { key: 'correctTempOnRecipe', label: 'Correct temp on recipe?', type: 'yesno' },
        { key: 'correctPressureOnRecipe', label: 'Correct pressure on recipe?', type: 'yesno' }
      ]},
      { title: 'Notes', fields: [
        { key: 'processDeviationAlarms', label: 'Process deviations/alarms', type: 'textarea', wide: true }
      ]}
    ]
  });
})();
</script>
</body>
</html>
