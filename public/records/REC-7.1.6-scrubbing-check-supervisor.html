<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.1.6 Scrubbing Check - Supervisor</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="mlRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/lookups.js?v=1"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=5"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/spec-registry.js?v=2"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/monitoring-log.js?v=10"></script>
<script>
(function () {
  MonitoringLog.init({
    mount: '#mlRoot',
    recordKey: 'scrubbing-check-supervisor',
    batchField: 'jobNo',
    docCode: 'REC 7.1.6',
    title: 'Scrubbing Check - Supervisor',
    docRevisionStart: 5,
    instructions: [
      { label: 'Purpose', text: 'Supervisor check that abalone is cleaned effectively during scrubbing, and any damage is recorded.' }
    ],
    // Selecting a job number that was already received on Abalone Receiving (REC 7.1.2) pulls in
    // its receiving date, harvest farm, and processing destination, so none of it needs to be
    // re-typed. Only fills empty fields.
    autofill: [
      { watch: 'jobNo', source: 'abalone-receiving', matchField: 'jobNo', fill: {
        intakeDate: 'receivingDate', harvestFarm: 'receivedFrom', processingFor: 'toBeProcessedFor'
      } }
    ],
    entryFields: [
      { key: 'intakeDate', label: 'Intake date', type: 'date', required: true },
      Lookups.field({ key: 'harvestFarm', label: 'Harvest farm', list: 'farms' }),
      { key: 'processingFor', label: 'Processing for', type: 'select', options: ['Can', 'Dried', 'Other'] },
      { key: 'jobNo', label: 'Job no.', type: 'jobsearch' },
      { key: 'abaloneSize', label: 'Abalone size', type: 'number', unit: 'g' },
      { key: 'date', label: 'Date', type: 'date' },
      { key: 'time', label: 'Time', type: 'text' },
      { key: 'productCleanedEffectively', label: 'Product cleaned effectively?', type: 'yesno' },
      { key: 'damagedAbalone', label: 'Damaged abalone?', type: 'yesno' },
      { key: 'weightDamagedAbalone', label: 'Weight damaged abalone', type: 'number', unit: 'kg' },
      { key: 'weightDamagedTrimmed', label: 'Weight damaged abalone trimmed', type: 'number', unit: 'kg' },
      { key: 'supervisor', label: 'Supervisor', type: 'text', required: true }
    ],
    specFields: [],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
  });
})();
</script>
</body>
</html>
