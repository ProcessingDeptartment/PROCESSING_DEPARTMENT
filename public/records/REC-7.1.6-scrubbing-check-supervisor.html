<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.1.6 Scrubbing Check - Supervisor</title>
<script src="../lib/shell.js?v=1"></script>
</head>
<body>
<div id="mlRoot"></div>

<script>
(function () {
  Shell.record({
    engine: 'monitoring-log',
    uses: ['lookups'],
    /* Built rather than declared: the entry fields below call Lookups.field(), and
     * lookups.js is loaded by the shell -- it is not there yet when this file parses. */
    config: function () { return {
    mount: '#mlRoot',
    recordKey: 'scrubbing-check-supervisor',
    docCode: 'REC 7.1.6',
    title: 'Scrubbing Check - Supervisor',
    docRevisionStart: 5,
    instructions: [
      { label: 'Purpose', text: 'Supervisor check that abalone is cleaned effectively during scrubbing, and any damage is recorded.' }
    ],
    entryFields: [
      { key: 'intakeDate', label: 'Intake date', type: 'date', required: true },
      window.Lookups.field({ key: 'harvestFarm', label: 'Harvest farm', list: 'farms' }),
      { key: 'processingFor', label: 'Processing for', type: 'select', options: window.Lookups.get('processingFor') },
      { key: 'jobNo', label: 'Job no.', type: 'text' },
      { key: 'abaloneSize', label: 'Abalone size', type: 'number', unit: 'g' },
      { key: 'date', label: 'Date', type: 'date' },
      { key: 'time', label: 'Time', type: 'text' },
      { key: 'productCleanedEffectively', label: 'Product cleaned effectively?', type: 'yesno' },
      { key: 'damagedAbalone', label: 'Damaged abalone?', type: 'yesno' },
      { key: 'weightDamagedAbalone', label: 'Weight damaged abalone', type: 'number', unit: 'kg' },
      { key: 'weightDamagedTrimmed', label: 'Weight damaged abalone trimmed', type: 'number', unit: 'kg' },
      { key: 'supervisor', label: 'Supervisor', type: 'text', required: true }
    ],
    specFields: [],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
    }; }
  });
})();
</script>
</body>
</html>
