<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.1 Incubator Cans Log</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="mlRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=5"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/spec-registry.js?v=2"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/monitoring-log.js?v=11"></script>
<script>
(function () {
  MonitoringLog.init({
    mount: '#mlRoot',
    recordKey: 'incubator-cans-log',
    docCode: 'REC 7.1',
    title: 'Incubator Cans Log',
    docRevisionStart: 1,
    instructions: [
      { label: 'Purpose', text: 'Track cans sent for incubation/micro testing until they are cleared.' }
    ],
    showVerificationStrip: false,
    entryFields: [
      { key: 'dateIn', label: 'Date in', type: 'datetime', required: true },
      { key: 'jobNo', label: 'Job no.', type: 'jobsearch', required: true },
      { key: 'productionCode', label: 'Production code', type: 'text', required: true,
        pattern: '^AG[0-9]{6}$', patternMessage: 'Production code must be AG followed by 6 digits, e.g. AG123456.' },
      { key: 'pieces', label: 'Pieces', type: 'textarea' },
      { key: 'quantity', label: 'Quantity', type: 'number' },
      { key: 'dateOutForMicro', label: 'Date out for micro', type: 'date' },
      { key: 'checkedBy', label: 'Checked by', type: 'text', required: true },
      { key: 'dateCleared', label: 'Date cleared', type: 'date' },
      { key: 'clearedByName', label: 'Cleared by — name', type: 'text' },
      { key: 'clearedByDate', label: 'Cleared by — date', type: 'date' }
    ],
    specFields: [],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
  });
})();
</script>
</body>
</html>
