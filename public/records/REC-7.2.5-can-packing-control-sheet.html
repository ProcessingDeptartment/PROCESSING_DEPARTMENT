<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.2.5 Can Packing Control Sheet</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
<style>
  :root{--ink:var(--palette-ink); --steel:var(--palette-primary); --steel-dk:var(--palette-dark); --paper:var(--palette-paper); --line:var(--palette-border); --line-soft:var(--palette-head-bg); --accent:var(--palette-primary); --mono:'IBM Plex Mono','SF Mono',Consolas,monospace; --sans:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;}
  #cpc-root{font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:13px; line-height:1.4;}
  #cpc-root *{box-sizing:border-box;}
  #cpc-root h1,#cpc-root h2,#cpc-root h3{margin:0; font-weight:700;}
  #cpc-root input,#cpc-root select,#cpc-root textarea{font-family:var(--mono); font-size:12.5px; border:1px solid var(--line); border-radius:3px; padding:4px 6px; background:#fff; color:var(--ink); width:100%;}
  #cpc-root input:focus,#cpc-root select:focus,#cpc-root textarea:focus{outline:2px solid var(--steel); outline-offset:-1px;}
  #cpc-root button{font-family:var(--sans); cursor:pointer; border:none; border-radius:3px; font-weight:600;}
  .dc-top{background:var(--steel-dk); color:#f4f1e8; padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;}
  .btn{padding:5px 11px; font-size:11.5px;}
  .btn-primary{background:var(--accent); color:#241a0a;}
  .btn-primary:hover{background:#dd9536;}
  .btn-flat{background:var(--line-soft); color:var(--ink);}
  .btn-flat:hover{background:#d5d8d6;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .dc-body{padding:12px 14px 40px; max-width:900px; margin:0 auto;}
  .panel{background:#fff; border:1px solid var(--line-soft); border-radius:5px; margin-bottom:10px;}
  .panel-head{padding:7px 11px; border-bottom:1px solid var(--line-soft); background:#fbfbfa; border-radius:5px 5px 0 0;}
  .panel-head h2{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--steel); margin:0;}
  .panel-body{padding:11px;}
  .grid{display:grid; gap:8px;}
  .grid-6{grid-template-columns:repeat(6,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  label.field{display:flex; flex-direction:column; gap:2px; font-size:10.5px; color:#54606b; font-weight:600;}
  label.field input,label.field select,label.field textarea{font-size:11.5px; padding:3px 5px;}
  .actions{display:flex; gap:8px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; align-items:center;}
  .status-line{font-size:10px; color:#8a939b; font-family:var(--mono); margin-right:auto;}
  .record-status{font-size:10px; color:#54606b; font-weight:600; padding:4px 8px; background:#e2e4e3; border-radius:3px;}
  .toast{position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--steel-dk); color:#fff; padding:8px 16px; border-radius:20px; font-size:11px; z-index:999; opacity:0; pointer-events:none; transition:opacity .25s;}
  .toast.show{opacity:1;}
  @media(max-width:900px){.grid-6{grid-template-columns:repeat(3,1fr);}.grid-4{grid-template-columns:repeat(2,1fr);}}
</style>
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="cpc-root">
  <div class="dc-top">
    <div class="doc-line"><span class="doc-code">REC 7.2.5</span><h1>Can Packing Control Sheet</h1><span class="doc-rev">Rev 2 &middot; Rev date not set</span></div>
  </div>
  <div class="dc-body">
    <div class="panel">
      <div class="panel-head"><h2>Pack Info</h2></div>
      <div class="panel-body">
        <div class="grid grid-6" style="margin-bottom:8px;">
          <label class="field">Date<input id="h_date" type="date"></label>
          <label class="field">Time<input id="h_time" placeholder="HH:MM"></label>
          <label class="field">Tracking no. or Job no.<input id="h_trackingOrJobNo" placeholder="No."></label>
          <label class="field">Size range<input id="h_sizeRange" placeholder="Range"></label>
          <label class="field">Quality of abalone<input id="h_qualityOfAbalone" placeholder="Notes"></label>
          <label class="field">Pieces / sizes<input id="h_piecesSizes" placeholder="Info"></label>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Weight Check</h2></div>
      <div class="panel-body">
        <div class="grid grid-4">
          <label class="field">Ingo weight spec (g)<input id="h_ingoWeightSpec" type="number"></label>
          <label class="field">Actual ingo weight (g)<input id="h_actualIngoWeight" type="number"></label>
        </div>
      </div>
    </div>
    <div class="panel no-print">
      <div class="panel-head"><h2>Deviations</h2></div>
      <div class="panel-body">
        <textarea id="h_processDeviation" rows="2" placeholder="Deviationsâ€¦" style="font-size:11px;"></textarea>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Sign-off</h2></div>
      <div class="panel-body">
        <div class="grid grid-2">
          <label class="field">Packer<input id="f_packer"></label>
          <label class="field">QC online<input id="f_qcOnline"></label>
        </div>
        <div class="grid grid-2" style="margin-top:8px;">
          <label class="field">Date<input id="f_packerDate" type="date"></label>
        </div>
      </div>
    </div>
    <div class="actions no-print">
      <span class="record-status" id="recordStatus"></span>
      <span class="status-line" id="statusLine"></span>
      <button class="btn btn-flat" id="exportBtn">Export JSON</button>
      <button class="btn btn-flat" id="generatePdfBtn">Print PDF</button>
      <button class="btn btn-flat" id="saveDraftBtn">Save</button>
      <button class="btn btn-primary" id="submitBtn">Submit</button>
    </div>
  </div>
  <div class="toast no-print" id="toast"></div>
</div>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id);
  if(window.LoginUI&&window.Auth&&!window.Auth.isAuthenticated()){await window.LoginUI.ensureAuthenticated();}
  function newRecord(){return{id:null,revision:1,status:'draft',date:'',time:'',trackingOrJobNo:'',sizeRange:'',qualityOfAbalone:'',piecesSizes:'',ingoWeightSpec:'',actualIngoWeight:'',processDeviation:'',packer:'',qcOnline:'',packerDate:'',createdAt:null,updatedAt:null};}
  let state=newRecord();
  function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
  function safeKey(s){return String(s).trim().replace(/[\s\/\\'"]+/g,'_');}
  async function storeGet(key,shared){try{const r=await window.storage.get(key,shared);return r?r.value:null;}catch(e){return null;}}
  async function storeSet(key,value,shared){try{await window.storage.set(key,value,shared);return true;}catch(e){return false;}}
  function renderForm(){$('h_date').value=state.date;$('h_time').value=state.time;$('h_trackingOrJobNo').value=state.trackingOrJobNo;$('h_sizeRange').value=state.sizeRange;$('h_qualityOfAbalone').value=state.qualityOfAbalone;$('h_piecesSizes').value=state.piecesSizes;$('h_ingoWeightSpec').value=state.ingoWeightSpec;$('h_actualIngoWeight').value=state.actualIngoWeight;$('h_processDeviation').value=state.processDeviation;$('f_packer').value=state.packer;$('f_qcOnline').value=state.qcOnline;$('f_packerDate').value=state.packerDate;}
  function bindInputs(){const fields=['date','time','trackingOrJobNo','sizeRange','qualityOfAbalone','piecesSizes','ingoWeightSpec','actualIngoWeight','processDeviation','packer','qcOnline','packerDate'];fields.forEach(f=>{const id=f.startsWith('packer')||f.startsWith('qcOnline')?'f_'+f:'h_'+f;const el=$(id);if(el)el.addEventListener('input',()=>{state[f]=el.value;});});}
  function updateRecordStatus(){const jobStr=state.trackingOrJobNo?state.trackingOrJobNo:'No job';const submitted=state.status==='submitted';$('recordStatus').textContent=`${submitted?'âœ“ Submitted':'Draft'} Â· ${jobStr} Â· ${state.id?'ID: '+state.id.slice(-8):'Unsaved'}`;}
  function renderAll(){renderForm();updateRecordStatus();$('statusLine').textContent=state.updatedAt?`Last saved ${new Date(state.updatedAt).toLocaleString()}`:'Not yet saved';}
  async function saveRecord(finalize){const now=Date.now();if(!state.id){const jobId=state.trackingOrJobNo?state.trackingOrJobNo:'NOJOB';state.id=`can_packing_${safeKey(jobId)}_${now}`;state.createdAt=now;}state.updatedAt=now;state.status=finalize?'submitted':'draft';const ok=await storeSet('record:'+state.id,JSON.stringify(state),true);if(!ok){toast('Save failed.');return;}toast(finalize?'Submitted for verification.':'Draft saved.');renderAll();}
  function generatePdf(){const jobStr=state.trackingOrJobNo?state.trackingOrJobNo:'record';document.title=`REC_7.2.5_CAN_PACKING_${safeKey(jobStr)}_${state.date||''}`;window.print();}
  function wire(){bindInputs();$('saveDraftBtn').addEventListener('click',()=>saveRecord(false));$('submitBtn').addEventListener('click',()=>saveRecord(true));$('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);const jobStr=state.trackingOrJobNo?state.trackingOrJobNo:'can_packing_draft';a.download=`can_packing_${safeKey(jobStr)}.json`;a.click();});$('generatePdfBtn').addEventListener('click',generatePdf);}
  wire();renderAll();
})();
</script>
</body>
</html>
