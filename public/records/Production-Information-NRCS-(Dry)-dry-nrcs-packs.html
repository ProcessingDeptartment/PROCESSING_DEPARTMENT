<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dry NRCS Packs — Production Information NRCS</title>
  <script src="../lib/palette-map.js"></script>
  <link rel="stylesheet" href="../styles/record-theme.css?v=2">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body class="rt-pc">
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=14"></script>
<script src="../lib/auth.js?v=2"></script>
<script src="../lib/login-ui.js?v=3"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=8"></script>
<script src="../lib/signoff-block.js?v=6"></script>
<script src="../lib/form-record.js?v=53"></script>
<script>(function () {
  // Definition (fields, sections, autofill...) lives in the DB and is fetched by the engine from
  // GET /api/record-def/dry-nrcs-packs (same as the Dry Export Pack Front Page).
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'dry-nrcs-packs'
  });
})();
</script>
<script src="../lib/record-shell.js?v=6"></script>
<script>
(function () {
  // Live list of EVERY record submission linked to the selected job number (read-only, always
  // current, nothing is dropped). Top table = the records this pack expects, with Attached Yes/No;
  // bottom table = every other linked record, so no submission is ever left out.
  var EXPECTED = [
    ['REC 7.1.2 Abalone Receiving', ['abalone-receiving']],
    ['REC 7.1.1 Basket Removal / Shucking / Gutting', ['basket-removal-shucking-gutting']],
    ['REC 7.1.3 Bleeding & Salting Checklist', ['salting-and-tumbling', 'bleeding-and-salting']],
    ['REC 7.1.4 Washing Control Sheet', ['washing-control-sheet']],
    ['REC 7.8.1 Chiller Batch Control', ['dry-chiller-batch-control', 'chiller-batch-control']],
    ['REC 7.4.0 Dry Cooking', ['dry-cooking']],
    ['REC 7.4.2 Dry Monitoring', ['dry-monitoring']],
    ['REC 7.4.3 Grading / Packing / Boxing of Dried Abalone', ['grading-production-log-cultivated', 'grading-production-log-ranched']]
  ];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var lastJob = null, panel = null;
  function ensurePanel() {
    var host = document.getElementById('fr_modalSections');
    if (!host) return null;
    if (panel && host.contains(panel)) return panel;
    panel = document.createElement('div');
    panel.id = 'linkedRecordsPanel';
    panel.style.cssText = 'margin-top:16px';
    host.appendChild(panel);
    return panel;
  }
  function badge(st) { return st === 'verified' ? 'Verified' : st === 'draft' ? 'Draft — not yet submitted' : 'Awaiting verification'; }
  function codeOf(codes, key) { return codes[key] || ''; }
  function item(r, codes) {
    var name = esc((codeOf(codes, r.record_key) ? codeOf(codes, r.record_key) + ' — ' : '') + (r.record_title || r.record_key)) +
      (r.stage ? ' [' + esc(r.stage) + ']' : '') + (r.occurred_on ? ' · ' + esc(r.occurred_on) : '') + ' · ' + badge(r.status);
    return r.href ? '<a href="' + esc(r.href) + '" target="_blank" rel="noopener">' + name + '</a>' : name;
  }
  async function render(jobNo) {
    var p = ensurePanel(); if (!p) return;
    var h = function (t) { return '<h3 style="margin:0 0 6px">' + t + '</h3>'; };
    if (!jobNo) { p.innerHTML = h('Records linked to this job') + '<div class="fr-muted">Select a job number to list every record linked to it.</div>'; return; }
    p.innerHTML = h('Records linked to ' + esc(jobNo)) + '<div class="fr-muted">Loading…</div>';
    var rows = [], failed = false;
    try { rows = window.Traceability ? await window.Traceability.trace(jobNo) : []; } catch (e) { failed = true; }
    if (jobNo !== lastJob) return;
    if (failed || !window.Traceability) { p.innerHTML = h('Records linked to ' + esc(jobNo)) + '<div class="fr-muted">Could not load linked records — check your connection and re-select the job number.</div>'; return; }
    var codes = {};
    ((window.MasterIndexData && window.MasterIndexData.rows) || []).forEach(function (r) { if (r.recordKey) codes[r.recordKey] = String(r.docNo || '').trim(); });
    var seen = {}, list = [];
    rows.forEach(function (r) { var k = r.record_key + '|' + r.submission_id; if (!seen[k]) { seen[k] = 1; list.push(r); } });
    list.sort(function (a, b) { return String(a.occurred_on || '').localeCompare(String(b.occurred_on || '')); });
    var used = {};
    var expectedRows = EXPECTED.map(function (e) {
      var hits = list.filter(function (r) { return e[1].indexOf(r.record_key) !== -1; });
      hits.forEach(function (r) { used[r.record_key + '|' + r.submission_id] = 1; });
      return '<tr><td>' + esc(e[0]) + '</td><td><strong>' + (hits.length ? 'Yes' : 'No') + '</strong>' + (hits.length > 1 ? ' (' + hits.length + ')' : '') + '</td><td>' +
        (hits.length ? hits.map(function (r) { return '<div>' + item(r, codes) + '</div>'; }).join('') : '<span class="fr-muted">Not found for this job</span>') + '</td></tr>';
    }).join('');
    var others = list.filter(function (r) { return !used[r.record_key + '|' + r.submission_id]; });
    var t = 'class="fr-table" style="width:100%"';
    p.innerHTML = h('Records linked to ' + esc(jobNo) + ' (' + list.length + ' submission' + (list.length === 1 ? '' : 's') + ')') +
      '<div class="fr-table-wrap"><table ' + t + '><thead><tr><th>Record</th><th>Attached</th><th>Linked submissions</th></tr></thead><tbody>' + expectedRows + '</tbody></table></div>' +
      (others.length ? '<h3 style="margin:14px 0 6px">Other records linked to this job (' + others.length + ')</h3><div class="fr-table-wrap"><table ' + t + '><tbody>' +
        others.map(function (r) { return '<tr><td>' + item(r, codes) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '');
  }
  function check() {
    var el = document.getElementById('fr_f_jobNo');
    var job = el ? String(el.value || '').trim() : '';
    if (job !== lastJob) { lastJob = job; render(job); }
  }
  setInterval(check, 800);   // job number can come from the picker, autofill or a reopened draft
})();
</script>
</body>
</html>
