<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dry NRCS Packs — Production Information NRCS</title>
  <script src="../lib/palette-map.js"></script>
  <link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/form-record.js?v=20"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'dry-nrcs-packs',
    docCode: 'Production Information NRCS (Dry)',
    title: 'Dry NRCS Packs — Production Information NRCS',
    docRevisionStart: 1,
    listColumns: ['jobNumberProductionDate', 'nrcsAgCode'],
    // Job number search-select, sourced from Abalone Receiving (REC 7.1.2) -- pick from what's
    // actually been received instead of typing blind.
    // Picking one also fills in the receiving date of that job, where this form's own
    // field is still empty. The free-text 'Job number / production date' line is kept as
    // captured -- it carries a production date too, which the picker does not.
    autofill: [
      { watch: 'jobNumber', source: 'abalone-receiving', matchField: 'jobNo',
        fill: { receivingDate: 'receivingDate' } }
    ],
    sections: [
      { title: 'Batch details', fields: [
        { key: 'receivingDate', label: 'Receiving date', type: 'date', required: true },
        { key: 'dateOfInspection', label: 'Date of inspection', type: 'date' },
        { key: 'jobNumberProductionDate', label: 'Job number / production date', type: 'text' },
        { key: 'jobNumber', label: 'Job number', type: 'jobsearch' },
        { key: 'nrcsAgCode', label: 'NRCS AG code', type: 'text' },
        { key: 'productDescription', label: 'Product description', type: 'text' }
      ]},
      { title: 'Sign-off', fields: [
        { key: 'checkedByQC', label: 'Checked by (QC)', type: 'text', required: true },
        { key: 'verificationBy', label: 'Verification by', type: 'text' }
      ]}
    ],
    roster: {
      title: 'Records included — Abalone Receiving (7.1.2), Basket Removal/Shucking/Gutting (7.1.1), Bleeding & Salting Checklist (7.1.3), Washing Control Sheet (7.1.4), Chiller Batch Control (7.8.1), Dry Cooking (7.4.0), Dry Monitoring (7.4.2), Grading/Packing/Boxing of Dried Abalone (7.4.3)',
      columns: [
        { key: 'recordName', label: 'Record', type: 'text' },
        { key: 'recordCode', label: 'REC code', type: 'text' },
        { key: 'included', label: 'Included', type: 'select', options: ['Yes', 'No', 'N/A'] }
      ]
    }
  });
})();
</script>
</body>
</html>
