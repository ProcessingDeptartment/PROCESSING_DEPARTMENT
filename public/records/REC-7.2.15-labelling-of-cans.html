<script>

  FormRecord.init({
    mount: '#frRoot',

    listColumns: ['date', 'labelUsed', 'clientDetails'],

      { title: 'Pre-labelling', fields: [
        { key: 'date', label: 'Date', type: 'date', required: true },
        { key: 'labelUsed', label: 'Label used', type: 'text' },
