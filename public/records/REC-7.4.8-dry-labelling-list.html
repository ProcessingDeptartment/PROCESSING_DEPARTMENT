<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.4.8 Dry Labelling List</title>
  <script src="../lib/palette-map.js"></script>
  <link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/form-record.js?v=19"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'dry-labelling-list',
    batchField: 'agCode',
    stage: 'dry-labelling',
    docCode: 'REC 7.4.8',
    title: 'Dry Labelling List',
    docRevisionStart: 2,
    listColumns: ['customer', 'flight', 'nettWeight'],
    sections: [
      { title: 'Shipment details', fields: [
        { key: 'customer', label: 'Customer', type: 'text', required: true },
        { key: 'flight', label: 'Flight', type: 'text' },
        { key: 'address', label: 'Address', type: 'text', wide: true },
        { key: 'airwaybillNr', label: 'Airwaybill nr.', type: 'text' },
        { key: 'etd', label: 'ETD', type: 'date' },
        { key: 'nettWeight', label: 'Nett weight', type: 'number' }
      ]},
      { title: 'Sign-off', fields: [
        { key: 'salesDept', label: 'Sales dept.', type: 'text' },
        { key: 'driverFromFreightCo', label: 'Driver from freight company', type: 'text' },
        { key: 'abagoldEmployee', label: 'Abagold employee', type: 'text', required: true }
      ]}
    ],
    roster: {
      title: 'Boxes',
      columns: [
        { key: 'boxNo', label: 'Box no.', type: 'number' },
        { key: 'gradeRange', label: 'Grade range', type: 'select', options: ['30-40g', '40-50g', '50-60g', '60-70g', '70-90g', '90-110g', '110-150g', '150-200g', '350-500g', 'Wild'] },
        { key: 'boxCode', label: 'Box code', type: 'text' },
        { key: 'agCode', label: 'NRCS AG code', type: 'text' },
        { key: 'weight', label: 'Weight (kg)', type: 'number' }
      ]
    }
  });
})();
</script>
</body>
</html>
