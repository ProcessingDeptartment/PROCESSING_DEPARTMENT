<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.3.6 Brine Mixing Report</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/lookups.js?v=4"></script>
<script src="../lib/auth.js?v=2"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=6"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/permission-rules.js?v=1"></script>
<script src="../lib/form-record.js?v=27"></script>
<script>(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'brine-mixing-report',
    batchField: 'jobNumber',
    docCode: 'REC 7.3.6',
    title: 'Brine Mixing Report',
    docRevisionStart: 1,

    autofill: [
      { watch: 'jobNumber', source: 'abalone-receiving', matchField: 'jobNo', fill: {
          jiReceivingDate: 'receivingDate',
          jiReceivedFrom: 'receivedFrom',
          jiProcessingFor: 'toBeProcessedFor',
          jiIntakeWeight: 'intakeWeight'
        } }
    ],
    listColumns: ['date', 'jobNumber', 'productDescription'],
    sections: [
      { title: 'Job info', collapsible: true, summaryField: ['jobNumber', 'jiProcessingFor'], fields: [
        { key: 'jobNumber', label: 'Job number', type: 'jobsearch' },
        { key: 'jiReceivingDate', label: 'Receiving date', type: 'date', readOnly: true },
        { key: 'jiReceivedFrom', label: 'Received from (farm)', type: 'text', readOnly: true },
        { key: 'jiProcessingFor', label: 'Processing for', type: 'text', readOnly: true },
        { key: 'jiIntakeWeight', label: 'Intake weight (kg)', type: 'text', readOnly: true }
      ]},
      { title: 'Batch info', fields: [
        { key: 'date', label: 'Date', type: 'date', required: true },
        { key: 'sample', label: 'Sample', type: 'text' },
        { key: 'productDescription', label: 'Product description', type: 'text' },
        { key: 'productionDateIngo', label: 'Production date (ingo)', type: 'date' },
        { key: 'canPieces', label: 'Can pieces', type: 'number' }
      ]},
      { title: 'Product specs', newPage: true, fields: [
        { key: 'nettWeightMin', label: 'Nett weight min', type: 'number' },
        { key: 'drainMassMin', label: 'Drain mass min', type: 'number' },
        { key: 'drainMassMax', label: 'Drain mass max', type: 'number' }
      ]},
      { title: 'Salt', fields: [
        { key: 'saltG', label: 'Salt (g)', type: 'number' },
        { key: 'saltBatchNo', label: 'Salt batch no.', type: 'text' },
        { key: 'saltPercent', label: 'Salt (%)', type: 'number' }
      ]},
      { title: 'Sugar', fields: [
        { key: 'sugarG', label: 'Sugar (g)', type: 'number' },
        { key: 'sugarBatchNo', label: 'Sugar batch no.', type: 'text' },
        { key: 'sugarPercent', label: 'Sugar (%)', type: 'number' }
      ]},
      { title: 'Malt', fields: [
        { key: 'maltG', label: 'Malt (g)', type: 'number' },
        { key: 'maltBatchNo', label: 'Malt batch no.', type: 'text' }
      ]},
      { title: 'Notes', fields: [
        { key: 'commentsDeviations', label: 'Comments/deviations', type: 'textarea', wide: true }
      ]}
    ]
  });
})();
</script>
</body>
</html>
