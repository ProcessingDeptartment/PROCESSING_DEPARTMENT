<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.7.5 Glove Issuing Register</title>
<script src="../lib/shell.js?v=1"></script>
</head>
<body>
<div id="mlRoot"></div>

<script>
(function () {
  Shell.record({
    engine: 'monitoring-log',
    mount: '#mlRoot',
    recordKey: 'glove-issuing-register',
    docCode: 'REC 7.7.5',
    title: 'Glove Issuing Register',
    docRevisionStart: 9,
    entryFields: [
      { key: 'date', label: 'Date', type: 'date', required: true },
      { key: 'personAllocated', label: 'Person allocated', type: 'text', required: true },
      { key: 'quantityIssued', label: 'Quantity issued', type: 'number' },
      { key: 'conditionWhenReturned', label: 'Condition of gloves when returned', type: 'text' },
      { key: 'correctiveAction', label: 'Action / corrective action taken (not returned, broken etc.)', type: 'textarea' },
      { key: 'signature', label: 'Signature', type: 'text' }
    ],
    specFields: [],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
  });
})();
</script>
</body>
</html>
