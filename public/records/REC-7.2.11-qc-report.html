<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.2.11 QC Report</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/api-backend.js?v=1"></script>
<script src="../lib/lookups.js?v=1"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/permission-rules.js?v=1"></script>
<script src="../lib/form-record.js?v=8"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'qc-report',
    docCode: 'REC 7.2.11',
    title: 'QC Report',
    docRevisionStart: 1,
    // Job number search-select, sourced from Abalone Receiving (REC 7.1.2) -- pick from what's
    // actually been received instead of typing blind.
    autofill: [
      { watch: 'jobNumber', source: 'abalone-receiving', matchField: 'jobNo', fill: {} }
    ],
    listColumns: ['date', 'jobNumber', 'productDescription'],
    batchField: 'jobNumber',
    stage: 'quality',
    sections: [
      { title: 'Batch info', fields: [
        { key: 'date', label: 'Date', type: 'date', required: true },
        { key: 'harvestFarm', label: 'Harvest farm', type: 'text' },
        { key: 'productionCode', label: 'Production code', type: 'text' },
        { key: 'productDescription', label: 'Product description', type: 'text' },
        { key: 'jobNumber', label: 'Job number', type: 'jobsearch' }
      ]},
      { title: 'Measurements', newPage: true, fields: [
        { key: 'canPieces', label: 'Can pieces', type: 'number' },
        { key: 'nettMassMin', label: 'Nett mass min', type: 'number' },
        { key: 'drainMassMin', label: 'Drain mass min', type: 'number' },
        { key: 'drainMassMax', label: 'Drain mass max', type: 'number' },
        { key: 'ph', label: 'pH', type: 'number' },
        { key: 'brix', label: 'Brix', type: 'number' },
        { key: 'waterReading', label: 'Water reading', type: 'number' },
        { key: 'saltPercent', label: 'Salt (%)', type: 'number' },
        { key: 'vacuum', label: 'Vacuum', type: 'number' }
      ]},
      { title: 'Visual checks', fields: [
        { key: 'rustOnCans', label: 'Rust on cans?', type: 'yesno' },
        { key: 'rustOnLids', label: 'Rust on lids?', type: 'yesno' },
        { key: 'dentsOnBatch', label: 'Dents on batch?', type: 'yesno' },
        { key: 'oddOursOnOpening', label: 'Odd odours on opening?', type: 'yesno' },
        { key: 'damagedPcsInCans', label: 'Damaged pieces in cans?', type: 'yesno' },
        { key: 'bluingBlackSpots', label: 'Bluing/black spots?', type: 'yesno' },
        { key: 'sauceColour', label: 'Sauce colour OK?', type: 'yesno' },
        { key: 'visualAppearance', label: 'Visual appearance OK?', type: 'yesno' },
        { key: 'textureOfAbalone', label: 'Texture of abalone OK?', type: 'yesno' },
        { key: 'tasteOfProduct', label: 'Taste of product OK?', type: 'yesno' }
      ]},
      { title: 'Notes', fields: [
        { key: 'comments', label: 'Comments', type: 'textarea', wide: true }
      ]}
    ]
  });
})();
</script>
</body>
</html>
