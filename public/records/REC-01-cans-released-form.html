<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 01 Cans Released Form</title>
<script src="../lib/shell.js?v=1"></script>
</head>
<body>
<div id="mlRoot"></div>

<script>
(function () {
  Shell.record({
    engine: 'monitoring-log',
    mount: '#mlRoot',
    recordKey: 'cans-released-form',
    docCode: 'REC 01',
    title: 'Cans Released Form (Awaiting NRCS Releases)',
    docRevisionStart: 1,
    instructions: [
      { label: 'Purpose', text: 'Record cans released from hold, awaiting NRCS clearance.' }
    ],
    entryFields: [
      { key: 'date', label: 'Date', type: 'date', required: true },
      { key: 'noOfPieces', label: 'No. of pieces', type: 'number' },
      { key: 'brineOrBraised', label: 'Brine / Braised', type: 'select', options: ['Brine', 'Braised'] },
      { key: 'noOfGrams', label: 'No. of grams', type: 'number' },
      { key: 'noOfCans', label: 'No. of cans', type: 'number' },
      { key: 'agCode', label: 'AG code', type: 'text' },
      { key: 'checkedByQC', label: 'Checked by (QC)', type: 'text', required: true }
    ],
    specFields: [],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
  });
})();
</script>
</body>
</html>
