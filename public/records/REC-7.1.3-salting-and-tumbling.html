<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.1.3 Salting and Tumbling</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/lookups.js?v=4"></script>
<script src="../lib/auth.js?v=2"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=6"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/permission-rules.js?v=1"></script>
<script src="../lib/form-record.js?v=27"></script>
<script>(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'salting-and-tumbling',
    batchField: 'jobNo',
    docCode: 'REC 7.1.3',
    title: 'Salting and Tumbling',
    docRevisionStart: 1,
    stage: 'salting',

    autofill: [
      { watch: 'jobNo', source: 'abalone-receiving', matchField: 'jobNo',
        fill: { intakeDate: 'receivingDate', harvestFarm: 'receivedFrom', processingFor: 'toBeProcessedFor', jiIntakeWeight: 'intakeWeight' },

        restrict: { sizeRange: 'sizeRange' } }
    ],
    listColumns: ['date', 'jobNo', 'intakeDate', 'processingFor'],
    sections: [
      { title: 'Job info', collapsible: true, summaryField: ['jobNo', 'processingFor'], fields: [
        { key: 'jobNo', label: 'Job no.', type: 'jobsearch' },
        { key: 'intakeDate', label: 'Intake date', type: 'date' },
        { key: 'harvestFarm', label: 'Harvest farm', type: 'text' },
        { key: 'jiIntakeWeight', label: 'Intake weight (kg)', type: 'text', readOnly: true },
        { key: 'date', label: 'Date', type: 'date', required: true },
        { key: 'processingFor', label: 'Processing for', type: 'select', options: ['Can', 'Dried', 'Other'], matchJobRoute: 'jobNo' }
      ]},

      { title: 'Sign-off', newPage: true, fields: [
        { key: 'qualityController', label: 'Quality controller', type: 'text' },
        { key: 'processDeviation', label: 'Process deviation', type: 'textarea', wide: true }
      ]}
    ],

    roster: {
      title: 'Salting batches',
      batchIdColumn: 'batchId',
      columns: [

        { key: 'batchId', label: 'Batch', type: 'batchseq' },
        Lookups.field({ key: 'sizeRange', label: 'Size range', list: 'sizeRanges' }),

        { key: 'standardSaltingTime', label: 'Standard salting time', type: 'derived',
          deriveLookup: { from: 'sizeRange', map: 'saltingStandardTimes' } },
        { key: 'noOfCrates', label: 'No. of crates', type: 'number' },
        { key: 'startTime', label: 'Start time', type: 'time' },
        { key: 'finishTime', label: 'Finish time', type: 'time' },

        { key: 'totalTumblingTime', label: 'Total tumbling time', type: 'derived',
          deriveDuration: { from: 'startTime', to: 'finishTime' } },
        { key: 'shuckWeight', label: 'Shuck weight (kg)', type: 'number' },
        { key: 'saltKg', label: 'Salt (kg)', type: 'number' },
        { key: 'saltPercentUsed', label: 'Salt % used', type: 'number' },
        { key: 'saltBatchCode', label: 'Salt batch code', type: 'text' },
        { key: 'bakingSodaKg', label: 'Baking soda (kg)', type: 'number' },
        { key: 'bakingSodaBatchCode', label: 'Baking soda batch code', type: 'text' },
        { key: 'sugarKg', label: 'Sugar (kg)', type: 'number' },
        { key: 'sugarPercentUsed', label: 'Sugar % used', type: 'number' },
        { key: 'sugarBatchCode', label: 'Sugar batch code', type: 'text' }
      ]
    }
  });
})();
</script>


<script src="../lib/record-shell.js?v=6"></script>
</body>
</html>
