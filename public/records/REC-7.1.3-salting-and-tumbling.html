<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.1.3 Salting and Tumbling</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/lookups.js?v=1"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=4"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/permission-rules.js?v=1"></script>
<script src="../lib/form-record.js?v=20"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'salting-and-tumbling',
    batchField: 'jobNo',
    // The salt/baking soda/sugar batch codes used on this job become searchable in their own
    // right (batch-trace.html), cross-linked back to the job number.
    extraBatchFields: ['saltBatchCode', 'bakingSodaBatchCode', 'sugarBatchCode'],
    docCode: 'REC 7.1.3',
    title: 'Salting and Tumbling',
    docRevisionStart: 1,
    // Job number search-select, sourced from Abalone Receiving (REC 7.1.2) -- pick from what's
    // actually been received instead of typing blind.
    // Picking one also fills in what that job already carries (processingFor),
    // only where this form's own field is still empty.
    // The size range picker is narrowed to the sizes actually received on that job.
    autofill: [
      { watch: 'jobNo', source: 'abalone-receiving', matchField: 'jobNo',
        fill: { processingFor: 'toBeProcessedFor' },
        restrict: { sizeRange: 'sizeRange' } }
    ],
    listColumns: ['date', 'jobNo', 'sizeRange'],
    sections: [
      { title: 'Batch info', fields: [
        { key: 'date', label: 'Date', type: 'date', required: true },
        { key: 'processingFor', label: 'Processing for', type: 'select', options: ['Can', 'Dried', 'Other'] },
        { key: 'jobNo', label: 'Job no.', type: 'jobsearch' },
        Lookups.field({ key: 'sizeRange', label: 'Size range', list: 'sizeRanges' }),
        { key: 'noOfCrates', label: 'No. of crates', type: 'number' },
        { key: 'standardSaltingTime', label: 'Standard salting time', type: 'text' }
      ]},
      { title: 'Process timeline', newPage: true, fields: [
        { key: 'startTime', label: 'Start time', type: 'text' },
        { key: 'finishTime', label: 'Finish time', type: 'text' },
        { key: 'shuckWeight', label: 'Shuck weight (kg)', type: 'number' },
        { key: 'totalTumblingTime', label: 'Total tumbling time', type: 'text' }
      ]},
      { title: 'Salting mix', fields: [
        { key: 'saltKg', label: 'Salt (kg)', type: 'number' },
        { key: 'saltPercent', label: 'Salt (%)', type: 'number' },
        { key: 'saltBatchCode', label: 'Salt batch code', type: 'text' },
        { key: 'bakingSodaG', label: 'Baking soda (g)', type: 'number' },
        { key: 'bakingSodaBatchCode', label: 'Baking soda batch code', type: 'text' },
        { key: 'sugarKg', label: 'Sugar (kg)', type: 'number' },
        { key: 'sugarPercent', label: 'Sugar (%)', type: 'number' },
        { key: 'sugarBatchCode', label: 'Sugar batch code', type: 'text' }
      ]},
      { title: 'Sign-off', fields: [
        { key: 'qualityController', label: 'Quality controller', type: 'text' },
        { key: 'processDeviation', label: 'Process deviation', type: 'textarea', wide: true }
      ]}
    ]
  });
})();
</script>
</body>
</html>
