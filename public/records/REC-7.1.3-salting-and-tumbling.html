<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.1.3 Salting and Tumbling</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/lookups.js?v=2"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=5"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/permission-rules.js?v=1"></script>
<script src="../lib/form-record.js?v=23"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'salting-and-tumbling',
    batchField: 'jobNo',
    docCode: 'REC 7.1.3',
    title: 'Salting and Tumbling',
    docRevisionStart: 1,
    stage: 'salting',
    // Job number search-select, sourced from Abalone Receiving (REC 7.1.2) -- pick from what's
    // actually been received instead of typing blind. Picking one also fills in what that job
    // already carries (processingFor), only where this form's own field is still empty.
    autofill: [
      { watch: 'jobNo', source: 'abalone-receiving', matchField: 'jobNo',
        fill: { intakeDate: 'receivingDate', harvestFarm: 'receivedFrom', processingFor: 'toBeProcessedFor', jiIntakeWeight: 'intakeWeight' } }
    ],
    listColumns: ['date', 'jobNo', 'intakeDate', 'processingFor'],
    sections: [
      { title: 'Job info', collapsible: true, summaryField: 'jobNo', fields: [
        { key: 'jobNo', label: 'Job no.', type: 'jobsearch' },
        { key: 'intakeDate', label: 'Intake date', type: 'date' },
        { key: 'harvestFarm', label: 'Harvest farm', type: 'text' },
        { key: 'jiIntakeWeight', label: 'Intake weight (kg)', type: 'text', readOnly: true },
        { key: 'date', label: 'Date', type: 'date', required: true },
        { key: 'processingFor', label: 'Processing for', type: 'select', options: ['Can', 'Dried', 'Other'] }
      ]},
      // One sign-off covers every batch on the job (see roster below).
      { title: 'Sign-off', newPage: true, fields: [
        { key: 'qualityController', label: 'Quality controller', type: 'text' },
        { key: 'processDeviation', label: 'Process deviation', type: 'textarea', wide: true }
      ]}
    ],
    // A job runs many salting/tumbling batches before sign-off. Each row is one batch with its
    // own short id, size, times and salting mix.
    roster: {
      title: 'Salting batches',
      batchIdColumn: 'batchId',
      columns: [
        // "<job no>/<n>" -- read-only, set from the job number + row position.
        { key: 'batchId', label: 'Batch', type: 'batchseq' },
        Lookups.field({ key: 'sizeRange', label: 'Size range', list: 'sizeRanges' }),
        // Auto-populated from the size range via Lookups.lists.saltingStandardTimes
        // (fill those values in lookups.js). Read-only.
        { key: 'standardSaltingTime', label: 'Standard salting time', type: 'derived',
          deriveLookup: { from: 'sizeRange', map: 'saltingStandardTimes' } },
        { key: 'noOfCrates', label: 'No. of crates', type: 'number' },
        { key: 'startTime', label: 'Start time', type: 'time' },
        { key: 'finishTime', label: 'Finish time', type: 'time' },
        // finishTime - startTime (hh:mm), wrapping past midnight. Read-only.
        { key: 'totalTumblingTime', label: 'Total tumbling time', type: 'derived',
          deriveDuration: { from: 'startTime', to: 'finishTime' } },
        { key: 'shuckWeight', label: 'Shuck weight (kg)', type: 'number' },
        { key: 'saltKg', label: 'Salt (kg)', type: 'number' },
        { key: 'saltPercentUsed', label: 'Salt % used', type: 'number' },
        { key: 'saltBatchCode', label: 'Salt batch code', type: 'text' },
        { key: 'bakingSodaKg', label: 'Baking soda (kg)', type: 'number' },
        { key: 'bakingSodaBatchCode', label: 'Baking soda batch code', type: 'text' },
        { key: 'sugarKg', label: 'Sugar (kg)', type: 'number' },
        { key: 'sugarPercentUsed', label: 'Sugar % used', type: 'number' },
        { key: 'sugarBatchCode', label: 'Sugar batch code', type: 'text' }
      ]
    }
  });
})();
</script>

<!-- ============================================================================
     Page-specific: narrow the roster's "Size range" picker to the sizes the picked
     job was ACTUALLY received as (REC 7.1.2). The shared engine's `restrict:` only
     narrows top-level fields, not roster columns, so this hooks the roster from
     outside -- same pattern as REC 7.1.2's basket panel.

     Fails OPEN: no job picked, lookup unreachable, or nothing in common with the
     preset list all restore the full list. A too-wide picker is a nuisance; an
     empty one stops the shift. A value already captured is always kept selectable.
============================================================================ -->
<script>
(function () {
  'use strict';
  var CACHE = {};            // jobNo -> [allowed size ranges] | null
  var full = null;           // full preset list, captured once

  function fullList() {
    if (!full) full = (window.Lookups && window.Lookups.get('sizeRanges')) || [];
    return full;
  }
  function jobNo() {
    var i = document.getElementById('fr_f_jobNo');
    return i ? String(i.value || '').trim() : '';
  }

  function fetchAllowed(job) {
    if (!job) return Promise.resolve(null);
    if (job in CACHE) return Promise.resolve(CACHE[job]);
    var p = '/api/lookup/abalone-receiving/jobNo/' + encodeURIComponent(job);
    var req = window.FacilityApi ? window.FacilityApi.fetch(p)
      : fetch((window.FACILITY_API_BASE || 'https://processing-department-api.onrender.com') + p);
    return req.then(function (r) { return r.ok ? r.json() : null; })
      .then(function (found) {
        var list = found && found.__rosterOptions && found.__rosterOptions.sizeRange;
        CACHE[job] = (Array.isArray(list) && list.length) ? list : null;
        return CACHE[job];
      })
      .catch(function () { return null; });
  }

  function narrow(sel, allowed) {
    if (!sel._allOpts) {
      sel._allOpts = Array.prototype.map.call(sel.options, function (o) {
        return { value: o.value, text: o.textContent };
      });
    }
    var current = sel.value;
    var keep;
    if (allowed && allowed.length) {
      var want = {};
      allowed.forEach(function (v) { want[String(v).trim().toLowerCase()] = 1; });
      keep = sel._allOpts.filter(function (o) {
        return o.value === '' || want[String(o.value).trim().toLowerCase()];
      });
      if (keep.filter(function (o) { return o.value !== ''; }).length === 0) keep = sel._allOpts;
    } else {
      keep = sel._allOpts;
    }
    if (current && !keep.some(function (o) { return o.value === current; })) {
      keep = keep.concat([{ value: current, text: current }]);
    }
    sel.innerHTML = '';
    keep.forEach(function (o) {
      var opt = document.createElement('option');
      opt.value = o.value; opt.textContent = o.text;
      sel.appendChild(opt);
    });
    sel.value = current;
  }

  function apply() {
    var host = document.getElementById('fr_rosterRows');
    if (!host) return;
    var sels = host.querySelectorAll('select[id$="_sizeRange"]');
    if (!sels.length) return;
    fetchAllowed(jobNo()).then(function (allowed) {
      sels.forEach(function (s) { narrow(s, allowed); });
    });
  }

  (function boot() {
    var host = document.getElementById('fr_rosterRows');
    if (!host || !window.Lookups) { setTimeout(boot, 200); return; }
    var pending = false;
    new MutationObserver(function () {
      if (pending) return;
      pending = true;
      setTimeout(function () { pending = false; apply(); }, 0);
    }).observe(host, { childList: true, subtree: true });
    var job = document.getElementById('fr_f_jobNo');
    if (job) ['change', 'input'].forEach(function (e) { job.addEventListener(e, apply); });
    apply();
  })();
})();
</script>
</body>
</html>
