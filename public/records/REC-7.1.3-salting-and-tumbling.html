<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.1.3 Salting and Tumbling</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
<style>
  :root{
    --ink:var(--palette-ink); --steel:var(--palette-heading); --steel-dk:var(--palette-dark); --paper:var(--palette-paper);
    --line:#c9cdd1; --line-soft:var(--palette-border); --ok:var(--palette-ok); --ok-bg:var(--palette-ok-bg);
    --warn:#b8791c; --warn-bg:#fbf0dc; --fail:var(--palette-fail); --fail-bg:var(--palette-fail-bg);
    --accent:var(--palette-primary); --mono: 'IBM Plex Mono','SF Mono',Consolas,monospace;
    --sans: 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  #st-root{ font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:var(--form-fs-root); line-height:1.4; }
  #st-root *{ box-sizing:border-box; }
  #st-root h1,#st-root h2,#st-root h3{ margin:0; font-weight:700; }
  #st-root input, #st-root select, #st-root textarea{
    font-family:var(--mono); font-size:var(--form-fs-input); border:1px solid var(--line); border-radius:3px;
    padding:4px 6px; background:#fff; color:var(--ink); width:100%;
  }
  #st-root input:focus, #st-root select:focus, #st-root textarea:focus{ outline:2px solid var(--steel); outline-offset:-1px; }
  #st-root button{ font-family:var(--sans); cursor:pointer; border:none; border-radius:3px; font-weight:600; }
  .dc-top{ background:var(--steel-dk); color:var(--palette-dark-text); padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .dc-topline{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .dc-topline input{ width:120px; padding:3px 5px; font-size:var(--form-fs-small); }
  .btn{ padding:5px 11px; font-size:var(--form-fs-button); }
  .btn-primary{ background:var(--accent); color:var(--palette-primary-text); }
  .btn-primary:hover{ background:var(--palette-primary-hover); }
  .btn-ghost{ background:transparent; color:var(--palette-dark-text); border:1px solid #55636e !important; }
  .btn-ghost:hover{ background:#33444f; }
  .btn-flat{ background:var(--line-soft); color:var(--ink); }
  .btn-flat:hover{ background:#d5d8d6; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .dc-body{ padding:12px 14px 40px; max-width:900px; margin:0 auto; }
  .panel{ background:#fff; border:1px solid var(--line-soft); border-radius:5px; margin-bottom:10px; }
  .panel-head{ padding:7px 11px; border-bottom:1px solid var(--line-soft); background:var(--palette-head-bg); border-radius:5px 5px 0 0; }
  .panel-head h2{ font-size:var(--form-fs-panel-head); text-transform:uppercase; letter-spacing:.05em; color:var(--steel); margin:0; }
  .panel-body{ padding:11px; }

  .grid{ display:grid; gap:8px; }
  .grid-6{ grid-template-columns:repeat(6,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  label.field{ display:flex; flex-direction:column; gap:2px; font-size:var(--form-fs-label); color:var(--palette-label); font-weight:600; }
  label.field input, label.field select, label.field textarea{ font-size:var(--form-fs-button); padding:3px 5px; }

  .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .status-line{ font-size:10px; color:#8a939b; font-family:var(--mono); margin-right:auto; }
  .record-status{ font-size:10px; color:var(--palette-label); font-weight:600; padding:4px 8px; background:var(--palette-border); border-radius:3px; }
  .muted{ color:#8a939b; }
  .toast{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--steel-dk); color:#fff; padding:8px 16px; border-radius:20px; font-size:var(--form-fs-small); z-index:999; opacity:0; pointer-events:none; transition:opacity .25s; }
  .toast.show{ opacity:1; }

  @media (max-width:900px){
    .grid-6{grid-template-columns:repeat(3,1fr);}
    .grid-4{grid-template-columns:repeat(2,1fr);}
  }
</style>
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="st-root">
  <div class="dc-top">
    <div class="doc-line"><span class="doc-code">REC 7.1.3</span><h1>Salting and Tumbling</h1><span class="doc-rev">Rev 9 &middot; Rev date not set</span></div>
    <div class="dc-topline no-print"><button class="btn btn-flat" id="saveDraftBtn">Save</button>
      <button class="btn btn-primary" id="submitBtn">Submit</button>
    </div>
  </div>

  <div class="dc-body">

    <div class="panel">
      <div class="panel-head"><h2>Batch Info</h2></div>
      <div class="panel-body">
        <div class="grid grid-6" style="margin-bottom:8px;">
          <label class="field">Date<input id="h_date" type="date"></label>
          <label class="field">Harvest farm<input id="h_harvestFarm" placeholder="Farm"></label>
          <label class="field">Job no.<input id="h_jobNo" placeholder="Job"></label>
          <label class="field">Size range<input id="h_sizeRange" placeholder="Range"></label>
          <label class="field">No. of crates<input id="h_noOfCrates" type="number"></label>
          <label class="field">Standard salting time<input id="h_standardSaltingTime" placeholder="Time"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Process Timeline</h2></div>
      <div class="panel-body">
        <div class="grid grid-4">
          <label class="field">Start time<input id="h_startTime" placeholder="HH:MM"></label>
          <label class="field">Finish time<input id="h_finishTime" placeholder="HH:MM"></label>
          <label class="field">Shuck weight (kg)<input id="h_shuckWeight" type="number" step="0.01"></label>
          <label class="field">Total tumbling time<input id="h_totalTumblingTime" placeholder="HHhMMm"></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Salting Mix</h2></div>
      <div class="panel-body">
        <div class="grid grid-6" style="margin-bottom:8px;">
          <label class="field">Salt (kg)<input id="h_saltKg" type="number" step="0.01"></label>
          <label class="field">Salt (%)<input id="h_saltPercent" type="number" step="0.1"></label>
          <label class="field">Salt batch code<input id="h_saltBatchCode" placeholder="Code"></label>
          <label class="field">Baking soda (g)<input id="h_bakingSodaG" type="number"></label>
          <label class="field">Baking soda batch code<input id="h_bakingSodaBatchCode" placeholder="Code"></label>
        </div>
        <div class="grid grid-4">
          <label class="field">Sugar (kg)<input id="h_sugarKg" type="number" step="0.01"></label>
          <label class="field">Sugar (%)<input id="h_sugarPercent" type="number" step="0.1"></label>
          <label class="field">Sugar batch code<input id="h_sugarBatchCode" placeholder="Code"></label>
        </div>
      </div>
    </div>

    <div class="panel no-print">
      <div class="panel-head"><h2>Process Deviation</h2></div>
      <div class="panel-body">
        <textarea id="h_processDeviation" rows="2" placeholder="Record any deviations…" style="font-size:11px;"></textarea>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Sign-off</h2></div>
      <div class="panel-body">
        <div id="signoffCompletedBy"></div>
        <div class="grid grid-2" style="margin-top:8px;">
          <label class="field">Quality controller<input id="f_qualityController"></label>
        </div>
      </div>
    </div>

    <div class="actions no-print">
      <span class="record-status" id="recordStatus"></span>
      <span class="status-line" id="statusLine"></span>
      <button class="btn btn-flat" id="exportBtn">Export JSON</button>
      <button class="btn btn-flat" id="generatePdfBtn">Print PDF</button>
    </div>

    <div class="panel no-print" id="panelVerification"></div>
  </div>

  <div class="toast no-print" id="toast"></div>
</div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script>
/* Controlled-copy title block, repeated on every printed page.
 * docCode/recordKey are also what tools/build-master-index-data.py keys this page
 * to in the Master Index. Without them the build falls back to the file name, which
 * silently re-keys the record and orphans its stored revision history.
 * The paper revision is deliberately not stated here -- mountPrintHeader takes it
 * from the record's index row, so the issued index stays the single source. */
window.RecordDoc = { docCode: 'REC 7.1.3', recordKey: 'salting-and-tumbling' };
document.addEventListener('DOMContentLoaded', function () {
  if (!window.DocHeader) return;
  window.DocHeader.mountPrintHeader({ recordKey: window.RecordDoc.recordKey })
    .catch(function (e) { console.error('title block failed to mount', e); });
});
</script>
<script src="../lib/data-store.js?v=4"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script>
(async function(){
  const $ = id => document.getElementById(id);

  function newRecord(){
    return {
      id: null, revision: 1, status:'draft',
      date:'', harvestFarm:'', jobNo:'', sizeRange:'', noOfCrates:'', standardSaltingTime:'',
      startTime:'', finishTime:'', shuckWeight:'', totalTumblingTime:'',
      saltKg:'', saltPercent:'', saltBatchCode:'', bakingSodaG:'', bakingSodaBatchCode:'',
      sugarKg:'', sugarPercent:'', sugarBatchCode:'', processDeviation:'',
      operator:'', operatorTitle:'', qualityController:'', operatorDate:'', operatorSignature:'',
      verification: null,
      createdAt: null, updatedAt: null
    };
  }

  let state = newRecord();
function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  }
  function safeKey(s){ return String(s).trim().replace(/[\s\/\\'"]+/g,'_'); }

  async function storeGet(key, shared){
    try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function storeSet(key, value, shared){
    try{ await window.storage.set(key, value, shared); return true; }
    catch(e){ return false; }
  }

  function renderForm(){
    $('h_date').value = state.date;
    $('h_harvestFarm').value = state.harvestFarm;
    $('h_jobNo').value = state.jobNo;
    $('h_sizeRange').value = state.sizeRange;
    $('h_noOfCrates').value = state.noOfCrates;
    $('h_standardSaltingTime').value = state.standardSaltingTime;
    $('h_startTime').value = state.startTime;
    $('h_finishTime').value = state.finishTime;
    $('h_shuckWeight').value = state.shuckWeight;
    $('h_totalTumblingTime').value = state.totalTumblingTime;
    $('h_saltKg').value = state.saltKg;
    $('h_saltPercent').value = state.saltPercent;
    $('h_saltBatchCode').value = state.saltBatchCode;
    $('h_bakingSodaG').value = state.bakingSodaG;
    $('h_bakingSodaBatchCode').value = state.bakingSodaBatchCode;
    $('h_sugarKg').value = state.sugarKg;
    $('h_sugarPercent').value = state.sugarPercent;
    $('h_sugarBatchCode').value = state.sugarBatchCode;
    $('h_processDeviation').value = state.processDeviation;
    $('f_operator').value = state.operator;
    $('f_operatorTitle').value = state.operatorTitle;
    $('f_qualityController').value = state.qualityController;
    $('f_operatorDate').value = state.operatorDate;
    $('f_operatorSignature').value = state.operatorSignature;
  }

  function bindInputs(){
    const fields = ['date','harvestFarm','jobNo','sizeRange','noOfCrates','standardSaltingTime','startTime','finishTime','shuckWeight','totalTumblingTime','saltKg','saltPercent','saltBatchCode','bakingSodaG','bakingSodaBatchCode','sugarKg','sugarPercent','sugarBatchCode','processDeviation','operator','operatorTitle','qualityController','operatorDate','operatorSignature'];
    fields.forEach(f=>{
      const id = (f.startsWith('operator')||f.startsWith('qualityController')) ? 'f_'+f : 'h_'+f;
      const el = $(id);
      if(el) el.addEventListener('input', ()=>{ state[f] = el.value; });
    });
  }

  function updateRecordStatus(){
    const jobStr = state.jobNo ? state.jobNo : 'No job';
    const submitted = state.status === 'submitted';
    $('recordStatus').textContent = `${submitted ? '✓ Submitted' : 'Draft'} · ${jobStr} · ${state.id ? 'ID: ' + state.id.slice(-8) : 'Unsaved'}`;
  }

  function renderAll(){
    renderForm();
    updateRecordStatus();
    $('statusLine').textContent = state.updatedAt ? `Last saved ${new Date(state.updatedAt).toLocaleString()}` : 'Not yet saved';
  }

  async function saveRecord(finalize){
    const now = Date.now();
    if(!state.id){
      const jobId = state.jobNo ? state.jobNo : 'NOJOB';
      state.id = `salting_tumbling_${safeKey(jobId)}_${now}`;
      state.createdAt = now;
    }
    state.updatedAt = now;
    state.status = finalize ? 'submitted' : 'draft';

    const ok = await storeSet('record:'+state.id, JSON.stringify(state), true);
    if(!ok){ toast('Save failed.'); return; }
    toast(finalize ? 'Submitted for verification.' : 'Draft saved.');
    renderAll();
    if(verificationBlock) verificationBlock.refresh();
  }

  function generatePdf(){
    const jobStr = state.jobNo ? state.jobNo : 'record';
    document.title = `REC_7.1.3_SALTING_TUMBLING_${safeKey(jobStr)}_${state.date||''}`;
    window.print();
  }

  function mountSignoff(){
    $('signoffCompletedBy').innerHTML = window.SignOffBlock.completedByHtml({
      byId: 'f_operator', titleId: 'f_operatorTitle', dateId: 'f_operatorDate', signatureId: 'f_operatorSignature', byLabel: 'Operator'
    });
  }

  let verificationBlock = null;
  function mountVerification(){
    verificationBlock = window.SignOffBlock.mountVerification({
      recordKey: window.RecordDoc.recordKey,
      mount: '#panelVerification',
      getPending(){
        return (state.status === 'submitted' && !state.verification)
          ? [{ id: state.id, label: state.jobNo ? `Job ${state.jobNo}` : (state.id || '(unsaved)') }]
          : [];
      },
      async onLogged(record){
        state.verification = record;
        await storeSet('record:'+state.id, JSON.stringify(state), true);
        renderAll();
      }
    });
  }

function wire(){
bindInputs();
    $('saveDraftBtn').addEventListener('click', ()=>saveRecord(false));
    $('submitBtn').addEventListener('click', ()=>saveRecord(true));
    $('exportBtn').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const jobStr = state.jobNo ? state.jobNo : 'salting_tumbling_draft';
      a.download = `salting_tumbling_${safeKey(jobStr)}.json`;
      a.click();
    });
    $('generatePdfBtn').addEventListener('click', generatePdf);
  }

  mountSignoff();
  wire();
  renderAll();
  mountVerification();
})();
</script>
</body>
</html>
