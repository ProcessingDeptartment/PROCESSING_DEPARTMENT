<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.2 Sampling Log</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="mlRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/auth.js?v=2"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/spec-registry.js?v=2"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/monitoring-log.js?v=27"></script>
<script>(function () {
  MonitoringLog.init({
    mount: '#mlRoot',
    recordKey: 'sampling-log',
    docCode: 'REC 7.2',
    title: 'Sampling Log',
    docRevisionStart: 1,
    instructions: [
      { label: 'Purpose', text: 'Record any product samples taken (AG code / DW / dry job number / live tag / ranched incoming date) and why.' }
    ],

    jobInfoGroup: 'Job info',
    autofill: [
      { watch: 'jobNo', source: 'abalone-receiving', matchField: 'jobNo',
        fill: { jiReceivingDate: 'receivingDate', jiReceivedFrom: 'receivedFrom', jiProcessingFor: 'toBeProcessedFor', jiIntakeWeight: 'intakeWeight' } }
    ],
    entryFields: [
      { group: 'Job info', key: 'jobNo', label: 'Job no.', type: 'jobsearch' },
      { group: 'Job info', key: 'jiReceivingDate', label: 'Receiving date', type: 'date', readOnly: true },
      { group: 'Job info', key: 'jiReceivedFrom', label: 'Received from (farm)', type: 'text', readOnly: true },
      { group: 'Job info', key: 'jiProcessingFor', label: 'Processing for', type: 'text', readOnly: true },
      { group: 'Job info', key: 'jiIntakeWeight', label: 'Intake weight (kg)', type: 'text', readOnly: true },
      { key: 'date', label: 'Date', type: 'date', required: true },
      { key: 'productInfo', label: 'Product information (AG code, DW / dry job no. / live tag / ranched incoming date)', type: 'text', required: true },
      { key: 'pieces', label: 'Pieces', type: 'number' },
      { key: 'quantity', label: 'Quantity (amount or grams)', type: 'number' },
      { key: 'reason', label: 'Reason for sampling', type: 'select', options: ['QC check', 'Customer request', 'Investigation', 'Other'] },
      { key: 'sampledBy', label: 'Sampled by', type: 'text', required: true }
    ],
    specFields: [],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
  });
})();
</script>
<script src="../lib/record-shell.js?v=6"></script>
</body>
</html>
