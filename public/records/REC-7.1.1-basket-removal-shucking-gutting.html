<!DOCTYPE html>
<html lang="en">
<head>
<!-- Warm the connection to the records API before any script asks for it: DNS + TLS to a
     second origin otherwise costs ~200ms on top of the first data read. -->
<link rel="preconnect" href="https://processing-department-api.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://processing-department-api.onrender.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.1.1 Basket Removal, Shucking &amp; Gutting</title>
<script src="../lib/palette-map.js"></script>
<link rel="stylesheet" href="../styles/record-theme.css">
  <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>
<body>
<div id="frRoot"></div>

<script src="../lib/doc-header.js?v=5"></script>
<script src="../lib/master-index-data.js?v=2"></script>
<script src="../lib/data-store.js?v=5"></script>
<script src="../lib/job-status.js?v=2"></script>
<script src="../lib/api-backend.js?v=6"></script>
<script src="../lib/lookups.js?v=1"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>
<script src="../lib/document-revision.js?v=3"></script>
<script src="../lib/traceability.js?v=4"></script>
<script src="../lib/signoff-block.js?v=2"></script>
<script src="../lib/permission-rules.js?v=1"></script>
<script src="../lib/form-record.js?v=20"></script>
<script>
(function () {
  FormRecord.init({
    mount: '#frRoot',
    recordKey: 'basket-removal-shucking-gutting',
    batchField: 'jobNo',
    docCode: 'REC 7.1.1',
    title: 'Basket Removal, Shucking & Gutting',
    docRevisionStart: 1,
    // Submission is stamped with date and time, not date alone.
    submitStamp: true,
    listColumns: ['intakeDate', 'jobNo', 'sizeRange'],
    // Selecting a job number that was already received on Abalone Receiving (REC 7.1.2) pulls in
    // its receiving date and processing destination, so neither needs to be re-typed. Only fills
    // empty fields. The size range picker is narrowed to the sizes actually received on that job.
    autofill: [
      { watch: 'jobNo', source: 'abalone-receiving', matchField: 'jobNo',
        fill: { intakeDate: 'receivingDate', processingFor: 'toBeProcessedFor' },
        restrict: { sizeRange: 'sizeRange' } }
    ],
    sections: [
      { title: 'Intake & processing info', fields: [
        { key: 'jobNo', label: 'Job no.', type: 'jobsearch' },
        { key: 'intakeDate', label: 'Intake date', type: 'date', required: true },
        { key: 'processingFor', label: 'Processing for', type: 'select', options: ['Can', 'Dried', 'Other'] },
        Lookups.field({ key: 'sizeRange', label: 'Size range', list: 'sizeRanges' })
      ]},
      { title: 'Incoming check', newPage: true, fields: [
        { key: 'incomingTemp', label: 'Incoming abalone temp (°C)', type: 'number' },
        { key: 'noOfMortalities', label: 'No. of mortalities', type: 'number' },
        { key: 'signsOfParasites', label: 'Signs of parasites?', type: 'yesno', good: 'No' },
        { key: 'foreignObjects', label: 'Foreign/physical objects?', type: 'yesno', good: 'No' },
        { key: 'damagesOnFoot', label: 'Damages on foot?', type: 'yesno', good: 'No' }
      ]},
      { title: 'Quality checks', fields: [
        { key: 'damagesAfterShucking', label: 'Damages after shucking?', type: 'yesno', good: 'No' },
        { key: 'beakCutCorrect', label: 'Beak cut correct?', type: 'yesno', good: 'Yes' },
        { key: 'damagesAfterGutting', label: 'Damages after gutting & beaking?', type: 'yesno', good: 'No' }
      ]},
      { title: 'Process deviations', fields: [
        { key: 'processDeviations', label: 'Process deviations', type: 'textarea', wide: true }
      ]}
    ]
  });
})();
</script>
</body>
</html>
