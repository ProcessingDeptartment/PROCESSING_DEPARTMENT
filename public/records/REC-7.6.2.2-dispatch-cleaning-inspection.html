<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.6.2.2 Dispatch Cleaning Inspection</title>
<script src="../lib/shell.js?v=1"></script>
</head>
<body>
<div id="crRoot"></div>

<script>
(function () {
  // Dispatch / loading bay. Moved off monitoring-log.js (a periodic numeric-reading
  // engine, the wrong shape for a C/NC checklist with corrective actions) onto the
  // cleaning register, and onto the shared 'weekly' family so the dispatch area is not
  // inspected separately from the rest of the weekly walk.
  Shell.record({
    engine: 'cleaning-register',
    mount: '#crRoot',
    recordKey: 'dispatch-cleaning-inspection',
    docCode: 'REC 7.6.2.2',
    title: 'Dispatch Cleaning Inspection',
    docRevisionStart: 2,
    docRevisionDate: '2023-09-13',
    family: 'weekly',
    scope: 'dispatch',
    shift: false,
    performLabel: 'checked',
    performAction: 'checked',
    viewNote: 'Part of the same weekly record as REC 7.6.1.1 and REC 7.6.2.',
    instructions: [
      'Inspect the dispatch and loading bay area before loading. Product must not be loaded into a space showing odours, mould growth or dust.',
      'Mark C if conforming, NC if not, N/A if not applicable. Every NC needs a finding and a correction before the record can be verified.'
    ]
  });
})();
</script>
</body>
</html>
