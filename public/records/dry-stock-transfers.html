<head>

<title>REC 7.4.9 Dry Stock Transfers</title>
<style>
  :root {
    --ink: #3a4a40;
    --steel: #7a9b88;
    --steel-dk: #556966;
    --paper: #f8f9f8;
    --line: #b3c9bf;
    --line-soft: #d0dcd8;
    --ok: #7a9b88;
    --ok-bg: #e8f3ed;
    --warn: #b8791c;
    --warn-bg: #fbf0dc;
    --fail: #a3352d;
    --fail-bg: #fbe8e6;
    --accent: #7a9b88;
  }
  .ml-app { color: var(--ink); background: var(--paper); }
  .ml-top { background: var(--steel-dk); }
  .ml-panel-head h2 { color: var(--steel); }
  .ml-btn-primary { background: var(--accent); }
  .ml-badge-ok { background: var(--ok-bg); color: var(--ok); }
  .ml-badge-fail { background: var(--fail-bg); color: var(--fail); }

  <link rel="stylesheet" href="color-palettes.css">
  <link rel="stylesheet" href="../responsive.css?v=1">

<body>
<div id="mlRoot"></div>

<script src="../lib/data-store.js?v=2"></script>
<script src="../lib/auth.js?v=1"></script>
<script src="../lib/login-ui.js?v=1"></script>

<script src="../lib/document-revision.js?v=2"></script>
<script src="../lib/monitoring-log.js?v=2"></script>
<script>
(function () {
  MonitoringLog.init({
    mount: '#mlRoot',
    recordKey: 'dry-stock-transfers',
    docCode: 'REC 7.4.9',

      { key: 'date', label: 'Date', type: 'date', required: true },

  });
})();
