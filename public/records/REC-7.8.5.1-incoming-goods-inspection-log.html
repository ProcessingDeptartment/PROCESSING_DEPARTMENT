<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 7.8.5.1 Incoming Goods Inspection (Log)</title>
<script src="../lib/shell.js?v=1"></script>
</head>
<body>
<div id="mlRoot"></div>

<script>
(function () {
  Shell.record({
    engine: 'monitoring-log',
    mount: '#mlRoot',
    recordKey: 'incoming-goods-inspection-log',
    docCode: 'REC 7.8.5.1',
    title: 'Incoming Goods Inspection (Log)',
    docRevisionStart: 1,
    entryFields: [
      { key: 'date', label: 'Date', type: 'date', required: true },
      { key: 'product', label: 'Product', type: 'text', required: true },
      { key: 'supplier', label: 'Supplier', type: 'text' },
      { key: 'approvedSupplier', label: 'Approved supplier?', type: 'yesno' },
      { key: 'deliveryNote', label: 'Delivery note', type: 'text' },
      { key: 'quantity', label: 'Quantity', type: 'number' },
      { key: 'carRequired', label: 'CAR required?', type: 'yesno' },
      { key: 'carNr', label: 'CAR nr.', type: 'text' },
      { key: 'receivedBy', label: 'Received by', type: 'text', required: true }
    ],
    specFields: [],
    deviationLabel: 'Deviation',
    deviationPolarity: 'deviation'
  });
})();
</script>
</body>
</html>
