# Keeps facility-api awake so the site doesn't stall on a cold start.
#
# The API runs on Render's free tier, which spins a service down after ~15 minutes with no
# traffic. The next request then pays a 20-30s wake-up, and because api-backend.js is loaded on
# every record page, that wake-up is the first thing a user waits for -- the site looks broken.
#
# Pinging /api/health every 10 minutes keeps it inside that idle window. /api/health is exempt
# from the API_KEY check (see src/index.js), so no secret is needed here.
#
# Note: GitHub's scheduler is best-effort and can run late under load, so the schedule is a bit
# tighter than the 15-minute window to absorb a skipped tick.
name: Keep API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Never let two pings overlap if one runs long.
concurrency:
  group: keep-api-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          # --max-time 90 because a fully cold service can genuinely take that long to answer;
          # this run is what absorbs the wait so a person doesn't have to.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
            https://processing-department-api.onrender.com/api/health)
          echo "health returned $code"
          test "$code" = "200"
